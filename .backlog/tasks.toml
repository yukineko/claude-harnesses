  sed -i '' 's|A|B|' crates/blastguard/src/detect.rs
  sed -i '' 's|A|B|' /Users/yuki/src/harness/.claude/worktrees/agent-a3292f0e8fb2bc7e3/crates/blastguard/src/detect.rs

The refusal message echoes the command truncated at the token AFTER the empty-string argument ("... 'crates" and "... /Users"), which shows the parser consumed the empty '' as the sed script and then took the NEXT token as the file - i.e. it is not resolving the real operand. BSD sed requires the empty '' after -i; GNU sed does not, so this only bites on macOS.

Impact is friction, not a hole - the gate fails CLOSED, which is the correct direction, and the work was completed with the Edit tool instead. Filing it because a gate that refuses legitimate in-worktree edits pushes work toward tools that the gate does not see, which is the pressure CLAUDE.md section 5 warns about.

Also note the second refusal fired on a path that literally starts with the worktree root, so a prefix check against the worktree path would have cleared it."""
