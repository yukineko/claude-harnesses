検出は不可能。

## ドリフトの向き (docstring の主張は正しい)

- **condukt が短い側へドリフト** (= backlog の TTL が上がる): backlog がまだ live と
  みなす記録を condukt が `AllStaleHere` と読む -> `Occupancy::Dead` ->
  **生きている driver の worktree を removable / resumable と答える**。permissive・不可逆。
- **condukt が長い側へドリフト**: 回収可能なディレクトリを保持するだけ。restrictive。

docstring の「Erring long is the restrictive direction」は実装と一致する (第4節 OK)。

## 罠: 危険な向きは「安全に見える編集」から生まれる

危険側 (condukt が相対的に短い) を作るのは **backlog の TTL を上げる**編集であり、
これは「reap を急がない」という**安全に見える方向**である。`crates/backlog/src/lock.rs`
を編集する人間に、condukt 側の定数が連動すべきという信号は一切届かない。

## 併せて検証した否定的結果 (再導出を防ぐため記録する)

**backlog の reaper は第4項を空虚にしない。** `reap_stale_in` の呼び出しは
`crates/backlog/src/driver.rs:159` の 1 箇所だけで、`register_at`
(= `heartbeat_at`) の中から、**登録者自身の project バケットに限定して**呼ばれる。
死んだセッションの記録が消えるのは同一 project path で誰かが再登録したときだけで、
その再登録は自分の記録を **reap より先に** 書く (`write_atomic` -> `reap_stale_in`) ので
どのみち `LiveHere` になる。よって `AllStaleHere` は production で到達可能である。

