実測 2026-08-06、worktree session-b9a78b46、HEAD 90385f84 (= origin/main)。

run1: `cargo build --workspace --all-targets` (rc=0) の直後に `cargo test --workspace --no-fail-fast` を実行 → 出力末尾に `error: 1 target failed:`。
run2: 同じコマンドを単独で実行 → rc=0、`test result: FAILED` も `failures:` も `panicked at` も 0 件。

判定不能として扱う根拠と、そこから読める形:
run1 の出力には `test result: FAILED` が 1 行も無い。この行は当時のフィルタ `^(error|test result|failures:|---- )` に一致するので、出ていれば残っていたはず。したがって「テストが赤くなった」のではなく、**どのテストバイナリも結果行を出さないまま target が落ちた** — プロセスの異常終了 (abort/シグナル) か、結果を出す前の停止が疑われる。直前の `--all-targets` build は rc=0 なのでリンク失敗ではない。

target 名は当時のフィルタが落としており不明 (`error: 1 target failed:` の次行はインデントされていて一致しなかった)。これは計測側の不備であり、次に測るときはフィルタを掛けない。

疑うべき差分: run1 のテスト実行中に、別プロセスとして `backlog driver register` と `backlog add`、および `cargo fmt --all -- --check` を走らせていた。共有状態 (driver レジストリ / backlog ストア / target ディレクトリ) を読むテストが非 hermetic である可能性がある。ただしこれは仮説であって観測ではない。

完了条件: (1) 落ちた target を特定する (フィルタ無しで反復実行し、`error: 1 target failed:` の次行を読む)。(2) 特定できたら、共有状態への依存を除いて hermetic にする。(3) 反復実行しても再現しない場合は、その事実と試行回数を記録して閉じる — 「再現しなかった」を「問題なし」と書かない。"""
