[package]
# brush-parser 0.4.0 declares rust-version = "1.88.0", above the workspace
# 1.85, so this crate sets its own (precedent: crates/budgetguard sets 1.89).
rust-version = "1.88"
name = "blastguard"
version = "0.2.1046"
edition = "2021"
description = "PreToolUse hook that denies or asks before project-destroying Bash commands and file operations, as a single self-contained Rust binary."
license = "MIT"

[[bin]]
name = "blastguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }
serde = { workspace = true }
serde_json = { workspace = true }
globset = "0.4"
# askrules: restrictive-side regex conditions and the TOML rule files.
regex = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
# Shell AST for detect::ast (the single parser input for migrated detectors).
brush-parser = { version = "=0.4.0", default-features = false }
# Stage S5: embedded programs (inline Python) read with a real parser; the
# shared per-language parser crate (user ruling 2026-11-17).
progeffect = { path = "../progeffect" }

[dev-dependencies]
trybuild = "1"
harness-core = { path = "../harness-core", features = ["fault-injection"] }
tempfile = { workspace = true }
# Real Rust lexer for tests/no_unbounded_child_wait.rs (separates code tokens from literals and comments).
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }

# ワークスペースの [workspace.lints.clippy] を継承する（unwrap_used / expect_used = deny）。
# 判定を持つ crate では panic は判定不能そのものなので、production 側に unwrap / expect を
# 書けなくする。テスト側は各 crate root / 各 integration test の
# `#![cfg_attr(test, allow(...))]` で除外している（意図的な assert であって fail-open ではない）。
[lints]
workspace = true
