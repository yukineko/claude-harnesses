notes = '''Observed 2026-11-21 (main 366eab917, session c1b3e891, ~/.blastguard/blocks/blocks.jsonl). Reasons verbatim: (1) "'> …/scratchpad/vh.json': `jq '.tasks[0].title=\"fix rsync\" | …' decomp.routed.json` may create or rename an entry on this path and is not modelled, so blastguard cannot tell which file the write really lands on" (2) "'> /Users/yuki/.condukt/worktrees/run-20261121-091940-12305-t1/crates/blastguard/tests/rsync_protected_destination_20261121.rs': `git commit -qm \"blastguard: RED tests for rsync protected destination\" --trailer \"Condukt-Task: $TASK_ID\"` may create or rename an entry on this path and is not modelled". Mechanism (read from src/detect/relink.rs parse/is_relink_word/mentions): the WORD rsync inside a quoted argument (jq filter string, commit message) makes the segment Parsed::Unmodelled; mentions() then fires on any glob metachar ([0]) or unresolvable expansion ($TASK_ID) anywhere in the command, regardless of the target; a later segment counts whenever any segment holds the bare word 'done' (here a comment in the heredoc body). RED at 62c62ad5e (2026-11-21): all 3 jq shapes and both commit shapes Ask with the same reason; controls pass (ditto src vh.json in a loop stays Ask; heredoc-to-/etc/hosts + commit stays Deny). Readings: (a) FP — jq <filter> <file> and git commit -m <msg> --trailer <t> (no pathspec) cannot create/rename the target; their rsync is data, not an argv word naming a path or a relinking program. (b) intended — unmodelled command naming a relink verb is undetermined → Ask. How to tell: whether the unmodelled command's argv can NAME the target path (an operand equal/resolving to it, or a glob/expansion in an OPERAND position); here the glob/expansion sits inside a jq filter string / --trailer value, so (a). Related fail-open filed separately (same relink path masks an /etc/hosts Deny).'''
