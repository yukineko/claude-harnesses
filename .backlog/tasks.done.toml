notes = """
実測 2026-09-13 22:40 JST、測定点 15adc7bd（main）、cwd=/Users/yuki/src/harness（main worktree）。

現象: 30.8日前に死んだ run の file claim が永久に reap されず、他セッションの condukt タスクを恒久的にブロックする。実測でブロックされた: 本セッションの condukt state set --run run-20260913-223733-78880 --task t1-subagentstop --status running が exit 1 で skipped、conflicts=[crates/condukt/Cargo.toml, crates/condukt/.claude-plugin/plugin.json], holder_run=run-20260814-025356-78549, holder_pid=80275。progress window（既定90秒）を空けて再実行しても同じ exit 1（＝1回目だから未確定、ではない）。

holder が死んでいる証拠（5点、いずれも観測）:
  - pid 80275 は ps -p で不在。
  - claim の heartbeat_at=1786644417、経過 2662249 秒 = 30.81 日（stuck TTL を遥かに超過）。
  - holder session b57a58c3-eec2-4880-bc67-40ffdafb18cd の transcript mtime は Aug 14 22:58。
  - holder の worktree t1/t2/t3 の HEAD commit 日時は 2026-08-14 03:03-03:08 で凍結。
  - holder の t4 worktree（/Users/yuki/.condukt/worktrees/run-20260814-025356-78549-t4）は既に削除済み（git -C ... rev-parse HEAD が fatal: No such file or directory）。

根本原因（コード上の経路、逐語）: crates/condukt/src/claim.rs の run_worktree_head_signal は run.tasks を status で絞らずに t.worktree.as_deref() を集め、どれか1つでも読めなければ signal 全体を Undetermined にする（docstring: 「Any recorded worktree is unreadable (removed, or never a git repo) => Undetermined for the whole signal」）。run-20260814-025356-78549 の t4 は status=cancelled で、cancelled タスクの worktree は condukt worktree remove/cleanup が正当に削除する。つまり「タスクを1つ cancel して worktree を掃除した run」は、その瞬間から run-scoped head signal が恒久的に Undetermined になる。
harness_core::progress::fingerprint_from_signals は 1 つでも Undetermined なら全体 Undetermined（progress.rs:148）。claim_progress はそれを progress::sample に渡すが、Undetermined な current では snapshot が書かれない（実測: 期待される snapshot ファイル ~/.condukt/state/harness-e77d23c7/progress/691cce99ba15316e.json = fnv1a64("claim:run-20260814-025356-78549") が存在しない。同ディレクトリには同時刻 22:36 に書かれた別 run の snapshot が 4 つあるので、store dir 自体は解決できている）。
retain_claim は「Known(Stalled) のときだけ reap」なので、Undetermined は claim を永久に保持する。

これは fail-open ではなく fail-closed 側の恒久デッドロックである。CLAUDE.md 第3節の「判定不能は制限側へ」は正しく効いているが、判定不能が**構造的に永久**になる経路があるため、制限側が解除不能になっている。設計意図（live-but-quiet な holder を force-steal しない）は正しいが、terminal タスクの削除済み worktree を「読めない signal」として数えるのは意図ではないはず。

影響が大きい理由: ブロックされた 2 ファイルは crates/condukt/Cargo.toml と plugin.json、すなわち CLAUDE.md の version lockstep 禁忌ルールにより **condukt を触る全タスクが必ず触る**ファイル。したがって condukt プラグインを改修する condukt タスクは、以後どのセッションからも claim できない。

修正方向（案、要検討）:
  (1) run_worktree_head_signal が畳み込む対象を非 terminal なタスクに限定する（cancelled/verified/failed の worktree 消失は進捗不能の証拠ではなく、単に掃除済み）。
  (2) 非 terminal タスクが 1 つも worktree を持たない場合は既存どおり Undetermined（現行の 2 つ目の arm を維持）。
  (3) それでも「全 signal が構造的に恒久 Undetermined」な claim を検出して人間に見せる経路（overwatch review-queue か condukt state claims の警告欄）を足す。黙って永久保持しない。
反証防止の control: 削除済み worktree を持つが **running** タスクの run は従来どおり Undetermined のままであること（生きている worker を force-steal しないという元の設計意図を壊していないこと）をテストで固定する。

本セッションでの回避（隠蔽しないため明記）: 根本修正は行わず、documented な明示 override である condukt state release --run run-20260814-025356-78549 --file crates/condukt/Cargo.toml --file crates/condukt/.claude-plugin/plugin.json を、上記 5 点の死亡証拠を添えて実行した。skip ファイルや --force やゲート緩和は使っていない。

=== 追加実測 2026-09-16、測定点 main 12afeb9b、condukt 0.7.166 ===

不死 claim が今も生きていることの直接観測。condukt state claims の
同時点スナップショットを run_id で束ねた結果:

  p0trio-1                    files=1   最新 heartbeat から 35.5 日
  run-20260814-025356-78549   files=10  最新 heartbeat から 33.8 日
  run-20260913-223004-15261   files=10  最新 heartbeat から  3.0 日

78549 は本チケットの当該 run。2026-08-14 に claim して以来 33.8 日、
一度も reap されていない。以前この run から明示 override で 2 件
(crates/condukt/Cargo.toml と plugin.json) を解放したが、残り 10 件は
そのまま。したがって「たまたま一度きり」ではなく恒常状態である。

15261 はサイクル6 で死んだピアセッションの run で、同じ形で 10 件を
握ったまま死んでいる。本件の機構が直っていないので同じ末路になった。

なお本サイクル (run-20260913-223733-78880) では別の穴も見つけて 06eb8aa3
として起票した: run が gate PASS しても file claim は自動解放されない。
5e62b0eb が「reap が効かない」なのに対し、06eb8aa3 は「そもそも解放が
呼ばれない」。2 つ揃うと、握ったまま死んだ run の claim は永久に残る。
=== 追加実測 2026-09-23、測定点 main 6725d0d3 — 同じ機構を TASK claim で再現した ===

これまでの実測はすべて file claim だった。今回、同じ不死が **task claim** でも
起きることを本セッション自身の claim で観測した。file claim 固有の穴ではなく
retain_claim の progress ゲートそのものの帰結である。

観測: 本セッション (2444be10-e07a-4c9a-a785-01f58d3995fa) が 2026-09-16 に取った
4 件の task claim (a4050204859f1c7a / 3cd5754819c50a69 / 12e54ff974ef54b4 /
caa9442e63a3e007) は、**152.5 時間 (6.4 日) 後も condukt state is-claimed が
rc=0 (claimed) を返し続けた**。一方 backlog 側は CLAIM_STALE_SECS により
4 件とも pending へ requeue 済みだった。

機構 (crates/condukt/src/claim.rs:589-598、逐語):
  「A claim whose heartbeat has lapsed past the TTL is kept UNLESS its run's
   progress is confirmed Known(Stalled) - Progressing or Undetermined preserve
   it (fail-closed: "cannot determine" never reaps).」
claim を取った run (run-20260917-030727-89796) は stall watchdog で落ち、その
worktree が消えたため progress が恒久的に Undetermined になる。したがって
reap 条件 (Known(Stalled)) が永久に成立せず claim は不死になる。本チケットが
主張している機構と同一であり、**file claim だけでなく task claim でも起きる**
ことをこの測定が示している。

=== 帰結 (これが実害) — 2 つの期限の不一致が deadlock を作る ===

backlog は CLAIM_STALE_SECS (約 1 時間) で item を pending へ戻すのに、
condukt 側の is-claimed は永久に claimed を返す。この 2 つの期限が一致していない
ことが致命的で、次の閉ループになる:

  1. backlog next --claim が item を後続セッションへ渡す (requeue 済みなので渡る)。
  2. そのセッションは flow の claim-skip ゲートに従い condukt state is-claimed を引く。
  3. rc=0 (claimed) が返るので「他セッションが作業中」と解釈して item をキューへ戻す。
  4. 1 に戻る。

つまり **どのセッションも受け取った直後に必ず手放す**。この 4 件は、誰かが手で
claim を解放するまで、**どのセッションにも着手できない状態** に陥っていた。
実際に本セッションが condukt state release-task を 4 回打って手で解放し、
ようやくサイクル7 を再開できた。

重要なのは「遅くなる」ではなく「**誰にも実行不能になる**」という点である。
fail-closed が正しく効いた結果ではなく、判定不能が構造的に永久であるために
制限側が解除不能になっている (本チケット冒頭の指摘と同じ構図)。

したがって修正案には task claim 側の経路も含めること。retain_claim は file claim
と task claim の両方を通るので、run の死を Known(Stalled) へ解決できるようにすれば
両方が同時に直る。ただし live な run を誤って reap しないこと (両方向のテスト) は
引き続き最優先の不変条件。

併せて観測した他 run の不死 file claim (他セッションの所有物なので手を出さず、
計測値としてのみ記録する。解放していない):

  run-20260814-025356-78549   files=10   最新 heartbeat から 40.2 日
  p0trio-1                    files=1    最新 heartbeat から 41.9 日

前回測定 (2026-09-16) の 33.8 日 / 35.5 日から単調に増えており、reap が
一度も発火していないことがここでも確認できる。なお 2026-09-16 に観測された
run-20260913-223004-15261 の 10 件は今回のスナップショットには現れず、
registry の合計は 11 件 (+ task_claims セクション) である。"""
