[[task]]
id = "03e004ec"
title = "post-merge: 既存 merge commit への fast-forward を bypass として誤記録し push をブロックする"
project = "/mnt/c/Users/hiroyuki_nakayama/src/harness"
project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = "実測 2026-09-18。worktree (session-47b2f117) で origin/main を merge し、pre-commit が green (rc=0) で通って merge commit d067c116 を作成。その後 main で `git merge --ff-only session-47b2f117` を実行したところ、post-merge が発火し ledger (.git/gate-bypassed) に d067c116 を「ungated」として記録、`git push` がブロックされた。原因: .githooks/post-merge:23-24 のガードが `git rev-parse HEAD^@` の親数だけを見ており、ff 後の HEAD は「既に他所で作られ certified 済みの merge commit」なのに親 2 を満たすため post-commit へ exec してしまう。ヘッダのコメント (:17-19)「A fast-forward merge creates no commit, so there is nothing to certify and the absent sentinel must not be read as a bypass」は ff 先が非 merge commit の場合しか成立していない。さらに証跡 sentinel は per-worktree (pre-commit:340-342 GIT_DIR_LOCAL/gate-verified-tree) で ledger は common (pre-commit:348 GIT_DIR_COMMON/gate-bypassed) なので、worktree で書かれた certificate は main の post-commit から原理的に参照できない。CLAUDE.md 8 が命じる「worktree で実装 → main へ merge」の正規ルートを通ると必ず踏む。fail-closed 側の誤検知なので安全側ではあるが、正規ルートが常に赤くなる。修正案: post-merge で「HEAD が merge 前の ORIG_HEAD の子として *この実行で* 作られたか」を判定する、または sentinel を GIT_DIR_COMMON 側に置いて worktree 間で参照可能にする。"
