[package]
# brush-parser 0.4.0 declares rust-version = "1.88.0" (precedent: crates/blastguard).
rust-version = "1.88"
name = "session-master"
version = "0.1.8"
edition = "2021"
description = "Session group orchestration for Claude Code: one master per git common dir, a master-only serial queue, and a fail-closed PreToolUse gate that keeps push / rollout / main merge and cross-session relays on the master."
license = "MIT"

[[bin]]
name = "session-master"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
brush-parser = { version = "=0.4.0", default-features = false }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
