id = "1e04dbbf"
title = "stop-verify-worktree.py blocks on a foreign in-progress merge on main, which CLAUDE.md 8 explicitly permits"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
Measured 2026-09-13 18:55-18:56 in session 59faffee, which authored ZERO file edits (its whole task was producing a distillation note).

All three Stop gates (stop-verify-worktree, reviewgate, donegate) fired on main-tree dirt owned by a DIFFERENT live session (pid 80124). Evidence: .git/MERGE_HEAD present, MERGE_MSG names the batch5 t5-abandon-dirty-guard branch, and crates/condukt/src/main.rs mtime was 6 seconds before my date call. Conflict marker count was already 0, i.e. the other session was mid conflict-resolution.

Two distinct defects here, both attribution:

1. stop-verify-worktree.py treats "main tree has uncommitted changes" as a violation of CLAUDE.md 8 without checking whether a merge is in progress. But 8 names integration (merge plus conflict resolution) as the ONE thing that IS allowed on main. So the gate blocks the exact activity its own cited rule permits. Suggested predicate: if .git/MERGE_HEAD exists and every dirty path is in the merge conflict set, that is integration, not authoring.

2. The gate has no session attribution at all, so a session that edited nothing cannot clear it without destroying another sessions work. The only exits available to me were to touch their merge (destructive, forbidden) or skip. reviewgate handles this correctly already: its prose tells the reviewer to exclude files it did not write. stop-verify-worktree and donegate have no equivalent.

Consequence chain worth naming: when a gate blocks a session that has no way to comply honestly, the only remaining exit is the skip mechanism. That is structural pressure toward the fail-open that CLAUDE.md 5 is trying to make rare. The gate is not wrong to be fail-closed; it is wrong about WHOSE work it is judging.

Related in-flight: 4b94e371 (false reds from intra-binary test parallelism) is the same theme from a different angle, both make reds less trustworthy and so train the habit of not reading reds. 【救出 2026-09-29】元 id 537a9efe。session-59faffee の未マージ/未コミットの tasks.toml にだけ存在していたため、ブランチ・worktree 整理の前に再起票した。notes 中の関連 id は元 id のまま。

【再観測 2026-09-29 19:4x】session-34385c9e の Stop で stop-verify-worktree.py が block。main の dirty は UU .backlog/tasks.toml のみで、.git/MERGE_HEAD=82992c23 (MERGE_MSG「Merge origin/main」、19:39:03 作成) は別セッションの進行中 merge。このセッションは main に未コミット変更を持っていない。帰属のバグ (CLAUDE.md 8 末尾) の実例。"""
