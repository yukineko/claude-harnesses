notes = "実測 2026-08-06、測定点 a4b24edc、rollout 直後: ~/.claude/plugins/cache/yukineko/donegate/0.1.7/bin/donegate status を叩くと、0.1.24 で入れたばかりの新挙動 (trust: trusted (inherited -- this is a worktree of ...)) が出力された。0.1.7 は superseded な version dir であり、live session が掴んでいるため prune 対象外として保持されている (rollout ログ: 83 superseded dir(s) remain, all held by a live session)。つまり version dir 名が、そこで実行されるコードを一意に特定していない可能性がある。考えられる読みは2つで、どちらかは未判定: (a) rebuild-plugins.sh が既存の全 version dir へバイナリを swap しており、0.1.7 に pin された稼働セッションが黙って新コードを実行している。これが本当なら version pin の契約が破れており、canary rollback (前の version dir へ re-point する設計) も実効しないことになる ため GATE crate の安全機構に直結する。(b) bin/<name> が単一の共有バイナリへ解決する shim にすぎず、version dir はアセットのみを持つ。この場合 pin の意味はもともとアセット限定であり、想定内。判定方法: 各 version dir の bin/<name> の実体 (シンボリックリンクか実ファイルか、inode、mtime) を測り、rebuild-plugins.sh が書き込む対象を読むこと。あわせて canary の rollback 経路が実際に旧コードへ戻せるかを、フォールト注入で観測すること (rollback したのに新コードが動くなら、それは rollback したふりである)。注意: check-plugin-rollout.py は rc=0 (41 plugin が file-for-file 一致) を返しており、この検証はこの現象を捕まえていない。"
