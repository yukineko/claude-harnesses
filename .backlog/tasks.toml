project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-18, 測定点 01deeab2。

再現: 4 タスクの decomposition (各タスクが自分の plugin の version を bump するため全員が .claude-plugin/marketplace.json を touched_files に持つ) を condukt schedule に掛けると全タスクが serial に降格する:
  condukt schedule --file .scratch/decomp.json
  -> {"batches":[],"serial":["t3","t1","t2","t4"],"warnings":["task 't1' file-overlaps another parallel task -> serial (overlap is authoritative over class)", ... 4件]}

condukt SKILL.md (0.7.138) は serial の実装方法を逐語で 'serial タスクは worktree に出さず main で順に実装する' と規定し、commit は condukt repo commit で main の作業ツリーに行う。

しかし:
1. CLAUDE.md 第8節が逐語で 'condukt の実装タスクは worktree 経由で行う。single_worktree モードや serial タスクを「main で直接実装する」経路として使わない' と**この経路を名指しで禁止**している。
2. さらに機械的にも通らない: git config の hooksPath が設定済み (git-common-dir/config:7 -> hooksPath = /mnt/c/Users/hiroyuki_nakayama/src/harness/.githooks) なので .githooks/pre-commit が発火し、scripts/check-worktree-isolation.py が main working tree からの非 merge commit を拒否する。condukt repo commit が作るのは merge ではなく通常 commit なので拒否対象。

帰結: このリポジトリでは **ファイル重複を持つ decomposition (= plugin version bump を伴うほぼ全ての実装タスク) が condukt の文書化された経路で完走できない**。今回は CLAUDE.md が skill 指示を override する前提で、serial 4 タスクをそれぞれ専用 worktree に出して順次実行する回避を採った (並列化は捨て、順序だけ serial を守る)。

判定不能な2つの読み: (a) condukt の serial 実装方法がこのリポジトリの第8節と非互換な実在の欠陥 / (b) serial は元々 shared-file を守るための直列化であり、実装場所が main であることは本質ではないので SKILL.md の記述を 'serial は順序の制約であって場所の制約ではない。各タスクは専用 worktree で順に実行する' に改めるだけでよい。

見分ける方法: crates/condukt/src/ で serial タスクの実行経路が worktree 生成をスキップする実装になっているか (schedule の serial 配列を消費する側) を読む。バイナリ側が worktree を作らない前提で state を持つなら (a) に近い設計上の結合、SKILL.md の散文だけが main tree を指しているなら (b) で散文修正で済む。

併せて要検討: この降格の根本原因は '各 plugin の version bump が単一の marketplace.json を共有する' ことなので、marketplace.json を shared_globs として明示し version bump を別レイヤに切り出す設計も選択肢 (ただし CLAUDE.md の禁忌ルールが bump を同一変更に要求するため単純ではない)。

