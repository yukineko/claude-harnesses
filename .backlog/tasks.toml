その導線の欠落を保持している。

配線への直接の影響 (重要): git は pre-push フックの stdin に ref 行を渡す。
したがって pre-push から cargo test --workspace を素で呼ぶと
(1) テストバイナリがフックの stdin を奪う、(2) push が無診断で無限に固まる。
ゲート側は子プロセスの stdin を /dev/null へ向け、かつ壁時計デッドラインを持ち、
期限切れは block へ倒す必要がある (判定不能を許可に写さない)。
この要件は既にゲート実装側へ伝達済み。

直し方の候補 (どれを採るかは要判断):
  (a) テスト内で stdin を明示的に閉じた状態にしてから呼ぶ。
  (b) read_stdin_if_piped() 自体にデッドラインを持たせる。ただし本番のフックは
      Claude Code が stdin を閉じるので、本番経路が今壊れているという証拠は無い。
      本番に手を入れる前に、本番でブロックしうるかを先に測ること。
