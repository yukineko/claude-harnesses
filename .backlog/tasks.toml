## 決着 (2026-09-24, session-9d349393 /condukt; 独立 verifier が全引用を逐語照合し CONFIRMED)
3e2aade5 settlement (primary source: https://code.claude.com/docs/en/hooks.md fetched 2026-09-24, local copy scratchpad/hooks.md, line numbers refer to that copy)

Q1. Is omitting permissionDecision equivalent to "defer"?
- REFUTED verbatim. "defer" is an explicit fourth value with its own semantics:
  L1814 "`"defer"` exits gracefully so the tool can be resumed later."
  L1853 "Claude Code honors this value only in non-interactive mode with the `-p` flag. In interactive sessions it logs a warning and ignores the hook result."
  L1858 "The hook returns `permissionDecision: "defer"`. The tool doesn't execute. The process exits with `stop_reason: "tool_deferred"`"
  L1819 "precedence is `deny` > `defer` > `ask` > `allow`."
  Omission does not pause the tool nor exit the process, so it is not defer.
- What omission IS, for the no-output case, is stated verbatim:
  L225 "Exit code 0 with no output means the hook has no decision to report, so the tool call continues through the normal permission flow. The hook can deny the call, but staying silent doesn't approve it."
  L845 "exit 0  # No decision: the normal permission flow applies"
- SILENT in the source: a PreToolUse hook that exits 0 with VALID JSON that omits permissionDecision (e.g. only additionalContext or only systemMessage). The PreToolUse table (L1814) lists the values but does not say what absence means; the "omit decision to allow" sentence (L1075) is scoped to events using TOP-LEVEL `decision`, which PreToolUse does not (L1810). Reading A: absence == no decision == normal permission flow (same as L225). Reading B: the source only guarantees that for "exit 0 with no output"; JSON-without-permissionDecision is undocumented. -> human.

Q2. Is systemMessage invisible to the model?
- Per-event and per-mode, not a flat rule:
  L958 (JSON output table) "Warning message shown to the user."
  L3710 async hooks: "Claude Code delivers the `additionalContext` and `systemMessage` fields from the hook's JSON response to Claude on the next conversation turn. Unlike a synchronous hook's `systemMessage`, neither field is shown to you."
  L2868 DirectoryAdded/slash_command: "Claude Code delivers the hook's `systemMessage` to Claude as context on the next conversation turn, rather than showing it to you."
  Discarded entirely on: Setup (L1300), InstructionsLoaded (L1339), MessageDisplay (L1505), Notification (L2357), ConfigChange (L2788), WorktreeCreate (L2956), WorktreeRemove (L3016), PreCompact (L3073), PostCompact (L3092), SessionEnd (L3356), Elicitation (L3439), ElicitationResult (L3486); CwdChanged/FileChanged show it as a terminal notification (L2823, L2946).
- So the flat claim "systemMessage is invisible to the model" is FALSE for async hooks and DirectoryAdded(slash_command).
- SILENT in the source: whether a SYNCHRONOUS hook's systemMessage on the remaining events also reaches the model. The source says only "shown to the user" (L958); it never says "not Claude" for it (contrast permissionDecisionReason, L1815, which says "shown to the user but not Claude" explicitly). Reading A: user-only (implied by the L3710/L2868 contrasts). Reading B: unstated; not guaranteed invisible. -> human.

STOPPED FOR HUMAN: 上の SILENT 2 点 (PreToolUse で JSON を返すが permissionDecision を省いた場合 / 同期 hook の systemMessage が model に届くか) は一次資料が沈黙しているため、両読みを記録して停止。決着手段の候補: 人間の判断、または claude -p を使った観測テスト。関連起票: ceb0a9bf (fugu-router の top-level additionalContext), 19ebd4a9 (context-governor io.rs の (not the model) コメント)。

USER RULING 2026-09-24: settle both open points by MEASUREMENT: write a minimal experimental hook and observe in Claude Code (a) what a PreToolUse hook's valid JSON without permissionDecision does, (b) whether a synchronous hook's systemMessage reaches the model. Record observed behaviour with version and date."""
