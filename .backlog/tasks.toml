notes = """
Measured 2026-09-11 in worktree agent-ad17472050aebf993, while working backlog 1e44bfd9.

CLAIM_RE in scripts/check-doc-claims.py requires the path component to carry a file-ish extension. A backticked citation of an extensionless path is therefore not recognised as a claim AT ALL: it produces zero findings and exit 0, with no signal that anything was skipped.

Observed, against both the pre-change and post-change gate: a doc containing a backticked /etc/passwd:1 gives exit 0 'all cited claims match', while the same doc with /etc/hosts.conf:1 gives exit 1 path-escapes-repo. The only difference is the extension.

Why it matters: several load-bearing files in this repo have no extension and are cited in prose -- .githooks/pre-commit, .githooks/commit-msg, and every plugin launcher under crates/<c>/bin/<name>. A citation of any of those is unverifiable by this gate and looks identical to a verified one.

Currently LATENT, measured: scanning docs/ plus CLAUDE.md for backticked path:line tokens that lack an extension returns 2 hits, both non-paths (a timestamp and a ':196,:200' fragment). So nothing is being missed today.

The extension requirement is deliberate false-positive discipline (the module docstring says ordinary prose such as a log excerpt must not become a claim), so the fix is NOT to drop it. Options: an allowlist of known extensionless repo paths, or requiring a leading path separator plus an existing-in-index check."""
