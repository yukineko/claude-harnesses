notes = """
Evidence, all verified 2026-07-31:
- crates/propguard/src/main.rs:330 and crates/condukt/src/gate_exec.rs:202 both call overwatch::store::record_finding. A grep for record_finding across crates excluding overwatch itself returns exactly those two call sites. specguard is absent.
- crates/overwatch/src/review_queue.rs:27-41 defines EntryKind as Systemic, Rollback, AiFinding, Escalation, MergeConflict. There is no spec or drift kind, so review-queue --to-backlog cannot carry one.
- specguard findings terminate in a dated markdown report plus a sentinel file: crates/specguard/src/report.rs:10-22 (Paths: report, last_ref, sentinel) and crates/specguard/src/config.rs:320-322 (default sentinel .specguard-pending). A human clears the sentinel with specguard ack.
- The only spec-to-backlog handoff that exists anywhere is PROSE telling an LLM to run the CLI: crates/specguard/commands/spec-audit.md:167-171 (backlog add --title add tests for entry key) and crates/specguard/commands/drift-map.md:121 (backlog add --title fix failing tests after drift adjustment). No Rust path exists. CLAUDE.md section 6 says compliance must not depend on the implementer self-reporting, and an instruction in a markdown file is exactly that.
- Observed state: reports/spec-audit holds 2026-06-26, 2026-06-28, 2026-07-13; no sentinel is currently raised; zero pending backlog items derive from a spec finding.

Rationale: overwatch bridged condukt escalations in v0.1.22 with the stated intent that every human-awaiting item, not just gate-check findings, shows in the one unified pane. A raised .specguard-pending sentinel IS such an item and is not in that pane. Worse, ack clears the sentinel without recording a per-finding disposition, so unlike overwatch findings (record-disposition, review-metrics, reconcile-fixed) there is no way to ask whether a given drift was ever actually fixed - the closure rate for spec findings is unmeasurable by construction.

Done when: specguard calls overwatch::store::record_finding from Rust for its structural findings (auditmap.rs StructuralKind Undocumented, DanglingReference, Untested at lines 78-84) so they appear in review-queue and can be bridged by --to-backlog, and a cleared sentinel leaves a disposition record rather than nothing. Note the dependency direction: harness-core, then overwatch, then blastguard, then condukt - specguard depending on overwatch is consistent with propguard already doing so.

