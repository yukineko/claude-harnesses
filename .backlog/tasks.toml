  79f1c03b gate-check escalated: task overwatch-rollout ... (61 日前)
  ab178c4d gate-check escalated: task audit-canary-gate-coverage ... (56 日前)
  4026e1a0 gate-check escalated: task fix-canary-gate-final-stage ... (56 日前)
notes の形は一律に finding-id:gate-exec:<run>:<task> file:(none) severity:high |
confirmed: N日前 | regression test: 該当テストなし。

問題の形: title が『<run> で gate-check が escalate した』という過去の出来事を述べて
おり、何をすれば閉じるのかを述べていない。file:(none) なので触る対象も無い。結果として
  - 自動では絶対に閉じない (誰も『あの escalation はもう解消した』と書き戻さない)
  - p0 なのでキュー先頭に居座り、flow の毎サイクルが最初にこれを掴む
という滞留が起きる。実際 4 件とも、実測すると裏の作業は既に完了していた (rollout は
provenance で確認、canary gate は scripts/tests/ の 2 本が PASS)。

重要 (過大主張を避ける): 今回 pending の condukt-gate タグは この 4 件で全部であり、
大量滞留ではない。クラスとしての指摘であって件数の問題ではない。

両方の読み: (a) 橋渡しの粒度が間違っている。escalation は『人間が判断を返すべき通知』で
あって backlog item ではない、あるいは item にするなら『何を確認すれば閉じるか』を
done_criteria として持たせるべき。(b) 意図的。escalation を消さずに残すことが目的で、
閉じるのは人間の仕事だと設計されている。

見分け方: overwatch の --to-backlog がこの kind に done_criteria を付ける口を持って
いるかを読む。持っていて使っていないなら (a)。

done_criteria: gate-check 由来の bridged item が『何を観測すれば閉じられるか』を
notes に持つ。または escalation は backlog ではなく review-queue 側へ出す。

--- 2026-09-24 再発データ (cycle 11) ---
本サイクルで backlog next --claim が返した p0 4 件のうち 4 件すべてが、この
ticket が指摘している「出来事を作業として橋渡ししたもの」だった:

  7c4e8218 systemic  autoflow:record-requested 3x
      -> 欠陥ではない。per-session 1 回の設計上の block (main.rs:197)。
         「3 session で 3 回」は設計どおりのレートで、異常の兆候ではない。
         recurrence registry が「意図された per-session gate の発火」を
         「systemic signature」として数えている。カウント軸に session が
         入っていないのが原因。
  7c776a26 merge-conflict
      -> 対象ブランチが既に存在しない。衝突 4 ファイルは全部 version lockstep
         対象で、現在 41 plugin すべて consistent。解決すべき衝突が無い。
  d28fb530 escalation
      -> 前提 (dead run の claim が不死) が a2e9e3a3 で修正済み、registry も空。
  3503d99e escalation
      -> 問い (何が death を確立するか) が wt_reconcile.rs:1427 で決着済み、
         予測された 3 つの帰結はいずれも成立せず、テスト 28 件が green。

cycle 9 でも condukt-gate の 4 件が全く同じ形 (56-61 日前の橋渡しで、
下の作業は既に完了済み) だった。2 サイクル連続で「claim した p0 の全件が
既に解決済み」になっている。これはキューの汚染としては軽くない:
p0 が優先度順の先頭に並ぶので、本物の p0 が後ろに押される。

測定値: 本サイクル時点の pending 653 件、うち tag escalation 3 件、
systemic 6 件、merge-conflict 2 件 (自分が claim 中の 4 件を除く)。
橋渡し由来の総量自体は小さいが、全部 p0 なので先頭を占める。

done_criteria への追加提案 (この ticket の本体は変えない):
  橋渡し時点ではなく「拾われた時点」で前提がまだ成立しているかを
  確認する経路があること。上の 4 件はいずれも 5 分以内の実測で
  決着したので、自動化できる形をしている (ブランチの存在・registry の
  中身・named test の green・per-session カウント軸)。"""
