[[task]]
id = "6d451627"
title = "condukt gate-check の decomposition 読み込みが「無い」と「読めない」を併合している（分類は三値化済み、読み込みは二値のまま）"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "fail-open",
    "condukt",
    "p2",
]
touched_files = []
status = "done"
notes = """
condukt の gate-check は分類 (classification) を三値化したが、その手前の読み込みが二値のまま。commit 32ead775 の gate_exec.rs は自分でこれを KNOWN GAP として docstring に書いている:

  GatherOutcome::Missing は「そもそも評価対象が無い」(run/task が存在しない) と
  「対象はあるが読めなかった」(IO エラー、パースできない decomposition) を併合する。
  併合は 1 層上流にあり、state::load_decomposition が std::fs::read_to_string を
  素の Result で包むだけなので、ここへ届く時点で ENOENT と読み取り失敗は区別不能。

fail-open ではない (どちらも Escalate へ倒れる) が、読み取り失敗が undetermined_reason: null かつ risk=unknown reversible=unknown として報告される。つまり「評価すべきものが何も無かった」のと同じ見え方になる。

呼び出しサイト実測 (コマンド: grep -rn 'load_decomposition' --include=*.rs crates/ 、測定点 f08fa5f0、測定日 2026-08-06): 定義を除いて 17 箇所。内訳は condukt/src/main.rs に 9、state.rs 内 (テスト含む) に 5、gate_exec.rs に 1、lessons.rs に 1、docstring 参照 1。

したがってスコープ判断: load_decomposition のシグネチャを一括で三値へ変えると 17 箇所に波及する。判定を担っているのは gate_exec の 1 箇所だけ (他は表示・集計・テスト) なので、**一括変更ではなく、三値を返す新しい関数を足して gate_exec だけをそちらへ寄せる**のが正しい切り方。残り 16 箇所は現状維持でよく、寄せる必要が出たときに個別に移す。

完了条件:
(1) state.rs に、絶対的不在 (ENOENT) と判定不能 (その他の IO エラー・パース失敗) を区別して返す読み込み関数を足す。harness_core::verdict::Determination を使う (この repo の共有三値型であり、各 crate で再発明しない)。
(2) gate_exec の gather_assessment をその関数へ寄せ、GatherOutcome に「読めなかった」を Undetermined 側として届ける (Missing は絶対的不在だけを意味するようにする)。
(3) 読み取り失敗のとき undetermined_reason が null でなくなることを確かめるテストを RED 先行で追加する。現状 gate_exec の Undetermined 経路は SensitiveConfig::default() が常にコンパイル可能なため公開入口から到達不能 (backlog a5d9bdd8) だが、**読み込み失敗の側は decomposition ファイルを壊すだけで CLI 経由で到達できる**ので、こちらは end-to-end テストが書ける。
(4) gate_exec.rs の KNOWN GAP docstring を、解消された事実に合わせて同一コミットで是正する。
(5) condukt は 3 ファイル lockstep で micro bump。"""
