[package]
rust-version.workspace = true
name = "runbook"
version = "0.1.17"
edition = "2021"
description = "Reusable procedure includes for Claude Code: a UserPromptSubmit hook that expands !name macros in a prompt into the matching repo-committed procedure under .runbook."
license = "MIT"

[[bin]]
name = "runbook"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }
