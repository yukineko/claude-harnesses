  13:05:51  full rollout (--canary) が registry を patch。deployed_at=1787544351
  13:06:11  registry が 0.2.51 へ書き戻される (patch の **20 秒後**、100 秒ではない)
            書き戻された record: lastUpdated=2026-08-24T04:06:11.696Z
                                 gitCommitSha=cd2576bd (= 本セッション開始時の HEAD)
  13:07:21  blastguard だけを対象に rollout → 0.2.54 が入る
  13:08:53  **92 秒後も 0.2.54 のまま。戻らない。** registry の mtime は 13:07:21 で不変
  13:09:15  full rollout (--force --canary) → check-plugin-rollout.py が
            「OK: 40 plugins deployed at their source version and file-for-file
             identical to their crate (no rollout drift)」
  13:10:20  5 件すべて source 版のまま (blastguard 0.2.54 / condukt 0.7.140 /
            fetchguard 0.1.2 / flow 0.2.8 / overwatch 0.2.29)

## 書き込み契機 — 上で「未読のまま残した」点の答え

reconcile は**周期的ではなくイベント駆動**である。13:06:11 の書き戻しは、その直前に
ユーザーが打った `/plugin update` + `/reload-plugins` の非同期 reconcile が着地した
ものであり、13:05:51 の rollout はその窓の**内側**に入ってしまっていた。
書き戻された record の `gitCommitSha` がセッション開始時の HEAD (cd2576bd) だったのが
決定的な証拠 — アプリは古い in-memory snapshot を権威として書いている。

したがって上の本文にある提案 (3)「rollout 側でレースを避ける手段があるか」は
**判定不能ではなく、答えが出た**: `/plugin update` / `/reload-plugins` と同時に
走らせないこと。それだけで足りる。

## 併せて見つかった別の罠 — reconcile は新しい version dir を GC 対象に印を付ける

13:06:11 の reconcile は registry を戻すだけでなく、**その瞬間に配布したばかりの
version dir へ `.orphaned_at` を書いた**:

    $ cat ~/.claude/plugins/cache/yukineko/blastguard/0.2.54/.orphaned_at
    1787544371697          # = 13:06:11。registry 書き戻しと同一秒

in-memory の registry から見て参照されていない dir なので、prune 対象として印を
付けている。これは version drift とは**別の finding** に化ける:

    - blastguard: deployed tree is not a mirror of crates/blastguard — 1 deployed
      file(s) are not in the crate and are not rebuild artifacts: .orphaned_at
      <- fix with: scripts/rollout-plugins.sh --plugin blastguard --force
         (a plain rollout is a no-op at an unchanged version and will NOT repair this)

**素の rollout では直らない** (版が変わらないので no-op)。`--force` が必要である。
ゲートのメッセージ自体がそう言っているので、ここは既に正しく設計されている。

## この item に残る有効な部分

提案 (2)「rollout の最後に registry を再検証する」は**既に実装済み**である —
rollout は末尾で `check-plugin-rollout.py` を回し、戻されていれば
「rollout: FAILED — drift remains after this run」で非 0 終了する
(13:05:51 の run が実際にそう報告した)。patch した時点で成功扱いにはしていない。

提案 (1)「稼働プロセスの保持版に張り付いている状態を三値で報告する」は依然有効。
今回のように `/plugin update` の窓に入った場合、「ロールアウトしていない」と
「ロールアウトしたが reconcile に戻された」は出力から区別できない。prune が pid を
見ているのと同じ情報で区別できるはずである。
