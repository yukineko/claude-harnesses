worktree cwd (同一秒): last_outcome = null

原因: .gitignore:21-22 が .compass/carve-state.json と .compass/outcomes.json を無視している。.compass/charter.md だけが tracked。linked worktree は fresh checkout なので ignored ファイルは存在せず、main の 63 件の outcome が worktree からは 0 件に見える。

なぜ重要か: CLAUDE.md 第8節は作業を worktree で行うことを絶対義務にしており、compass skill 自身も 現ツリーへ書き込む skill は worktree から実行する と明記している。つまり compass を規約どおりに動かす唯一の場所から、計測ループの履歴が構造的に見えない。しかも見えないことが last_outcome: null として返る — これは outcome が一度も記録されていない状態と区別がつかない。判定不能が 空 へ潰れる形であり、charter 自身の north_star が名指ししているクラスそのもの。claim registry の worktree 分離 (p0 d83b0e8f) と同型で、ストアの解決が repo_root ベースであることが共通の根。

影響: (a) compass gap の last_outcome が常に null になり、前回の verdict が次サイクルへ再浮上しない（build ≠ validate の validate 側が効かない）。(b) carve-state.json も worktree ごとに新規作成されるので carve round が fork する。実測: worktree 側の carve-state.json は本日 18:32 に新規作成され 41487 bytes、main 側は 2026-09-07 22:56 の 35329 bytes。

読み1 (欠陥): これらは project 単位の永続状態なので tracked にするか、machine-global ストア（~/.compass など）へ移すべき。
読み2 (仕様): outcomes/carve-state は生成物なので ignore は正しく、worktree から compass を回すことを想定していないだけ。
見分け方: compass の README/DESIGN が outcomes.json を project 永続状態と位置づけているか、それとも再生成可能な cache と位置づけているかを読む。永続状態と書いてあれば読み1。

最低限の是正（読み1でも読み2でも成立する）: 読めなかった場合と 0 件だった場合を区別する。今は両方 null。Determination で undetermined を返し、gap の消費側がそれを 前進なし と読まないようにする。

【2026-09-13 追記 — 三例目。しかもこれは verdict 経路である】
compass pivot-check を同一秒に 2 つの cwd から実行した実測（測定点 a8f79bd7）:

  main cwd     -> {"recommendation":"persevere","streak":0,"threshold":3,"reason":"latest outcome is forward; persevere"}
  worktree cwd -> {"recommendation":"persevere","streak":0,"threshold":3,"reason":"no outcomes recorded yet; persevere"}

pivot-check は north_star を彫り直すべきかを決める判定であり、observability ではない。
worktree から実行すると outcomes が 0 件に見えるため、backward がいくつ積み上がっても
streak は 0 のままで、**pivot 検出器は worktree からは構造的に発火しない**。
reason 文字列が no outcomes recorded yet と言っている点に注目 — ゲート自身は
読めなかったのではなく 一度も記録されていない と述べており、これは
CLAUDE.md 第3節の 空集合を返さない に真っ向から反する形（Absent と Undetermined の同一視）。

したがって本件は compass の内部都合ではなく、DoD14(b) が要求する
『共有ストアの worktree 読み取りは Known(空) ではなく Undetermined』の実例である。
消費者は少なくとも 3 本: compass gap の last_outcome、compass pivot-check、carve-state.json の round。


【2026-09-16 — 四例目。ここで初めて「隠す」ではなく「失う」が起きた】
これまでの 3 例はいずれも共有ストアが worktree から空に見えるという読み取り側の話だったが、
今回は書き込みが失われた。測定日 2026-09-16。

flow の sink として worktree cwd から compass outcome を記録したところ、逐語:
  compass: recorded outcome #0 (Forward) vs measuring_stick -- <worktree>/.compass/outcomes.json

main 側の実際の seq は 63 である (同日 compass gap を main cwd から取得して確認済み)。
worktree からは履歴が 0 件に見えるので、64 番目ではなく #0 として記録された。
さらに .compass/outcomes.json は .gitignore:21-22 で無視されるため、この outcome は
commit されず main へ merge されることもない。つまり計測ループを閉じた記録が
worktree の中に取り残されて消える。

ここが重要な点である。CLAUDE.md 第8節は作業を worktree に限定し、compass skill 自身も
「compass / flow など現ツリーへ書き込む skill も worktree から実行する」と明記している。
一方で outcomes の正典は main のツリーにある。両者は両立しない。
規範に従って正しく実行した結果として記録が失われるのだから、これは利用者の運用ミスではなく
配線の欠陥である。

回避策として main cwd から compass outcome を打つことは選ばなかった。
.compass/ は gitignore されているとはいえ main の作業ツリーへの書き込みであり、
第8節が明示的に .compass/charter.md を例に挙げて禁じている形に該当するため。
黙って迂回するより、失われたことを記録する方を選んだ。

