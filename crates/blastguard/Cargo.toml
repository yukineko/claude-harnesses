[package]
rust-version.workspace = true
name = "blastguard"
version = "0.2.54"
edition = "2021"
description = "PreToolUse hook that denies project-destroying Bash commands and file operations. Self-contained, subscription-native."
license = "MIT"

[[bin]]
name = "blastguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }
serde = { workspace = true }
serde_json = { workspace = true }
globset = "0.4"
sha2 = { workspace = true }

[dev-dependencies]
trybuild = "1"
tempfile = { workspace = true }

# ワークスペースの [workspace.lints.clippy] を継承する（unwrap_used / expect_used = deny）。
# 判定を持つ crate では panic は判定不能そのものなので、production 側に unwrap / expect を
# 書けなくする。テスト側は各 crate root / 各 integration test の
# `#![cfg_attr(test, allow(...))]` で除外している（意図的な assert であって fail-open ではない）。
[lints]
workspace = true
