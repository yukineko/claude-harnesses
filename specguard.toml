# specguard config: harness workspace-level spec↔implementation drift audit.
# Run `specguard run` (or `/specguard:run`) to audit areas touched since the last baseline.
# The SessionStart hook (`specguard pending`) surfaces any unhandled sentinel.
[project]
name = "harness"
root = "."

[output]
report_dir = "reports/spec-audit"
sentinel = ".specguard-pending"

# This repo does not use ADR-style decision records; disable the decisions
# feature explicitly (empty dir = disabled; see config.rs / decision.rs).
[decisions]
dir = ""

# file→spec map store (`specguard map`). `exclude` lists repo-root-relative globs
# for paths that are NOT spec-bearing features — manifests, lockfiles, plugin
# descriptors, docs, prompt assets, CI/tooling, fixtures. `map build`/`sync` skip
# them and `map prune` drops any already-seeded entry that matches, so a `changed`
# status reflects genuine source/spec drift rather than config churn. Only real
# source (`crates/*/src/**` etc.) and *.rs tests remain tracked.
[map]
exclude = [
    "Cargo.lock",
    "**/*.toml",
    "**/.claude-plugin/**",
    "**/*.md",
    "**/templates/**",
    "**/commands/**",
    "scripts/**",
    ".github/**",
    "**/*.yml",
    "**/*.yaml",
    "**/*.py",
    "**/fixtures/**",
    "**/*.json",
    "**/*.jsonl",
    # committed compiled plugin binaries (repo-root and per-crate bin/) — generated artifacts, not spec-bearing
    "bin/**",
    "crates/*/bin/**",
    # repo tooling / non-source that is not a spec-bearing feature
    "Makefile",
    "**/Makefile",
    ".githooks/**",
    ".gitignore",
    "**/.gitignore",
    # stale pre-monorepo root-level source paths (real source lives under crates/*/src)
    "src/**",
    "hooks/**",
    "agents/**",
    # shell scripts and per-crate build/sync scripts — tooling, not spec-bearing
    "**/*.sh",
    "**/scripts/**",
    "install.sh",
    # examples / eval harness scaffolds and root-level integration tests (not a crate feature)
    "examples/**",
    "eval/**",
    "tests/**",
]

# condukt: task decomposition / worktree orchestrator
[[area]]
name = "condukt"
globs = [
    "crates/condukt/src/**",
    "crates/condukt/skills/**",
    "crates/condukt/agents/**",
    "crates/condukt/hooks/**",
]
canon = [
    "crates/condukt/README.md",
    "crates/condukt/skills/condukt/SKILL.md",
]

# specguard: spec↔impl drift audit harness (dogfood)
[[area]]
name = "specguard"
globs = [
    "crates/specguard/src/**",
    "crates/specguard/templates/**",
    "crates/specguard/commands/**",
]
canon = [
    "crates/specguard/README.md",
    "crates/specguard/DESIGN.md",
    "crates/specguard/DESIGN-VERIFY.md",
    "crates/specguard/INSTALL.md",
]

# harness-core: shared hook/pricing/transcript/config foundation
[[area]]
name = "harness-core"
globs = ["crates/harness-core/src/**"]
canon = ["docs/OVERVIEW.md"]

[[invariant]]
name = "hook never panics"
description = "harness-core::hook::run_hook must catch panics and always exit 0 (docs/OVERVIEW.md §フック不変条件)"
canon = ["crates/harness-core/src/hook.rs", "docs/OVERVIEW.md"]

# blastguard: destructive-Bash-command PreToolUse guard
[[area]]
name = "blastguard"
globs = ["crates/blastguard/src/**"]
canon = ["crates/blastguard/README.md", "crates/blastguard/README.ja.md"]

# propguard: invariant/property verdict guard
[[area]]
name = "propguard"
globs = ["crates/propguard/src/**"]
canon = ["crates/propguard/README.md", "crates/propguard/README.ja.md"]

# stuckguard: repeated-operation / oscillation nudge guard
[[area]]
name = "stuckguard"
globs = ["crates/stuckguard/src/**"]
canon = ["crates/stuckguard/README.md", "crates/stuckguard/README.ja.md"]

# mutategate: mutation-testing PASS/fail gate
[[area]]
name = "mutategate"
globs = ["crates/mutategate/src/**"]
canon = ["crates/mutategate/README.md", "crates/mutategate/README.ja.md"]

# overwatch: cross-session lease/review-queue observability registry
[[area]]
name = "overwatch"
globs = ["crates/overwatch/src/**"]
canon = ["crates/overwatch/README.md", "crates/overwatch/README.ja.md"]
