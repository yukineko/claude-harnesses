[[task]]
id = "8abd74c4"
title = "blastguard: the >| redirect operand is mis-extracted to an empty string, producing a true verdict with a false reason"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "blastguard",
    "prose-vs-behaviour",
    "p2",
]
touched_files = []
status = "pending"
notes = """
Measured 2026-09-10, locally built 0.2.59 binary, worktree agent-a3292f0e8fb2bc7e3.

  cargo test >| /etc/hosts
    -> deny | '> ' destroys the file's current contents and '' is a relative path and blastguard does not know which directory it is relative to, so it cannot tell whether these bytes are recoverable

Compare the same target through every other spelling, all of which extract /etc/hosts correctly and deny with the right reason: '>', '2>', '1>', '&>', '>' + tab, quoted '"/etc/hosts"', single-quoted, no-space '2>/etc/hosts', inside a subshell, after a semicolon, and behind a here-string. Twelve forms were probed; only >| mis-parses.

The bash clobber-override operator >| is being split as '>' followed by an operand beginning '|', and the operand comes out empty. The VERDICT is still deny, so this is fail-closed and not a hole - but the reason a human reads names a relative path and an empty target that do not exist in the command. That is a CLAUDE.md section 4 divergence between the stated reason and the actual finding, and it is also the kind of empty-operand path that only stays safe by luck: anything downstream that treats an empty target as 'nothing to check' would turn it into an Allow.

Fix = teach the redirect operand scanner that >| is a single two-character operator."""
