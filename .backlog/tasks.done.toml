--- 再測定 2026-09-11、測定点 f7ffc2c9 ---

【未着手 1 は landed していた — 結論を継承せず測り直した結果】
チケットは precommit-audit 側を「未着手」としていたが、現在の HEAD では
帰属絞り込みが実装済みである:
  crates/precommit-audit/src/main.rs:359
    let attribution = harness_core::attribution::attribute_from_session(...)
  同 :361 Narrowed { keep, excluded } / :373 Undetermined { why } を
  それぞれ明示的に処理し、:380 で attribution.files(&files) に絞る。
git.rs:69 の changed_and_untracked も docstring が逐語で
「This is the **unattributed** working set ... `main` narrows it through
`harness_core::attribution` before auditing, which drops only files another
session's transcript positively claims — never files that merely fail to
appear in this session's own footprint」と書いており、実装と一致する。
判定不能を「自分の変更ではない」へ倒していない点も完了条件どおり。
チケットが懸念した「セッション同定の入口」は attribute_from_session が
session_id を受ける形で解決済み。

【未着手 2 は今も再現する — 実測で確認した】
pathspec commit x check-doc-claims。まず「もう直っている」可能性を潰すため
段階的に測った:

  (a) SKILL.md を作業ツリーで 1 行ずらす -> 検出されない。
      理由は判明: scripts/check-doc-claims.py:108 LINE_DRIFT_TOLERANCE = 10
      があり、10 行以内のずれは finding にならない。
  (b) 引用文そのものを破壊する -> [BLOCK] quote-not-found x2。
      つまり当該 claim は確かに検査対象である (検査されていないから
      静かなのではない)。この対照を取らずに (a) だけで「直っている」と
