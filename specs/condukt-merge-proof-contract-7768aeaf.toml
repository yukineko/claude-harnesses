[[requirement]]
id = "R5"
statement = "判定できない入力はすべて拒否する。proof が判定不能なら merge-proof-contract(undetermined-proof)、task が判定不能なら merge-proof-contract(undetermined-task) を出す。"
acceptance = [
    "次の各条件は `merge-proof-contract(undetermined-proof)` で拒否する: red_failed_tests が null または欠落、counts.determined が false または counts が欠落、tree_identity または tree が null か欠落、proof が読めない・parse できない、slot_files の読み取りエラー、branch tip の tree が計算できない、worktree と archive の両方に内容の違う proof がある、proof dir が proof_dir_candidates の 1 候補に定まらない。",
    "旧形式の手書き proof（write_valid_proofs）は拒否する。control_merge_with_valid_tdd_proofs_succeeds は、独立 agent がこの拒否を assert する control に re-anchor する。",
    "task を名指しした（または conduktTask から解決した）merge で、run state が読めない・task が run state に無い・kind が無いときは `merge-proof-contract(undetermined-task)` で拒否する。requires_fp_oracle_only_for_fix_or_feature は green のまま。",
]
canon = [
    "CLAUDE.md §3",
    "crates/tdd/src/evidence.rs:203-237",
    "crates/tdd/README.md:171-178",
    "crates/condukt/src/proof_archive.rs:40-44",
    "crates/condukt/src/proof_archive.rs:77-99",
    "user rulings 2026-11-20 round 1, round 3 Q3, round 5 Q-F",
]
falsifiable = true

[[requirement]]
id = "R6"
statement = "proof は task worktree から読み、無ければ archive dir から読む。branch tip に commit された .tdd/ は読み元にしない。`worktree merge` では hold gate と trial merge より前に検査する。task 指定の無い merge は branch.<b>.conduktTask から task を解決する。契約の対象は kind fix/feature だけ。"
acceptance = [
    "契約に違反し、かつ conflict するか hold される branch は、merge-proof-contract token 付きの非0終了で拒否し、conflict や hold の記録を作らない。",
    "--run/--task を付けない merge で、conduktTask が proof の無い fix task を指していれば `merge-proof-contract(i)` で拒否する。conduktTask の記録が無い branch は契約を検査しない。",
    "kind=chore で proof の無い task の merge は成功する。",
    "branch tip に commit された .tdd/ にしか proof が無い場合は merge-proof-contract(i) で拒否する。",
    "main.rs:554-562 の doc を同じ commit で改訂する。",
]
canon = [
    "crates/condukt/src/worktree.rs:1137-1158",
    "crates/condukt/src/main.rs:554-562",
    "crates/condukt/src/worktree.rs:833",
    "crates/condukt/src/proof_archive.rs:40-44",
    "crates/condukt/src/model.rs:162-169",
    "user rulings 2026-11-20 round 3 Q1, round 5 Q-F",
]
falsifiable = true

[[requirement]]
id = "R7"
statement = "`condukt worktree resolve-merge` にも同じ契約を適用する（task は conduktTask で特定し、(h) は resolve 時点の branch tip と比べる）。Theirs では merge の前に検査する。clean に merge できる Manual では commit の直前に検査し、違反なら rollback する。Ours と marker だけの Manual は対象外。"
acceptance = [
    "Theirs で契約違反の branch は非0終了で merge-proof-contract(<item>) を出し、main HEAD は変わらない。",
    "clean に merge できる Manual（worktree.rs:1633 経路）で違反があれば、非0終了・main HEAD==head_before・merge 進行中の状態が残らない。",
    "Ours と ManualPending は契約で拒否しない。",
    "conduktTask の記録が無い branch は契約を検査しない。",
]
