status = "pending"
notes = """
実観測 2026-09-08、測定点 cebce0e6。`scripts/rollout-plugins.sh --plugin blastguard
--plugin overwatch --plugin specguard --canary --force` の実行中に発生。

## 何が起きたか

stage 2 (overwatch) の health-gate が下記で fail-closed halt した:

    overwatch: no bundled binary for linux-x86_64
      (/home/…/.claude/plugins/cache/yukineko/overwatch/0.2.32/bin/overwatch-linux-x86_64)
    health-gate: CANNOT EVALUATE (rc=1) — canary health unverifiable; failing CLOSED,
      rolling back stage 2 and halting without advancing.

halt 後に配布ツリーを実測すると、先行して copy 済みの blastguard / specguard も
プラットフォームバイナリを失っていた (launcher しか無い):

    blastguard/0.2.55/bin/  -> blastguard
    overwatch/0.2.32/bin/   -> overwatch
    specguard/0.2.56/bin/   -> specforge specguard

## 因果 (実測で確定)

1. `bin/<name>-linux-x86_64` は rebuild-plugins.sh が後段で生成する成果物であって
   crate には存在しない (`git ls-files crates/overwatch/bin/` は
   `crates/overwatch/bin/overwatch` の 1 件のみ)。
2. `copy_plugin_dir` (rollout-plugins.sh:393) は `rsync -a --delete` で crate を
   鏡像コピーするため、`--force` 再コピーでこの成果物を**削除する**。
   rsync 非搭載時の fallback (`find "$dst" -mindepth 1 -maxdepth 1 ! -name '.in_use'
   -exec rm -rf {} +`) も同じく bin/ ごと消す。
3. canary の health-gate は `resolve_overwatch_bin` が返す overwatch を実行するが、
   これは cache 内の launcher に解決される。overwatch 自身の stage で 2. が起き、
   直前に自分の実行体を消してから gate を呼ぶことになる。
4. rebuild 段 (rollout-plugins.sh:602) は**全 stage 完了後**にしか走らないので、
   halt すると copy 済み stage は成果物が無いまま残る。

## なぜ red ではなく dark か

launcher しか無いプラグインの hook は「違反なし」ではなく**起動しない**。
CLAUDE.md の launcher-exec-bit ゲートが 100644 launcher について
「Permission denied で暗転し、hook が起動しない = finding も出ないので red ではなく
dark になる」と書いているのと同じ失敗様式で、ゲート crate 3 本が同時に暗転した。

fail-closed でロールバックした判断自体は CLAUDE.md 3. のとおり正しい。欠陥は
(a) 鏡像コピーが gate 自身の実行体を消す順序と、
(b) halt が「rollout 前より暗い」状態を残すこと の 2 点。

## 復旧手順 (今回実施済み・恒久対策ではない)

    scripts/rebuild-plugins.sh --no-clean --only=blastguard,overwatch,specguard

で 4 バイナリを seed し直し、`check-plugin-rollout.py` は exit=0 に戻した。

## done_criteria

1. `copy_plugin_dir` が配布済みのプラットフォームバイナリ
   (`bin/<name>-<platform-suffix>`、`check-plugin-rollout.py` の PLATFORM_SUFFIXES が
   正典) を `--delete` 鏡像から保護する。rsync 経路と cp -a fallback の両方。
2. 保護対象の算出に失敗したら CLAUDE.md 3. に従い copy を実行せず異常終了する
   (空集合を「保護対象なし」と読まない)。
3. 上の欠陥を再現する自動テストが存在し、修正前に RED、修正後に GREEN であることを
   観測した証跡がコミットに残る。テストは実装者以外が書く (CLAUDE.md 2.(a))。
4. `scripts/check-plugin-rollout.py` が exit=0 のまま。

## 裁定 (2026-09-08、ユーザー裁定。未決ではない)

(b)「halt が rollout 前より暗い状態を残す」は**修正しない**。stage ごとに rebuild を
走らせる案は既知の bootstrap-skew (backlog 2a953ab5) の前提を変えるため、そちらの設計を
維持する方を採る。(a) の修正で halt 時にバイナリが消えること自体が無くなったので、
halt が残す状態は「rollout 前と同じ」であって「より暗い」ではなくなった。

## 追加で決まったこと (同日)

保護は無条件ではない。`bin/<stem>-<suffix>` を守るのは **crate が launcher
`bin/<stem>` を今も出荷している間だけ**で、rename / 削除されたバイナリの置き土産は
`--delete` に任せて消す。守り続けると保護そのものが増える一方の ratchet になるため。

## 未決 — checker との非対称 (2026-09-08、独立検証者の指摘。要裁定)

保護を絞った結果、同じファイル種別について 2 つのスクリプトが違う規則を持つ:

- `scripts/rollout-plugins.sh` の `copy_plugin_dir` は、crate に launcher の無い
  `bin/<stem>-<suffix>` を orphan として削除する。
- `scripts/check-plugin-rollout.py` の `_is_rebuild_artifact` は、crate に対応が無い
  `bin/<name>-<suffix>` を「配布ツリーに正当に存在しうる rebuild 成果物」として今も許容する。

したがって `copy_plugin_dir` 以外の経路で入り込んだ orphan は、check を素通りする。
rollout が毎回消すので蓄積はしないが、**検出はされない**。checker を広げるのは
ゲートの verdict を変える行為なので、別コミット・別裁定とする。

## 追記 — 判定不能が削除側に倒れる点への対処 (同日)

`[ -f "$src/bin/$stem" ]` は「crate が launcher を commit している」という不変条件に
依存する。この不変条件が live な plugin について破れると、生きている成果物が orphan と
読まれて削除され、d22b2d6b が直したのと同じ dark に戻る。不変条件自体は
`check-plugin-rollout.py` の `_bin_launcher_problem` と `check-launcher-exec-bit.py` が
機械検査しているが、copy の時点では検査していない。そこで **保護しなかった成果物は
必ず stderr に 1 行出す**ようにした (沈黙は許容される degrade ではない — CLAUDE.md 1.)。
rename 時には出て当然の行であり、rename していない plugin で出たら不変条件が破れた合図。"""
