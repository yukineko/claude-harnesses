## 1. 決定関数そのもの

`is_removable` (wt_reconcile.rs:279) は total・pure・網羅 match で、`_ =>` アームが無い。
`Undetermined` はどの入力位置でも `false`。`true` に到達するのは
`Known(ThisRepo)` かつ `Known(Dead)` かつ (`Known(dirty=false)` または
`Known(dirty=true)` かつ `preserved`) の場合だけ。
`decision_table()` (:2243) が **3 role x 3 attribution x 3 occupancy x 3 dirty x 2
preserved = 162 行の完全直積**を出力し、
`no_undetermined_input_is_ever_removable` (:2367) が
「Undetermined を含む行は 1 つも removable でない」と
**`removable_seen > 0`** (アンチ空虚) を同時に固定している。

## 2. `Occupancy::Dead` へ至る経路

`unclaimed_occupancy` の match で Dead に落ちるアームは :1428-1433 の **1 本だけ**で、
`Known(Stalled)` かつ `Known(NoneEverRanHere)` かつ `Known(AllStaleHere)` の
三重 Known を要求する。他の全アームは Undetermined。

## 3. IO 失敗

`registrations_in` の `read_dir` (root / bucket / record 列挙)・`read_to_string`・
`serde_json::from_str`・project/heartbeat_at フィールド欠落は**すべて Undetermined**。
`driver_registry_root` は `$HOME` 未設定を Undetermined。
`dirtiness` は git root でない path を Undetermined。

## 4. subprocess の終了ステータス (CLAUDE.md 第3節)

`worktree::git` -> `git_output_to_result` は **timeout と非0終了の両方で `bail!`** し、
stdout を返さない。したがって `dirtiness` の
`Ok(s) => Known(!s.trim().is_empty())` に空文字が渡るのは
**git が実際に 0 で終了した場合だけ**。「落ちたチェッカを合格と読む」経路は無い。

## 5. 空集合

`registrations_in` で一致する記録が 0 件のとき `found_stale == false` となり
`Undetermined` を返す (「誰も居ない」ではない)。空集合 fail-open は無い。

## 6. panic

`condukt worktree cleanup` は `run_user` 経由であり、`run_hook`
(main.rs:1707 の `catch_unwind` -> 常時 exit 0) は**通らない**。GC の経路に panic
barrier は無く、panic はプロセスを非0で落とす — 削除は判定の**後**なので何も消えない。
**ここに panic barrier が無いことが正しい設計**であり、後から「turn を壊すな」で
包まないこと (第1節)。この経路唯一の `.expect` は
`git_output_to_result` の `status is Some when not timed_out` で、不変条件が明示されている。

## 訂正: blast radius は「削除」ではなく「resume」の側が重い

本項目の記録は removable=true を**削除の危険**として書いていたが、走査の結果
**`Occupancy::Dead` の消費者は 2 つ**あることが分かった:

- `is_removable` -> 削除。ただし `worktree cleanup --remove` は
  `role == Unregistered` の entry しか候補にしない (main.rs:3307)。
  0.7.146 で dead 判定された `session-05717fa8` は **Registered** なので
  cleanup では消えなかった。
