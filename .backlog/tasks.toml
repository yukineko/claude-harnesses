notes = "実測 2026-09-13。本セッション (開始 1789273597、worktree session-2444be10) で tdd Stop ゲートが3回連続で no bundled binary for darwin-arm64 を報告し UNCHECKED で fail-closed した。当初これを 8206b09f が未修正である証拠と読んだが、これは誤りだった。訂正する。/ 逐語の実測: /Users/yuki/.claude/plugins/cache/yukineko/tdd/0.1.31/bin/ には tdd-darwin-arm64 が 1852304 bytes で存在し、mtime は 13:36。.deployed-from.json は commit 8604174044085d44413f06fa6afe44fb18da0159 / dirty:false / harness_core_version 0.2.19 / deployed_at 1789274197。すなわち別セッションが本セッション開始の約600秒後に 0.1.31 を rollout して既に修正している。一方 0.1.29/bin/ には launcher (4044 bytes) しか無く host binary は無いまま。/ 観測された不変条件: 稼働中セッションの CLAUDE_PLUGIN_ROOT はセッション開始時に解決された version dir に固定される。したがって rollout は既に走っているセッションのフックを差し替えられない。dark なゲートを持つセッションは、他のセッションがいくら直しても restart するまで dark のままである。/ 帰結が2つある。(1) 私が観測した dark は セッション局所の事実であり、グローバルな未修正ではなかった。ゲートの UNCHECKED という報告自体は正しく、嘘はついていない — 嘘をついたのは それを未修正と読んだ私の推論である。(2) より重要な点として、0.1.29 という version dir は今も host binary を欠いたまま存在する。もし将来どこかのセッションがこの dir に解決されれば、そのセッションは丸ごと dark になる。古い version dir を残す設計なら、host binary を欠いた dir が残ることは それ自体が欠陥である。/ 判定不能として残す点: 0.1.29 の dir を手動で seed すべきかは判断しない。CLAUDE.md は手動 cp を禁じている (cache の version dir が乖離し古い版が配布される) ので、0.1.30 でビルドした binary を 0.1.29 の dir へ置くのは、まさにその禁止が対象とする乖離を作る。正しい解は (a) host binary を欠いた version dir を rollout が検出して削除する、(b) launcher が binary 不在時に兄弟 version dir へフォールバックする、(c) 現状維持で restart に委ねる、のいずれか。人間の裁定が要る。/ 関連 8206b09f (実質的に別セッションが解決済み) / 6fb08b03 (取り残し claim の起票。そちらの 修正は landed していない という記述も本件により訂正が必要) / 5319d798 (version dir 名と中身の乖離は rollout の設計どおり、という既存の訂正記録)。"
