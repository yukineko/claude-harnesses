[package]
rust-version.workspace = true
name = "benchkit"
version = "0.1.16"
edition = "2021"
description = "External-benchmark (SWE-bench Verified) runner skeleton: a typed instance model, a fixture-based JSONL loader, and a gated download subcommand that fetches the dataset only on explicit request."
license = "MIT"

[[bin]]
name = "benchkit"
path = "src/main.rs"

[lib]
name = "benchkit"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
overwatch = { path = "../overwatch" }

[dev-dependencies]
tempfile = { workspace = true }
