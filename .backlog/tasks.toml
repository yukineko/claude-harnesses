notes = """
Measured 2026-09-10 against the locally built 0.2.59 binary (worktree agent-a3292f0e8fb2bc7e3), PreToolUse payload on stdin, cwd=/Users/yuki/src/harness:
  cp evil /etc/paths.d/zz            -> ALLOW (silent)
  install -m755 evil /usr/local/bin/x -> ALLOW (silent)
  mv evil /Library/LaunchDaemons/e.plist -> ALLOW (silent)
  tee /etc/paths.d/zz                -> deny (caught by the tee rule, not by any system-dir axis)

Same root cause as 19c359d0: f18134da (0.2.59) moved the axis to recoverability, and a path that does not exist yet answers NothingToDestroy, so the write is allowed. 0.2.60 added scope::is_inside_system_dir and wired it into the TRUNCATING and APPEND redirect loops only. The cp/mv/install DESTINATION path is a separate rule and was NOT wired up, so the identical payload lands through a different verb.

This is the mirror-gap pattern the repo already records: a fix landed on one path, the twin was left open. Fix = call system_path_block on the destination operand of the copy/move/install rules too.

Note the 0.2.58 behaviour for contrast: all of these were DENIED at f18134da^, for the wrong stated reason (truncates and overwrites an existing file, asserted without any existence check). So the verdict regressed while the reason string was being corrected."""
