番号だけ直すと **解決済みの設計を現状の欠陥として提示する**ことになる。それは CLAUDE.md 第4節が
禁じる「次のレビュアーを騙す散文」そのもので、行番号が合っているぶん**むしろ発見しにくくなる**。
