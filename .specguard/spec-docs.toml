# Tracked spec-doc bindings for gate-crate map entries (backlog 0c277117).
#
# `specguard map gate-check` reads this file: a changed gate-crate entry passes
# when one [[spec]] names its entry key or one of its impl files, carries a
# non-blank `reason`, and `doc` is an existing, non-empty docs/specs/*.md.
# The spec map (.specguard/spec-map.toml) is a gitignored machine-local cache,
# so a binding written there by `map set-spec` never reaches another clone or
# the pre-push check tree; this file is the durable record.
# Each reason cites the doc section that describes the file. A file no doc
# describes goes to spec-doc-acks.toml with its reason instead.

