   # On Stop, tdd gate blocks the turn when implementation code was ADDED without
   # an accompanying test ...

   The substring without an accompanying test is exactly what the frozen test at gate.rs around :640 rejects in the block reason (!lower.contains("no accompanying test")) and :645 (!lower.contains("without a test")). The scan is working-tree only.

3. reviewgate - crates/reviewgate/src/main.rs around :377-378 (STARTER), crates/reviewgate/reviewgate.example.toml around :10-12, crates/reviewgate/src/config.rs around :18-19, crates/reviewgate/README.md around :17, crates/reviewgate/src/main.rs around :6, verbatim:

   #   mode = "inject"     block once per new diff and inject a rubric; the running
   #                       agent reviews its own changes (no API key).

   review.rs around :499-504 already documents why 自分の変更 was removed from the message: the list is an unattributed union with no blame, no author, no session id. The frozen tests (review.rs around :997 and :1147) bind inject_reason and subprocess_reason only - they do not reach the template, the Mode::Inject doc comment, or the README.

