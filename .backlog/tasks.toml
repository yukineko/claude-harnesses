id = "aafeaa05"
title = "blastguard: quoted non-redirect '>' in a shell command after a python stdin heredoc is misattributed as the heredoc's program-text redirect (Deny in subagent)"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "blastguard",
    "false-positive",
    "p1",
]
touched_files = []
status = "pending"
notes = '''
User ruling 2026-11-07: 「false positiveは許可できない」. Do not fix in the filing task.

Observed 2026-11-07 in subagent a4265a5c8acbb7f5e (session 0d3d5bb8): a harmless `python3 - "$F" <<'PY' ... PY` regex rewrite (writes open(p,'w') to argv path $F) followed by the shell line `grep -c '...' $F; diff $S/committed.rs $F | grep '^>' | wc -l` was DENIED (subagent hardening of an Ask) with verbatim reason: "`python3 - "$F" <<'PY'` takes its program from stdin, and the program text contains a `>` that a shell would read as a redirect whose target cannot be determined ('> ' destroys the file's current contents and `` is a relative path and blastguard does not know which directory it is relative to, so it cannot tell whether these bytes are recoverable); in program text it may be an operator or part of a string, but blastguard cannot show that it is not a redirect. Recommended: do not run this."

Measured at d9863f70 (target/debug/blastguard, subagent payload with agent_id, cwd=CLAUDE_PROJECT_DIR=fresh temp dir): the heredoc BODY contains no `>`. The deciding `>` is the single-quoted grep pattern '^>' on the line AFTER the `PY` terminator. Exact command -> deny; same command with '^>' -> '^X' -> allow; exact without the trailing line -> allow; trailing line alone -> allow. Minimal: `python3 - <<'PY'\nprint(1)\nPY\necho '>'` -> deny (echo 'X' -> allow); `... grep '^>' x` and `... grep "^>" x` -> deny; `... echo 'a > b'` -> allow. A `>` as comparison/string INSIDE the quoted body (`if len(s) > 0:`, `print('a > b')`) is already allow. So the defect is attribution: a quoted, non-redirect `>` in a later shell command is reported as program text of the heredoc's interpreter (and with an empty target ``).

Contract quotes:
(1) crates/blastguard/src/detect/interpreter.rs `interpreter_code_verdict` docstring (user ruling R2, 2026-10-14): "The shell pass over the program text reads every `>` as a redirect, so `print(1 > 0)` or `s = 'x > \`y\`'` used to be DENIED as a truncating redirect onto a file it could not name. When that is the ONLY Deny the program text produces, the verdict is an Ask carrying [`RECOMMEND_NO`]".
(2) crates/blastguard/src/detect.rs (line-level arm, 4a1cf1ad): "this `>` sits in the body of a quoted here-document handed to a code interpreter, so it is program text the shell never parses."
Two readings:
(A) intended: R2 says a `>` in program text is an undeterminable possible redirect -> Ask (Deny in subagent); if the `>` were in the program, the Ask is the documented behaviour.
(B) false positive: the `>` here is not in the program text at all (it is inside single/double quotes in a separate shell command after the heredoc terminator, which no shell reads as a redirect), so the R2 finding is misattributed.
How distinguished: targets compare against the neutral variant ('>' -> 'X'); the neutral variant is allow, so the `>` alone decides, and the body has none. Fix must keep the controls (all deny in a subagent at HEAD): `sh <<EOF\necho x > .git/hooks/pre-commit\nEOF`, `bash <<EOF\necho x > .claude/settings.json\nEOF`, `sh <<'EOF'\necho x > .git/hooks/pre-commit\nEOF`, `python3 - <<'PY'\nprint(1)\nPY\necho x > .git/hooks/pre-commit`, `python3 -c "open('.git/hooks/pre-commit','w').write('x')"`, `python3 -c "open('.claude/settings.json','w').write('x')"`.

Test file: crates/blastguard/tests/quoted_heredoc_python_gt_fp_20261107.rs (targets #[ignore]). The exact-command test embeds absolute paths from the observing machine; blastguard only analyses them.'''
