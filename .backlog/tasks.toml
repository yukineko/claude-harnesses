So the honest message is handed to the agent and then re-narrated dishonestly by the skill that ships alongside it. The correct reading is: the block means no test was visible in the uncommitted changes; if the covering test is already committed, say so and take the one-shot skip.

Nothing binds SKILL.md - the frozen tests bind block_reason, giveup_notice and concession_reentry_notice only, and check-doc-claims scopes itself to docs/**/*.md.'''
