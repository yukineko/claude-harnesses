【何が起きるか】
`harness_core::gate::run::consume_session_skip` は 2026-09-09 に第3引数
`stop_hook_active` を得て三状態になった: 尊重した札を `<id>.skip.honoured` へ park し、
別ゲートが block した再入では尊重を続け、chain が実際に終わった最初の 1 回で消費する。
これは「Stop を 4 プロセスが独立に裁く」ために必要だった。

`crates/precommit-audit/src/hookio.rs:75` の `consume_session_skip` は 5 本目の
呼び出し元だが、pre-commit フックなので Claude Code から `stop_hook_active` を
受け取らない。したがって `false`（＝読んだ瞬間に消費）を渡している。

同型の欠陥はここにも存在する: precommit-audit が札を消費して pass した後、
**別の pre-commit チェック**（check-doc-claims / check-test-weakening /
clippy-lints / raw-io-ratchet 等）が同じ commit を止めると、commit は起きていないのに
operator の 1 回限りの札は消えている。次の試行では札を再発行しなければならない。

【なぜ推測で埋めなかったか】
`true` を渡すと `.honoured` が永久に削除されない＝恒久バイパスになる（CLAUDE.md §5 が
禁じるもの）。`false` は少なくとも従来挙動と同一で、恒久バイパスは作らない。
どちらも正しくないが、`false` は既存挙動の保存であり、`true` は新しい穴の作成である。

【完了条件】
pre-commit プロセスが「直前の commit 試行が失敗したか」を観測できる seam を見つけるか、
無いことを確定させる。候補: (a) `.git/` 配下に precommit-audit 自身が置く試行マーカーを
post-commit が消す（post-commit は commit が成立したときだけ走る）、(b) 札を
「N 秒以内 / M 回まで」の時間窓にする（one-shot ではなくなるので要判断）、
(c) 観測不能と確定し、その事実をコード内に明記して閉じる。
測れないなら §2 に従って人間に返すこと。"""
