notes = """
実測 2026-08-18, 測定点 01deeab2。

## 症状: CLAUDE.md 第8節が義務づける worktree から起票すると、課題は削除予定のパスにキーされて生きたチェックアウトから見えなくなる

backlog のプロジェクトキーは cwd の git toplevel である。linked worktree では
show-toplevel が worktree 自身を返すため、worktree ごとに別プロジェクトになる。

  crates/harness-core/src/discovery.rs:44-53  resolve_repo_root(cwd)
    -> git_toplevel(cwd) を第一候補にする
  crates/harness-core/src/discovery.rs:104-116 git_toplevel(cwd)
    -> git -C <cwd> rev-parse --show-toplevel を実行する
  crates/backlog/src/store.rs:1815  canonicalize_project の実体が
    harness_core::discovery::resolve_repo_root(expanded)

セッション worktree での観測値:

  git rev-parse --show-toplevel   -> /mnt/c/.../src/.harness-worktrees/session-e7948728
  git rev-parse --git-common-dir  -> /mnt/c/.../src/harness/.git
  git -C /mnt/c/.../src/harness rev-parse --show-toplevel -> /mnt/c/.../src/harness

つまり show-toplevel は main repo ではなく worktree を返す。git の定義としては正しいが、
プロジェクト同一性の定義としては worktree を別プロジェクトに分裂させる。

## 実害 (このセッションで実際に起きた)

本セッションで起票した 9 件すべてが project = session worktree のパスで保存された。

  backlog list --project /mnt/c/.../src/harness --status pending
    -> 2 件 (2a15dba6, 310a6d56) のみ。9 件は出ない。
  backlog list --project /mnt/c/.../src/.harness-worktrees/session-e7948728 --status pending
    -> 9 件 (2dfb54f8 a0d3cb74 df199ddb ae30502a d592bf28 0067cc23 b112092c 33c9cc23 d1d6383b)

worktree は作業完了後に削除される。削除後、この 9 件は ~/.backlog/tasks.toml に残存するが、
存在しないパスを --project に明示しない限り列挙されない。SessionStart hook と flow propose は
cwd 由来のキーで絞るので、次のセッション (別 worktree) からも main tree からも見えない。

## なぜ構造矛盾なのか

CLAUDE.md 第8節は「main の作業ツリーで許されるのは統合だけ。単一ファイルの doc / 状態編集も
含めて一切 main で直接行わない。必ず worktree で行う」を絶対義務としている。第5節は
「直せないなら理由を明示して報告し、判断を人間に返す (backlog add で残す)」を正しい振る舞いと
定めている。この2つを同時に守ると、起票は必ず worktree の cwd から行われ、必ず捨てられるキーに
紐づく。つまり規範を守るほど起票が失われる。

第4節「間違いの隠蔽は最もやってはならないこと」に照らすと、これは意図しない隠蔽経路である。
起票した本人は「残した」と真に報告でき、その報告は真だが、内容は誰にも見えない。第7節が
GitHub required check について指摘した「報告が真であることと、流れが進んでいることが分離した」
と同じ形が、backlog でも起きている。

## 既存の防御が効かない理由

store.rs:1607-1613 と :1637-1650 は project_unresolved (プロジェクト同一性が UNDETERMINED
だった課題) をフィルタ免除している。逐語: 「Filtering it would hide the task from every
checkout with no diagnostic」「dropping it here would turn 'could not determine the project'
into 'there is nothing here' - the collapse CLAUDE.md §3 forbids」。

つまり「判定できなかった場合」は既に正しく守られている。今回はそこに該当しない
— worktree のパスは **確定的に解決された** ので unresolved マーカーが立たず、
免除も効かない。判定不能ではなく「判定が正しく行われた結果として分裂している」ケースである。

## 判定不能な読み (どちらか未確定)

(a) worktree を別プロジェクトとして扱うのは意図的設計であり、worktree ごとの課題管理が
    望ましいと考えられている。
(b) worktree 対応が単に考慮されていない。show-toplevel を選んだ時点で worktree の存在が
    想定外だった。

見分ける方法: crates/harness-core/src/discovery.rs の resolve_repo_root 導入コミットと、
git-common-dir を使わなかった理由が記録されているかを読む。また backlog 以外の
resolve_repo_root 消費者 (gauge/overwatch/condukt 等) が worktree でどう振る舞うかを確認する
— 同じ分裂が起きているなら横断的な問題であり (b) の可能性が上がる。

## 修正候補 (どれを採るかは人間の判断)

1. resolve_repo_root が linked worktree を検出したら main repo の toplevel を返す。
   git rev-parse --git-common-dir の親を使えば得られる (実測済み:
   /mnt/c/.../src/harness/.git の親 = /mnt/c/.../src/harness)。
   影響範囲が広い (harness-core の共有関数なので全 crate に及ぶ) ため、
   worktree 分裂が他の crate で意図的に使われていないか先に確認が必要。
2. backlog 側だけで worktree を折り畳む (store.rs:1815 の呼び出しを差し替える)。
   影響は backlog に閉じるが、resolve_repo_root の他の消費者は分裂したままになる。
3. backlog add に「repo 単位で起票する」既定を持たせ、worktree 単位が必要なときだけ
   明示させる。

## 本セッションでの扱い

この課題自体は main repo のキー (/mnt/c/.../src/harness) で起票する
— そうしないとこの起票自体が同じ罠にはまる。
既存 9 件の再キーは backlog edit に --project が無いため CLI では不可能
(backlog edit --help の Options は --title/--tag/--notes/--status のみ)。"""
