[[task]]
id = "2b1065a1"
title = "condukt schedule の force-gate が否定文脈のデプロイ語を拾う — 「rollout しない」と書いたタスクが deploy として force-gated される"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-17、測定点 f1131a36。crates/condukt/src/schedule.rs:475 の resolve_force_gate(classify_change(&task_action_text(t), ...)) は blastguard の分類器に task の title+done_criteria を素の文字列として渡す。分類器は substring ベースで否定を解さないため、done_criteria に「scripts/rollout-plugins.sh の実行は t3 の担当なのでこのタスクでは実行しない」と**やらないこと**を明記したタスク t2 が
  warnings: "task t2 force-gated: high-risk irreversible action (declared class Serial)"
として gated に隔離された。当該文字列を「配布工程は後続タスク t3 の担当」と書き換える (同義・deploy 語を含まない) だけで force-gate は消え、schedule は serial:[t1,t2] / gated:[t3] になった。

【なぜ記録するか】この挙動には 2 つの読みがあり、どちらも実害の向きが違う:
(a) 意図的で正しい — deploy 語が出るタスクは中身に関わらず人間に見せる、という保守的設計。false positive のコストは「余計に 1 回聞かれる」だけなので許容、という立場。
(b) 実在の欠陥 — タスク記述は自然言語なので「Xをするな」と書くほど gate に掛かりやすくなる。結果として **書き手が gate を避けるために deploy 語を書かなくなる**圧力が生じ、スコープ外である旨の明示的な注意書きが記述から消える。これは gate が記述の質を下げる方向に働くので、CLAUDE.md 第6節の「検出側を厚くする」意図と逆行する。

見分け方: blastguard::classify に否定検出があるか、または task_action_text が done_criteria 全文ではなく action 句だけを渡す設計になっているかを読む。前者が無く後者も全文渡しなら (b) 寄り。
なお本件では **gate を無効化していない** — 実際の deploy (scripts/rollout-plugins.sh の実行) は t3 として class:"gated" のまま残し、t2 からは配布工程を実際に取り除いた上で語を書き換えた。「通すために緩めた」のではなく「タスク分割を実態に合わせた」ケースとして記録する。

関連: d7e1ac30 (この分割が生まれた元タスク)。"""
