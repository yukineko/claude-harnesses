So the two documents disagree, and SKILL.md is the one that is wrong for this repo. In this run I deviated deliberately: each serial task got its own worktree and was run sequentially, which satisfies both the scheduler ordering and section 8.

This matters because the SKILL is the instruction an autonomous agent follows. An agent that follows it literally will either be blocked by the pre-commit gate, or worse, reach for the shared skip file to get past it, which is the fail-open pressure section 5 warns about.

