notes = """
User rulings 2026-11-07 (relayed by coordinator):
 R1 "any command harmful to the system must be DENY, for whatever reason; this is a critical bug".
 R2 (design) instead of parsing what git exec-wrappers run, BAN them outright: every git subcommand/option that executes an arbitrary command must be Deny regardless of the embedded command (git bisect run, rebase --exec/-x/--exec=, submodule foreach, filter-branch any --*-filter, -c alias.X='!...' / shell alias, difftool/mergetool --extcmd, any other exec-capable shape).
All targets assert deny. Do not fix in the filing task.

Measured 2026-11-07 on main fa2e6fda (blastguard 0.2.287; target/debug/blastguard built from that rev; re-checked identical on 0.2.288 = 12e728b0, version-only bump). Bash PreToolUse payload, cwd=CLAUDE_PROJECT_DIR=/Users/yuki/src/harness, BLASTGUARD_ASK/CLAUDE_CODE_SESSION_ID/TMPDIR unset. Verbatim probe output (ALLOW = empty stdout):
