【2026-09-13 — 機構を実測で確定した。仮説どおりで、しかも §8 のワークフローでは毎回起きる】
測定日 2026-09-13、測定点 55e6e195。

再現した操作列 (すべて逐語):
  1. worktree で通常コミット fb8f24f5 (pre-commit 全ゲート green)
  2. worktree で git merge main -> 55e6e195 を作成。
     pre-merge-commit が pre-commit を exec し、全ゲート green
     (逐語の最終行: check-test-weakening: no unacknowledged test weakening.)
     このとき bypass ledger は空 (pre-commit の cleared 行が出ていない)
  3. main で git merge --ff-only session-79d79a35 -> Fast-forward
  4. python3 scripts/gate-bypass.py -> rc=1
     gate-bypass: 1 ungated commit(s) outstanding
       55e6e1958df6  merge: main (15adc7bd) を取り込む

確定した機構は .githooks/post-merge の 1 行である:

    parents="$(git rev-parse HEAD^@ 2>/dev/null | grep -c .)" || exit 0
    [ "${parents:-0}" -lt 2 ] && exit 0

同じファイルのコメントは意図をこう書いている (逐語):
  A fast-forward merge creates no commit, so there is nothing to certify and the
  absent sentinel must not be read as a bypass

つまり意図は「この merge がコミットを作ったか」だが、実装は「HEAD の親が 2 つ以上か」である。
両者は fast-forward の行き先が merge commit のときに乖離する。実測値:
  git rev-parse 55e6e195^@ -> fb8f24f5 (worktree の直前コミット) と 15adc7bd (ff 前の main)
親は 2 つなので guard は発火せず post-commit を exec する。post-commit は証明書
gate-verified-tree を GIT_DIR_LOCAL から読むが、証明書は手順 2 で worktree 側の
git dir (.git/worktrees/session-79d79a35) に書かれ、そこで消費済みである。
main 側には最初から存在しないので「未検査」と判定され ledger に積まれる。

重要なのは、これが例外的な操作ではないこと: CLAUDE.md 第8節が要求する
「worktree で作業 -> main へ ff」の最後の一手そのものであり、worktree branch の先頭が
merge commit である限り毎回起きる。ゲートが repo 自身の正規ワークフローで偽陽性を出している。

判別の候補 (どちらも決定論的。実装は未着手で、§2(a) により利害のない agent がテストを先に書くこと):
  (a) reflog の最終エントリ。ff は merge <branch>: Fast-forward、真の merge は
      merge <x>: Merge made by the ort strategy と書き分けられる。
  (b) 第一親と ORIG_HEAD の一致。この merge が作った commit なら first parent == ORIG_HEAD。
      実測では 55e6e195 の first parent は fb8f24f5 で、ORIG_HEAD (15adc7bd) は第二親だった。
      ただし worktree 側が直前に main を取り込んでいる形では成り立たない場合があるので
      (a) の方が素直である。

d55f406a が「再現せず・機構は判定不能」としていたのは本件と同一クラスであり、
上の手順で決定論的に再現する。7ec6fca5 も同じ。fa54b8ed (conflict 解決を伴う merge) は
pre-commit を通るかどうかが異なるので別物の可能性があり、まだ切り分けていない。


【2026-09-15 — 二度目の再現。決定論的であることが確認できた】
同一セッション内で 2 回目の ff でも同じ形で発火した。
  worktree で merge commit 89def60a を作成 (pre-merge-commit -> pre-commit 全ゲート green)
  main で git merge --ff-only session-79d79a35
  python3 scripts/gate-bypass.py --json -> {"verdict": "outstanding", "entries": [{"commit": "89def60a...", ...}]}
一度目は 55e6e195 で、条件も結果も同一。偶発ではなく、worktree branch の先頭が
merge commit である限り ff のたびに起きる。

--- 2026-09-23 自然実験で機構を確定: ff merge の「行き先」が merge commit だと踏む ---

session 79d79a35 で偶然 2 回の対照が取れたので逐語で残す。仮説ではなく観測である。

実験 1 (踏んだ): main を ff で 414be4f1 へ進めた。414be4f1 自身が merge commit
(親が 2 つ) である。この ff の直後に post-merge が発火し、bypass ledger に
ungated commit として記録された。

実験 2 (踏まなかった): main を ff で ecf5fdc8 へ進めた。ecf5fdc8 は通常の commit
(親が 1 つ)。同じ ff という操作だが ledger は反応しなかった。

つまり post-merge の判定は「今回の操作が本当に merge だったか」ではなく
「HEAD の親が 2 つ以上か」を見ている。ff merge は HEAD を動かすだけで新しい commit を
作らないので、行き先が過去の merge commit だった場合に「merge commit が今できた」と
誤読する。操作の性質ではなく到達点の形状で判定しているのが根因。

事後: その後の pre-commit が green で通った際、逐語で
    cleared 1 ungated commit(s) from the bypass ledger
と表示され ledger は自動で解消した。つまり実害は「次に green な commit を打つまで
push がブロックされる」ことに限られるが、誤検知であること自体は変わらない。

見分け方 (将来の実装者向け): ff かどうかは post-merge 側では
ORIG_HEAD と HEAD の関係で判定できる。ORIG_HEAD が HEAD の祖先なら ff であり、
その場合 HEAD の親の数は今回の操作の産物ではないので判定に使ってはならない。

関連: 36c936bc / d55f406a (同一事象の両起票)。"""
