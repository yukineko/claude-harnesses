id = "752e006a"
title = "condukt worktree create doubles the run id into the branch name when --branch is already run-qualified"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = []
touched_files = []
status = "pending"
notes = """
Observed 2026-09-23, condukt 0.7.168.

Command run:
  condukt worktree create --run run-20260917-030727-89796 --topic t3-reap-dead-run-claims --branch condukt/run-20260917-030727-89796/t3-reap-dead-run-claims

Resulting branch:
  condukt/run-20260917-030727-89796/run-20260917-030727-89796/t3-reap-dead-run-claims

The run id appears TWICE. condukt prefixes the run namespace onto whatever --branch is given, so passing an already-qualified name double-prefixes it silently, with no warning and no diagnostic.

Why this is not cosmetic: the later merge step is documented as
  condukt worktree merge --branch condukt/$RID/<id>
and that name does NOT exist, so the merge fails with
  condukt: branch not found: does not resolve to a commit; refusing to merge (nothing recorded as a conflict)
The operator then has to discover the real name by hand. The refusal itself is correct and fail-closed, which is good; the problem is upstream, that create accepted an input it then silently rewrote.

Evidence this is a repeatable trap and not a one-off slip: the previous session on this same run produced the identical doubling, recorded in the cycle-7 brief as branch
  condukt/run-20260917-030727-89796/run-20260917-030727-89796/t1-repo-primary-lock
So two independent sessions hit it the same way.

Contributing cause in the docs: the condukt SKILL.md Phase 5 step 1 shows --branch condukt/<t.id> in the command, then says the real branch becomes condukt/$RID/<t.id>, and every later step refers to condukt/$RID/<id>. Reading those together invites passing the qualified form to create.

Fix direction: either reject an already-run-qualified --branch with a named error (fail-closed, consistent with the merge refusal), or normalise it idempotently so double-prefixing cannot happen. Also make create PRINT the branch it actually created, not only the worktree path - it currently prints only the path, so the rewrite is invisible at the point it happens."""
