notes = "実測 2026-09-11、測定点 6374a143、git 2.50.1 (Apple Git-155) / darwin。post-commit の証明書検証 (6267bfbe) の検証中に観測した一般的な所見。(1) reflog が無傷な非 amend コミットでは rev-parse HEAD@{1} は必ずそのコミットの first parent と一致する。(2) ところが別 worktree から git update-ref refs/heads/main を打つと、こちらの worktree の HEAD は動くのに こちらの reflog にはエントリが書かれない。この穴をまたぐと rev-parse HEAD@{1} は「1 つ前のエントリの new sha」を返す (stderr に warning: log for ref HEAD has gap after ... が出る) のであって、現エントリの old sha ではない。(3) git symbolic-ref HEAD は穴を作らない (空メッセージのエントリを書く)。害: CLAUDE.md 第8節はセッションごとの worktree を必須にしているので、この穴は例外ではなく日常的に発生する。HEAD@{1} を「直前の HEAD」と読んで同一性や順序を判定しているコードがあれば、並行セッション下で静かに誤答する。要調査: harness 内で HEAD@{1} ないし reflog を判定に使っている箇所の棚卸し。判定に使っているなら、穴の可能性を検出できるか (warning の有無・gap の検出) を確認し、検出できないなら判定不能として制限側へ倒すこと。なお 6267bfbe の post-commit パッチはこの穴を承知の上で 2 条件の AND にしており、穴があっても reflog subject 条件が効くので誤って許可側へは倒れない。"
