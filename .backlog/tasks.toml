notes = """
2026-07-30 AEGIS で実測。誤検知ではなく設計どおりの命中だが、ルールが over-broad。

## 現象
crates/blastguard/src/detect.rs:519 detect_write() が、内容も存在も見る前に
protected_path_deny() を通す:

    // BEFORE the config-file allowlist, not after
    if let Some(deny) = protected_path_deny("Write", &path) { return deny; }
    if exclude::is_config_file(&path) { return Decision::Allow; }

is_protected_path(".claude/hooks/*") が true なら即 Deny。新規作成か上書きか、
中身が何かを一切見ない。Write/Edit/cp/mv/リダイレクト/rm すべて同様。
Ask にも落ちず hard deny。override 環境変数も exclusion 設定も無い
(BLASTGUARD_ASK は ask の有無を変えるだけ)。

## 何が問題か
1. path ベースで intent を見ない。「settings.json から blastguard 自身の登録を消す」
   (真の自己無効化) と「無関係な SessionStart hook を 1 本 *新規追加* する」を
   区別できない。後者に脅威は無い — **未登録の hook ファイルは何も実行しない**。
   ゲートを決めているのは settings.json の登録であって hooks/ にファイルが在る事ではない。
2. 前提が repo によって崩れる。blastguard の暗黙の前提は「hooks はゲート設定であり
   滅多に触らない」。AEGIS では .claude/hooks/** は 10 本以上が現役で tests/hooks/ に
   pytest カバレッジまである第一級のソースツリー。product code を guard config として
   扱うので誤検知率が構造的に高い。
3. 回避策 (人間が手で cp) は agent の write より **監査性が低い**。diff もテスト実行も
   commit 痕跡も残らない。ガードがレビュー可能な変更をレビュー不能な変更に変換している。

## 実害 (2026-07-30)
subagent 2 本が hook 修正を完遂できず commit ゼロで終了。成果物を scratchpad に
退避して人間の手作業に回すことになった。
- post-deploy 完了通知の SessionStart hook (新規追加) — 配置不可
- daily-routine marker の per-worktree バグ修正 (既存 hook の編集) — 配置不可
  ※ RED 14 failed / GREEN 31 passed まで実測済みだったが載せられず
さらに .claude/hooks/ に touch で作った 0 バイトファイルが残り、rm も deny されて
worktree の後片付けまで手作業になった (touch は通るのに rm は通らない非対称)。

## 修正案 (脅威モデルを弱めずに誤検知だけ削る)
.claude/hooks/ 配下の **まだ存在しないパスへの新規作成のみ Allow**。
既存ファイルの上書き・削除・disarm と settings.json / hooks.json は従来どおり Deny。
未登録 hook は無力なので防御は落ちない。

要検討:
- hooks/*.ps1 を glob で総なめする loader を持つ repo では成立しない (汎用ツールとして
  保守側に倒す判断もあり得る)。その場合は per-project の opt-in 設定を入れるか。
- touch が通って rm が通らない非対称も併せて整理する (protected_disarm_deny は rm を
  見ているが create は見ていない)。
- Decision::Ask は model.rs にあり detect.rs:195/404 で使われているのに protected path
  だけ deny 直書き。interactive.rs:3 の「Ask is only safe when someone can answer」
  (敵対的 agent に farm される) という判断は筋が通るので、Ask には倒さない方が良い。
  = 直すなら Ask ではなく deny 条件の絞り込みで。
除外 (ユーザー指示 2026-08-17): harness backlog は当面対象外。aegis の作業に集中する。復帰は backlog edit a82274cb --status pending

## 2026-09-24 session-9d349393 /condukt: STOPPED FOR HUMAN (spec gap, no code change)
The notes' own open design questions remain (glob-loader repos, per-project opt-in vs conservative default, touch/rm asymmetry). Added counterexample to the premise that an unregistered hook file executes nothing: if settings.json or a hooks.json already REGISTERS a hook path that does not exist yet, creating that file activates it — so allow-only-new-files needs a registration check (a settings parser inside a GATE crate) or it opens a hole. Also: blastguard Ask hardens to Deny outside CLAUDE_CODE_ENTRYPOINT=cli, so Ask is not an escape either. Needs a human decision on the design before a GATE-crate change. Note also the 2026-08-17 exclusion above.

USER RULING 2026-09-24: RESUME design (supersedes the 2026-08-17 exclusion for this item). Settle the open design questions (per-project opt-in, registration check for pre-registered-but-absent hook paths, touch/rm asymmetry) and implement."""
