これらは CLAUDE.md 第3節・第8節・禁忌ルールの逐語内容なので、covered が返らないのは
「正典が無い」ではなく「判定面が機能していない」ことを意味する。

原因 (測定): specguard map list は 134 entries を持つが、そのうち spec-doc を持つ entry は 0 件。
  total entries: 134
  with (no spec-doc): 134
  with a spec-doc: (0 行)
つまり covered を返しうる入力が構造的に存在しない。verdict は二値的に not-covered へ固定されている。

なぜ問題か: flow SKILL.md の Step 3-1.5 は trigger 3 として
verdict=not-covered を spec-gap divert (specforge へ差し戻し) の発火条件にしている。
現状この trigger は全課題で発火するので、(a) 全タスクが divert 候補になり、
(b) その escalate が常時発生して人間の判断が儀式化する。
さらに divert は書き込み側 (specforge draft が新しい spec を起こす) なので、
判定面が死んでいる状態での発火は「読めなかった」を「仕様が無い」へ写す —
3-1.5 自身が明示的に禁じている置換であり、CLAUDE.md 第3節の
「判定不能を permissive/誤った側へ潰す」の一形態。

判定不能なので両方の読みを残す:
  (a) 実在の欠陥 = spec-map に spec-doc を結び付ける経路 (drift-map) が未実行/未配線で、
      brief が三値のうち covered を出せない。この場合 brief は not-covered ではなく
      undetermined (exit 10) を返すべきで、二値へ潰れているのが欠陥。
  (b) 意図的な仕様 = spec-doc がまだ 1 件も無いのは事実なので not-covered は正しい、
      という読み。ただしその場合でも trigger 3 は全件発火するので flow 側の運用が破綻する。

見分ける方法: spec-doc を 1 件だけ作って map の当該 entry に結び付け、
その領域の課題文で brief が covered を返すか観測する。
返るなら (a) は「未配線」であり配線すれば解ける。返らないなら brief の判定経路自体の欠陥。
併せて specguard brief が undetermined (exit 10) を実際に返す入力が存在するかも確認する
(存在しないなら三値は名目だけで実体は二値)。

発見経緯: /flow の Step 3-1.5 プリフライトで 3 件全部が not-covered になり、
divert する前に対照実験を掛けて空虚さが判明した。divert は実行していない。

