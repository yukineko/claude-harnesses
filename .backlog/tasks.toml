Narrowed scope (measured, contradicts the original probe's wider claim): the same test's `tdd skip --reason "... <wt> ..."` sub-case does NOT reproduce. attribution.rs read_only_stage already has `"tdd" | "reviewgate" => rest.get(1) == Some(&"skip")` (added in c735d338, 2026-10-20, harness-core 0.2.63, for exactly this "path in the skip reason that says not mine" case). `donegate` is not on that list, so `donegate skip --reason` is kept by writing_statements and every existing-path word in it (quotes trimmed by split_whitespace + trim_matches in session_written_paths) becomes a Bash candidate; session_roots.rs then adds its git toplevel as a root. So this is a mirror gap: twin rule for donegate missing. c735d338's message names only tdd/reviewgate; no record of donegate being deliberately excluded (UNVERIFIED either way).

