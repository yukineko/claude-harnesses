project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "spec",
    "spec:sitecraft-capabilities",
    "req:sitecraft-capabilities:R4",
    "p1",
]
touched_files = []
status = "pending"
notes = """
specforge が spec sitecraft-capabilities の requirement R4 から自動起票 (ratify 時).
spec title: sitecraft を Web アプリを超える課題（能力・実機検証・停滞検知）まで拡張する
statement: sitecraft check capability <name> は、能力が実機で動いた証拠を D4 の画素規則と GLB 条件で判定し、0 clean / 1 violation / 2 undetermined を返す。

done_criteria (spec の acceptance を逐語で。言い換えないこと):
  - 未登録または relevance=irrelevant の name は exit 2。300 秒を超えると exit 2（reason timeout）
  - 画素規則: 背景色は 4 隅の RGB の最頻値。最頻値が一意でなければ、描画率が最小になる候補を背景色にする。描画画素は R/G/B のいずれかで背景との差の絶対値が 16 を超える画素。描画率 1% 以上で clean、1% 未満と幅か高さが 0 の画像は violation。単色画像が violation、1% 以上描かれた画像が clean になることをテストで観測する
  - GLB 条件: 先頭 4 バイトが glTF、version(uint32 LE)=2、length(uint32 LE) がファイルサイズと一致。0 バイトのファイルと条件不成立のファイルは violation
  - builtin:blender-headless: 実行前に既存の glb と render を削除し、cwd=root で `<blender> --background --factory-startup --python <script> -- --glb <絶対パス> --render <絶対パス>` を実行する。非 0 終了・出力が無い・PNG として読めない・GLB 条件不成立・画素規則 violation は exit 1。blender が見つからない・script が無い・読み取りの IO 失敗は exit 2
  - builtin:threejs-render: trust 済み sitecraft.toml が無いか未 trust なら exit 2。dev server が止まっていれば自分で起動し、終了時に自分が起動したものだけを止める。http://127.0.0.1:<port><page> を headless Chromium で開き、selector（既定 canvas）が 30 秒以内に可視にならなければ exit 1。可視になったら 2000 ms 後に要素のスクリーンショットを撮り、画素規則で判定する。Playwright か Chromium が起動できなければ exit 2
  - command: D2-trust が無ければ実行せず exit 2。trust 済みなら cwd=root で argv を実行し、終了 0 は exit 0、終了 2 は exit 2、それ以外の非 0 と signal 終了は exit 1、spawn 失敗は exit 2

