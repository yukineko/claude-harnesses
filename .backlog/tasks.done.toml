起票時の証拠は陳腐化していた。condukt 分岐の give-up はその後 landed 済みで、
decide_progress + StopDecision::{Continue, EscalateStuck, DoneEmpty} と
condukt_no_progress_streak が実在し main.rs が match している。

さらに完了条件の前半はその後の設計と正面から矛盾する。
crates/autoflow/src/state.rs の Continuing 逐語:
  no cumulative call-count ceiling. Only a stalled-progress streak
  (decide_progress -> EscalateStuck) escalates ... The only legitimate stop is
  an empty pending/open set (-> Done).

裁定: state.rs を正とする。完了条件の前半「N 回後に Done へ遷移」は撤回する
(後から landed した意図的な設計を、古いチケットで逆転させない)。

残る実在の欠陥は後半だけ: crates/autoflow/src/main.rs:249 の
condukt::mark_running(&cwd, &ids) が唯一の呼び出し箇所でありながら
match decision (:257) より前に無条件で発火するため、EscalateStuck の経路でも
再発火し、同一 worktree/branch に 2 人目の worker を stack しうる
(memory condukt-redispatch-stuck-worker-dup と同じ形)。
ここだけを RED 先行で塞ぐこと。進捗判定は既存の probe 機構を使い、
heartbeat や pid 生存で代用しない。"""
