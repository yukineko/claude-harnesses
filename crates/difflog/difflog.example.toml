# difflog.toml — session diff-log for Claude Code
#
# Place as ./difflog.toml in the working directory, or at ~/.difflog/config.toml.

enabled = true

# Directory holding per-session state (sessions/<id>.json). SessionEnd writes
# no markdown log (see README).
# log_dir = "~/.difflog/logs"

# Max bytes of verbatim `git diff` to include. No effect on output: SessionEnd
# writes no log (see README).
diff_body_limit = 4096

# Parsed and shown by `difflog status`; NOT applied to the diff.
exclude_globs = [
  "Cargo.lock",
  "package-lock.json",
  "*.min.js",
  "*.min.css",
  "*.snap",
]
