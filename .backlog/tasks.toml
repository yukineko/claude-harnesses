  cargo test -p harness-core --lib run_with_timeout_kills_hung
  boundary::tests::run_with_timeout_kills_hung_process_group_and_returns_promptly FAILED
  expected Known, got Undetermined: pgrep -fc harness-core-boundary-test-marker-NNNNN exited 2
