id = "f84a6779"
title = "condukt: diffrisk_record journal test is unreliable under a full workspace run (passes alone, failed 1 of 2 workspace runs)"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "condukt",
