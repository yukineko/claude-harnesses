[package]
rust-version.workspace = true
name = "gauge"
version = "0.3.29"
edition = "2021"
description = "Local LLMOps telemetry for Claude Code: a Stop hook that records each session's token usage, tool calls, latency and cost to a local store and reports it, with no API key."
license = "MIT"

[[bin]]
name = "gauge"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
