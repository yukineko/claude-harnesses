notes = """
OBSERVED 2026-09-13 in flow session 2444be10. Command: git -C <repo> config core.hooksPath
Blocked with: "git config core.hooksPath repoints every git hook at once, disabling the repo hook gates"

THE CONFLATION: `git config <key>` with NO value argument is a READ; it prints the current
value and changes nothing. `git config <key> <value>` is the write that actually repoints
hooks. blastguard appears to match on the KEY NAME alone and so refuses the read with a
message describing the write.

WHY IT MATTERS: the read is exactly what you want available when AUDITING whether the hook
gates are armed. Refusing it means the question "are the gates actually installed here?"
cannot be answered through the obvious command, which pushes toward re-spelling it another
way -- i.e. the gate trains the rewrite-until-it-passes reflex. Same concern as ebd1359a,
different construct. This is NOT a request to loosen blastguard: a genuine
`git config core.hooksPath <path>` SHOULD stay blocked. The ask is to distinguish arity.

TWO READINGS, and how to tell them apart:
 (a) real false positive -- the matcher keys on the option name and ignores whether a value
     follows. Discriminator: check whether blastguard permits `git config user.name`
     (a read of a harmless key) but refuses `git config core.hooksPath`; if only the
     hooks key is refused, the rule is key-based and arity-blind.
 (b) deliberate -- someone decided even naming that key is suspicious. Discriminator: look
     for an explicit comment/test pinning the read case as intended.
Do not resolve this by relaxing the key match; resolve it by requiring a value argument
before treating it as a write.

CONTEXT that triggered it: I was auditing whether the main-tree isolation gate
(scripts/check-worktree-isolation.py) was armed, because commit ea12e6dd is a NON-merge
commit on main (single parent) touching .backlog/tasks.toml, which that gate is supposed to
refuse. That audit is unfinished because the read was blocked -- see the separate ticket."""
