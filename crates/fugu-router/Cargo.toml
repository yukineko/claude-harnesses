[package]
rust-version.workspace = true
license.workspace = true
name = "fugu-router"
version = "0.1.53"
edition = "2021"
description = "Per-model routing for Claude Code orchestration: learns from past task outcomes via a local episode store and suggests the cheapest model tier that historically cleared similar work."

[[bin]]
name = "fugu-router"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }
sha2 = { workspace = true }
wait-timeout = "0.2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
