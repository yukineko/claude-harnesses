notes = """
実測 (2026-09-07, overwatch 0.2.32, cache の bin を直接実行):

    $ overwatch end --key "definitely-not-a-real-key-12345" --status done
    out=[]
    rc=0

`overwatch status` は同じ瞬間に `== Sessions ==  (none)` を返しており、この key の
lease は **存在しない**。それでも end は「解放した」ときと**同一の出力・同一の
終了ステータス**を返す。呼び出し側 (flow SKILL.md Step 4、および /flow を回す
LLM) は fail-soft で扱えと書かれているので、この 0 を見て「解放できた」と記録する。

なぜこれが fail-open か: これは ledger write である。同じ plugin の launcher
(crates/overwatch/bin/overwatch:38) は自分の missing-binary 経路について
まさにこの形を名指しで禁じている —

    * begin / end / heartbeat / record-* -> ledger writes; reporting success
      for a write that never happened is what leaves a stale lease behind.

launcher は binary が無い場合を exit 1 で塞いでいるが、**binary 自身**が key の
不在に対して同じ穴を開けている。守られているのは 1 段上だけである。

観測される害: begin した key を typo などで取り違えて end すると、実 lease は
解放されないまま「解放済み」と報告される。overwatch status には残り続け、TTL で
reap されるまで他セッションからは「そのスコープは担当者あり」に見える。
逆に一度も begin していない key を end しても何も言わないので、
begin/end の対応漏れが検出されない。

あるべき形 (CLAUDE.md 第3節): 三値にする。
  - 実在する lease を解放した -> exit 0、解放した旨を出力
  - key が存在しない        -> 非0 (「解放していない」は「解放した」ではない)
  - 台帳が読めない          -> 非0、判定不能として理由を出力
少なくとも「存在しなかった」と「解放した」を出力で区別できること。

帰属メモ: 本セッションの変更ではない。/flow Step 4 の anchor 解放を実行する過程で
観測した。"""
