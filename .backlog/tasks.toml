    - Stop でブロックされる → テストが付いていない実装がある。テストを足す。純粋な

This is agent-facing and it is the DIAGNOSIS the agent is told to act on: it translates the block into an unqualified claim about the change. The block reason itself is forbidden from saying this - crates/tdd/src/gate.rs around :640-643 verbatim:

