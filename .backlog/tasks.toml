[[task]]
id = "19ccedd8"
title = "donegate trybuild control は gate.rs を実際にコンパイルしない(bin-only)。散文リンクのみで drift 検出機構が無い"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
status = "pending"
notes = """
測定日 2026-07-22 / 測定点 8685f760 / run-20260722-072334 Phase 6 の独立 verifier が(C)として報告。
done_criteria は満たしており本タスクは pass。以下は『このスイートが証明しないこと』の記録。

1) gate.rs はこのスイートでコンパイルされない。
   donegate は bin-only (crates/donegate/src に lib.rs が無く Cargo.toml に [lib] も無い) ため、
   positive control は 'use donegate::gate::...' できず、gate.rs の呼び出し形を手で写している。
   control と gate.rs を結ぶのは docstring の行参照 = 散文のみ。
   gate.rs の呼び出し形が非 sanctioned な形へ drift しても control は green のまま。
   証明しているのは『これらの形は型が許す』であって『gate.rs はこれらの形しか使わない』ではない。
   機械的な drift 検出機構は存在しない。

2) main.rs の verdict 経路は未カバー。
   crates/donegate/src/main.rs:239-240 が Verdict::violation(reason) と .stop_decision() を呼ぶが
   control に無い。control の docstring は gate.rs にスコープした記述なので逐語では正確だが、
   読者が『donegate 全体についての主張』と誤読しうる。

3) 軽微な行参照の腐り: control の docstring (sanctioned_clean.rs:26) が
   『gate.rs:233: format!(...)』と引用しているが、実際の format! は gate.rs:235-237
   (233 は直前アームの閉じ括弧)。他の引用行 (231/234/239 等) は正確。
   行番号参照は gate.rs が動くたびに腐る。

4) 固定しているのは permissive extractor 3種 (unwrap_or / ok / unwrap_or_default) のみ。
   unwrap_or_else の不在、Default impl の不在、From<bool> の不在は証明していない。
   gate のランタイム fail-closed 挙動も証明していない。

対処方針の候補:
- (1)に対して: donegate に薄い [lib] を追加して control から実型を use する、
  または gate.rs の実 API 集合を機械抽出して control と突き合わせる検査を足す。
  前者は crate 構造の変更を伴うので影響範囲の確認が要る。
- (3)に対して: docstring から行番号を落とし、シンボル名での参照に変える (行番号は必ず腐る)。
- (4)に対して: negative fixture に unwrap_or_else / Default / From<bool> を追加する。

注: この note の初版は shell のバッククォート展開で 'use donegate::gate::...' の一節が
欠落していた。backlog edit で復元済み。notes にコード片を書くときはバッククォートを使わないこと。
"""
