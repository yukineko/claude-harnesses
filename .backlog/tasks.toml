notes = """
観測 (2026-09-24、すべて実測):

python3 scripts/gate-bypass.py --json
  verdict=outstanding、entries に 98548fda が 2 回。
  .git/gate-bypassed にも同じ行が 2 行ある。
  scripts/gate-bypass.py の docstring どおり exit 1 相当で、push が blocked になる。

しかし当の merge は gate を素通りしていない。agent の transcript に残っている
その merge の出力には pre-merge-commit の全チェックが green で並んでいる:
  check-doc-claims / check-claudemd-claims OK
  41 plugins version-consistent、un-bumped なし
  hardcoded-secret-guard clean、raw-io-ratchet count == baseline (46)
  GATE_CRATES consistent、launcher-exec-bit 39/39
  clippy-lints: checking blastguard -> clean
  main-tree-guard: allowed - Merge in progress (declared by .githooks/pre-merge-commit
    and corroborated by GIT_REFLOG_ACTION)
  check-test-weakening: no unacknowledged test weakening
コマンドは素の git merge --no-ff で、--no-verify は付いていない
(transcript を grep して確認した。付いていたら pre-merge-commit の出力自体が出ない)。

つまり .githooks/post-merge が「pre-commit が certify した tree hash」と
実際に commit された tree を比べる仕組みで、gate が実際に走って green だったのに
不一致と判定している。.githooks/post-commit の header はこの仕組みを
  match   -> gate を通った。sentinel を消費して黙る
  no match -> 検査されていない。ledger へ追記
と書いている。今回は「検査された」が「no match」になっている。

対照 (同じ session の同じ main tree での merge):
  9db95175 (conflict 解決後の git commit 経由)  -> ledger に載っていない
  f6add075 (素の git merge --no-ff)            -> ledger に載っていない
  98548fda (素の git merge --no-ff)            -> 2 回載っている
f6add075 と 98548fda は同じコマンド形なので、コマンドの違いでは説明できない。
差分の候補は「触ったファイルの種類」(前者は .backlog/tasks.toml のみ、後者は
crates/blastguard/src/detect.rs + version 3 点 + Cargo.lock) と
「clippy が実際に走ったかどうか」(前者は nothing to check、後者は blastguard を checking)。
どちらが効いているかは未検証。ここから先は推測になるので測っていない。

なぜ重要か: これは 4. が最も嫌う向きの逆、すなわち「検査したのに検査していないと
記録する」偽陽性である。fail-open ではないので安全側ではあるが、
偽陽性が常態化すると ledger が「いつもの赤」になり、本物の --no-verify が
紛れても誰も見なくなる。ledger の価値はそこにしかないので、偽陽性は実害がある。
2 重登録も別軸の bug (1 merge = 1 entry のはず)。

done_criteria:
  (1) 同じ形の merge (crate のソースを含む素の git merge --no-ff) を再現させ、
      post-merge が ledger に書く条件を RED として観測すること。
      推測ではなく、sentinel の tree hash と commit の tree hash を実際に
      並べて差を見ること。
  (2) 1 つの merge が 2 entry になる経路を特定すること。
  (3) 偽陽性であれば post-merge 側を直す。もし「certify した tree と
      commit された tree が本当に違う」のなら、それは gate が別の内容を
      見ていたということなので、偽陽性ではなく pre-merge-commit 側の欠陥として
      扱うこと。3. に従い、どちらか判定できないうちは ledger を黙らせない。

注意: ledger は scripts/gate-bypass.py からは消せない (--clear を意図的に
持たない)。green な pre-commit が走ると消える設計なので、次の通常 commit で
消える見込みだが、それは「原因が直った」ことを意味しない。"""
