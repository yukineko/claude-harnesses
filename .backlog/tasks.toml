測定 2026-08-12, commit d2cc68fa (worktree p0trio-1-t3-backlog-add-verified). bd6d81df の修正で add に 2 つの belt を入れた: (1) with_tasks_lock_aware で mutual exclusion 不成立時に Err, (2) save 後に load し直して id の存在を確認 (confirm_added_id_is_on_disk)。実測した mutation kill rate: belt2 を構造的に削除した M1 は crate 全体 229 test のうち 1 件も落とさなかった (0 kill)。理由は belt1 が先に Err を返すため、既存の add_reporting_success_must_mean_the_id_is_in_a_fresh_load_of_the_store の含意 (Ok なら fresh load に居ること) が vacuous になること。つまり belt2 は現状どのテストにも観測されておらず、消しても誰も気づかない。必要なのは belt1 を通過した状態 (lock は取得済み) で save 後に store が別内容へ差し替わる状況を注入し、add が Err を返すことを観測する behavioural test。実装者が自分でテストを書くことは CLAUDE.md 2-a により禁止のため未実施。DoD: M1 相当の構造削除で少なくとも 1 件 named test が落ちること

--- 統合者による独立再測定 (2026-08-13、測定点 d2cc68fa) ---
worker の自己申告は正しかった。私は agent の worktree を一切触らず、d2cc68fa を
自分の detached worktree (/Users/yuki/src/.harness-worktrees/measure-t3) へ
checkout して独立に測った。走行中かもしれない worker と同一 index を共有しない
