ユーザー報告: SessionEnd hook [${CLAUDE_PLUGIN_ROOT}/bin/fugu-router sync] failed:
fugu-router: sync_repo is not configured in ~/.fugu-router/config.toml

直接原因:
  ~/.fugu-router/config.toml に store_file / playbook_file の 2 キーしか無く、
  sync_repo が未設定だった。crates/fugu-router/src/main.rs:1211 の
  cfg.sync_repo.as_deref().ok_or_else(...) がここで Err を返す。
