[[requirement]]
id = "R3"
statement = "testscope の Decision に Ask を加える。confirmed 行が無く pending 行 (legacy の state 列なし行、tool_use_id なしの Pre の行を含む) だけが前歴の rerun は Ask に解決する。Ask の output / reason に deny という部分文字列を含めない。"
acceptance = [
    "RED: 新規 crates/condukt/tests/testscope_ask_pending_20261117.rs (実装者以外の Agent が書く) の各テストが GREEN になる。現行コードでは失敗する。内訳: (a) Pre(X) のみ → Pre(X) で Ask を明示 assert する (Q4 の別テスト)。(b) state 列なしの legacy 3 列行だけを持つ ledger から rerun すると Ask (Ask 7)。(c) tool_use_id なしの Pre は従来どおり allow されるが、その行は昇格されず、後続の rerun は Ask (R4-2)。",
    "Ask 時の hook 出力の permissionDecisionReason と systemMessage は、いずれも小文字化しても deny という部分文字列を含まない (C1)。",
    "Ask に解決した Pre は、自分の tool_use_id で pending 行を書く (round 7)。承認されて実行された場合は、その Post が昇格する。却下された場合は Post が発火せず pending のまま残るので、次の rerun は再び Ask になる。unmatched 経路には落とさない。",
    "backlog_20261115_testscope_counts_unexecuted_attempt.rs の c_no_post_ever_in_session_falls_back_to_recording_at_pre (212 行目) の期待を「denied されない、かつ Ask」に改訂する。旧 fallback (session に Post が一度も無ければ Pre が confirmed を書く) は撤回し、同ファイルの doc (24〜28 行目) も同じ commit で直す (G3-C 裁定)。C は C1 リストへの承認済み改訂として扱う。",
    "Ask の headless / subagent での解決は testscope について未観測である。この点は R10 で測定する。ここでは Ask と Deny の区別を保つことだけを要求する。",
]
