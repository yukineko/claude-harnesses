【対象】
crates/specguard/bin/specguard の末尾。同型の launcher が他 38 plugin にもあるので、specguard を直したら横展開の要否を判断すること (判定を持たない observability hook は carve-out 側にあたる可能性がある — CLAUDE.md 第1節の分類に従い、免責を主張する plugin は下流消費者を列挙する)。

【関連】
