  (0 起点 99) はちょうど 1 つ外。off-by-one というより窓幅がこのサイトに 1 足りない。

実体側も未修正のまま残っている (逐語 crates/harness-status/src/path_shadow.rs:99-108):
  fn list_binary_names(dir: &Path) -> Vec<String> {
      std::fs::read_dir(dir).map(|it| { ... .collect() }).unwrap_or_default()
  }
