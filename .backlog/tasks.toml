notes = """
実測 (2026-09-07, 本 repo):

2 セッションが共有 plugin cache (~/.claude/plugins/cache/yukineko) に対して同時に
rollout を走らせた結果、両 GATE crate が dark になった:

    plugin      registry が指す版   cache の実体
    specguard   0.2.56             0.2.55   <- 指す先が存在しない
    blastguard  0.2.55             0.2.54   <- 同上

機序: rollout-plugins.sh は末尾で prune-plugin-cache.py を走らせ、prune は
「current 版」を *その実行元ツリーの* crates/<name>/.claude-plugin/plugin.json から
読む。セッション A のツリーが 0.2.56、セッション B のツリーが 0.2.55 のとき、
B の rollout は A が配備して registry に登録した 0.2.56 を「stale」と判定して削除する。
registry (installed_plugins.json) は cache と別ファイルなので、指す先が消えても
更新されない。結果、hook は存在しないパスを exec しようとして起動せず、finding も
出ない = red ではなく dark。

なぜ既存ガードで防げないか: prune が保持する 2 条件 (live pid の .in_use マーカー /
settings.json の絶対パス pin) はどちらも「別セッションが今まさに配備した新しい版」を
守らない。.in_use は旧版側に付き、settings.json は本機では 0 件
(`grep -c 'cache/yukineko' ~/.claude/settings.json` -> 0)。

修正案 (どれも未検証の案であって結論ではない):
- prune が削除前に installed_plugins.json を読み、registry が指す版は絶対に消さない
  (「current でない」と「誰も使っていない」は別物。指されている版の削除は定義上 dark 化)。
- cache 全体に対する rollout ロックを取る (worktree 分離では防げない — cache は
  ~/.claude 配下の単一共有資源であって repo の中に無い)。
- prune の判定不能を制限側へ倒す: 実行元ツリーの版と registry の版が食い違うときは
  「どちらが current か判定不能」として何も消さない。

暫定復旧手順 (今回実施したもの): registry が期待する版を main ツリーから
`scripts/rollout-plugins.sh --plugin <name> --canary` で貼り直し、cache が registry の
指す先を含む状態に戻す。復旧後は binary の --version 起動まで確認すること
(ファイル存在の確認だけでは dark と区別できない)。"""
