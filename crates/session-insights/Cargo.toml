[package]
rust-version.workspace = true
name = "session-insights"
version = "0.2.38"
edition = "2021"
description = "Per-session work metrics for Claude Code: PostToolUse and Stop hooks roll up tool calls, turns, files touched, a size class and a work category, with optional Obsidian session logs."
license = "MIT"

[[bin]]
name = "session-insights"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Integration tests derive the context-governor ledger path with the SAME shared
# helpers the writer uses (project_key / safe_session), so the join can never drift.
harness-core = { path = "../harness-core" }
