notes = '''
Found and independently re-verified 2026-09-11 at HEAD 2abf8dea by reading crates/tdd/src/gate.rs classify().

crates/tdd/src/gate.rs:172-181 verbatim:

    for AddedLine { file, text } in added {
        let marker_hit = markers.is_match(text);
        if is_test_file(file) {
            test_marker_added = true; // any added line in a test file is evidence
            continue;
        }
        if marker_hit {
            test_marker_added = true; // inline test written in an impl file
            continue;
        }

The comment on the second arm says "inline test written in an impl file". There is NO is_impl_file(file) guard on that arm. is_impl_file is defined right above at gate.rs:165 and is applied only to the added_impl_lines counter at gate.rs:182. So marker_hit is evaluated against every added line of every changed path, whether or not the path is in impl_globs at all.

Consequence: test_marker_added drives Fields::has_test_evidence, which drives Report::verdict -> Verdict::from_findings(Vec::new()) -> Clean -> the Stop hook ALLOWS. One matching added line anywhere silences the whole gate for that turn.

The default marker set makes this trivially reachable. crates/tdd/src/config.rs:190-198 verbatim:

    r"#\[\s*(tokio::|async_std::|rstest|test)",
    r"\bfn\s+test_",
    r"\bdef\s+test_",
    r"\bfunc\s+Test\w",
    r"\b(it|test|describe)\s*\(",
    r"@Test\b",

The fifth pattern matches the bare substring test( or it( or describe( followed by optional whitespace and an open paren. An added line in a CHANGELOG.md, a Cargo.toml comment, a JSON fixture, a shell script, or a commit-message template containing test( is sufficient. Adding documentation that quotes the gate own block-reason text - which contains def test_ and func Test and it(...) - would also do it.

This is a fail-open in the verdict predicate, not a wording issue: "cannot determine whether a real test was added" is being resolved to "clean". It is also a docstring-vs-behaviour contradiction of the kind CLAUDE.md section 4 names.

Suggested fix (narrows the gate, i.e. blocks MORE, which is the safe direction): guard the marker arm with is_impl_file(file), so a marker only counts as inline-test evidence when it lands in a file the config actually calls implementation. Needs its own RED test from a disinterested agent before the change, per section 2(b).

Related: gate.rs human_report then renders this as "yes (inline test added)" / "yes (test file + inline test)" (gate.rs around :329-334), asserting an inline test was added when all that was observed is a regex hit somewhere.

Also note the first arm: any added line in a test-glob file, including a blank-adjacent comment line, is evidence. That may be intentional but it is unstated.

