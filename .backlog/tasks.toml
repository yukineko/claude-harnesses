[[task]]
id = "355d3b12"
title = "lint-changed-crates.sh / test-changed-crates.sh report no crate touched for committed-but-unmerged branch work on a clean tree"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "donegate",
    "p1",
]
touched_files = []
status = "pending"
notes = """
Observed 2026-11-07, session c2e3bc17, measured at rev 30d95437. After a subagent committed its work in a run-20261107-034825-70254 task worktree, scripts/lint-changed-crates.sh and scripts/test-changed-crates.sh printed "no crate touched" for it. Both compute the changed set from `git diff --name-only HEAD` plus `git ls-files --others` only. So committed-but-unmerged branch work, changed against the branch's merge-base with main, is never checked by donegate's lint-changed/test-changed. The worker's branch therefore reaches merge unchecked; see the fmt/clippy-before-merge ticket.

RED (python3 -m pytest -q scripts/test_changed_crates_committed_unmerged_20261107.py): 2 failed, 2 passed.
- test_lint_changed_checks_committed_unmerged_fmt_violation: "lint-changed-crates.sh: committed-but-unmerged crate change on a clean tree was reported as nothing to check (exit 0) --- output --- lint-changed-crates: no crate touched — nothing to lint".
- test_test_changed_checks_committed_unmerged_failing_test: the same, with "test-changed-crates: no crate touched — nothing to test".
The fixture is a linked worktree on branch `task`, with a clean tree, a committed change in crates/alpha, and `git diff main...HEAD` naming it. The controls (the same change left uncommitted is caught, exit != 0) pass.

TWIN (the same gap, not covered by this test, and it must be fixed together or the script fix is unreachable): donegate's own scoping, crates/donegate/src/git.rs changed_files, uses `git diff --name-only`, `git diff --cached --name-only` and `ls-files --others`, all uncommitted-only. So on a clean tree the `when_changed = ["**/*.rs"]` checks are SKIPPED ("skipped (no matching changes)") before either script even runs.

Readings:
(a) Defect: a worktree's unmerged commits are exactly the work that has not yet been checked anywhere. "Nothing changed vs HEAD" reads as "nothing to check", and that is fail-open (CLAUDE.md §3).
(b) Intended: the scripts are documented as a per-turn tripwire for "crates touched in the working tree" (their headers say so), and committed work is meant to be checked elsewhere.
How to tell them apart: (b) needs an "elsewhere" that runs. Today nothing runs fmt/clippy/test on commit or merge (pre-commit runs no cargo, and condukt merge runs none: see the fmt/clippy-before-merge ticket). If a merge-time lint+test lands first, (b) becomes true for lint, and this ticket narrows to test-changed or can be closed by ruling. Design notes for the fixer:
- Diff against the merge-base with the default branch (`git merge-base HEAD main`, or the condukt-recorded branch.<b>.conduktBase).
- A merge-base that cannot be determined is undetermined and must not mean "nothing to check"."""
