and canaried, provenance eea5f29d dirty:false). This item stays PENDING - only the
first half of its done-criteria is met.

PREMISE CORRECTED (measured, do not re-litigate the old wording): this note said
specguard never calls into overwatch. It does - emit_audit_violations has been
emitting overwatch violations all along. The real mechanism is worse than the note
claimed rather than better: the violation stream only reaches review-queue through
the SYSTEMIC path, and violation.rs:305-306 requires
occurrences >= threshold && (distinct_tasks > 1 || distinct_sessions > 1).
specguard's task_key is <kind>:<symbol>, constant for a given finding, so
distinct_tasks is pinned at 1 and the same drift must recur across separate
SESSIONS before it surfaces. A first-time structural drift was invisible in the
queue by construction.

DONE: emit_audit_findings records one overwatch review finding per structural
finding, so a first occurrence surfaces immediately and review-queue --to-backlog
can bridge it. Idempotent on finding_id specguard:<kind>:<key> (append_review_finding
has no dedupe of its own, so re-auditing would otherwise re-row the whole set). An
unreadable store re-appends rather than skips - a duplicate row is visible, a
withheld finding is not. Severity: dangling-reference high (the map is reading a
lie), undocumented/untested medium. RED observed first via a no-op stub: 3 failed,
229 passed, with the clean-audit test passing under the stub as the control.

STILL OPEN, and the reason this is not marked done: "a cleared sentinel leaves a
disposition record rather than nothing". specguard ack still clears the sentinel
silently, so the closure rate for spec findings remains unmeasurable - the exact
asymmetry with overwatch findings (record-disposition / review-metrics /
reconcile-fixed) that this item opened with. It needs a mapping from the sentinel
to the finding ids it covered, which is a design question, not a mechanical
addition. Whoever takes it: the ids are now stable and derivable
(specguard:<kind>:<key>), which is the piece that was missing before.


---
SECOND HALF LANDED 2026-08-02, merge a30b323f (specguard 0.2.46 -> 0.2.47,
overwatch 0.2.17 -> 0.2.18; both canary-rolled-out, provenance a30b323f
dirty:false). Closing this item.

The remaining done-criterion was "a cleared sentinel leaves a disposition record
rather than nothing". It needed more than an ack-side write, because the two
producers are separate: the sentinel comes from the run/ingest SHARD audit,
while the review findings added in the first half come from `specguard audit`
(structural findings, which raise no sentinel). The sentinel path recorded no
review finding at all, so ack had nothing to dispose of. Both ends built:

- raise: emit_drift_findings queues one review finding per needs_user shard
  (specguard:spec-drift:<label>, or specguard:audit-indeterminate:<label> at
  severity high when the shard's verdict was indeterminate - not folded into
  drift, since "could not say" is not "found drift"). write_sentinel stamps
  those ids into covers: lines.
- ack: appends one disposition per covered id BEFORE removing the file. If the
  append fails or the store lock is contended, the sentinel stays RAISED
  (EXIT_DISPOSITION_UNRECORDED=9, --force overrides) - clearing first would
  delete the ids and with them the only evidence the findings were closed.
  Verdict derived from observation: no --force means the fix-commit guard
  passed (confirmed), --force means it did not (dismissed). --verdict added
  because no observable can express "the finding was wrong".
- old-format sentinels (no covers:) still clear but say out loud that nothing
  was recorded and that the item enters neither side of the ratio.

The rate itself did not exist either, so overwatch gained closure_by_source /
closure_rate and review-metrics reports it, split by finding source. Numerator
is an intersection with known findings (an unjoinable disposition cannot push
the rate over 1.0); no findings is None but findings-with-no-dispositions is a
real 0.0; closure now prints even on the total==0 early return, where the
command previously said only "(no dispositions recorded yet)".

RED observed twice before GREEN (env-guarded stubs reproducing the status quo):
specguard 7 failed / 236 passed with 4 controls passing under the stub;
overwatch 4 failed / 17 passed with closure_of_an_empty_store_is_undefined as
the control. Smoke-tested end to end with the real binaries: 0.00 (0/2) ->
1.00 (2/2) across one `specguard ack`.

FIRST MEASUREMENT, now that the metric exists (live store, 2026-08-02):
