title = "tdd の strict_separation が既定無効なため、CLAUDE.md 第2節(a) 「テストは利害関係のない Agent が書く」が機械強制されていない"
project = "/mnt/c/Users/hiroyuki_nakayama/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-18, 測定点 01deeab2。

tdd status の出力: 'strict_separation: false'。tdd.toml (repo root) の該当行はコメントアウトされたまま (# strict_separation = false)。

tdd.toml の doc が逐語で (バックティックは [bt] で表記):
'Opt-in: [bt]tdd green[bt] fail-closed rejects if the RED (test-authoring) identity equals the GREEN (implementation) identity. Identity defaults to CLAUDE_CODE_SESSION_ID when [bt]--author[bt] is omitted from [bt]tdd red[bt]/[bt]tdd green[bt] (not just an honor-system string) — but a single agent can still defeat this by passing two different --author overrides; this is HOTL, not a hard security boundary.'

注記: この notes の初版は backlog add をシェルのダブルクォート内で実行した際にバックティックがコマンド置換として評価され、上記引用の 3 箇所 (tdd green / --author / tdd red) が空文字に落ちて逐語引用が壊れていた。2026-08-18 に修正。引用の欠損自体が CLAUDE.md 第4節が禁じる「次のレビュアーを騙す仕掛け」に該当するため、隠さず記録する。

CLAUDE.md 第2節の成立条件 (a) は 'テストは利害関係のない Agent が書く。実装した本人は自分の実装を検証するテストを自分で書かない' を必須としており、strict_separation はその唯一の機械的な強制点である。既定無効なので、現状この規範は実装者の自己申告と orchestrator の構成に依存している。

なお doc 自身が 'a single agent can still defeat this by passing two different --author overrides' で破れると認めているので、有効化しても hard boundary にはならない。したがって課題は2層ある:
1. strict_separation を既定で有効にするか (repo の tdd.toml を変更)。
2. --author を agent が自由に指定できる限り HOTL のままなので、identity を agent 側の申告ではなく orchestrator 側 (Task tool が返す agentId 等) から導出できないか。

判定不能な2つの読み: (a) 単に既定を有効にし忘れている / (b) 意図的に opt-in にしてある (誤検知で TDD ループが止まるのを避けるため)。

見分ける方法: crates/tdd/ の README / commit 履歴で strict_separation 導入時の意図を読む。また有効化した場合に既存の /tdd skill ワークフロー (単一 agent が red と green を連続実行する形) が壊れるかを確認する — 壊れるなら (b) であり、その場合は 'skill 側を 2 agent 構成に変える' が正しい修正になる。

今回の作業 (harness 拡張 T1-T4) では、orchestrator が テスト著者(sonnet) / 実装 worker(opus) / verifier(sonnet) を別 agent として起動することで構成上の分離を担保したが、これは機械強制ではなく orchestrator の構成による分離である。

