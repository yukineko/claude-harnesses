drain の実行スコープが「1つのタスクと関連するタスク」に決まったが、backlog には
**「関連」を決定論的に判定する手段が無い**。LLM の散文判断で境界を決めると、
どこまで実行したかがその場の判断に依存し、CLAUDE.md 第6節
（規範の遵守を実装者の自己申告に依存させない）に反する。

## 使えそうな決定論シグナル

1. **notes 内の task id 相互参照** — この repo では「0ab44b59 から派生」の形で実際に
   使われている。双方向に辿れば推移閉包が取れる。最も強い。
2. **tag の一致** — docs/backlog-tag-taxonomy.md の規約タグ。中程度。
3. **title と notes の字句重なり** — 弱い。閾値の置き方次第で無関係を巻き込む。

## 判定不能の倒し方（CLAUDE.md 第3節）

関連かどうか**判定できない item は「関連ではない」側に倒す**（実行しない）。
スコープ拡大のほうが非可逆なので、除外が制限側である。

ただし**黙って落とさない**。「関連未判定のため対象外」として逐語で列挙し報告する。
沈黙は許容される degrade ではない（第3節・3b1eb24 の statusline と同型）。

