status = "done"
notes = """
Measured 2026-08-12, measurement point 1ef71cc5, crates/backlog/src/store.rs.

THE PROSE ASSERTS AN INVARIANT THE CODE DOES NOT HOLD (CLAUDE.md section 4).

store.rs:246 claims: Bounded blocking-acquire budget: attempts x sleep approximately 8s worst case.
store.rs:257 claims: The budget must stay a comfortable margin BELOW TASKS_LOCK_STALE_SECS (10s) so a queued-behind-many-live-holders waiter is never mistaken for one waiting on a crashed holder and made to reap+barge in early.

MEASURED REALITY. The nominal arithmetic is TASKS_LOCK_MAX_ATTEMPTS 1600 x TASKS_LOCK_SLEEP 5ms = 8.0s, but that arithmetic counts ONLY the sleep. Each attempt also pays an OpenOptions create_new syscall plus a tasks_lock_is_stale metadata stat, so real per-iteration cost is about 6.2ms. Independently observed elapsed budget: 9.967965208s. That number was produced by a different agent (the t3 test-writer for run p0trio-1) in the panic message of store::tests::add_must_not_report_success_when_the_tasks_lock_is_unavailable, which holds the lockfile for the whole budget and prints the measured wait. It is an observation, not my estimate.

So the actual margin is 10.000 - 9.968 = about 0.03s, i.e. 0.3 percent -- not a comfortable margin. On a loaded machine, or for any waiter that starts even tens of milliseconds later, the budget CROSSES the 10s stale threshold.

CONSEQUENCE (exactly the harm the comment itself names as the stale-lock reap window race). A waiter reaches the end of its budget at ~9.97s. At 10.0s the LIVE holder's lockfile satisfies tasks_lock_is_stale, so the waiter removes it and takes the lock via create_new. Both parties now hold what each believes is the exclusive lock and both run read-modify-write on tasks.toml. The later save clobbers the earlier one. This is a direct mechanism for the bd6d81df lost update.

WHY THE bd6d81df FIX DOES NOT CLOSE THIS. The t3 fix makes add fail CLOSED when acquisition fails (returns Err instead of running unprotected) and re-reads after save. Neither helps here, because in this race BOTH writers successfully acquire -- neither takes the degraded path. The post-save reload can only catch the clobber if it happens to land before the reload, so it is a mitigation with a race window, not a fix.

SUGGESTED DIRECTION (not verified by an executed test). Two independent problems: (1) the budget must be derived from measured elapsed wall-clock, not from an attempt count multiplied by sleep duration, because the latter systematically undercounts syscall cost; (2) stale-reap must not be keyed on lockfile mtime alone -- an alive holder should be refreshing something, or the reap should require a positive liveness signal, mirroring the progress-gated reap in condukt claim.rs retain_claim which requires a confirmed Known(Stalled) verdict rather than mere staleness. Related: backlog b6cf486d on which liveness probes are actually sound.

NOT DONE: I did not write a test reproducing the two-writers-barge sequence. It needs deterministic control of the 10s boundary, so it likely needs the threshold and budget injectable rather than const.

--- 進捗 (2026-08-17, session 52834a1f, 測定点 f1131a36): 実装済み・未コミット・検証中 ---

**作業は worktree `/mnt/c/Users/hiroyuki_nakayama/src/.harness-worktrees/session-52834a1f` に
uncommitted で存在する。** 別セッションが着手する前にこの worktree を確認すること
(捨てる場合も、下記の RED テストだけは価値があるので回収を検討)。

【観測: RED を先に取った】production の code path 上で 1.14s で再現。逐語:
  "a second acquire took the tasks lock while the first holder was STILL ALIVE
   (its guard had not been dropped)... test result: FAILED. 0 passed; 1 failed"

【一次原因はチケット記述より一段深い】起票は budget 算術 (9.968s vs 10s) の問題として
書かれているが、実際の一次原因は `tasks_lock_is_stale` が **mtime だけ**で判定していたこと。
mtime は `create_new` 後に誰も更新しないので「古い」は「**現 holder が長く保持している**」で
あって「死んだ」ではない。budget margin は「1 回の acquire 呼び出し内でそこへ到達できるか」を
決める二次要因にすぎない。したがって budget を直すだけでは閉じない。

【既存テストが欠陥を隠していた】テストヘルパ `HeldTasksLock` は lockfile を 200ms ごとに
書き直しており、コメント逐語で「the holder never looks abandoned to tasks_lock_is_stale」と
書いてある。つまり suite は heartbeat する holder しかモデル化しておらず、production の
holder は heartbeat しない。ロックを保持する既存テスト全部がこの欠陥を覆い隠していた。
また `bounded_wait_gives_up_before_stale_reap_window` は名前に反して acquire budget を
見ておらず、`is_claimed` subprocess の 300ms 境界しか検査していない。

【実装】crates/backlog/src/store.rs:
 1. 三値 `TasksLockHolder` (Alive / Gone / Unknown) と `tasks_lock_pid_state` / `tasks_lock_holder`。
 2. acquire 成功時に holder の pid を lockfile へ記録。
 3. `tasks_lock_is_abandoned_with` = 「mtime が古い **かつ** holder が Gone」の連言。
    Unknown (pid 読めない・parse 不能・プローブ失敗) は **絶対に reap しない**。
 4. budget を `attempts × sleep` から **実測 elapsed の Duration (8s)** へ変更。
    これにより「8s、10s より comfortable margin」という既存の散文が嘘から真になった。
    user-facing エラーメッセージが偽の算術を引用していた件も同時に修正。
 5. 新規テスト 3 本: a_live_holder_that_holds_longer_than_the_stale_window_must_not_be_reaped
    (headline, RED→GREEN) / a_lockfile_whose_holder_really_died_is_still_reaped (**アンチ空虚の対照**:
    これが無いと「何も reap しない」実装が満点で通り deadlock する) /
    a_lockfile_with_no_readable_holder_is_not_reaped_on_age_alone。

【計測】cargo test -p backlog = 255 passed / 0 failed。clippy clean。
version lockstep 0.2.26 -> 0.2.27 (3 ファイル)、check-plugin-versions.py と
check-version-bumped.py の両ゲート通過。**rollout は未実施**。

