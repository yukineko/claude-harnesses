--- 訂正 (実測 2026-09-09、測定点 8366ed89) ---

**この起票の前提は誤っていた。** ストアは main のツリーに固定されてはいない。

crates/backlog/src/claim_ledger.rs:9 が逐語で「worktree owns `<worktree>/.backlog/tasks.toml`.
That is deliberate」と書いており、crates/backlog/src/divergence.rs:5 も「resolves per repo
(config::locate -> `<root>/.backlog/tasks.toml`)」と書いている。つまり store は cwd の git root
から解決され、worktree で実行すれば worktree のストアに書かれる。

実測: cwd を worktree にして `backlog add --project /Users/yuki/src/harness ...` を実行したところ、
`git -C <worktree> status` に `M .backlog/tasks.toml` が現れ、`git -C /Users/yuki/src/harness status`
は空のままだった (task 0cd69e11)。main のツリーは一切汚れていない。

