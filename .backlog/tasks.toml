title = "condukt と scout の SKILL.md にも逸脱禁止・常時起票の不変条件を入れる (flow は d215649a で完了)"
project = "/Users/yuki/src/harness"
tags = [
    "flow",
    "harness",
    "p1",
]
status = "pending"
notes = "commit d215649a で flow の SKILL.md に2つのループ不変条件を明文化した: (1) ユーザー課題から逸脱しない・着手した課題は終わるまでそれだけをやる・見つけた別課題は backlog add して戻る、(2) 気づいたことは常に起票し、起票するかどうかを判断しない (実在の課題かは後でチケットから判定する)。condukt と scout は同じループ形と同じ失敗モードを持つが、3つの skill を1コミットで変えると3プラグインが同一 lockstep bump に乗り並行セッションと衝突する (CLAUDE.md 第8節) ため flow のみに留めた。完了条件: condukt の SKILL.md と scout の SKILL.md にも同等の不変条件を入れ、それぞれ独立したコミットで3ファイル lockstep bump する。注意: 文面をそのままコピーしない — condukt は executor なので「worker が別の問題を見つけたときの扱い」、scout は発見専用なので「発見を実装に化けさせない」という各 skill 固有の失敗モードに合わせて書くこと。あわせて、この2規範が実際に守られたかを事後に観測する手段が現状無い (自己申告のみ) ことも検討対象とする — CLAUDE.md 第6節は規範の遵守を自己申告に依存させないことを要求している。"
