移行リスクは想定より低い: repo ストアとの重複が title 一致 0 件・ID 一致 0 件、home ストア内の重複も 0 件。単純追記で二重起票は起きない。障害は表記ゆれ3種の正規化と、一時/worktree パス 14 件の除外だけ。起票時ノートの注意「project フィールドで振り分ける必要がある」はこの3種+除外14件が具体像。

