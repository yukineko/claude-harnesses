id = "R2"
statement = 'slot_files が列挙する全 GREEN slot（legacy の <task>.green.json と <task>.<16hex>.green.json）について、green.red_failed_tests の名前のうち green.tests で "pass" でないものが 1 つでもあれば merge-proof-contract(f) で拒否する。'
acceptance = [
    "merge_refused_when_green_passed_set_misses_a_red_failure が #[ignore] の除去だけで pass する。",
    "独立 agent が書く分離テストを追加する（修正前に RED を観測する）。t.sh と mode.txt を commit してから real red(none)/green(lost) を記録し、非0終了・main 不変・stderr に `merge-proof-contract(f)` を assert する。",
    "command が 2 つあり、2 つ目の GREEN slot だけが (f) に違反する場合も拒否する。",
]
canon = [
    "crates/tdd/README.md:155-156",
    "crates/tdd/README.md:180-184",
    "crates/tdd/src/proof.rs:244-265",
    "crates/condukt/tests/backlog_20261117_merge_without_tdd_proofs.rs:356-366",
]
falsifiable = true

