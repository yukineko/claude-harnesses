## D2'（G3・決定的）— 「撤回する既存記述」が実体と合わない（2 件ではない）

要望は撤回対象を `scope.rs:56-63` と `detect.rs:8399` の **2 件**と宣言し、「散文と実装の食い違いを残さない」と書いています。実測（測定コマンド・測定点 `1d45dd69`・測定日 2026-09-14）:

- `grep -c 'is_deny()' crates/blastguard/src/detect.rs` → **290 件**
- そのうち `/tmp` を含む行 → **13 件**（`detect.rs:8399-8402`, `9622`, `9638`, `9814-9815` ほか）

裁定2/裁定3 が期待値を反転させる assert のうち、撤回リストに**無い**ものの実例（逐語）:

- `detect.rs:8744`: `assert!(bash("rm -rf .claude").is_deny());`
- `detect.rs:8745`: `assert!(bash("rm -rf /Users/yuki/.claude").is_deny());`
  → A3 が `Ask` を要求する当のケース。
- `detect.rs:8393`: `assert!(bash("sudo rm -rf /var/data").is_deny());`
  → 裁定1 で `/var` を C1 に入れないので C5 → ask。
- `detect.rs:8400-8402`: `nice -n10` / `env -i` / `ionice -c3` + `/tmp/x`（下記 D3'）。

撤回対象を 2 件と数えたまま実装すると、残りは**赤いテストとして現れるか、黙って期待値を書き換えられる**。後者は CLAUDE.md 第4節の禁止事項です。

## D3'（G3 + CLAUDE.md 第2節(b)・決定的）— 裁定2 の機械適用が回帰テスト CA-blastguard-004 の検出力を消す

`crates/blastguard/src/detect.rs:8396-8403`（逐語）:

> `// ---- Regression: CA-blastguard-004 (wrapper flag bypass) ----`
> `#[test]`
> `fn wrapper_flags_do_not_bypass_detection() {`
> `    assert!(bash("sudo -u root rm -rf /tmp/x").is_deny());`
> `    assert!(bash("nice -n10 rm -rf /tmp/x").is_deny());`
> `    assert!(bash("env -i rm -rf /tmp/x").is_deny());`
> `    assert!(bash("ionice -c3 rm -rf /tmp/x").is_deny());`
> `}`

要望は 8399 の 1 行だけを「期待値を allow に更新」と指示しますが、**4 行すべてが `/tmp/x` = C4 → allow** になります。4 行とも allow にすると、このテストは wrapper flag 解析を丸ごと削除しても通る — すなわち「wrapper 経由の bypass を検出する」という回帰被覆が消えます。テストは残るが何も証明しなくなる形で、CLAUDE.md 第2節「落ちることを確認していないテストは、何も証明しない」／第4節「通すためだけに緩める」に該当します。

裁定2 はこの副作用を明示していません。**回帰被覆をどう保存するか（例: target を C5 のパスへ差し替えて deny→ask で検出力を残す）は人間の判断**です。

## D4'（G3）— C2 container の verdict が canon の積極的論拠と衝突し、撤回リストにも無い

`crates/blastguard/src/detect.rs:652-655`（`protected_tree_deny` の doc、逐語）:

> The verdict is a Deny rather than an Ask because a recursive delete of a directory removes EVERYTHING under it — the protected paths are a subset of what goes, so there is nothing to guess about.

裁定3 の C2 = 常に ask は、この **Deny → Ask の緩和**です（`detect.rs:657` は `is_protected_path(path) || holds_protected_paths(path)` で container を拾い、`Decision::deny` を返す）。canon はこの Deny に「guess することが無い」という積極的論拠を書いており、要望の撤回リストはここを含みません。機械は「どちらが正か」を決めません。

## D5'（G2・沈黙）— 「破壊的操作」の外延が canon にも要望にも無い

R1 は対象を「削除・truncate する redirect」とだけ書きます。`detect.rs` には他に `truncate`（64 箇所で言及）/ `shred`（41）/ `git clean`（16）/ `find -delete`（3）/ `dd`（3）系の破壊ルールがあり、`protected_disarm_deny` / `system_path_block` / `protected_glob_deny` / `protected_landing_block` など独立した block 関数も存在します（`detect.rs:579/608/636/656/720/773`）。

**R1-R3 の支配下に入る verb 集合が決まらない**ので、実装者は `git clean -fdx <project>` や `shred <project>/x` が C3 = allow になるのかを推測するしかありません。A1-A8 は `rm -rf` と `>` しか触れないので、acceptance でも塞がりません。

## D6'（G2・沈黙）— 1 行に複数 target があるときの合成規則が無い

`crates/blastguard/src/model.rs:12-15`（逐語）:

> Ranking, used everywhere sub-analyses are combined: `Deny > Ask > Allow`. A `Deny` found anywhere on a command line must always outrank an `Ask` found anywhere else on it, or the stronger verdict would be silently downgraded.

`detect.rs:1163` の `VerdictAcc` がこの合成を実装しています。R3 の「該当すれば allow で確定」は **単一 target を前提**にしており、`rm -rf <project>/a /other/b`（C3 + C5）や `rm -rf <project>/a && rm -rf /usr/lib`（C3 + C1）で C3 の allow が他を打ち消すのかが未定義です。ここを決めないと A2/A6 のテストは単一 target でしか書けず、**仕様として一番危ない経路が未被覆のまま**残ります。

## D7'（G1・事実誤り。修正は軽微だが仕様文の訂正が要る）

R7 は `scope::RealPathResolver` と `approve::TargetProbe` を「trait」と呼び、`GitStateProbe` も trait として新設するとしていますが、canon では両方とも **fn ポインタの型別名**です:

- `crates/blastguard/src/scope.rs:89`: `pub type RealPathResolver = fn(&str) -> Option<String>;`
- `crates/blastguard/src/approve.rs:107`: `pub type TargetProbe = fn(&str) -> Determination<String>;`

trait にするか fn 型にするかで fake 注入の書き方が変わり（fn 型はクロージャの状態を持てないので、A6 の「clean を返す fake」と「untracked を返す fake」を 1 つのテスト内で切り替える書き方が変わる）、`detect` の純粋性契約の守り方にも影響します。

### 参考（ブロッカーではないが要一行明記）

R3 の「safe list は C1 より先」は、canon の実体（`detect.rs:1955-1958`）では **protected が safe list より先**です:

> `if exclude::is_protected_path(&t) {`
> `    return false;`
> `}`

`/dev/null` が protected になることは無いので観測上は衝突しませんが、R3 の順序記述（safe list > C1 > C2）と canon の順序（C2 > safe list）が字面で食い違うので、どちらの記述を正典にするか一行で決めてください。

