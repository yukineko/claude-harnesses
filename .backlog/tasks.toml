[[task]]
id = "e033c406"
title = "新ゲート: block 直後に同一効果を別構文で再試行する回避を検出する（ユーザー承認済み・hack route を閉じる）"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = """
ユーザーが明示的に追加を許可した「hack route を閉じる gate」。設計のみ、実装は未着手。

**なぜ新しい状態が要るか（観測）**: PreToolUse の deny は PostToolUse イベントを生まず、
後続の hook 入力のどのフィールドにも残らない。crates/harness-core/src/hook.rs:39-81 が運ぶのは
session_id / transcript_path / cwd / hook_event_name / tool_name / tool_input / tool_response /
message / stop_hook_active / context_window で、prompt は UserPromptSubmit のみ。
「直前に X が deny された」を表すフィールドは存在しない。したがって **deny した側が自分で記録する**
必要がある = guard-maintree-bash.py / guard-maintree-edit.py / blastguard / taintguard の変更を要する。

**状態の置き場（第5節に違反しないこと）**: ホーム配下の gate 別 state に session_id で keying する
（taintguard が crates/taintguard/src/state.rs:93,161-168 で既に採っている形）。
プロジェクトルートのファイルは**絶対に使わない** — 一度きり消費の共有 skip と同じ失敗になる。
記録: ts / session_id / denier / effect_verb / target_abs / raw_command / reason。

**同一効果の比較子（種類の違う2信号を意図的に併用）**:
1. 予防（安価・綴り非依存・リゾルバ非依存）— リテラル対象の包含判定。deny された target_abs が
   新しい呼び出しの tool_input のシリアライズ中に部分文字列として現れるか。同一 session_id、
   N 呼び出し / T 分以内、かつ対象が依然 main ツリー配下であること。
   これは実測で確認された interpreter ミラー（python3 -c / sh -c / eval / awk / node -e / ed /
   curl -o / tar -C）を**すべて**捕らえる。絶対パスのリテラルがラッパを貫通して残るため。
   捕らえないもの（残余として明示すること）: 断片から再構成したパス、HOME や PWD 経由のパス。
2. 健全な検出（綴り非依存・回避不能だが事後）— deny 時に git status --porcelain -z と対象の
   mtime/size をスナップショットし、PostToolUse と Stop で再比較する。deny されたパスが dirty に
   なっていれば、**構文が何であれ** deny は回避されている。予防はしないが Stop を止められる
   （scripts/stop-verify-worktree.py という chokepoint が既にある）。

**verdict の形（ここで doctrine が効く）**: deny ではなく **ask** を出し、直前の拒否を逐語で引用する。
「denier が ts に raw_command を reason により拒否した。この呼び出しは別の綴りで同じ対象
target_abs に到達する。本当に別のアプローチかを確認せよ」。非対話 entrypoint では
crates/taintguard/src/main.rs:212-218 と同じく ask を deny へ hardening する。
doctrine 2（block かつ ask、逐語引用可能）と doctrine 3（万能既定ではない＝観測された deny の
後にしか発火しないので clean な turn には一切コストが無い）を同時に満たす。

**正当に別アプローチを採った場合の誤検出**: 発火は「deny された当の対象が依然 main ツリー配下」に
keying する。正しい是正（worktree でやり直す）は**別の絶対パス**を対象にするので tuple が違い、
ゲートは沈黙する。加えて UserPromptSubmit（このイベントだけが prompt を運ぶ、hook.rs:51）で
そのセッションの台帳を消す — 新しい人間の指示は新しい authority である。
許可された場所に同一効果が着地したときも消す。

**判定不能**: 台帳が読めない / 破損 / 対象が計算不能 / payload がパース不能 to ask
（非対話では deny へ hardening）。allow には決して落とさない。状態はすべてローカル、外部サービス無し（第7節）。

**同時に入れる価値のある小さい第二のゲート**: settings.json とフック設定の自己編集 denier。
git config core.hooksPath を別パスへ / chmod / .git/hooks 配下への書き込みは現状すべて
guard-maintree-bash.py で rc=0（実測）。ゲートを無効化するのが最も安い hack route である。
親 826c29bf"""
