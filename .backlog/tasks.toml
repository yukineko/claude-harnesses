 M Cargo.lock を返した)。_git() の timeout は 15 秒 (stop-verify-worktree.py:47)。

判定不能を block に倒すのは CLAUDE.md 第3節どおり正しい。問題は「判定不能になった
原因が負荷であって、ツリーの状態ではない」点。

2つの読みがあり、どちらか確定していない:
 (a) 実在の欠陥 — 15 秒の timeout が /mnt/c + 並行 workspace build の下では短すぎ、
     ツリーが実際には判定可能なのに block する。Stop ゲートが負荷に依存して
     非決定的になる。
 (b) 意図的な仕様 — fail-closed は設計どおりで、stop_hook_active による bounded
     allow (2回目の Stop は通る) がコストの上限を押さえているので、timeout を
     延ばすと今度は「本当に git が壊れている」ケースの検出が遅れる。

見分ける方法 (どちらかに決着させる観測):
 1. cargo build --release --workspace を走らせながら、同 repo で
    git status --porcelain の wall time を 50 回測る。
 2. p99 が 15 秒を超えるなら (a) が確定 = timeout が原因。その場合の是正は timeout
    延長ではなく、timeout と他の判定不能を区別して別 slug で報告すること
    (「負荷で測れなかった」と「git が壊れている」を同じ出力に写さない —
    第3節の二値潰しと同じ構造の問題)。
 3. p99 が 15 秒を大きく下回るなら (a) は棄却され、probe が落ちた原因は timeout では
    ない (fork 失敗 / index.lock 競合等)。原因を別途特定する。「たぶん負荷だろう」で
    閉じてはいけない — それが第2節の禁じる判断。

