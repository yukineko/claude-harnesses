  (`lock.rs:76` が `now.saturating_sub(info.heartbeat_at) > LOCK_STALE_TTL_SECS`)。
- `crates/condukt/src/wt_reconcile.rs` : `const DRIVER_STALE_TTL_SECS: i64 = 1800;`
  これが記録を読む側 (condukt) が「heartbeat が古い = death の第4項が成立」と
  判定する値。
- condukt は backlog を link できない: `ls crates/backlog/src/lib.rs` -> No such
  file (binary crate のみ)、定数は `pub(crate)`、`crates/condukt/Cargo.toml` の
  依存に backlog は無い。以上 3 点は実行して確認した。

## なぜ重いか — ずれる方向によって非対称

- condukt 側が短くなる (例 300) -> backlog がまだ生きているとみなす登録を condukt が
  「期限切れ」と読む。**生きているセッションの worktree が dead と判定される** —
  7039ad47 で直したばかりの欠陥が、定数のドリフトという別の入口から再発する。
- condukt 側が長くなる -> 回収が遅れるだけ (制限側)。

つまりこの重複は片方向にだけ fail-open へ倒れる。現在はコメントで source of truth を
名指ししているだけで、**機械的な検出は無い**。CLAUDE.md 6.「規範の遵守を実装者の
自己申告に依存させない」に照らすと不十分。

## 取りうる手 (いずれも未検証の案であって結論ではない)

1. `crates/backlog` に薄い `src/lib.rs` を足して定数を `pub` にし、condukt が依存する。
   最も直接的だが、backlog を lib+bin にする影響 (plugin の version lockstep、
   ビルド時間) を測っていない。
2. `harness-core` に TTL を移す。両者が既に harness-core に依存しているので link は
   自明。ただし「セッション登録の TTL」が harness-core のドメインか?という問いが残る。
3. `scripts/` に定数照合ゲートを足す (gate-crates-sync と同じ形で、2 ファイルの
   リテラルを機械照合して差異で block する)。link を増やさずにドリフトだけ止める。

3 が最も安く、1/2 と排他でもない。

