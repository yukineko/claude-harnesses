]
touched_files = []
status = "pending"
notes = '''
Observed 2026-11-07, session c2e3bc17, measured at rev 30d95437 (donegate 0.1.66). Root ~/.condukt/worktrees/run-20261107-034825-70254-c2-debc6df3 was mid-edit by a still-running subagent. A test-writer had swapped in the pre-fix git.rs to watch pins fail, so the tree was not the fix candidate. donegate ran lint-changed and test-changed on that root at the PARENT's Stop. log.jsonl shows "blocked" at attempts 1-3 (04:33:38, 04:34:11, 04:37:00) and "giveup" at attempt 4 (04:37:40). It reported mid-edit state to an agent that did not own the root and could not fix it. In the observed case the writer was a condukt worker, i.e. a nested subagent. Its launch record sits in the sidechain of the depth-1 general-purpose agent a1b0b358b487f1afc (meta.json requestShape "background"), not in the parent transcript.

User ruling 2026-11-07: 「lintと推論が競合しているのは解消したい」. The user chose BOTH readings of this conflict as separate tickets; the fmt/clippy-before-merge ticket is the other one.

Mechanism: harness_core::session_roots::resolve turns every path written in the parent transcript AND in every sidechain `<stem>/subagents/*.jsonl` into a root of the parent's Stop. It does that through attribution::session_written_paths, with no notion of the root's owner or whether that owner is still running. crates/donegate/hooks/hooks.json registers only "Stop", so nothing judges the root at the owner's own stop. condukt already has a SubagentStop hook (crates/condukt/src/subagent_stop.rs), which shows the payload is usable.

In-flight signal as Claude Code records it (shape copied from the observed parent transcript):
- the Agent tool_result carries toolUseResult {isAsync:true, status:"async_launched", agentId};
- agent-<id>.meta.json carries toolUseId;
- no <task-notification> with status completed has arrived for that agent yet.

Desired: a root written ONLY by an in-flight subagent is not judged at the parent's Stop. The skip must not be silent: the root is named in the output. The root is judged at the owner's SubagentStop. Fail-closed: if ownership or liveness cannot be determined, or the parent itself also wrote the root, keep blocking as today.

RED (cargo test -p donegate --test backlog_inflight_subagent_root_20261107 -- --include-ignored parent_stop_does_not_judge donegate_registers): 2 failed / 0 passed.
- parent_stop_does_not_judge_a_root_only_an_inflight_subagent_wrote: `assertion left != right failed: the parent's Stop blocked on a root that only a still-running background subagent wrote`. The stdout was {"decision":"block","reason":"[root: .../subagent-wt]\n... 1 required check(s) failed (attempt 1/50) ...".
- donegate_registers_a_subagent_stop_hook: `.../crates/donegate/hooks/hooks.json registers no SubagentStop hook running donegate; registered events: Some(["Stop"])`.
The controls control_undetermined_liveness_still_blocks and control_parent_also_wrote_the_root_still_blocks pass today and must keep passing.

Readings:
(a) Defect: judging a root whose owner is still writing races with in-flight inference. The finding is about a tree nobody claims as a candidate, and it lands on an agent that cannot act on it.
(b) Intended: session_roots deliberately includes sidechains so that subagent-written files are not dropped from the gate (the attribution.rs doc: "a missing sidechain would turn a subagent-written file into 'not mine'"). Without a SubagentStop check, the parent Stop is the ONLY place such a root is ever judged.
How to tell them apart: (b) holds only while no SubagentStop judgment exists. The fix must add the SubagentStop check (second RED) BEFORE the parent stops judging in-flight roots (first RED). Otherwise subagent work is never checked at all, which is fail-open. Remove both #[ignore] together.'''
