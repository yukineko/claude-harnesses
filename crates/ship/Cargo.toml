[package]
rust-version.workspace = true
name = "ship"
version = "0.1.27"
edition = "2021"
description = "Nudges the commit, merge, push and plugin-update shipping ritual and detects unshipped state using read-only git checks, never auto-running a mutating command."
license = "MIT"

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
