scoped_destructive::relaxed_truncating_forms_inside_the_project is a TEST FIXTURE defect, and the
PRODUCT is correct. I did not edit it, per the instruction to ask rather than change a test whose
expectation I think is wrong.

The fixture calls SafeRoots::new(cwd, project, home, tmpdir=None, resolver) while writing its probe
file into std::env::temp_dir(). Its own comment says "/tmp is one of the safe roots" - true on Linux,
where temp_dir() returns /tmp, which IS in the hardcoded scope::TEMP_ROOTS. On macOS temp_dir()
returns $TMPDIR = /var/folders/..., which is NOT in TEMP_ROOTS and was NOT passed as tmpdir, so the
fixture never constructs the "confined to a safe root" precondition its own assertion message names,
and the verdict is correctly Deny.

Production is unaffected: main.rs:364 does std::env::var("TMPDIR") and passes it to SafeRoots::new.
Proved by running the real binary twice on the same command, same probe file, differing only in env:
  WITH TMPDIR set (production on macOS): ask | truncating redirect is confined to
