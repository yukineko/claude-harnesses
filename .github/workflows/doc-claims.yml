name: doc-claims

# Blocks a change that leaves a `path:line` citation in the norm documents
# pointing at something the tree no longer contains. CLAUDE.md and docs/ quote
# source locations to justify their rules; once the code moves, the citation
# keeps reading as evidence while describing nothing. A prose claim that has
# quietly stopped being true is not a documentation nit — it is the norm
# arguing from a fact nobody can check anymore.
#
# The scanner (scripts/check-doc-claims.py) reads the whole tree rather than a
# diff, so a claim can break because the CITED FILE changed, with the document
# itself untouched. It exits 0 when every cited claim matches, 1 when a
# non-exempt claim does not, and 2 when it cannot determine an answer (an empty
# document scope is treated as undetermined, not as clean). All three of those
# are surfaced here: a non-zero exit from either step below fails the step, and
# a failed step fails the job. Nothing in this file swallows an exit code.
#
# NOTE: there is deliberately no `paths:` filter. This job is intended to be a
# REQUIRED status check, and a required check skipped by a path filter never
# reports at all, leaving the PR permanently pending — the gate stops
# functioning without ever going red. A path filter would also be wrong on the
# merits here: the scan is whole-tree, so a source edit far from docs/ is
# exactly what breaks a claim. It is cheap enough (stdlib Python, no build) to
# run on every PR.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doc-claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Explicit unique name: a required status check is matched by context name,
    # which defaults to the job id. Three workflows here used the id `scan`, so
    # without this they are not individually addressable in branch protection.
    name: doc-claims-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # The scanner's own tests gate the scanner, and they run FIRST: a scanner
      # whose matching logic has broken can report a clean tree for the wrong
      # reason, and that verdict is indistinguishable from a real pass.
      - name: Unit-test the scanner
        run: python3 scripts/test_check_doc_claims.py
      - name: Verify doc path:line claims against the tree
        run: python3 scripts/check-doc-claims.py
