notes = """Observed 2026-11-07 on main around 51f98352 (worktree session-0d3d5bb8 at 2234f348). Verbatim: `check-test-weakening: undetermined — crates/blastguard/tests/git_config_worktree_twins_failopen_20261107.rs: #[test] inside a macro_rules! template in a file that exists at the base -- macro invocations are not counted, so removed generated tests cannot be ruled out` / `test-weakening: UNDETERMINED (exit 2)`. The Undetermined is raised in scripts/check-test-weakening.py (~line 1783-1793, `if before_src and (before["template_tests"] or after["template_tests"]): raise Undetermined`) BEFORE findings_for, so a `test-weakening-justified:` marker cannot clear it. Stuck instance: crates/blastguard/tests/git_config_worktree_twins_failopen_20261107.rs has 12 #[ignore]d macro-generated tests whose fix is merged in 51f98352 (they pass under --include-ignored) but the ignore can never be removed through pre-commit, so the backlog protocol (commit RED repro with #[ignore = "backlog ..."], remove ignore when fixed) cannot complete for macro-generated tests. Repro: scripts/test_check_test_weakening_macro_unignore.py (commit 45308949). RED at 45308949: test_removing_template_ignore_with_same_invocations_passes -> `AssertionError: 2 != 0 ... output='check-test-weakening: undetermined — crates/c/tests/macro_repro.rs: #[test] inside a macro_rules! template in a file that exists at the base -- macro invocations are not counted, so removed generated tests cannot be ruled out'`. Controls green: test_control_dropping_an_invocation_is_not_clean, test_control_adding_template_ignore_is_not_clean (both currently non-zero via the same Undetermined exit 2, not via a block finding). Two readings: (a) DEFECT - a change that only removes #[ignore] lines from a template while the macro invocation count is unchanged is countable (invocations of the template name can be counted on both sides) and is a coverage restoration, not a weakening, so it should resolve to clean; (b) INTENDED - macro expansion is not modelled, so any template change in a base-existing file is fail-closed by design and the protocol must route un-ignore through some other declared path. How to tell apart: if a fix counts invocations per template on both sides and the controls stay non-zero (dropping an invocation must still be a finding, adding a template #[ignore] must still be ignore-added), (a) holds; if invocation counting cannot be made sound (e.g. invocations generated by other macros / include!), the ruling is (b) and the human must decide the un-ignore route for macro-generated repros. Fix must keep fail-closed for the unmodelled cases."""
