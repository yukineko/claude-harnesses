[package]
rust-version.workspace = true
license.workspace = true
name = "backlog"
version = "0.2.27"
edition = "2021"
description = "Cross-project task queue with cycle-type tags for Claude Code."

[[bin]]
name = "backlog"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
unicode-normalization = "0.1"
# `kill(pid, 0)` + errno is the only probe that distinguishes "no such process"
# (ESRCH) from "exists but not ours to signal" (EPERM). See
# `store::tasks_lock_holder_from_kill`.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
