Observed (verbatim, 2f9f927e): "1 failed, 1 passed in 1.33s"
FAILED scripts/test_guard_maintree_bash_foreign_merge_window.py::ForeignMergeWindow::test_foreign_merge_window_does_not_refuse_unrelated_command
scripts/test_guard_maintree_bash_foreign_merge_window.py:100: AssertionError
  AssertionError: 2 != 0 : command never touched main but was refused:
  Refused: ORIG_HEAD was rewritten during this call while HEAD did not move and there is no MERGE_HEAD. That is what another session's in-flight `git merge` in this project's MAIN working tree looks like (a concurrent merge in main is one possible cause), but this command's own reset / merge / rebase produces it too. The change below is therefore NOT asserted to be this command's; it is still refused because a verdict that cannot be determined resolves to refuse (CLAUDE.md 3).
  Changed in .../main:
    feature.txt

Readings:
(a) real defect: the guard (scripts/guard-maintree-bash) refuses a command that ran in its own worktree while ANOTHER process's merge was in flight in main (pre-merge-commit window: ORIG_HEAD rewritten, HEAD not yet moved, no MERGE_HEAD). The test asserts the guard should attribute this window to the foreign merge and allow (rc 0); the guard instead refuses as undetermined. Fix = distinguish the foreign-merge window from this command's own reset/merge/rebase.
(b) intended: the refusal text says the window is indistinguishable from this command's own reset/merge/rebase and resolves undetermined to refuse (CLAUDE.md 3). If that indistinguishability is the accepted ruling, the test is stale and should be rewritten/removed by a ruling, not left red on main.
How to tell apart: check whether a later commit deliberately changed the guard to refuse this window (git log -S "ORIG_HEAD was rewritten" -- scripts/) and whether the test was written before or after that change; if the guard change postdates the test with an explicit ruling, (b); if the guard can observe something that distinguishes the command's own cwd (worktree, not main) — the command here ran with cwd=self.wt — (a). Either way a committed test is RED on main and must be resolved."""
