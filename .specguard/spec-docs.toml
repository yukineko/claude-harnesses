[[spec]]
path = "crates/blastguard/src/detect/interpreter/python_escape.rs"
doc = "docs/specs/blastguard.md"
reason = "Bullet 'Python の非 raw 文字列 literal は escape を decode した値でも判定する（backlog 47b20647）': decode_non_raw decodes a non-raw Python literal body (backslash-newline removed, simple/octal/hex/unicode escapes) into Decoded::Value, a \\N{...} naming one of the 95 printable ASCII characters (ascii_by_name, case-insensitive, alias SP) into that character, any other \\N{...} into a one-code-point HOLE (Decoded::Holed), a malformed escape into Decoded::Undecodable; raw literals are not decoded."

[[spec]]
