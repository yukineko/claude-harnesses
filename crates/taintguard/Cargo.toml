[package]
name = "taintguard"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
description = "Provenance-scoped least-privilege gate: detects a turn that consumed untrusted-provenance content (WebFetch/WebSearch/an external Read) and downgrades write-class tools (Bash/Write/Edit/MultiEdit/NotebookEdit) to ask/deny for the rest of that turn; restores after a clean Stop."
license = "MIT"

[[bin]]
name = "taintguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# ワークスペースの [workspace.lints.clippy] を継承する（unwrap_used / expect_used /
# panic = deny）。taintguard は judgment を持つゲート（gate サブコマンドが
# ask/deny を返す）なので、production 側で panic が判定不能の別名になってはならない
# （blastguard/propguard 等と同じ理由）。テスト側は各ファイルの
# `#![cfg_attr(test, allow(...))]` / `#![allow(...)]` で除外する。
[lints]
workspace = true
