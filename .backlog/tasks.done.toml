--- FIX (blastguard 0.2.60) ---

A SECOND AXIS, not a special case, and not a change to the recoverability axis. reversible.rs's own
module doc already reserved it: "Recoverability is not the only reason to surface a command ... That
axis stays where it already lives ... and callers must consult it FIRST." Added
scope::is_inside_system_dir + detect::system_path_block, consulted by BOTH the truncating and the
append redirect loops, before the recoverability probe, beside the existing protected_path_block.

It denies rather than asks: protected_path_block asks because only the human knows whether an edit to
their own gate config strengthens or disarms it, and that ambiguity has no counterpart when an agent
installs into /etc.

The system list is deliberately NARROWER than scope::NEVER_A_ROOT, which exists to answer a different
question. /home, /Users, /Volumes, /mnt are excluded - denying every absolute write under them would
re-create the friction 0.2.59 measured and retired. /var is excluded because the macOS per-user
$TMPDIR (/var/folders/...) and /var/tmp live under it. A target confined to a safe root escapes, so a
project checked out at /opt/myproj is unaffected.

