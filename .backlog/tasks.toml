Three docstrings assert the opposite:
  crates/context-governor/src/defaults/rehydrator.rs:1-3  "so pins survive compaction (I1) ... Most relevant on source == compact"
  crates/context-governor/src/handlers.rs:63-64            "so pins survive compaction (I1)"
