[package]
name = "harness-core"
version = "0.2.37"
edition = "2021"
# MSRV: `is_none_or` (store.rs) was stabilized in Rust 1.82.
rust-version.workspace = true
description = "Shared build-time infrastructure for the yukineko Claude Code harness plugins: hook I/O, transcript streaming, the note store (parallel-session-safe), config primitives, the metrics sink, and settings.json wiring."
license = "MIT"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
dirs = "5"
chrono = { workspace = true }
anyhow = { workspace = true }
wait-timeout = "0.2"

[features]
# Test-only seam: `boundary::fault` (a thread-local FaultPlan that forces the
# boundary IO entries to `Undetermined`) and `degrade::assert_fails_closed`.
# Enable it ONLY from `[dev-dependencies]`; with resolver 3 a dev-dependency
# feature is not unified into a crate's shipped binary.
fault-injection = []

[target.'cfg(unix)'.dependencies]
# Process-group kill for `boundary::run_with_timeout`: a timed-out child may
# have exec'd or backgrounded a grandchild (e.g. a shell-wrapped checker
# command), and killing only the direct child leaves that grandchild running.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
proptest = { version = "1", default-features = false, features = ["std"] }
trybuild = "1"
# Self dev-dependency so this crate's own integration tests always build with
# the fault seam. A `required-features` test target would be skipped silently
# by a plain `cargo test -p harness-core`, i.e. the suite would pass without
# ever running.
harness-core = { path = ".", features = ["fault-injection"] }

[lints]
workspace = true
