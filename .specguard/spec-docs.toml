doc = "docs/specs/blastguard.md"
reason = "Same bullet (backlog 47b20647): unknown_literal_target_verdict judges a holed/undecodable literal of a writing Python program — every '/', '.', '_' filling of the holes (<= 4) through the system-directory checks, Deny on any system landing; hole in a directory name, > 4 holes or Undecodable -> Ask (Deny in a subagent); hole only in the last segment of a determined directory adds nothing."

