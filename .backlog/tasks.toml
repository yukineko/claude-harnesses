title = "F→P オラクルが reproduction_tests 未宣言の fix/feature タスクを静かに免除する — tdd 実proof が存在しても check_oracle が宣言欠落で required:false に短絡（fail-open 疑い）"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "audit",
    "condukt",
    "fail-open",
]
status = "done"
notes = "訂正: 初版の『state が kind を永続化しない』は誤り。decomposition は sidecar(run-ID.decomposition.json)に kind と reproduction_tests を永続化し、check-oracle と set-verified はそれを load して読む。真の機構: oracle.rs の check_oracle は先頭で『!requires_oracle または reproduction_tests.is_none()』なら tdd を呼ぶ前に required:false, fallback:true を返す。観測: run-20260725-001352-87770(untestable) の decomp task は kind=feature だが reproduction_tests=null → required:false。run-20260724-231544-15238(autoflow) は kind=fix かつ reproduction_tests=cargo test -p autoflow → required:true, valid。fail-open の核心: tdd oracle は同 run でも valid_fp_oracle:true を返す(RED/GREEN proof は実在)のに、check_oracle は reproduction_tests 宣言の欠落だけで tdd を参照せず免除する。§3(判定不能・欠落は制限側)に照らすと、kind∈fix/feature で reproduction_tests 未宣言のタスクは、免除ではなく(a)tdd proof の実在を確認して有れば要求充足、無ければ block/ask に倒すのが正。修正案: check_oracle の短絡を、fix/feature かつ reproduction_tests 欠落のとき tdd oracle を実行して has_red&&has_green を確認する経路へ変更(あるいは decomposition validate で fix/feature の reproduction_tests 必須化)。独立 worktree+テストで。関連: 私の untestable-decomp が reproduction_tests を宣言し忘れた運用ミスも併発(interpreter/手書き decomp は fix/feature に必ず reproduction_tests を付ける)。"
