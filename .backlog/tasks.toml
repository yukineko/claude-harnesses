backlog に related サブコマンドを足し、JSON を返す。seed の id、related の配列
（id と判定根拠の signal つき）、undetermined の配列。
読み取り失敗時に**空配列の clean を返さない** — 非0終了と undetermined で返す。

## テストの持ち主（CLAUDE.md 第2節 a）

判定ロジックを書いた主体がそのテストを書かない。利害関係のない Agent に書かせる。
特に「undetermined を related に含めない」アームは、実装が空アームでもコンパイルが
通るので**それ専用の behavioural test が要る**（forwarding arms have zero kill rate と同型）。
"""
