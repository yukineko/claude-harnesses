実測 2026-09-13、測定点 1a5f451a。バッチ4 の実行体が自己申告した逐語: condukt parallel workers are subagents spawned by the /condukt skill, and as a fork I am barred from spawning subagents ... I implemented the four items serially myself ... CONDUKT_MAX_PARALLEL=4 was never meaningfully applied.

**構造**: condukt の並列度は worker = subagent として実装されている。一方 flow がバッチを回すとき、実行体は fork subagent である。subagent は subagent を起こせないので、**condukt の並列実行経路そのものが到達不能になる**。CONDUKT_MAX_PARALLEL を渡しても受理され、エラーも警告も出ず、直列で完走する。

**なぜ p1 か。** ユーザーの常設方針は「どんどん並列で pending 処理したい。worktree つかって merge すればいい」である。その方針を実行したつもりの経路が、黙って直列に縮退している。しかも成果物は正しく landed するので **成功の顔をして返ってくる**。CLAUDE.md 第1節の「沈黙は許容される degrade ではない」に真っ向から該当する — 下流 (この場合は人間) が「並列で回った」と読める出力を、判定を持つ層が返している。

**未測定の部分は未測定と書く**: 同日のバッチ3 (agent aea2dfb8f464e7c9c) は worktree を 2 本作り workers と複数形で報告したので、そちらは実際に subagent を起こせた可能性がある。もしそうなら縮退は fork 固有であって全 subagent 種別に共通ではないことになる。**この差は測っていないので断定しない。** 先に測るべきはここ: 同じバッチを (a) fork, (b) 非 fork の general-purpose agent で起動し、condukt が実際に worker を並列起動したかを worktree 数と各 worker の開始時刻の重なりで観測する。

**完了条件**: 並列で走れない実行体から condukt の並列 run が要求されたとき、**非0 か明示的な警告で「直列に縮退した」と宣言される**ことを観測する。宣言せずに直列完走しないことを対照として同時に観測する (第3節: 判定不能・能力不足は沈黙ではなく制限側の明示へ倒す)。縮退そのものを禁じる必要は無い — 見えれば flow 側が別の実行体を選べる。

関連: 91d319d2 (隔離実行規約)、4b94e371 (並列下の偽の赤)。並列度を上げる方針は、上げたつもりが上がっていない経路と、上げると嘘の赤が出るテストの両方を潰さないと成立しない。"""
