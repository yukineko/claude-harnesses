id = "93341bd5"
title = "budgetguard ledger double-counts a session that crosses local midnight (cumulative session cost recorded under each day key)"
project = "/home/hiroyuki_nakayama/src/harness"
project_unresolved = false
tags = [
    "budgetguard",
    "ledger",
    "p2",
]
touched_files = []
status = "pending"
notes = "Observed 2026-11-06 (JST 10:05) in ~/.budgetguard/state/ledger.json at main fe604377: session 4a9031bf has 24.18 under 2026-11-05 and 49.06 (cumulative) under 2026-11-06; 2 sessions appear on both days. Cause: gate.rs records the session's CUMULATIVE cost via ledger.record(session_id, today, session_usd) under today's key; the pre-midnight part stays in yesterday's entry too. Day boundary itself is LOCAL time (chrono::Local, system TZ Asia/Tokyo => JST midnight), intentional per main.rs today_str comment. Effects: (1) today's day_usd is over-counted (restrictive side); (2) past day totals are inflated and feed derive_limits (Tukey fence), raising derived limits = loosening. Readings: (a) defect; (b) intentional 'attribute whole session to last day'. Distinguish: (b) would not also keep the value in the earlier day; the sum over days exceeds real spend, which no reading justifies. Fix direction: store per-day delta (cumulative minus the session's cost already recorded on earlier days). Repro: cargo test -p harness-core --test ledger_midnight_double_count_20261106 -- --ignored."
