[[task]]
id = "7b6bcfe6"
title = "harness_core の text_similarity は日本語で機能しない — 分かち書きしないため文節が丸ごと1トークンになり、既知の重複ペアが 0.26 (閾値 0.6) にしかならない"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "gate",
    "fail-open",
