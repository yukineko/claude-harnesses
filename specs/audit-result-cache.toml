[spec]
id = "audit-result-cache"
title = "検証済みの内容は、内容が変わるまで再検証しない（監査結果キャッシュ）"
status = "ratified"
provenance_commit = "54ec4cdb3a144400056c505273c5ad765eef651a"
date = "2026-11-01"
canon = []

[spec.ratification]
canon_commit = "54ec4cdb3a144400056c505273c5ad765eef651a"
date = "2026-11-01"
reason = "User approved 2026-11-01: per-file content-hash audit cache; unchanged files are neither read nor re-audited; every undeterminable case re-audits or blocks (fail-open rejected by user ruling)."
fingerprint = "31b0cb7b3f6f0521"

[[requirement]]
id = "R1"
statement = "harness-core（Rust モジュール）と scripts の Python 共有モジュール 1 本が、同じ形式の監査結果台帳を git common dir 配下の audit-ledger ディレクトリに持ち、キー（audit id、ルール指紋、repo 相対パス、内容の git blob oid）で、判定型は Clean のみ、計数型は確定した 0 以上の整数件数のみを記録する。"
acceptance = [
    "Rust 側と Python 側の両方のテストが、共通の golden fixture ファイルを読み書きし、同じキーに同じ値を返す（片方で記録したものをもう片方で lookup すると Known になる）",
    "台帳の置き場所が `git rev-parse --git-common-dir` 配下の audit-ledger であり、linked worktree から記録したエントリを別 worktree から lookup すると Known になる",
    "Violation と Undetermined の結果を record しようとしても台帳は変わらない（その後の lookup は Absent）",
    "計数型に負数や非整数を record しようとすると拒否され、台帳は変わらない",
    "キーの 4 要素のどれか 1 つだけを変えた lookup は Absent になる（パスだけが違う同一内容も Absent。F1）",
]
canon = [
    "要望 R2 / E1 / E2 / D5 / F1",
    "crates/sitecraft/Cargo.toml:21",
    "CLAUDE.md §3（三値で『判定できなかった』を表現可能にする）",
]
falsifiable = true

[[requirement]]
id = "R2"
statement = "台帳の lookup は Known / Absent / Undetermined の三値を返す。台帳が読めない・壊れている・未知の版のときは Undetermined を返し、Absent と Undetermined はどちらも呼び出し側で再監査になる。書き込みは atomic で、60 秒の時間制限付き排他ロック下で行い、時間切れ・取得失敗は block（非 0 終了）になる。"
acceptance = [
    "台帳ファイルに形式の読めない行が 1 行あると、すべてのキーの lookup が Undetermined になり、全ファイルが監査される（監査関数の呼び出し回数で観測する）",
    "未知の版番号を持つ台帳は、すべての lookup が Undetermined になる",
    "台帳ディレクトリが読めない（権限 000）ときの lookup は Undetermined で、ゲートは全件を監査し、exit 0 を『キャッシュから clean』として返さない",
    "書き込み途中（一時ファイルの書き込み後、rename の前）に障害を注入すると、元の台帳がバイト単位で無傷のまま残る",
    "別プロセスが書き込みロックを保持したままのとき、record は 60 秒の時間切れで非 0 終了し、ゲートは block する",
    "Python 側でロック取得に失敗したとき、呼び出し元の pre-commit ゲートが exit 0 にならない",
]
canon = [
    "要望 R0(b) / R2 / D4 / E2 / E3",
    "CLAUDE.md §3（IO 失敗 / ロック取得失敗 / パース不能 … は clean ではない）",
]
falsifiable = true

[[requirement]]
id = "R3"
statement = '照会では、`git diff-files` で作業ツリー＝index と出たファイルについて、ファイルを読まずに index の blob oid を使う。記録では、監査が実際に読んだバイト列から計算した git blob oid（"blob <len>\0" + 内容の SHA-1）を使う。一致しないファイルと判定できないファイルは、キャッシュを引かず記録もせずに毎回監査する。'
acceptance = [
    "台帳にヒットするファイルについては、監査の実行中に open/read が一度も起きない（読み込み関数をスパイして 0 回であることを観測する）",
    "作業ツリーを index と違う内容に変えたファイルは、台帳に旧内容の Clean があっても毎回監査され、記録もされない",
    "`git diff-files` が非 0 終了したら、全ファイルがキャッシュを引かずに監査される",
    "読んでいる最中にファイルの中身を差し替える（読み取りフックで注入する）と、記録される oid は実際に読んだバイト列の oid で、差し替え後の index oid には Clean が付かない",
    "CRLF の作業ツリーと LF の index の組（text=auto）では、2 回続けて実行しても 2 回とも監査される（F2）",
    "tracked な symlink のリンク先の中身を変えると、リンク本体の index oid が変わらなくても次回は監査される",
    "計算した blob oid が、同じバイト列に対する `git hash-object` の出力と一致する",
]
canon = [
    "要望 R3 / D3 / E6 / F2",
    "`git rev-parse --show-object-format` = sha1（この repo で観測）",
]
falsifiable = true

