[[task]]
id = "1601272b"
title = "taintguard 撤去で開いた prompt-injection 防御の穴を記録する — プロジェクト外ファイルの Read の provenance を追跡するものが 0 本になった"
project = "/mnt/c/Users/hiroyuki_nakayama/src/harness"
project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = """
起票理由: 2026-08-24 のユーザー裁定で crates/taintguard をリポジトリから撤去した
(判定が厳しすぎて実害が出たため)。撤去そのものは裁定どおりで正しいが、**撤去された防御を
記録しないと「黙って継承された穴」になる** (CLAUDE.md 第4節) ので、覆われなくなった面を
ここに固定する。この項目は「taintguard を戻す」ことを求めるものではない。

実測 (2026-08-24、session-24b59ce3 の worktree、撤去後のツリー):

1. provenance シグナルが 0 本。プロジェクト外パスの `Read` を「外部由来」として印を付ける
   経路は撤去後どこにも無い。旧 taintguard の PreToolUse `gate` が turn 内の write-class
   ツールを降格していた挙動も、移設先が無いまま消えた。
2. fetchguard は代替ではない。hooks.json の matcher は `WebFetch|WebSearch` のみで
   (crates/fetchguard/hooks/hooks.json)、`Read` は元から対象外。0.1.1 までの
   docstring は「external-file Read is deferred to taintguard's provenance gate」と
   *他所が見ている* と書いていた — 撤去でその宛先が消えたので、0.1.2 で
   `gate.rs` の fail-closed contract と `WEB_TOOLS` の docstring、README.ja.md、
   `scan`/`main` のモジュール doc を「どこも見ていない」へ訂正済み。
3. **強制の半分も無い。** fetchguard がやるのは `additionalContext` の警告注入だけで、
   どのツールも降格・拒否しない (PostToolUse なのでモデルは既に生バイトを読んでいる)。
   つまり web 経路も「検出して警告」までで、止める部品は無い。
4. commit-time の scripts/check-prompt-injection.py は committed prompt asset を
   見るゲートであり、runtime に流れ込むテキストは対象外 (それ自身の docstring が
   そう書いている)。

したがって現状の防御は「web 出力の内容警告 1 本」だけで、(i) 外部ファイル読み取りの
provenance、(ii) 読んだ後の write-class 降格、の 2 つが空である。

次の一手の候補 (どれも未着手・どれを採るかは人間裁定):
 - fetchguard の matcher を `Read` へ広げる。ただし path-trust 判定 (プロジェクト内外の
   分類) が必要で、この crate はそれを持たない。旧 taintguard::classify が持っていた
   「cwd 配下 / 同一 repo の worktree のみ Trusted」がその判定だった。
 - provenance ゲートを別 crate で建て直す。**その場合、撤去理由を先に解く必要がある** —
   旧実装は cwd/worktree 以外を一律 external とみなしたため、%TEMP% の scratchpad を
   1 度 Read した時点で turn 全体が tainted になり、以降の Write/Edit/Bash が deny された
   (backlog 96075670 がその実例)。同じ設計で建て直せば同じ害が出る。
 - 「穴のまま置く」も裁定としてあり得る。その場合はこの項目を「受容したリスク」として
   close すること — 黙って放置と、明示的に受容したのを区別するため。

--- 追記 (2026-08-24, 別セッションの重複 d3721c8a から移設) ---
同じ穴を 2 つの agent が独立に起票したため d3721c8a を重複として close し、
そちらにしか無かった論点をここへ移す。

**進行中の後継設計 (backlog 9e0e3881: blastguard へ承認の記憶 TOFU を足す作業) は
この穴を埋めない。** 軸が直交しているためである:
  - 本 item の軸 = その turn が untrusted な出自の内容を消費したか (provenance)
  - 9e0e3881 の軸 = その操作の効果がどこに着地するか (blast radius)
blastguard は untrusted な内容を読んだかどうかを一切知らないので、9e0e3881 が
landed してもこの item は閉じない。**「新しいゲートを入れたから被覆済み」という
読み方をしないこと** — それは第4節が禁じる、答えが合っていて理由が嘘の形である。

補足の実測 (測定点 0521d013): fetchguard の hooks.json の matcher は PostToolUse の
WebFetch|WebSearch のみで、出力は additionalContext = block しない。よって Web 取得系は
所有者ゼロではなく enforcement から advisory へ降格した、というのが正確な言い方である
(外部ファイル Read の側は所有者ゼロで正しい)。
"""
created_at = 1787536534
updated_at = 1787542488
