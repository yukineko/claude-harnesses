# mutategate — internal mutation-testing kill-rate gate.
#
# NOT a distributed Claude Code plugin: it carries no `.claude-plugin/plugin.json`
# (per CONTRIBUTING.md, internal tooling that isn't shipped needs only Cargo.toml).
# It parses `cargo-mutants` JSON output and fails (exit 1) when the measured
# kill-rate of the existing tests falls below a threshold.
[package]
rust-version.workspace = true
name = "mutategate"
version = "0.1.7"
edition = "2021"
description = "Mutation-testing kill-rate gate: parses cargo-mutants outcomes.json, computes the kill-rate (caught / viable) of the existing tests, and exits non-zero when it drops below a threshold. Measures the fault-detection power that golden/regression tests alone cannot."
license = "MIT"
publish = false

[[bin]]
name = "mutategate"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }

[dev-dependencies]
# The violation-write tests point $HOME at a throwaway path (one of them at a
# FILE, so the store's create_dir_all provably cannot succeed) rather than at the
# developer's real home.
tempfile = { workspace = true }

# ワークスペースの [workspace.lints.clippy] を継承する（unwrap_used / expect_used = deny）。
# 判定を持つ crate では panic は判定不能そのものなので、production 側に unwrap / expect を
# 書けなくする。テスト側は各 crate root / 各 integration test の
# `#![cfg_attr(test, allow(...))]` で除外している（意図的な assert であって fail-open ではない）。
[lints]
workspace = true
