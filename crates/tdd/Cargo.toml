[package]
name = "tdd"
version = "0.1.60"
edition = "2021"
rust-version.workspace = true
description = "Test-first gate for Claude Code: on Stop it blocks when implementation lines were added with no test visible in the uncommitted changes, and red/green/verify subcommands record RED before GREEN."
license = "MIT"

[[bin]]
name = "tdd"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
globset = "0.4"
regex = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
harness-core = { path = "../harness-core", features = ["fault-injection"] }

[lints]
workspace = true
