## 出所

12f77905 で (A/B)(C) を修正した後、独立した検証 agent が**修正後のコード**に対して
掃き出した残り。いずれも「stale にも problems にも入らない」= 判定不能が clean に
写る形 (CLAUDE.md 3.)。再現スクリプトは scratchpad の probe_residual.py /
probe_dangling_root.py。**未修正のまま**起票する。

## 1. cache root 自体が壊れたリンクだと丸ごと clean、exit 0

`os.listdir()` が `FileNotFoundError` を投げ、`scan()` の
`except FileNotFoundError: return [], []` に落ちる。これは「キャッシュが無い」
という確定した観測のための経路であり、12f77905 でその旨を明記した — が、**root が
dangling symlink の場合も同じ穴に落ちる**。実測: `lexists(root)=True`
`isdir(root)=False` で `exit=0`、stdout `0 stale dir(s) removed`、stderr 空。
このモジュールが対処している事故 (condukt/0.4.2) と**同じ形が root 段にある**。
再現: `os.symlink(tmp+"/nowhere", cache); prune-plugin-cache.py --cache <cache>`。
EACCES 版は正しく problems に落ちるので、穴は ENOENT の弁別だけ。

→ 対処案: `os.path.lexists(cache_root)` が真なのに listdir が ENOENT なら、それは
「キャッシュが無い」ではなく「root が壊れている」なので problems へ。

## 2. 認識できない `.in_use` マーカー名が黙って無視され、dir が removable になる

`_PID_RE` が非数値名を skip する。docstring は `.tmp.<hex>` の残骸だけを skip する
と書いているのに、実際は**任意の非数値名**を落とす。実測: `pid-12345` という
マーカー 1 個だけを置くと `stale=1 problems=0 removable=[True]` — 「この holder
記録は読めない」が「誰も持っていない」に写っている。docstring と実挙動の食い違い
でもあるので CLAUDE.md 4. にも触れる。

## 3. `source_versions()` が読めない crate を黙って落とす

`crates/alpha` を chmod 000 → `versions={} problems=[]`。plugin.json が dangling
symlink → 同じく `versions={} problems=[]`。どちらも `if not os.path.isfile(pj):
continue` を通る。`check-plugin-rollout.py:1041` はこの map を直接消費するので、
「読めなかった crate」が「plugin ではない crate」と区別できない。scan 側の
「cached but no current version known」で*間接的に*だけ声が出るが、それはその
plugin がたまたま cache dir を持っている場合に限られる。

## 4. version dir でない**ディレクトリ**が rmtree に渡る

`<cache>/alpha/node_modules/` → `stale=['node_modules'] removable=[True]`。
silent drop ではない (stale には入る) が、素性の分からない状態に対して
不可逆な操作を取っている。plain file 側は「報告して残す」規則を守っているのに、
型が 1 つ違うだけで逆になる。

## 共通の注意

3. と 4. は「削除する側」ではなく「判定できない側」に倒すのが規範どおり。ただし
4. を problems 側へ倒すと、既存の運用で node_modules 等が紛れ込んでいた場合に
prune が恒常的に exit 1 になる可能性があるので、実際の cache を測ってから決める。"""
