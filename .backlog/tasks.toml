notes = "crates/condukt/src/claim.rs, fn run_task_progress_signal (around line 322). It computes rs.tasks.iter().filter_map(t.updated_at).max().unwrap_or(0) and wraps the result in Determination::Known. When the run state loads cleanly but NO task carries an updated_at (legacy run states, or a run whose tasks were never transitioned), the unwrap_or(0) mints a Known frozen value of zero. That is an ABSENCE being written as an OBSERVATION: nothing was observed to be frozen, yet the signal contributes a stable byte string to the fingerprint and therefore helps the verdict reach Known(Stalled), which is the ONLY verdict that fires the reap in retain_claim. Per CLAUDE.md section 3 the empty case is cannot-determine and must resolve to Determination::undetermined, exactly as the adjacent Err arm already does for an unloadable run state. Same function family as the run-scoped head-signal defect being fixed under task t1-claim-scope, but a DIFFERENT arm and not in that task scope. Suggested pin: a run state that loads fine but whose tasks all have updated_at None must yield Undetermined from claim_progress and must keep a heartbeat-stale claim in retain_claim. Noticed by the t1-claim-scope test-writer while reading the signal readers; not verified by an executed test yet."
