name: gate-crates-sync

# Consistency gate for the GATE_CRATES set (the fleet defense gates that require
# a canary rollout). The set is hardcoded in SEVEN places — rollout-plugins.sh
# (canonical), .githooks/pre-push's GATE_PATTERN, continuous-audit.sh's
# DEFAULT_TARGETS, check-plugin-rollout.py's GATE_CRATES tuple, condukt's
# adversarial.rs and tdd's config.rs Rust constants, and the continuous-audit
# SKILL.md — and scripts/check-gate-crates-sync.py verifies each satisfies its
# required relation (exact / superset / mirror). Until this workflow existed that
# checker had no automated trigger, so drift between the sources was only caught
# by running it by hand; the incident that motivated the checker is written up in
# docs/fix-gate-crates-drift.md.
# Runs unconditionally (no paths filter): a crate can join or leave the gate set
# via any of the seven files, and a stale pre-push GATE_PATTERN silently drops the
# canary advisory for a gate crate. Self-contained stdlib Python — no third-party action.
#
# This job also carries scripts/test_check_plugin_rollout.py. That checker is
# machine-local at RUN time (it reads ~/.claude state, which no runner has), but
# its unit tests are hermetic fixtures and had no workflow invoking them at all,
# so 20+ tests never ran in CI while every sibling checker's tests did.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-crates-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PyYAML
        # check-ci-red reads workflow trigger declarations to tell a
        # dispatch-only workflow (never expected to run on main) from a rotting
        # one. Without PyYAML it cannot read ANY of them, so every workflow goes
        # undetermined — correct behaviour, but useless. The runner image has no
        # PyYAML, so install it rather than let the feature sit dead here.
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Unit-test the GATE_CRATES sync checker
        run: python3 scripts/test_check_gate_crates_sync.py
      - name: Unit-test the plugin-rollout checker
        # The checker itself cannot run here (no ~/.claude on a runner); its
        # tests are hermetic and are the only CI coverage it gets.
        run: python3 scripts/test_check_plugin_rollout.py
      - name: Unit-test the chronically-red-CI checker
        # Same shape: check-ci-red.py is a pre-push check (it needs an
        # authenticated gh, and asking about CI from inside CI is circular), but
        # its tests stub the gh boundary and are fully hermetic.
        run: python3 scripts/test_check_ci_red.py
      - name: Unit-test the pre-push hook's chronically-red-CI blocking contract
        # The hook itself is machine-local (it is only ever invoked by git on a
        # developer's clone that opted in via core.hooksPath), but this suite
        # drives it as a subprocess in a throwaway repo with stubbed checkers,
        # so it is fully hermetic. Advisory here by design: per CLAUDE.md
        # section 7 the enforcing copy of this contract is the hook on the
        # developer's machine, not a required status check on GitHub.
        run: python3 scripts/test_prepush_hook.py
      - name: Verify GATE_CRATES consistent across its 7 sources
        run: python3 scripts/check-gate-crates-sync.py
