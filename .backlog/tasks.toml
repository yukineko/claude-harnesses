実測 2026-08-14。notes の本文が - で始まると (例: 区切り線として --- CLOSED AS DUPLICATE ...)、
clap が「unexpected argument」として拒否し exit 2 で終わる。値としては渡っていない。

**危険なのは拒否そのものではなく、その組み合わせである**:
1. edit --notes は notes を追記ではなく **置換**する (73fb8e81)。したがって呼び出し側は必ず
   read-modify-write を組む。
2. その書き込みが失敗しても、読み戻した notes には**元の本文がそのまま残っている**。
3. よって「前の本文が生き残っているか」という素直な assert は**書き込み失敗時にも通る**。

本日これを踏んだ: 重複 close のスクリプトが 5 件の close marker を書けていないのに、
assert が通り 5 件とも done に落ちた (marker 不在に後から気づいて再実行し修復済み)。
これは CLAUDE.md 第2節の「何も検証していないテストは常に通る」の実例である。

対処の候補は 2 つあり、片方だけでは足りない:
(a) clap 側で allow_hyphen_values を付ける (または --notes-file / stdin 経由の入口を用意する)。
(b) それとは別に、**書き込みが実際に着地したことを検証できる出口**を用意する
    (edit が変更後の notes を stdout に返す、あるいは --verify で読み戻す)。
現状は呼び出し側が「置換したはずの文字列が読み戻せるか」を自前で assert するしかなく、
その assert は上記のとおり失敗を検出できない形に書きやすい。

