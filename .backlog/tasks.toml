必要がある = guard-maintree-bash.py / guard-maintree-edit.py / blastguard / taintguard の変更を要する。

**状態の置き場（第5節に違反しないこと）**: ホーム配下の gate 別 state に session_id で keying する
（taintguard が crates/taintguard/src/state.rs:93,161-168 で既に採っている形）。
プロジェクトルートのファイルは**絶対に使わない** — 一度きり消費の共有 skip と同じ失敗になる。
記録: ts / session_id / denier / effect_verb / target_abs / raw_command / reason。

**同一効果の比較子（種類の違う2信号を意図的に併用）**:
1. 予防（安価・綴り非依存・リゾルバ非依存）— リテラル対象の包含判定。deny された target_abs が
   新しい呼び出しの tool_input のシリアライズ中に部分文字列として現れるか。同一 session_id、
   N 呼び出し / T 分以内、かつ対象が依然 main ツリー配下であること。
   これは実測で確認された interpreter ミラー（python3 -c / sh -c / eval / awk / node -e / ed /
   curl -o / tar -C）を**すべて**捕らえる。絶対パスのリテラルがラッパを貫通して残るため。
   捕らえないもの（残余として明示すること）: 断片から再構成したパス、HOME や PWD 経由のパス。
2. 健全な検出（綴り非依存・回避不能だが事後）— deny 時に git status --porcelain -z と対象の
   mtime/size をスナップショットし、PostToolUse と Stop で再比較する。deny されたパスが dirty に
