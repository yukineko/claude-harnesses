[[task]]
id = "e9262d91"
title = "condukt lock の待機ループが poll ごとに kill サブプロセスを spawn し、負荷下で自分の獲得を遅らせる"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = "測定点 c39701bc / 2026-09-13、読み取りのみ。crates/condukt/src/lock.rs:267 acquire_at の待機ループは AlreadyExists のたびに read_info してから pid_alive を呼ぶ。pid_alive は lock.rs:138 付近で std::process::Command::new(kill) に -0 pid を渡して harness_core::boundary::run で実行する。つまりロック待ちの 1 回のポーリングごとに fork+exec が 1 回走る。ポーリング間隔は 10 ミリ秒なので、待機スレッドは 1 秒あたり最大 100 回のプロセス生成を行う。DEADLINE は 10 秒なので 1 回の獲得試行で最大 1000 プロセス。crates/condukt/src/lock.rs:484 の repo_primary_lock_serializes_concurrent_rmw_no_lost_update は 6 スレッド 8 イテレーションで同じロックを奪い合うので、5 スレッドが同時に待機して spawn し続ける構造になる。CPU 飽和時にはこの spawn 自体が遅くなり、待機がさらに長引いて自己増幅する。加えて獲得は FIFO ではなく hard_link に勝った者勝ちなので、負荷下でスレッドが繰り返し負ける飢餓がありうる。Linux では /proc の exists() で先に返るので spawn は回避されるが、macOS では常に spawn する。影響は fail-open ではない (獲得できなければ Err に倒れる、正しい側) が、liveness の問題であり負荷下で condukt の merge やコミットが理由なく拒否されうる。改善案: 保持者の pid が自分自身のときは spawn せずに Known(true) を返す、あるいは liveness 確認を毎ポーリングではなく数回に 1 回に落とす。関連 35d61d23。 【救出 2026-09-29】元 id 680d541a（2026-09-13 に run-20260913-223004-15261 の orch worktree で起票されたが未コミットのまま残っていた。worktree 削除前に再起票。notes 中の関連 id は元 id のまま）"
