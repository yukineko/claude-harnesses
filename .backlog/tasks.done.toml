【原因 — 読解で特定、agent に検証させる】
チケットの仮説 (BEHAVIORAL_MARKERS の語彙不足) は寄与因子として正しいが、
主因ではない。主因は 2 つ:

1. verify.rs:1144 の mechanical_cmd は captures_iter のループ内で
