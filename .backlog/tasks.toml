   (--all の全出力に path_shadow.rs のヒットが 1 件も無い)。

原因 (推測ではなく行数で決まる):
  path_shadow.rs:100 が std::fs::read_dir(dir)、:107 が .unwrap_or_default()。距離は 7 行。
  scripts/check-fail-open.py:346-349 は
    lo = max(0, idx - READDIR_WINDOW)
    if any(RS_IO_CALL.search(code[j]) for j in range(lo, idx + 1))
  で、READDIR_WINDOW は :111 で 6。idx は 0 起点なので unwrap の idx=106、lo=100、
