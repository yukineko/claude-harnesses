notes = "harness-core の crate-wide test_env::lock は std Mutex なので再入すると panic ではなく deadlock する。症状は「名前のある失敗」ではなく「テストバイナリが終わらない」なので、CI では stuck / unrelated と読まれる。現状の防止策は lib.rs の doc comment の 1 文だけで、CLAUDE.md 第6節が禁じる「気をつける」に置いた対策そのもの。案: thread_local の保持フラグを立て、同一スレッドからの 2 回目の lock() で assert! を落として deadlock を named panic に変える。実装本体より、事前に RED を観測する方法（fix 前は当該テストが hang する＝通常の RED として観測できない）を先に決める必要がある。"
