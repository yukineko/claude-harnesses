## 何が起きているか (観測できた範囲)

テストは e2e.rs:167-184 で backlog add --title ZZTASK --project <canonical temp dir>
--priority p1 を成功させ (assert が通っている)、続いて e2e.rs:186-193 で
flow propose を cwd=<同じ canonical temp dir> / HOME=<temp> で実行する。

  - flow propose は exit 0 で成功している (e2e.rs:193 の assert が通っている)
  - しかし stdout が空文字列である

つまり pending が 1 件ある状態で propose が「何も無い」として沈黙している。

実環境 (このリポジトリ) では propose は正しく動く。逐語:

  [flow] バックログに 9 件の pending タスクがあります (最優先: '...')。

したがって出力フォーマット ('N 件') は一致しており、テストのアサーション文字列が
古いわけではない。差分は「テスト環境で propose が 0 件と判断している」点だけである。

## なぜ重大か

propose の沈黙は仕様上「open work が無い」を意味する (実環境の出力に逐語で
「断られた場合、または open work が無い場合は /flow を再提案しない」とある)。
したがって「件数を確定できなかった」と「作業が無い」が同じ出力 (空) に写っている。
これは CLAUDE.md 第3節が禁じる collapse であり、第1節の carve-out
(3b1eb24: statusline の空表示が「余裕あり」と読まれた fail-open) と同じ形である。
テスト環境でしか再現していないとしても、テストはまさにその collapse を検出するために
書かれており、いま検出している。

## 未検証の仮説 (UNVERIFIED — 事実として扱わないこと)

同日に起票した b0ff8c74 (backlog のプロジェクトキーが git show-toplevel 由来なので
worktree/非 git ディレクトリで分裂する) と根本原因を共有する可能性がある。
temp project dir は git リポジトリではないので resolve_repo_root
(crates/harness-core/src/discovery.rs:44-53) は git_toplevel を取れず
cwd.canonicalize() のフォールバックに落ちる。書き込み側 (backlog add --project) と
読み取り側 (flow propose の cwd 由来キー) でこのフォールバックの結果が一致しない
経路があれば説明がつく。

ただし **これは追跡していない。経路を辿っていないので棄却も採用もできない。**
第6節「反証にも同じ立証責任を課す」に従い UNVERIFIED と明記する。

## 見分ける方法

1. テストの temp HOME を残して ~/.backlog/tasks.toml を直接読み、
   保存された project の値と、flow propose が絞り込みに使ったキーを比較する。
2. flow propose にキー導出のデバッグ出力を一時的に入れて両者を並べる。
3. crates/flow/src/main.rs:75 の std::env::current_dir().ok()? が None になる経路
   (? で早期 return して沈黙する) がテスト環境で成立していないかを確認する
   — 成立していれば「cwd が取れない = 判定不能」を沈黙に写している fail-open であり、
   b0ff8c74 とは別の独立した欠陥になる。

## 本セッションでの扱い

本セッションのスコープ (harness 拡張 T1-T4) 外なので原因追跡はしていない。
ベースラインが赤いという事実だけを記録する。この赤は T1-T4 の変更以前から存在し、
T1-T4 の検証時に「自分が壊した」と誤認しないための基準線として必要である。"""
