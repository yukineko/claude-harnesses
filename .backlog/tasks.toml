先に否定した読み（記録として残す）: 「task_claims に heartbeat 経路が無いのでは」と疑ったが、crates/condukt/src/claim.rs:950 が
    for c in reg.files.values_mut().chain(reg.task_claims.values_mut())
と files と task_claims の両方を回しているので、heartbeat 経路の欠落ではない。この読みは REFUTED。

残る 2 つの読み:
(a) 実在の欠陥 — dispatch 時の condukt state claim-task が実際には登録に失敗していた（あるいは別の run_id で登録された）。exit code は fail-soft で握り潰される設計なので、登録できなくてもループは進む。その場合 registry には最初から入っていない。
(b) 登録はされたが TTL で reap された — heartbeat が run_id 一致で絞るため、claim 時と heartbeat 時で run_id が食い違っていれば refresh されずに期限切れになる。

見分ける方法: hashkey は backlog task.rs:208 の hashkey(title, project) で決定論的に再計算できる。同じ title/project で claim-task を打ち直し、直後に condukt state claims を見る。(i) 登録が現れれば (b)（元の登録が reap されたか run_id 不一致）、(ii) 登録が現れないのに exit 0 が返るなら (a)（fail-soft が登録失敗を隠している）。

影響: 現在の多重着手ガードは backlog 側の status=claimed だけに縮退している。registry 側が空なので condukt state is-claimed は exit 1 を返し、「誰も持っていない」と読める。並行セッションが 4 本走っている状況では、この 2 層のうち 1 層が黙って落ちていることになる。"""
