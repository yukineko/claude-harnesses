[[task]]
id = "95deaa32"
title = "donegate judges a root only an in-flight background subagent wrote on the PARENT's Stop (lint races inference); no SubagentStop hook"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "donegate",
