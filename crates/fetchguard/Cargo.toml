[package]
name = "fetchguard"
version = "0.1.7"
edition = "2021"
rust-version.workspace = true
description = "PostToolUse hook that scans WebFetch and WebSearch results for planted prompt-injection phrasing and warns the model that the flagged span is untrusted data."
license = "MIT"

[[bin]]
name = "fetchguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# ワークスペースの [workspace.lints.clippy] を継承する（unwrap_used / expect_used /
# panic = deny）。fetchguard は judgment を持つ gate（PostToolUse で untrusted-content
# 警告を emit する）なので、production 側で panic が判定不能の別名になってはならない
# （blastguard/propguard 等と同じ理由）。テスト側は各ファイルの
# `#![cfg_attr(test, allow(...))]` で除外する。
[lints]
workspace = true
