title = "CLAUDE.md:361 が fmt/clippy の強制点を CI と書いているが §7 で CI は全面禁止され、実際の強制点は donegate.toml (Stop 時) である"
project = "/mnt/c/Users/hiroyuki_nakayama/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-18, 測定点 01deeab2。

CLAUDE.md:361 の逐語: 「CI ゲートは **fmt + clippy を強制**する。コミット前に cargo fmt と cargo clippy -p <crate> --all-targets を green にする。」

しかし CLAUDE.md 第7節は「GitHub Actions のようなゴミサービスは二度と使用しない」として CI を全面禁止しており、gh run list/view/watch の実行も禁じている。したがって「CI ゲートが強制する」は、そのゲートを二度と観測しない前提と両立しない。

測定した実際の強制点:
  grep -n fmt   .githooks/pre-commit  -> ヒット無し
  grep -n fmt   .githooks/pre-push    -> ヒット無し
  grep -n clippy .githooks/pre-commit .githooks/pre-push -> ヒット無し
  donegate.toml:29-30  name = "fmt"    cmd = cargo fmt --all -- --check
  donegate.toml:35-36  name = "clippy" cmd = cargo clippy --workspace --all-targets -- -D warnings

つまり fmt/clippy は機械強制されている。強制点は donegate (Stop ゲート) であって CI ではない。
CLAUDE.md:299 は既に「donegate の required check は workspace 全体 (cargo fmt --all / cargo clippy --workspace) を見る」と正しく書いているので、:361 だけが古い。

実害 (このセッションで観測): テスト著者エージェントが :361 を読んで「fmt は pre-commit に入っていないので強制されていない」と結論しかけた。commit f7b6d149 は fmt 差分を含んだまま全 pre-commit ゲートを通過している (強制点が commit 時ではなく Stop 時なので正常)。読み手が強制点を CI だと思い込むと、CI を見ない規範と組み合わさって「誰も見ていない」と誤読される。

第4節「docstring / コメントで実挙動と違う話を書くな。散文が実装と食い違ったら次のレビュアーを騙す仕掛けになる」に該当する。

付随する構造的な注意点 (別課題になりうる): donegate は Stop 時にセッションの cwd に対して走るので、worktree で実装した変更は「その worktree で donegate が走らない限り」fmt/clippy を見られない。第8節が全作業を worktree で義務づけているため、fmt/clippy の強制と worktree 分離の間に帰属のギャップがある。CLAUDE.md 第8節の実測記録にある「自分が触っていない crate の赤が自分の停止をブロックした」の裏返しの現象である。

修正候補: :361 を「fmt + clippy は donegate (Stop ゲート) が強制する」に書き換える。CI への言及を残すなら第7節との関係を明示する。"""
