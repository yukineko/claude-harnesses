[[task]]
id = "8fe62654"
title = "overwatch audit-round ledger has no integrity check: a boundary truncation reads as a shorter history"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "fail-open",
    "p2",
]
touched_files = []
status = "pending"
notes = """
Found by the verdict-monotonicity property added in overwatch 0.2.16 (backlog a7d41587).

Truncating audit_rounds.jsonl at a RECORD BOUNDARY leaves a valid, self-consistent ledger of fewer rounds. Content-level parsing cannot distinguish that from a genuinely shorter history, so the convergence verdict computed over it can be strictly better than the true one. This is evidence SUBSTITUTION, not blinding, and is out of reach of the tri-state parse fix that closed the other three arms.

Demonstrated and PINNED, not silent: crates/overwatch/tests/verdict_monotonicity.rs has known_gap_a_boundary_truncation_still_reads_as_a_shorter_history, which asserts the gap so closing it trips the test. The property carves these cases out via a STRUCTURAL byte-prefix check (a prefix ending on a newline), deliberately not "did it still parse" — the latter would let a silently-skipping parser excuse itself, which is mutation-tested.

Closing it needs out-of-band integrity state, since a tail-truncated append-only file is undetectable from its own contents: a recorded round count beside the ledger, or a per-record chain. THE TRADE IS THE DECISION: either choice makes every pre-existing ledger unverifiable until its next append, so a legacy ledger with no count/chain would have to read as Undetermined (fail-closed, per CLAUDE.md sec 3) and audit-metrics would start erroring for existing users. That is a design call for a human, which is why this is filed rather than decided.

When done: delete the known-gap test and drop the is_clean_prefix carve-out in the property."""
