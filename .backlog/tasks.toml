notes = '実測 2026-09-13、測定点 984619c8。flow の sink 中に 2 回踏んだ。/ 1 件目 (逐語): "python3 is invoked with an inline-eval flag, and it writes .backlog/tasks.toml (,(w)) — it is tracked by git but carries uncommitted changes — those changes exist nowhere else"。実際のコマンドは tasks.toml を tomllib で READ し、書き込み先は scratchpad 配下の別ファイルだった。inline eval の中では open の第1引数と mode が構文的に結びつかないため、blastguard は「どこかに w がある」ことと「tracked file 名が出現する」ことを結合して最も危険な解釈を採った。/ 2 件目 (逐語): "(> $S/getnotes.py) destroys the file(s) current contents and $S/getnotes.py contains a shell expansion, so blastguard cannot tell which file this names, let alone whether its contents are recoverable"。/ **これは fail-open ではなく fail-closed 側の誤検知であり、その意味で設計どおりに動いている** (model.rs:9 の it is NOT a verdict about the command, it is a refusal そのもの)。したがって「緩めろ」という起票ではない。判定不能を Ask に倒す第3節の実装として正しい。/ 問題は精度ではなく**回避策の形**である。ユーザー側の自然な対処は (a) 変数をやめて literal path を書く、(b) inline eval をやめてスクリプトファイルにする、の 2 つで、どちらも blastguard から見た曖昧さを消すだけで危険度は 1 ミリも下がらない。つまり現状の Ask は「安全になるまで待て」ではなく「blastguard に読める書き方に直せ」という要求になっており、繰り返すうちに「とりあえず literal に書き直して通す」という**反射**を育てる。その反射は、本当に危険なコマンドを literal に書き直しただけで通してしまう瞬間に牙を剥く。/ 完了条件: inline eval 内の open(path, mode) について、mode が書き込みで path が literal なときは**その path** に帰属させ、同じコマンド内で READ しているだけの tracked file に帰属させないことを観測する。path が非 literal (変数・式) のときは従来どおり Ask のままであることも同時に観測する (安全側を緩めない対照)。'
