status = "done"
notes = """
2026-08-12 実測 (commit 74e3a879 / ee2d4d03)。実 repo で reconcile を回すと state_scan は readable で namespaces=2417 runs=150 だが running_tasks=0 で、結果 55 entries 中 47 が removable=true になった。occupancy の Dead は「完全に読めた走査で claim している running task が無かった」という意味しか持たないので、condukt が作っていない worktree —— CLAUDE.md 8 に従って /flow などが作る .harness-worktrees/session-* や、手で git worktree add したもの —— は生きていても常に dead に落ちる。今日実害が無いのは cleanup --remove が role==Unregistered しか消さず、これら 47 は全て registered だからであり、removable フラグ自体は誤った許可を出している。将来 registered も消す消費者が付いた瞬間に生きたセッションの worktree が消える。案: claim されていない worktree については condukt run state を「情報なし」として扱い、worktree 自身の活動 signal (worktree-activity は実装済み) や session transcript を独立の witness にして、claim 無し = Dead ではなく Undetermined に倒す。ただし現在の anti-vacuity control (dead_clean_worktree_is_removable) がこの設計を固定しているので、設計判断として人間に上げる。 統合者による独立確認 (2026-08-12、測定点 6fc4fdee、linked worktree を vantage にして deploy 済みではなくビルド直後のバイナリで実行): entries 56 件、うち primary 1 件 (/Users/yuki/src/harness、removable=false — ee2d4d03 の修正は効いている)、registered 55 件、removable=true が 49 件、そして occupancy は 56 件すべてが dead だった。決定的な観測: この統合作業をしていた worktree 自身 (run-20260811-230435-19389-t2-condukt-reconcile) が occupancy=dead / removable=true と 報告された。私はその中に立ってビルドとテストを回している最中だった。同時に、いま使っているセッション worktree (session-b57a58c3) も occupancy=dead であり、removable=false になっているのは dirty だったからにすぎない。つまり Dead は「生きていない」の証拠ではなく「condukt の RUNNING task が claim していない」以上のことを言えていない。これは判定不能を permissive へ写した (型の規律は正しい) のではなく、証拠が支えない known 値を主張している問題である。

--- 設計判断 (ユーザー裁定 2026-08-12) ---
採用: claim 無しを Undetermined に倒す。condukt run state が claim していない
worktree については run state を「情報なし」として扱い、worktree 自身の活動
signal (worktree-activity は実装済み) や session transcript を独立の witness に
する。どの witness も得られなければ occupancy は Undetermined とし、削除しない。
根拠: GC では判定不能は「消さない」が制限側であり (削除だけが不可逆)、CLAUDE.md 3
の方向と一致する。代償として auto-removable は減る (回収は手動か追加 witness 待ち)。
着手時の注意: 既存の anti-vacuity control dead_clean_worktree_is_removable が
現行セマンティクスを仕様として固定しているので、これを書き換える必要がある。
書き換えるときは「何を証明しないテストになったか」を先に問うこと。

--- 追記 (2026-08-14, 測定点 f7456175): worker は BLOCKED で停止した ---

RED テストのみ commit 済み (375587a2、実装なし)。escalation esc-bc08e8bd に
3 択で記録済み。2026-08-12 の ruling は unclaimed worktree の liveness を定めたが
**death には沈黙**しており、厳格解釈では Occupancy::Dead が reconcile から
到達不能になる。その結果 --preserve が no-op になり content-rescue が dead code 化し、
現在 green な dirty_worktree_is_preserved_before_it_becomes_removable と
stale_preserved_ref_does_not_authorize_deletion が通せなくなる。
この 2 本を retarget するのは「通すためにテストを緩める」と区別できないので触っていない。
claim を解放して pending に戻す (人間の裁定待ちを claimed のまま握らない)。

--- 裁定 (ユーザー, 2026-08-14): worktree DEATH の積極的判定基準が決まった ---

**Dead ⇐ 活動の停滞 ∧ progress window の経過 ∧ transcript 証拠なし** (3点の連言)。

esc-bc08e8bd の 3 択のうち第 1 案が選ばれた。したがって:

  * `Occupancy::Dead` は reconcile から**到達可能なまま**である。
  * `--preserve` は no-op にならず、content-rescue の安全網も dead code にならない。
  * 現在 green な 2 本 — dirty_worktree_is_preserved_before_it_becomes_removable と
    stale_preserved_ref_does_not_authorize_deletion — は**そのまま通り続ける**。
    retarget も削除もしない (これが「通すためにテストを緩める」との区別だった)。
  * 実装には **progress window を注入可能にする**改修が要る (テストが実時間の経過を
    待たずに死を再現できるようにするため)。これが本裁定の唯一の追加コスト。

**未解決として残るもの**: 375587a2 の RED テストは「claim なし worktree は
undetermined」を固定しており、本裁定と矛盾しないかを**実装前に読み直す必要がある**。
裁定は liveness 側 (2026-08-12) と death 側 (本裁定) の両方を確定させたので、
RED の期待値がどちらの側を pin しているかで書き直しの要否が変わる。
これは判断ではなく観測で決めること (テストを読んでから)。

また t3 側との結合: resume_verdict の `resumable` アームは Known(Occupancy::Dead) を
要求する。本裁定で Dead が到達可能なままなので、tripwire だった
interrupted_failed_task_worktree_is_resumable は**生きたまま**である
(worker が警告していた「production で到達不能になる」懸念は本裁定で解消した)。

--- 読み直し結果 (2026-08-14): 375587a2 の RED テストは裁定と矛盾しない ---

裁定が「実装前に読み直す必要がある」と残した宿題を実施した。**判断ではなく観測**である
(`git show 375587a2 -- crates/condukt/tests/worktree_reconcile.rs` の追加行を逐語で読んだ)。

**結論: retarget は不要。3 本とも裁定 (停滞 ∧ 窓経過 ∧ transcript 不在 = Dead) と整合する。**

  * `unclaimed_clean_worktree_with_no_witness_is_not_removable` — state root は readable かつ
    runs=0、worktree は fixture 内で新規作成。**初回プローブなのでアンカーが無く**、活動の
    「停滞」を確立できず window も経過していない。したがって裁定下でも Undetermined。整合。
  * `unclaimed_worktree_occupancy_is_undetermined_not_dead` — 単発プローブ。同上。整合。
  * `unclaimed_worktree_with_advancing_activity_is_live` — 2 プローブ目で worktree 内に
    ファイルが増え活動が前進して Live。裁定の第1分岐そのもの。整合。

3 本はいずれも **undetermined 側と live 側**を pin しており、「Dead は到達不能」を
pin しているものは 1 本も無い。裁定が追加する第3の経路 (停滞 ∧ 窓経過 ∧ transcript 不在)
を通る fixture が存在しないだけである。

**ただし 375587a2 は anti-vacuity control `dead_clean_worktree_is_removable` を削除している。**
削除された性質は「clean な worktree が dead かつ removable=true に**到達できる**」であり、
これは GC 全体が空虚 (何も消せない = Undetermined を返し続ける定数実装) でないことを示す
唯一の end-to-end 対照だった。テスト作成者自身が doc comment で
「What this test STOPS proving, stated rather than glossed over」として正直に明記している
(隠蔽ではない)。裁定によって Dead は到達可能なままなので、**この性質は新しい形で
復活させなければならない** — 注入した窓 (`HARNESS_PROGRESS_WINDOW_SECS`) のもとで
停滞 ∧ 窓経過 ∧ transcript 確認して不在の clean worktree が Dead + removable に到達することを
