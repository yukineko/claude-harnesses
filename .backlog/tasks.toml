[[task]]
id = "b802a5cf"
title = "Open question: should tdd narrow its impl-line count by transcript attribution the way reviewgate narrows its review set? (raised by 9ec045a1)"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
Raised 2026-09-11 at HEAD 2abf8dea while closing the surviving half of 9ec045a1.

tdd now DISCLOSES that authorship of its impl-file list was never verified (commit on branch fix-9ec045a1-gate-reasons). It does not NARROW. reviewgate does narrow: review.rs:191 calls harness_core::attribution::attribute_from_transcript and drops files a peer session positively claims, keeping everything unattributed.

I deliberately did not wire the same call into tdd, because narrowing changes the VERDICT in the permissive direction: fewer attributed files means a smaller added_impl_lines, which can fall under min_added_impl_lines and turn a block into an allow. CLAUDE.md forbids widening a gate into allowing more as a side effect of a wording fix, so this needs a human decision rather than my judgement.

The two sides:

FOR narrowing -- in a shared checkout tdd currently demands a test for a concurrent session or a human edit that the agent never made. That is a false block, and CLAUDE.md section 8 records the same attribution bug biting donegate and reviewgate as measured, not hypothetical.

AGAINST narrowing -- harness_core::attribution only sees Edit/Write/MultiEdit/NotebookEdit tool_use blocks in the transcript. A sed -i or a heredoc write appears in NO footprint (documented at crates/harness-core/src/transcript.rs EDIT_TOOLS). So narrowing would drop implementation the agent really did write via Bash, and let genuinely untested code through the gate. reviewgate can afford this because its worst case is reviewing less; tdd cannot, because its worst case is allowing untested code to land.

Note that the asymmetry is real and may be the right answer: reviewgate narrows, tdd only discloses. If so, that reasoning should be written down somewhere, because the next audit will read the difference as another mirror gap and try to close it."""
