  '> ' destroys the file's current contents and  is a relative path and blastguard does not know which directory it is relative to, so it cannot tell whether these bytes are recoverable

エラーメッセージのパス部分が空である点に注目。redirect のターゲットが空文字として抽出されており、実際にはそのようなリダイレクトはコマンドに存在しない。回避策: python ソースをファイルへ書き出して python3 FILE で実行すると通る（実際にそうして続行した）。

読み1 (欠陥): 二重引用符で括られた -c 引数の内部を走査対象にしており、引用境界を尊重していない。空ターゲットの redirect を抽出した時点で判定不能なのだから、Ask ではなく Deny に倒れているのも別問題（空ターゲットは そもそも redirect ではない の可能性が高い）。
読み2 (仕様): 引用の中でも destructive な形は拒否するという意図的な保守側。ただしその場合でもターゲットが空という事実は 判定不能 であり、メッセージが 'これらのバイトが復元可能か判断できない' と言いながら deny しているのは 3 節に適合する。

見分け方: crates/blastguard/src/detect.rs の redirect 抽出が引用状態を持つトークナイザを通しているかを読む。通していれば読み2、通していなければ読み1。加えて、抽出された target が空文字のときの分岐が Deny か Ask かを読む。空で Deny なら、そこが本件の実体。

再現の最小形は未取得（本件は /compass 実行中に踏んだので、元の課題へ戻るため深追いしていない）。最小形の特定自体が本チケットの第一歩。

--- 2026-09-24 flow cycle9 で 2 回再現、測定点 b19d9bbe ---
『疑い』ではなく確定として書き直せる観測が取れた。逐語のブロック文言は 2 回とも同一:
  '> ' destroys the file's current contents and `` is a relative path and blastguard
  does not know which directory it is relative to, so it cannot tell whether these
  bytes are recoverable
重要な点: ブロックされた 2 コマンドはいずれも truncating redirect を 1 つも含まず、
redirect は fd-dup の 2>&1 のみだった。それでも blastguard は『> に空のターゲット』と
報告する。つまり誤検知の実体は『2>&1 を truncating redirect と読む』ことであり、
ターゲットが空になるのはその誤読の帰結である。
最小コントロールで切り分け済み (予測ではなく観測。4 本すべて同セッションで実行):
  (i)  python3 -c "<複数行>"、redirect 一切なし                -> ALLOW
  (ii) python3 -c "<単一行>" 2>&1 | head -3                   -> DENY (上記文言)
  (iii) python3 --version 2>&1 | head -3                       -> ALLOW
  (iv) python3 以外の多数のコマンド + 2>&1 | head               -> ALLOW
したがって deny の必要十分条件は『python3 -c <文字列> が在ること』と『その後に 2>&1 が
在ること』の両方であり、どちらか一方では発火しない。複数行かどうかは無関係だった
(当初そう予測したが (i) と (ii) が反証した)。
最小再現 (そのまま回帰 fixture にできる):
  python3 -c "print('x')" 2>&1 | head -3
隣接: 45f2bb7f (done, $( ) 内の 2>&1) / 079b643f (2>&1 の直後が ) ) / 32706d14。
本件はそれらと同じ redirect_targets の解析であり、修正は同じ場所に収束する可能性が高い。
done_criteria: 複数行の python3 -c "..." を含み truncating redirect を持たない
コマンドが deny されないこと。上記 2 コマンドを回帰テストの fixture にできる。"""
