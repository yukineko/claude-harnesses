[package]
name = "flow"
version = "0.2.6"
edition = "2021"
rust-version.workspace = true
description = "Unified source→executor driver: binds compass/backlog (task sources) to condukt (executor); subscription-native."
license = "MIT"

[[bin]]
name = "flow"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# tests/launcher_missing_binary.rs runs bin/flow from a scratch dir that
# provably has no `flow-<os>-<arch>` sibling, so the missing-binary branch is
# exercised even on a host whose build IS bundled in the repo's bin/.
tempfile = { workspace = true }
