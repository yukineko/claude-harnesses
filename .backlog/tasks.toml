        add_must_not_report_success_when_the_tasks_lock_is_unavailable
        add_reporting_success_must_mean_the_id_is_in_a_fresh_load_of_the_store
  MB2 belt2 削除 (post-save の confirm 呼び出しを消す)  229 passed / 0 failed  SURVIVED
  MB3 belt2 無力化 (confirm が常に成功を返す)          229 passed / 0 failed  SURVIVED
  MB4 対照 (add が無条件 refuse)                  176 passed / 6 failed  KILLED

MB4 が 6 件を殺すので keep 側のテストは空虚ではない。したがって MB2/MB3 の生存は
テスト不足の証拠であって測定の失敗ではない。belt2 は呼び出し側の削除でも中身の
無力化でも 229 件全緑のまま通る = 1 本もテストに守られていない。

