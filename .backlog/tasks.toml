判定不能なまま残る点 (どちらの読みかを決める観測がまだ無い):
 (a) rollout の copy 窓に hook がぶつかった。→ 修正は copy を atomic に
     (同一 FS の一時名へ書いて rename)。rename は POSIX で atomic なので
     窓そのものが消える。
 (b) それとは別に、hook が起動した時点の CLAUDE_PLUGIN_ROOT が古い版 dir を
     指していた。→ 修正は e3366b5c 側 (registry を prune が読む) に寄る。
見分け方: rollout-plugins.sh / sync-plugin-assets.sh が cp を使っているか
`install`/rename を使っているかを読む。cp なら (a) が実在の窓である。

影響の重さ: この launcher は **正しく** unknown を明示して exit 0 する
(CLAUDE.md 第1節どおり、空表示ではなく unknown と言う) ので、今回は dark では
なく可視の degrade だった。だが同じ窓に当たる他の hook が同じ配慮を持っている
保証は無い — GATE crate の launcher がこの窓に当たれば exit 1 で暗転しうる。
窓を塞ぐのは launcher 側ではなく rollout 側の仕事である。

関連: e3366b5c (並行 rollout が互いの配備を prune し GATE を dark にする)。
両方とも「共有 plugin cache は repo の外にあり worktree 分離では守れない」という
同じ根に触れているが、機序が違うので別項目にしてある。

---
判定 (2026-09-07、同じターンで実測): 読み (a) が実在する。**cp はインプレース
上書きであり、rename ではない。**

    scripts/rebuild-plugins.sh:384   cp -f "$src" "$hostbin"; chmod +x "$hostbin"
    scripts/rebuild-plugins.sh:291   cp -f "$src" "$binfile";  chmod +x "$binfile"
    scripts/rebuild-plugins.sh:328   cp -f "$src" "$repofile"; chmod +x "$repofile"
    scripts/rollout-plugins.sh:401   cp -a "$src/." "$dst/"

`cp -f` は既存ファイルを **truncate してから書き直す** ので、その間に exec した
hook は不完全な (あるいは 0 バイトの) ファイルを見る。`[ -x ]` は mode しか見ない
ため真のまま通り、exec が失敗する経路もある。さらに cp がファイルを新規作成した
場合は mode が umask 由来 (644) になり、続く `chmod +x` までの間だけ `[ -x ]` が
**偽** になる — 今回観測した「no bundled binary for linux-x86_64」はこの形と一致
する。

したがって修正は launcher 側ではなく rollout 側:
同一 FS 上の一時名へ書き、chmod してから `mv`(rename) で置き換える。rename は
POSIX で atomic なので、hook から見えるのは常に「旧版の完全なファイル」か
「新版の完全なファイル」のどちらかになり、窓が消える。

読み (b) は棄却していない — 別機序として e3366b5c に残っている。今回のログは
