[[task]]
id = "710bc8c7"
title = "Agent の output transcript ファイルサイズを進捗シグナルとして読むのは誤り — 実測で live な agent を kill した"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-14、測定点 6ece7c72。**自分が犯した誤りの記録**であり、次に同じ推論をする者を止めるために起票する。

背景: background agent を dispatch した後、その進捗を
/private/tmp/claude-502/<proj>/<session>/tasks/<agentId>.output の**ファイルサイズの増加**で測ろうとした。
02:30:58 に 129 バイト (JSON 1 行の途中で切れている) で作られ、15 分後も 129 バイトのままだった。
12 秒プローブと 45 秒プローブを 2 回打って、いずれも増分ゼロ。condukt の run state も
作られておらず、branch も無かった。この 3 点から stalled と判断して TaskStop で kill した。

**判断は誤りだった。** kill した瞬間に返ってきた agent の最終行は逐語で
'Now dispatching t1 — the test author.' であり、**agent は生きて前進していた**。
実際に run-20260814-023742-67810 を init し、worktree
/Users/yuki/.condukt/worktrees/run-20260814-023742-67810-t1 と同名 branch を作り終えていた
(branch は main と同じ 6ece7c72 で commit 0 件だったので、失われた成果は setup の約 15 分ぶんだけ)。

**根本原因**: この output ファイルは stream されない。tool の説明文にも
'the full subagent JSONL transcript' としか書かれておらず、**逐次 flush されるとは書かれていない**。
つまりファイルサイズは agent の進捗を測っていない。私は
「観測できない」を「前進していない」と読んだ。これは CLAUDE.md 第3節が禁じる
判定不能の permissive 側への解決の**鏡像**であり、しかも皮肉なことに、
そのとき実装させようとしていた当のタスク (e99f61e4(b): 凍った fingerprint は死の証明ではない) と
**まったく同じ誤り**である。自分のツーリングに対して逆向きに適用してしまった。

**両方の読み**: (a) 実在の欠陥 — この output ファイルが進捗観測の手段として提示されている
(tool 結果が output_file を明示する) にもかかわらず、進捗を表さないので誤読を誘発する。
(b) 意図的な仕様 — transcript は完了時のアーカイブであって進捗 API ではなく、進捗は
task-notification でのみ通知される設計。

**見分ける方法**: 別の background agent を dispatch し、その agent が確実に長時間動く作業
(例: 大きな cargo build) をしている最中に output ファイルのサイズを 30 秒間隔で 5 回測る。
単調増加するなら (a) 側 (今回はたまたま buffer 境界に当たった)。ずっと不変で完了時に
一気に書かれるなら (b) 側 (仕様であり、進捗シグナルとして使ってはならないことが確定する)。

**当面の運用**: agent の liveness を output ファイルのサイズで判定しない。
判定できないなら kill しない (kill は不可逆で、TaskStop に undo は無い)。
再 dispatch は重複 worker を積むので、なおさら推測で殺さない。"""
