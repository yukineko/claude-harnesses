[package]
name = "compass"
version = "0.1.34"
edition = "2021"
rust-version.workspace = true
description = "Goal re-grounding and next-move derivation for Claude Code, sitting upstream of condukt to decide what to work on."
license = "MIT"

[[bin]]
name = "compass"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
