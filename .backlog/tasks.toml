notes = """
User principle 2026-08-05: a gate must be clear, WITH GROUNDS, about what asset it protects and against what failure -- and must communicate that to the user.

Measured gap: docs/gate-taxonomy.md classifies every gate by the KIND of judgment it makes (implementation-correctness / test-fitness / holistic-judgment) and by trigger type. That is a taxonomy of METHOD, not of THREAT. Nowhere does any gate declare the asset it defends or the adversary it defends against. A user facing a refusal cannot tell from it whether the concern is real.

Concrete symptom: taintguard's refusal says the turn consumed untrusted-provenance content and that write-class tools are downgraded. That is the MECHANISM. It never says that the asset is the filesystem and the shell, and the adversary is instructions embedded in fetched content acting through a write-class tool.

Shape: each gate carries an addressable protection statement (asset, adversary, grounds) that is quotable by the README so check-doc-claims.py can pin it to the code, and that a user can read WITHOUT triggering the gate. taintguard 0.1.9 is doing this for itself first; this item is the generalisation across the gate fleet.

Done when: every gate crate and every scripts/check-*.py exposes a protection statement naming asset and adversary, gate-taxonomy.md gains that column, and the statement is machine-pinned rather than prose that can drift."""
