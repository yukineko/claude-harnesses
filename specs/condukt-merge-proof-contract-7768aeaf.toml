[spec]
id = "condukt-merge-proof-contract-7768aeaf"
title = "condukt merge refuses fix/feature tasks without a valid tdd proof contract (7768aeaf)"
status = "ratified"
provenance_commit = "967ca7155bd2a27bc5a4b4addc317c359946c094"
date = "2026-11-20"
canon = []

[spec.ratification]
canon_commit = "967ca7155bd2a27bc5a4b4addc317c359946c094"
date = "2026-11-20"
reason = "Encodes backlog 7768aeaf plus user rulings 2026-11-20 rounds 1-5 (AskUserQuestion in /flow): merge-time proof contract f/g/h/i in condukt only, all GREEN slots, branch-tip commit tree minus proof dir, conduktTask resolution, resolve-merge incl. Manual clean path, fail-closed undetermined task/proof, stderr tokens"
fingerprint = "dd6810d957f8da64"

[[requirement]]
id = "R1"
statement = "requires_fp_oracle()==true の task について tdd proof file が 1 つも無いとき、`condukt worktree merge` は拒否し（非0終了・main 不変）、stderr に merge-proof-contract(i) を出す。"
acceptance = [
    "merge_of_fix_task_without_tdd_proofs_is_refused が #[ignore] の除去だけで pass する（assert は 25a27ee67 と同一）。",
    "拒否時の stderr に `merge-proof-contract(i)` が含まれる。",
    "拒否の前後で `git rev-parse main` が同じ。",
    "同じ cmd の RED slot があって GREEN slot が無ければ `merge-proof-contract(missing-green)` で拒否する。RED の無い GREEN slot だけでは拒否理由にならない。",
]
canon = [
    "crates/condukt/tests/backlog_20261117_merge_without_tdd_proofs.rs:254-276",
    "crates/condukt/src/model.rs:162-169",
    "crates/tdd/src/proof.rs:143-188",
    "user rulings 2026-11-20 round 2, round 4 Q-D",
]
falsifiable = true

