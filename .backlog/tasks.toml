今回は実害なし: 並行セッションが rollout 中に overwatch を 0.2.36 -> 0.2.37 へ bump し、0.2.36 の dir が prune された後に cp が走ったため。registry は 0.2.37 を 指しており、0.2.37/bin/overwatch-darwin-arm64 は 2033952 bytes で存在し、`overwatch status` は rc=0 で動作する。GATE 5 本すべて bin 実在を確認済み。

しかし潜在的な fail-open である: 同じ cp 失敗が *現行* version dir に対して 起きた場合、launcher には sibling version へのフォールバックが無いため その GATE は暗転する (hook が起動せず finding も出ない = red ではなく dark)。それでも rollout は exit 0 で『成功』と報告する。

これは harness-core の既知クラス『subprocess の stdout だけ見て終了ステータスを 判定に使わない』(CLAUDE.md 第3節) と同型。

done_criteria: asset sync / bin copy のいずれかが失敗したら rollout は非0で 終わり、どの plugin のどのファイルが落ちたかを名指しする。一過性の race (version dir が prune された等) は、成功と区別可能な形で 報告したうえで非0にするか、少なくとも警告として集計する。"""
