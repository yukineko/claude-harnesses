   followed 11 lines later by mode = "inject" as the written default. In inject mode propguard checks nothing and counts nothing - gate.rs around :273-276 builds Verified { satisfied: 0, findings: None } and blocks unconditionally on a new diff hash. The block_reason doc (gate.rs around :766-772) already says printing that 0 as a count reported a NON-judgement in the notation of a measurement; the template still describes the gate as a measurement.
