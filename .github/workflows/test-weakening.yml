name: test-weakening

# Blocks a pull request that WEAKENS the test surface instead of the code:
# assertions dropped, `#[test]` functions deleted, `#[ignore]` bolted on, or a
# case wrapped in `#[should_panic]`. When implementation and tests land in the
# same commit, weakening the test is the cheapest way to turn a red gate green,
# and every signal downstream (`cargo test`'s exit code, the F->P oracle,
# mutation kill-rate) reads that as success. `donegate.toml`'s `test-changed`
# check only inspects the exit code, never what happened to the tests.
#
# This job is merge-blocking, not advisory. A warning that can be ignored is the
# same fail-open in slower motion. A deliberate deletion is acknowledged in the
# commit message (`test-weakening-justified: <path>:<kind> - <reason>`), which
# keeps the decision where a human reviewer sees it.
#
# NOTE: there is deliberately no `paths:` filter. This job is meant to be a
# REQUIRED status check, and a required check that is skipped by a path filter
# never reports at all, leaving the PR permanently pending. It is cheap enough
# (stdlib Python, no build) to run on every PR.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-weakening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scanner diffs against the merge base, so it needs real history.
          # A shallow clone would make the base ref unresolvable, which the
          # scanner correctly reports as UNDETERMINED (exit 2) rather than
          # clean — turning a misconfigured checkout into a red job instead of
          # a silently vacuous pass.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit-test the scanner
        run: python3 scripts/test_check_test_weakening.py
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan changed test surface for weakening
        run: python3 scripts/check-test-weakening.py --base "${{ steps.base.outputs.ref }}"
