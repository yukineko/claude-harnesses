[package]
rust-version.workspace = true
name = "tracekit"
version = "0.1.13"
edition = "2021"
description = "Span-tree tracer for condukt runs that records the interpreter, worker and verifier phases as a parent-linked span tree, renders it, and exports it as OpenTelemetry JSON."
license = "MIT"

[[bin]]
name = "tracekit"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
