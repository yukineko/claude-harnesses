[[task]]
id = "0c22c77b"
title = "diffrisk_record flake ROOT CAUSE: the test uses Config::load() with no HOME override so it shares the real ~/.condukt state"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = []
touched_files = []
status = "pending"
notes = """
Root cause for the flake filed as d4d74fe2. Diagnosed 2026-09-23 during the 06eb8aa3 implementation.

crates/condukt/src/diffrisk_record.rs test every_invocation_is_journaled_even_when_nothing_is_recorded calls Config::load() with NO HOME override, so project_state_dir resolves to the users REAL ~/.condukt/state/<project-key>. The journal is therefore shared across every parallel test in the binary (and across concurrent cargo runs), so the assertion one record per invocation sees a count contributed to by other tests.

Reproduction, on an IDENTICAL committed tree, three consecutive runs of cargo test -p condukt --bins:
  846 passed / 846 passed / 845 passed with 1 failed
The failure is:
  assertion left == right failed: one record per invocation
    left: 1
   right: 2
Isolated it always passes: cargo test -p condukt --bins diffrisk_record gives 7 passed / 0 failed.

WHY THIS MATTERS MORE THAN A FLAKY TEST: it means a green cargo test -p condukt --bins run is NOT currently a reliable observation for this crate. Every task in condukt has to argue whether a red is its own or the known flake, which is exactly the condition under which a real regression gets waved through. It also writes into the developers real state dir during a test run, which is a test-isolation defect in its own right independent of the flake.

Fix direction: pin HOME (or the state dir) to a per-test temp dir, the way the claim.rs and progress tests already do via make_tmp_dir. Do NOT fix it by loosening the assertion to a range or by serialising the whole binary - one record per invocation is the property under test, and the isolation defect would remain.

Note this was observed again during the 5e62b0eb and 06eb8aa3 merges, so it is live on main now.

【関連 WIP を退避 2026-09-29】archive/diffrisk-flake-tests-wip (5cd07264、+178) は claim.rs に run_worktree_head_signal_waits_out_a_path_mutation、diffrisk_record.rs に journaling_tests_do_not_depend_on_process_home (HOME を細工する診断プローブ) を足す。根本原因 (Config::load() が実 ~/.condukt/state を共有) の修正ではない。テストごとに HOME/state_dir を tempdir に固定する修正を先に行い、2 本は修正後も意味があるか判断して採否を決める。 取り出しは git show archive/diffrisk-flake-tests-wip（worktree 整理で退避、2026-09-29）。マージ前に今のツリーで RED を必ず観測すること。"""
