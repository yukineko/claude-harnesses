0db309dc の作業中、rebuild-plugins.sh を変更したので隣接テストの回帰確認として実行して発覚。

[triage 2026-09-29 @b325a169] p2->p1: shell-syntax gate test: mktemp -d -t without Xs, unchecked; 4 of 6 assertions never run"""
