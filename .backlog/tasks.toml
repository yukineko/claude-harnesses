notes = "observation 2026-08-12, run run-20260811-230435-19389。REFILED: 最初 11d2a214 として起票したが消失した (bd6d81df 参照)。orchestrator が opus worker と sonnet verifier を dead と判定した根拠は次の4つの独立シグナルの収束: (1) worktree 内の非 .git ファイルの最新 mtime が約2時間進んでいない (epoch 1786460104 と 1786459932、観測時刻 1786467527)。(2) cargo と rustc のプロセスが 0 個。(3) SendMessage による直接 probe に対し9分間 (30秒間隔18回) 応答も tool round も無し。(4) Task tool の完了通知が来ない。反証: その後 verifier が正常に完走し完全な報告 (mutation kill rate 5/5、225/225 passed) を返した。所要 11126168 ms = 約3.09時間。worker も同様に完走した。つまり判定時点で両方生きており、4シグナルすべてが false negative だった。原因は agent が長時間 read と思考のみを行いファイル書き込みも subprocess 起動もしない区間が存在するため。ファイル mtime とプロセス存在は作業の証拠ではあっても生存の証拠ではない。重要な理由: e99f61e4 が作る live/dead/undetermined 三値照合は、まさにこの種の間接シグナルの収束で生死を決める設計である。本件はその設計が実測で false dead を出した1例であり、GC 側の方向反転 (判定不能は削除しない) が原則論ではなく必須であることの実証になる。同じ heuristic が worktree GC に使われ undetermined を削除側へ倒していたら、生きている worker の worktree を消していた。実害: 誤判定にもとづき duplicate worker と duplicate verifier を1体ずつ再投入し、同一 worktree に2体が同時に存在する状態を作った (356bd51d)。t1 側は冗長投入のみで実害なし。教訓: orchestrator には subagent の生存を直接問い合わせる一次手段が無い。SendMessage は next tool round で配送されるため応答が無いことは死の証拠にならず長考と区別できない。したがって subagent の生死は原理的に undetermined であり、undetermined を dead へ倒す再投入は必ず二重実行を生む。正しい設計は再投入前に worktree を分離するか、再投入をやめて待つか、ハーネスが一次的な生存 API を提供するか。判定不能な点: 2時間のファイル無活動が純粋な思考か API retry 待ちか rate limit stall かは未同定。見分ける方法は subagent transcript の該当時間帯の entry 間隔を読むこと。関連: e99f61e4, 356bd51d, aa6d6e43."
