notes = """
observed 2026-09-09（測定点 f17bbba3、session e9ebfcb6）。

【手順と観測】
1. ユーザーが main の作業ツリーで `git pull origin main` を実行し、28 ファイルが
   conflict した状態（`.git/MERGE_HEAD` あり）になった。
2. conflict 解決のために Edit ツールを使ったところ、`scripts/guard-maintree-edit.py`
   が PreToolUse で拒否した。
3. しかし CLAUDE.md 第8節は「main の作業ツリーで許されるのは統合（merge・conflict
   解決）だけ」と明記しており、pre-commit の `main-tree-guard` も **merge commit は
   通す**（block するのは非 merge commit だけ）。

つまり **同じ不変条件を守る 2 つのゲートが、許可範囲について食い違っている**。
commit 側は merge を許すのに、edit 側はその merge を完成させる編集を拒む。

【影響】
`git pull` が conflict した瞬間、main のツリーは「解決できないが abort もしにくい」
状態になる。今回は `git merge --abort` -> 専用 worktree で `git merge origin/main` を
やり直す、という迂回で通した（結果的に §8 に沿ってはいるが、迂回であって設計ではない）。
より悪いのは、この不整合が **共有 skip ファイルや --no-verify への圧力**になること。

【完了条件】
`guard-maintree-edit.py` が `.git/MERGE_HEAD`（および `REBASE_HEAD` /
`CHERRY_PICK_HEAD` を含めるかは要判断）の存在を見て、進行中の統合に属する編集を
許可する。**判定不能は従来どおり block 側**へ倒すこと。回帰テストを添え、
`main-tree-guard` と許可範囲が一致することを機械照合できる形にすること。"""
