[package]
rust-version.workspace = true
license.workspace = true
name = "overwatch"
version = "0.1.41"
edition = "2021"
description = "Lease & event store for condukt task orchestration. Manages claim registry, heartbeat lifecycle, and runtime state."

[lib]
name = "overwatch"
path = "src/lib.rs"

[[bin]]
name = "overwatch"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }
wait-timeout = "0.2"
