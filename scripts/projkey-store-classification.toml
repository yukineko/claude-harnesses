# Classification of every call site of `harness_core::projkey::{repo_root,
# project_key, main_worktree_root}` under `crates/*/src/`.
#
# Checked by scripts/check-projkey-store-classification.py. A call site present
# in the tree but absent here is a BLOCKING finding; so is an entry here with no
# matching call site, and so is a count that has drifted.
#
# WHY. `repo_root` stops at the first ancestor whose `.git` merely EXISTS. In a
# linked worktree `.git` is a FILE, so `repo_root` returns the WORKTREE, not the
# shared repo. CLAUDE.md §8 makes linked worktrees mandatory, so every durable
# store keyed off `repo_root`/`project_key` partitions per worktree and reads
# back EMPTY — which downstream reads as "no claim / no conflict / no progress",
# a fail-open (CLAUDE.md §3). Measured symptom recorded on backlog 2c1e54b3:
# 32 distinct `~/.condukt/state/<project>` directories for this one repo.
#
# FIELDS
#   file     path relative to the repo root
#   symbol   repo_root | project_key | main_worktree_root
#   count    number of call sites of that symbol in that file (comments and
#            string literals excluded — the checker lexes them away)
#   scope    shared         the value must be ONE per project, identical from
#                           every linked worktree
#            worktree-local the value is legitimately per-checkout
#   kind     store-key       the value keys a durable file on disk
#            tree-locus      the value is only a directory to run git/tests in
#            test            the call site is unit-test code
#            definition-site the call lives in projkey.rs itself
#            mixed           the file's call sites of this symbol are not all
#                            the same kind; `scope` is then the RESTRICTIVE
#                            reading of the set, never an average
#   evidence why that scope, in terms of what the value is actually used for
#
# RULE FOR WHOEVER ADDS THE NEXT ENTRY: `scope = "shared"` unless you have read
# the call site and can say in `evidence` why a per-worktree value is correct
# there. "Probably fine" is a prediction, not evidence (CLAUDE.md §2).
#
# `scope = "shared"` does NOT assert the call site is already correct. Several
# below are shared-by-contract but still keyed off `repo_root` today, i.e. they
# ARE the defect; migrating them is backlog 43393ce2, deliberately not done here
# (re-keying relocates stores that already exist on disk and orphans them).

