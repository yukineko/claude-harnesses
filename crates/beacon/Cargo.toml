[package]
rust-version.workspace = true
name = "beacon"
version = "0.1.14"
edition = "2021"
description = "Desktop and webhook notifications for Claude Code: Stop and Notification hooks that ping you via desktop, Slack, webhook or a custom command when a turn finishes or input is needed."
license = "MIT"

[[bin]]
name = "beacon"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
