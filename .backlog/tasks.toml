title = "rollout drift 37件: donegate 0.1.15 の verdict 型移行が稼働キャッシュ(registry 0.1.11)に未反映"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p1"]
status = "done"
notes = """
測定日 2026-07-22 / 測定点 daf599ba / run-20260722-072334 の Phase 6 で独立 verifier が発見、main で再現済み。

  python3 scripts/check-plugin-rollout.py   -> exit 1
  ROLLOUT DRIFT (37 problem(s) across 39 plugins checked):
    - donegate: source=0.1.15 registry=0.1.11 <- rollout-plugins.sh not run since bump

39 plugin 中 37 件が drift。donegate は source 0.1.15 に対し registry 0.1.11 のままで、
6d4312c5 の harness_core::verdict 型移行を含む 0.1.12->0.1.15 の全変更が
どのセッションにも反映されていない。

これは CLAUDE.md が名指しする既知の失敗モードそのもの:
『source 3ファイルの version 整合と bump-on-change を両方満たしていても、
rollout-plugins.sh を実際に実行し忘れれば、その fix はどのセッションにも一切反映されない』。
check-plugin-versions.py と check-version-bumped.py が両方 green でも検知できず、
check-plugin-rollout.py だけが捕まえる別の失敗モード。

対処: scripts/rollout-plugins.sh を実行する。donegate は GATE クレート一覧
(blastguard/propguard/specguard/stuckguard/overwatch/mutategate) に含まれないため
--canary は必須ではない。ただし 37 件のうち GATE クレートが含まれるなら
--plugin 無しの全 plugin 反映は --canary が必須。

注意(memory rollout-fresh-versiondir-missing-host-bin): version-bump 済みの rollout は
新しい cache dir を作るが rebuild-plugins.sh が host darwin-arm64 の bin を置かないことがあり、
live wrapper が黙って no-op する。反映後に必ず wrapper が新しいコードを実行することを確認する。"""
created_at = 1784723404
updated_at = 1784725168
weight = 0.0

[[task]]
id = "4883ad97"
title = "check-version-bumped.py が clean tree + 既定 base=HEAD で1件も検査せず exit 0 し「39 plugins scanned」と表示する"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
status = "pending"
notes = """
測定日 2026-07-22 / 測定点 daf599ba / run-20260722-072334 の Phase 6 で独立 verifier が発見。

scripts/check-version-bumped.py:72 の --base 既定は HEAD。同 94-99 行:

  diff = git('diff', '--name-only', base, '--', f'{CRATES}/{name}/')
  if not diff.stdout.strip():
      continue      # <- 変更なし = 比較せずスキップ

working tree がクリーンなとき、既定 base=HEAD では全 39 plugin で diff が空になり
version 比較が 1 件も実行されないまま exit 0 に到達する。にもかかわらず出力は

  OK: no changed plugin left un-bumped vs HEAD (39 plugins scanned)

であり、『39 件を走査した』が『39 件の bump を検証した』と読める。
すなわち **検査した と 検査対象が無かった を同じ exit 0 と同じ文言に写している**。
CLAUDE.md 3.(空集合を合格と読ませない)および『沈黙は許容される degrade ではない』に該当する。

意図された文脈では空虚ではない:
- pre-commit は staged 変更があるので diff は非空
- pre-push / CI は --base origin/main を渡すので非空
空虚になるのは clean tree で単独実行したとき(今回の検証がまさにそれ)。
危険なのは exit code そのものより **文言が全件検証を主張すること**。

実証: --base 6d4312c5^ で再実行すると donegate は非空 diff を持ちスキップされず、
実際に 0.1.12 < 0.1.15 を比較して exit 0 になる(こちらは本物の合格)。

修正方針の候補: 比較を実行した plugin 数と skip した数を分けて出力し、
比較 0 件のときは『scanned』ではなく『no plugin had changes vs <base> — nothing was verified』
と明示する(合格の主張をしない)。exit code を変えるかは別途判断。"""
created_at = 1784723404
updated_at = 1784723404
