touched_files = []
status = "pending"
notes = """
Observed 2026-11-21 (session ba440926, donegate Stop hook, cwd /Users/yuki/src/harness, verbatim excerpt): "🚦 donegate: 2 required check(s) failed ... ✗ lint-changed (exit 1) $ scripts/lint-changed-crates.sh error: key with no value, expected `=` --> crates/blastguard/Cargo.toml:6:9 ... 6 | <<<<<<< HEAD ... lint-changed-crates: scope was the changed crates only (blastguard) ... ✗ test-changed ... test-changed-crates: FAILED for blastguard". Logs: ~/.donegate/state/records/ba440926-aa85-4f93-a5e1-9566434e2c12/1795195397488-a1-lint-changed.log, ...1795195397490-a1-test-changed.log. The blastguard conflict (UU crates/blastguard/Cargo.toml etc., MERGE_HEAD) was ANOTHER session's unfinished merge in the main tree. ba440926 never edited the main tree; with cwd=main it ran only read-only commands plus path-less writers, most after `cd <other dir>` (e.g. `cd /Users/yuki/src/.harness-worktrees/session-ba440926 && backlog driver register ...`, `cd ~/.claude/projects/-Users-yuki-src-harness/memory/ && python3 - <<'EOF' ...`), and some with no cd (`python3 scripts/check-prose-tests.py ...`, `askrelay dismiss ...`). CLAUDE.md §8: 帰属のバグ.

Path (rev 644ff8dbc): (1) main.rs::gate_run judges root = hook cwd always; rootcheck::wrote_in_cwd only short-circuits when NO check is configured (`cfg.checks.is_empty() && !wrote_here`), so with checks configured the cwd is evaluated whether or not the session wrote there. (2) gate::attribute_scope narrows the tree's change set to the session's named writes (02ec6595, GREEN in tests/foreign_main_dirt_attribution_20261117.rs) UNLESS attribution::has_unattributable_write(transcript) is true; then the FULL change set is kept ("scope NOT narrowed to its named writes, checking all N changed file(s)"). (3) has_unattributable_write is transcript-global (parent + all sidechains) and cwd-blind: call_is_unattributable never compares the `cd` target or the line cwd with the judged root. Not 39772e9f (that one is a relative NAMED write joined with the line cwd; here no path is named at all). Not 95deaa32 (in-flight subagent root).

RED: crates/donegate/tests/backlog_20261121_foreign_merge_unattributable_elsewhere.rs, committed 2eefb224e. Fixture: primary repo + linked worktree; foreign real merge conflict (UU, MERGE_HEAD) in the primary tree; Stop cwd = primary. red_cd_linked_worktree_writer_does_not_widen_primary_scope (`git status` @primary, `cd <wt> && cargo fmt` @primary, sidechain `git log` @primary) and red_writer_with_cwd_in_linked_worktree_does_not_widen_primary_scope (`cargo fmt` with line cwd = wt) both FAIL: decision="block", check marker written, stderr "scope NOT narrowed ... checking all 1 changed file(s) in .../main". Controls GREEN: read-only parent+subagent cwd in primary is NOT judged (so a read-only/subagent cwd alone is not the path); own Edit in primary IS judged; `cd <primary> && cargo fmt` keeps full scope.

Both readings: (a) real attribution defect — a writer whose effective cwd is another worktree cannot have produced the primary tree's dirt; it must not widen that root's scope. (b) intended fail-closed — a path-less writer may write any path (python3 - can open absolute paths), so any such call anywhere in the session keeps the full scope (CLAUDE.md §3). How to tell apart: the REDs use `cargo fmt`, whose writes are confined to its cwd's cargo workspace; under (b) they must block, under (a) they must not — a ruling on whether the effective cwd may bound a path-less writer decides it. DOES NOT PROVE that a cwd-aware rule alone clears the observed block: ba440926 also has path-less writers with line cwd = main and no cd (python3 scripts/check-prose-tests.py, askrelay dismiss), which keep the full scope under both readings; the alternative fix shape (judge the cwd only when the session wrote there, i.e. wrote_in_cwd as a gate) is a separate design call."""
