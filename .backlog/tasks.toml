condukt schedule put all four cycle-7 tasks in serial (file overlap is authoritative over class parallel). The condukt SKILL.md then instructs, for serial tasks, the Phase 4.5.5 fast path and the Phase 5 B single-worktree mode, that the work is implemented directly in the main working tree:
