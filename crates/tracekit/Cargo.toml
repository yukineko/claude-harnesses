[package]
rust-version.workspace = true
name = "tracekit"
version = "0.1.7"
edition = "2021"
description = "Span-tree tracer for condukt runs. Records the interpreter→worker→verifier phases of one run as a parent-linked span tree (phase, model, ms, cost, status), renders it with `tracekit trace <RID>`, and exports it as OpenTelemetry GenAI-semconv JSON. Subscription-native: file-only, no network, no API key."
license = "MIT"

[[bin]]
name = "tracekit"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
