# Pinned toolchain (USER RULING 2026-09-30, backlog 034b6620).
#
# The trybuild compile-fail snapshots (crates/{harness-core,blastguard,donegate}/
# tests/ui/**/*.stderr) record rustc's exact diagnostics, which drift between
# releases. They were generated against rustc 1.97.1, so the compiler that judges
# them is pinned to the same release. Bump this together with a
# `TRYBUILD=overwrite` regeneration of those snapshots, in one commit.
# Enforced by scripts/check-compile-fail.py.
#
# rust-src is pinned too (USER RULING 2026-10-14). With it installed rustc adds a
# std-source snippet to some diagnostics (tests/ui/verdict/from_bool.stderr), and
# editor tooling reinstalls it on its own, so leaving it out made the snapshots
# depend on whatever the machine happened to have. Pinning it makes every checkout
# judge the snapshots with the same component set.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt", "rust-src"]
