notes = """
crates/specguard/bin/specguard は per-platform バイナリが無いとき stderr に 1 行出して **exit 0** する。コメントは逐語で「it exits 0 silently so a hook NEVER breaks the user's turn」。

CLAUDE.md 第1節は「ターンを壊すな」を verdict 経路の docstring・コメントに書いた時点で赤信号とみなすと明記している。specguard は GATE crate (scripts/rollout-plugins.sh の GATE_CRATES に登録) なので、この launcher は判定を持つ側にある。バイナリ不在時に exit 0 すると、hook 呼び出し側から見て「検査して問題なし」と「そもそも検査していない」が区別不能になる (第3節)。

これは 2026-09-07 に全 39 plugin が dark だった事象の増幅器でもある: バイナリが無いこと自体が exit 0 で覆い隠されるので red にならず dark になる。

