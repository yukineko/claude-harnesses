Each RED first asserts that `cargo fmt -- --check` / `cargo clippy --all-targets -- -D warnings` really fails in the fixture worktree. The control control_clean_branch_merges passes, so the fixture can merge at all.

Readings:
(a) Defect: unlinted worker code reaches main, and the lint finding surfaces later on an unrelated agent's Stop (see the in-flight ticket).
(b) Intended: merge is a pure integration step, and lint is the worker's or donegate's job.
How to tell them apart: (b) needs some automatic fmt/clippy step that a task branch cannot bypass before main. None exists today: the worker prompt is prose, pre-commit runs no cargo, donegate checks only uncommitted changes (see the committed-but-unmerged ticket) and only on the parent. A fix at another single choke point (e.g. a pre-merge hook in condukt's worker commit path) would also satisfy the test, as long as `worktree merge` refuses. Design notes for the fixer:
- Scope the lint to the crates the branch changed, the way lint-changed-crates.sh does.
- A cargo that cannot run is "undetermined", so the merge must refuse (CLAUDE.md §3).
- Remove the #[ignore]s when fixed."""
