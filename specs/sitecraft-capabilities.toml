[spec]
id = "sitecraft-capabilities"
title = "sitecraft を Web アプリを超える課題（能力・実機検証・停滞検知）まで拡張する"
status = "ratified"
provenance_commit = "8811b5a8be307167aa94f77f2b231257967ad239"
date = "2026-11-03"
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md",
    "crates/sitecraft/skills/sitecraft/SKILL.md",
    "crates/sitecraft/README.ja.md",
]

[spec.ratification]
canon_commit = "8811b5a8be307167aa94f77f2b231257967ad239"
date = "2026-11-03"
reason = "User approved 2026-11-03 (AskUserQuestion 'Ratify and implement'): extend sitecraft to capabilities beyond web apps with real-machine proof (blender headless, three.js), stall detection and self-repair; testbed 3d-pipeline-web; GLB to VRM out of scope."
fingerprint = "343f70c9e74a5e6c"

[[requirement]]
id = "R1"
statement = "目的を decisions.toml の [purpose] text に記録でき、未記録なら sitecraft decide check が exit 1 で記録方法を案内する。"
acceptance = [
    'sitecraft decide purpose --text "<要約>" の後、sitecraft/decisions.toml の [purpose] text に前後空白を除いた空でない文字列が保存されている',
    "空白だけの --text を渡すと decisions.toml は変わらず exit 1",
    "[purpose] が無い（または text が空白のみ）状態で他の記録が揃っていても sitecraft decide check が exit 1 になり、出力に `sitecraft decide purpose --text` の案内を含む",
    "sitecraft decide next は purpose を問いとして返さない",
    '値の違う purpose を再記録すると [[history]] に area = "purpose", question = "text" の行が 1 つ追記される',
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D1",
    "docs/specs/sitecraft-capabilities-rulings.md#D8",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r1_purpose"

[[requirement]]
id = "R2"
statement = "Web アプリ以外の能力を sitecraft decide capability で [capabilities.<name>] に登録できる。verify.kind は閉じた 3 種で、command 種の argv は D2-trust の digest で人間の trust を要する。"
acceptance = [
    "sitecraft decide capability --name N --relevance R --how T --done-when T --verify-kind K と種別ごとの引数で、[capabilities.N] に relevance・how・done_when・verify が保存される",
    "name が ^[a-z0-9][a-z0-9-]*$ に一致しない場合は記録されず、失敗終了する",
    "verify.kind が builtin:blender-headless / builtin:threejs-render / command 以外、必須キー（blender-headless: script・glb・render、threejs-render: page、command: argv（空でない文字列配列、先頭は空白でない）・inputs（空でない glob 配列））の欠落、または型不一致のとき、sitecraft decide check が exit 2",
    "relevance=relevant の能力で how / done_when / verify のどれかが無いとき、sitecraft decide check が exit 1",
    "[capabilities] テーブルが無い project では、能力に関する指摘を何も出さない（能力なしとして扱う）",
    "sitecraft trust は、command 種の能力が 1 つ以上あれば、[name, argv] を name 昇順に並べた JSON 配列の sha256 を trust store のキー `<canonical root>#capabilities` に記録する。command 種が 0 個ならこのキーを要求しない",
    "command 種の argv を変えた後、trust し直す前に sitecraft check capability <name> を実行すると、コマンドを実行せず exit 2 になり、sitecraft trust の案内を出す。trust store が読めない場合も exit 2",
    "how / done_when / builtin 種の verify の変更では D2-trust の記録は無効にならない",
    '値の違う能力を再記録すると [[history]] に area = "capability", question = N で追記される',
    "SKILL.md は、能力の how / done_when を AskUserQuestion でユーザーに決めてもらう手順を持ち、LLM が sitecraft trust を代わりに実行しないことを明記している",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#U1",
    "docs/specs/sitecraft-capabilities-rulings.md#D2",
    "docs/specs/sitecraft-capabilities-rulings.md#C4",
    "crates/sitecraft/skills/sitecraft/SKILL.md#不変条件",
    "crates/sitecraft/README.ja.md#trust の手順",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r2_capability_decide"

[[requirement]]
id = "R3"
statement = "sitecraft capability probe <name> は実環境で試して feasible / infeasible / undetermined の三値を JSON と終了コードで返す。プローブ結果は記録せず、完成判定にも使わない。"
acceptance = [
    'stdout に JSON がちょうど 1 個 {"capability":N,"result":…,"reason":…} 出る。終了コードは feasible 0 / infeasible 1 / undetermined 2',
    "未登録の name は exit 2",
    "120 秒を超えると result=undetermined、reason=timeout、exit 2",
    "blender の探索: SITECRAFT_BLENDER が空でなければそれだけを使い、指すファイルが無い・実行できない場合は undetermined。未設定なら PATH の blender、次に /Applications/Blender.app/Contents/MacOS/Blender の順に探し、どれも無ければ infeasible",
    "blender が見つかったら --background --factory-startup --python <最小スクリプト> を実行し、終了 0 かつ <state>/probe-tmp/ 配下の出力が D4 の GLB 条件を満たせば feasible。非 0 終了・条件不成立は infeasible、spawn 失敗は undetermined",
    "three.js プローブ: check pages と同じ方法で解決した Playwright の Chromium を headless で起動し、about:blank で webgl2 か webgl の context が取れれば feasible、どちらも取れなければ infeasible、Playwright か Chromium が起動できなければ undetermined",
    "command 種: argv[0] が実行可能（`/` を含むならそのパスのファイル、含まなければ PATH で解決）なら feasible、そうでなければ infeasible。コマンド自体は実行せず、trust も要求しない",
    "probe の実行で capability-results・decisions.toml のどちらにも書き込みが起きない",
    "SKILL.md は、プローブ結果を AskUserQuestion でユーザーに示す手順を持ち、probe の feasible を完成の根拠にしないことを明記している",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D3",
    "docs/specs/sitecraft-capabilities-rulings.md#U2",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r3_probe"

[[requirement]]
id = "R4"
statement = "sitecraft check capability <name> は、能力が実機で動いた証拠を D4 の画素規則と GLB 条件で判定し、0 clean / 1 violation / 2 undetermined を返す。"
acceptance = [
    "未登録または relevance=irrelevant の name は exit 2。300 秒を超えると exit 2（reason timeout）",
    "画素規則: 背景色は 4 隅の RGB の最頻値。最頻値が一意でなければ、描画率が最小になる候補を背景色にする。描画画素は R/G/B のいずれかで背景との差の絶対値が 16 を超える画素。描画率 1% 以上で clean、1% 未満と幅か高さが 0 の画像は violation。単色画像が violation、1% 以上描かれた画像が clean になることをテストで観測する",
    "GLB 条件: 先頭 4 バイトが glTF、version(uint32 LE)=2、length(uint32 LE) がファイルサイズと一致。0 バイトのファイルと条件不成立のファイルは violation",
    "builtin:blender-headless: 実行前に既存の glb と render を削除し、cwd=root で `<blender> --background --factory-startup --python <script> -- --glb <絶対パス> --render <絶対パス>` を実行する。非 0 終了・出力が無い・PNG として読めない・GLB 条件不成立・画素規則 violation は exit 1。blender が見つからない・script が無い・読み取りの IO 失敗は exit 2",
    "builtin:threejs-render: trust 済み sitecraft.toml が無いか未 trust なら exit 2。dev server が止まっていれば自分で起動し、終了時に自分が起動したものだけを止める。http://127.0.0.1:<port><page> を headless Chromium で開き、selector（既定 canvas）が 30 秒以内に可視にならなければ exit 1。可視になったら 2000 ms 後に要素のスクリーンショットを撮り、画素規則で判定する。Playwright か Chromium が起動できなければ exit 2",
    "command: D2-trust が無ければ実行せず exit 2。trust 済みなら cwd=root で argv を実行し、終了 0 は exit 0、終了 2 は exit 2、それ以外の非 0 と signal 終了は exit 1、spawn 失敗は exit 2",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D4",
    "docs/specs/sitecraft-capabilities-rulings.md#U2",
    "crates/sitecraft/skills/sitecraft/SKILL.md#終了コード規約",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r4_check_capability"

[[requirement]]
id = "R5"
statement = "check capability は結果を入力ハッシュ付きで記録し、Stop gate は能力を実行せずに、relevant な全能力の記録の鮮度を確かめ、そろっていなければ block する。"
acceptance = [
    "check capability は終了のたびに <state>/capability-results/<root-key>/<name>.json に {name, exit, input_hash, sitecraft_version, at} を一時ファイルからの rename で書く。<root-key> は canonical root パスの sha256 hex。書けなければ check capability 自体が exit 2",
    "input_hash は、[capabilities.<name>] のキー昇順の正規化 JSON に続けて、種別ごとの入力ファイル集合（blender-headless: script と verify.inputs、threejs-render: sitecraft.toml・web_globs・verify.inputs、command: verify.inputs）を root 相対パス昇順に (パス, 内容の sha256) として連結したものの sha256。command 種で一致が 0 件、または読めないファイルがあれば exit 2",
    "trust 済み sitecraft.toml がある project で、relevant な能力の記録が無い・exit≠0・sitecraft_version 不一致・input_hash 不一致・読めない・再計算できないときは gate が block し、reason に能力名と `sitecraft check capability <name>` を含める",
    "入力ファイルを 1 バイト変えると、check capability を再実行するまで gate が block する",
    "gate の実行中に blender も Chromium も能力の command も spawn されない",
    "能力の判定は既存の検査と Verdict::worst_of で合成され、既存の bounded give-up（max_attempts 後の NOTHING WAS VERIFIED 付き通過）と panic barrier は変わらない",
    "relevant な能力が無い decisions.toml では、gate の判定が変更前と同じになる",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D5",
    "crates/sitecraft/README.ja.md#Stop gate",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r5_results_gate"

[[requirement]]
id = "R6"
statement = "sitecraft init <dir> は D6 の規則で git repo と sitecraft/ を作る。scaffold 先は <root>/app/ とし、決定記録と分ける。"
acceptance = [
    "<dir> が存在しない、または空なら、ディレクトリを作り（必要なら）、git init と <dir>/sitecraft/ を作って exit 0",
    "<dir> が空でない、またはファイルなら、何も変えずに exit 1",
    "<dir> の親が別の git work tree の中にあるなら、何も変えずに exit 1",
    "git が無い・git init が非 0・30 秒の時間制限超過・IO 失敗は exit 2",
    "SKILL.md の不変条件「空でないディレクトリには scaffold しない」は文言を変えずに残し、scaffold 先を <root>/app/ と明記する（app/ が存在して空でなければ拒否する）",
    'SKILL.md の sitecraft.toml の例が `npm --prefix app …`・build_dir = "app/dist"・web_globs = ["app/src/**", …] の形になっている',
    "<root>/sitecraft/decisions.toml がある root でも、空の app/ への scaffold 手順は拒否されない",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D6",
    "docs/specs/sitecraft-capabilities-rulings.md#C5",
    "crates/sitecraft/skills/sitecraft/SKILL.md#Phase 6",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r6_init"

[[requirement]]
id = "R7"
statement = "sitecraft decide check は、D7 の閉じた 6 行の規則表（W1, V1〜V5）でカタログ回答の組を検査する。violation は exit 1、W1 は終了コードを変えない warning とする。domain 問いは判定しない。"
acceptance = [
    "規則表は crates/sitecraft/src/decide/ 内にあり、W1, V1, V2, V3, V4, V5 のちょうど 6 行で、条件は D7 の表のとおり",
    "6 規則のそれぞれについて、発火する例と発火しない例のテストがあり、どちらも pass する",
    "V1〜V5 が発火すると exit 1 になり、出力に `<id>: <表示文>` と関与した (area, question, answer) が並ぶ",
    "W1（auth.relevance=relevant かつ exposure.relevance=irrelevant）だけが成立する記録では、stderr に `warning: W1: …` が出て、終了コードは W1 が無い場合と同じ（ほかが揃っていれば 0）",
    "記録の無い回答（領域 irrelevant・follow-up 非活性・未回答）を参照する条件項は偽として評価する。multi の回答は、いずれかの要素が集合に含まれれば真",
    "domain 問いの回答をどう変えても、規則表の判定は変わらない",
    "SKILL.md の Phase 4 は、done の後に LLM が回答一覧（domain 問いを含む）を読み直し、食い違いがあれば AskUserQuestion で確認する手順を持つ",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D7",
    "docs/specs/sitecraft-capabilities-rulings.md#C1",
    "docs/specs/sitecraft-capabilities-rulings.md#C3",
    "docs/specs/sitecraft-capabilities-rulings.md#U4",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r7_rules"

[[requirement]]
id = "R8"
statement = "回答の複数選択（multi）と補足（--note）を記録でき、follow-up は any-of で活性化し、値が変わる再記録は [[history]] に追記されて changed 行を出す。"
acceptance = [
    "カタログで multi = true なのは notification.channel だけ。decide add-question --multi で domain 問いを multi にできる",
    "multi の問いは --answer の繰り返しを配列で保存する（1 個でも配列）。空要素・重複・choices 外の要素は記録を変えずに失敗終了する。multi でない問いへの --answer 2 個以上も同じく失敗終了する",
    "multi の問いに旧形式の文字列があれば 1 要素の配列として読む。multi でない問いに配列があれば exit 2",
    "channel=[web-push, email] と記録すると、decide next が email-sender を問う",
    "--note はカタログ回答なら [areas.<a>.notes] <q>、domain 問いなら [[questions]] の note に保存する。--note を付けない再記録は既存の note を残す",
    '値（回答・relevance・note・purpose・capability）が変わる記録ごとに [[history]] に {area, question, old, new, at}（at は UTC RFC 3339、note の変更は question = "<q>#note"）が追記され、stdout に `changed: <old> -> <new>` が 1 行出る',
    "同じ値の再記録では history が増えず、changed も出ない",
    'follow-up の剪定で消える回答は {…, new = "", pruned = true} として history に残る',
]
canon = ["docs/specs/sitecraft-capabilities-rulings.md#D8"]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r8_multi_history"

[[requirement]]
id = "R9"
statement = "classify の dedicated-harness 出力に description と reuse を加え、ユーザーが --confirm-fit yes を記録するまで既存 plugin の再利用を許可しない。simple / dedicated-harness の境界を SKILL に明記する。"
acceptance = [
    "dedicated-harness の出力 JSON に description（existing=true なら marketplace.json の当該 description、false なら null）と reuse が含まれる",
    "reuse は existing=true で fit の記録が無ければ unconfirmed、fit=yes なら confirmed、fit=no なら rejected、existing=false か kind=simple なら not-applicable",
    "--confirm-fit yes|no は existing=true のときだけ受け付けて [features.<F>] fit に記録し、それ以外では失敗終了する",
    "SKILL.md は、description を AskUserQuestion で示してユーザーの回答だけを --confirm-fit に記録すること、confirmed のときだけ既存 plugin を使うこと、unconfirmed を再利用許可と読まないこと、rejected は新規 plugin（別名）の経路に進むことを明記し、旧文言「existing: true ならその plugin を使う」を含まない",
    "SKILL.md に D9 の境界が明記されている: アプリのプロセス内で動き、アプリ利用者のための機能（ジョブ実行・予算制御・通知送信・認証など）は simple。Claude Code のセッション・ツール呼び出し・ファイル編集を判定するもの（hook・gate・検査ハーネス）だけが dedicated-harness",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D9",
    "crates/sitecraft/skills/sitecraft/SKILL.md#Phase 5",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r9_classify_fit"

[[requirement]]
id = "R10"
statement = "sitecraft.toml の任意キー api_paths を check pages が GET で検査し、SKILL に Vite + Hono（@hono/vite-dev-server）を 1 つの dev command で起動する手順を持つ。"
acceptance = [
    "api_paths（/ で始まる文字列の配列、既定は空）を sitecraft.toml が受け付け、/ で始まらない要素はエラーになる。trust 対象は従来どおりファイル全体",
    "check pages は各 api_paths に http://127.0.0.1:<port> から GET し（リダイレクトは追わない）、2xx 以外と接続失敗は exit 1、1 パスあたり 10 秒超過は exit 2",
    "SKILL.md に、Vite + Hono（@hono/vite-dev-server）でフロントと API を 1 つの dev command で起動する手順（vite.config.ts と server/app.ts の構成）がある",
