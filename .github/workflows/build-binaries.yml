name: build & commit plugin binaries

# Build the per-plugin bundled binaries on real runners and commit them
# back into crates/<plugin>/bin/. The committed per-platform binaries are what
# `/plugin install` ships, so end users need neither cargo nor an API key.
#
#   * smoke      — build + test the whole workspace on Linux and macOS (the gate).
#   * darwin     — build every distributable plugin for both apple targets (macos-14).
#   * linux      — build every distributable plugin for x86_64 linux (ubuntu).
#   * linux-arm64 — cross-build every distributable plugin for aarch64 linux, using
#                   the gcc-aarch64-linux-gnu cross linker on an x86_64 ubuntu runner
#                   (no QEMU/emulation — a linker-only cross-compile).
#   * commit     — collect the artifacts and commit the refreshed bin/<name>-<os>-<arch>
#                  back to main (only on push-to-main / manual dispatch, never on PRs).
#
# Exclusion rule for the binary matrix (PLUGINS below): it lists every crate
# directory under crates/ that ships a committed bin/ to end users. A crate is
# excluded ONLY for one of the reasons below, and every exclusion is named:
#
#   * harness-core       — a library (no [[bin]]); compiled into every plugin.
#   * integration-tests  — a test-only crate (publish = false, no [[bin]]).
#   * mutategate         — an internal, deliberately NON-DISTRIBUTED tool (this
#                          workspace's mutation-testing kill-rate gate; see
#                          docs/GLOSSARY.md). No plugin.json, no marketplace
#                          entry, publish = false.
#   * scout, daily-report — skill-only plugins (no Cargo.toml / no Rust crate);
#                          they ship skills + hooks only, nothing to build.
#
# Everything else in crates/ IS distributed and MUST appear in PLUGINS.
# specguard is distributed (it has a marketplace entry and a committed
# crates/specguard/bin/) — only its `specguard` bin is shipped; the extra
# specforge / testaudit bins in its Cargo.toml are dev/POC tools and are not
# committed, so the default (bin name == package name) build is correct.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**/src/**'
      - 'crates/**/Cargo.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/build-plugin-bin.sh'
      - '.github/workflows/build-binaries.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  # Distributable plugins, by CRATE DIRECTORY (build-plugin-bin.sh reads the
  # package name out of crates/<dir>/Cargo.toml, so a dir that differs from the
  # package name is fine — but the DIR must exist: the script does
  # `sed ... crates/$plugin/Cargo.toml` under `set -euo pipefail`, so a stale
  # entry exits 1 and aborts the whole build loop, silently starving every
  # plugin after it. Keep this list in sync with `ls crates/` minus the
  # exclusions named in the header comment above, and with the sbom-attest
  # matrix at the bottom of this file.
  PLUGINS: >-
    autoflow backlog beacon benchkit blastguard budgetguard compass condukt
    context-governor ctxrot curate daily deepwiki difflog donegate evalkit flow
    fugu-router gauge harness-status hypothesis overwatch playbook
    precommit-audit propguard replaykit reviewgate runbook schemaguard
    session-insights ship specguard stuckguard taskprog tdd tracekit
    trajectoryeval

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/check-versions.sh
      # Reject panic=abort builds: catch_unwind (never-break-a-turn) is a NO-OP
      # under abort. Asserts [profile.release] pins unwind + the harness-core
      # compile_error! backstop is intact, before the heavy release build below.
      - run: ./scripts/check-unwind.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      # Explicit, named build of every binary crates/integration-tests/tests/e2e.rs
      # shells out to. `cargo build --workspace --release` above already covers
      # this, but this step keeps the e2e binary prerequisite legible and
      # independently correct even if the workspace build step above were ever
      # narrowed. GitHub Actions sets `CI=true` for every job, so if a required
      # binary is somehow still missing after this step, `bin()` in e2e.rs
      # panics (see crates/integration-tests/tests/e2e.rs) instead of silently
      # skipping the test.
      - run: cargo build --release -p flow -p backlog -p fugu-router -p condukt
      - run: cargo test  --workspace

  darwin:
    name: darwin binaries
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build darwin binaries (arm64 + x86_64)
        run: |
          set -euo pipefail
          for p in $PLUGINS; do
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              bash scripts/build-plugin-bin.sh "$p" "$t"
            done
          done
      # tar preserves the crates/<plugin>/bin/ layout AND the executable bit.
      - run: tar czf darwin-bins.tar.gz crates/*/bin/*-darwin-*
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-bins
          path: darwin-bins.tar.gz
          retention-days: 1

  linux:
    name: linux binaries
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build linux binaries (x86_64)
        run: |
          set -euo pipefail
          for p in $PLUGINS; do
            bash scripts/build-plugin-bin.sh "$p" x86_64-unknown-linux-gnu
          done
      - run: tar czf linux-bins.tar.gz crates/*/bin/*-linux-*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bins
          path: linux-bins.tar.gz
          retention-days: 1

  linux-arm64:
    name: linux binaries (arm64)
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest ships an x86_64 gcc only; the aarch64-linux-gnu cross
      # toolchain provides the linker cargo needs to produce arm64 ELF
      # binaries from this x86_64 runner (no QEMU/emulation required — this
      # is a linker-only cross-compile, matching build-plugin-bin.sh's
      # existing triple-normalization for aarch64-* -> arm64).
      - name: Install aarch64 cross linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build linux binaries (arm64)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          for p in $PLUGINS; do
            bash scripts/build-plugin-bin.sh "$p" aarch64-unknown-linux-gnu
          done
      - run: tar czf linux-arm64-bins.tar.gz crates/*/bin/*-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bins
          path: linux-arm64-bins.tar.gz
          retention-days: 1

  commit:
    name: commit binaries
    # Only land binaries on main; never from a PR (can't/shouldn't push).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [darwin, linux, linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # SLSA build provenance: id-token mints the OIDC token Sigstore signs with;
      # attestations writes the attestation to the repo's attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage rebuilt binaries
        run: |
          set -euo pipefail
          tar xzf artifacts/darwin-bins/darwin-bins.tar.gz
          tar xzf artifacts/linux-bins/linux-bins.tar.gz
          tar xzf artifacts/linux-arm64-bins/linux-arm64-bins.tar.gz
      # Generate SLSA build provenance for the exact binaries we are about to
      # commit (and that `/plugin install` ships). The attestation binds each
      # binary's sha256 digest to this workflow run as the builder, so a consumer
      # can verify supply-chain origin with:
      #   gh attestation verify <binary> --repo <owner>/<repo>
      #   slsa-verifier verify-artifact <binary> --source-uri github.com/<owner>/<repo>
      # First-party action (actions/ org), consistent with the no-third-party
      # rule. Gated to main (the job's `if`), so only landed binaries are attested.
      - name: Attest build provenance for committed binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            crates/*/bin/*-darwin-*
            crates/*/bin/*-linux-*
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/*/bin
          if git diff --cached --quiet; then
            echo "binaries unchanged — nothing to commit"
            exit 0
          fi
          # [skip ci] is belt-and-suspenders: the bin/ paths are not in this
          # workflow's path filter, and pushes made with GITHUB_TOKEN do not
          # re-trigger workflows, so this commit will not loop.
          git commit -m "ci: rebuild plugin binaries [skip ci]"
          # checkout leaves a detached HEAD at the triggering SHA; push the new
          # commit explicitly onto main (fast-forward from that SHA).
          git push origin HEAD:main

  sbom-tool:
    name: build cargo-cyclonedx
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --root /tmp/cyclonedx-tool
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-cyclonedx-bin
          path: /tmp/cyclonedx-tool/bin/cargo-cyclonedx
          retention-days: 1

  sbom-attest:
    name: SBOM attestation (${{ matrix.plugin }})
    # Only attest against binaries actually landed on main (never on PRs).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [commit, sbom-tool]
    strategy:
      fail-fast: false
      matrix:
        # Must mirror the PLUGINS env list at the top of this file (same crate
        # directories, same exclusions).
        plugin: [autoflow, backlog, beacon, benchkit, blastguard, budgetguard,
                 compass, condukt, context-governor, ctxrot, curate, daily,
                 deepwiki, difflog, donegate, evalkit, flow, fugu-router, gauge,
                 harness-status, hypothesis, overwatch, playbook,
                 precommit-audit, propguard, replaykit, reviewgate, runbook,
                 schemaguard, session-insights, ship, specguard, stuckguard,
                 taskprog, tdd, tracekit, trajectoryeval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Same rationale as the provenance attestation above: id-token mints the
      # OIDC token Sigstore signs with, attestations persists the result.
      id-token: write
      attestations: write
    steps:
      # commit (needs:) has already pushed the refreshed binaries onto main by
      # the time this job starts; check out main explicitly (not the
      # pre-rebuild triggering SHA) so subject-path resolves to those files.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: cargo-cyclonedx-bin
          path: /tmp/cyclonedx-tool/bin
      - name: Install cargo-cyclonedx from shared build
        run: |
          chmod +x /tmp/cyclonedx-tool/bin/cargo-cyclonedx
          echo "/tmp/cyclonedx-tool/bin" >> "$GITHUB_PATH"
      - name: Generate CycloneDX SBOM
        run: bash scripts/generate-sbom.sh ${{ matrix.plugin }}
      - name: Attest SBOM for committed binaries
        uses: actions/attest-sbom@v4
        with:
          subject-path: crates/${{ matrix.plugin }}/bin/*
          sbom-path: target/sbom/${{ matrix.plugin }}.cdx.json
