  (c) 13 行ずらす (チケットの実測は 11 行のずれ) -> **再現**:
      [BLOCK] docs/plugin-dependency-graph.md:141 -> SKILL.md:130
              line-drifted (quote is at line(s) 143 but the claim cites 130)
      ほか計 5 件。このとき staged SKILL.md count = 0、すなわち
      **index には一切入っておらず、コミットされる木では引用は正しいまま**。

したがってチケットの記述どおり、ゲートは「このコミットは正しいか」ではなく
「作業ディレクトリ全体は整合しているか」を見ている。他セッションが 11 行以上の
未 stage 変更を持っているだけで、その行を一度も触っていないセッションの
pathspec commit がブロックされる。ブロック解除の最短経路のうち 2 つ
(--no-verify / 自分のコミット時点では偽になる行番号へ書き換える) が有害で
あるという構造も変わっていない。LINE_DRIFT_TOLERANCE=10 は緩和にはなるが、
閾値の内側に収まるかどうかは他セッションの編集量という自分の制御外の量で
決まるので、解決ではない。

【残る作業】check-doc-claims (および同エンジンを使う check-claudemd-claims)
が、pre-commit 実行時には作業ツリーではなく **index (git show :<path>)**
を読むようにする。doc 側と被引用ファイル側の両方を同じ源から読むこと
(片方だけを index にすると、源の不一致それ自体が新しい fail-open になる)。

--- 両半分とも解消。実測して done にする 2026-09-11、測定点 cf51306d ---

前回の再測定で「未着手1 は既に landed、未着手2 は今も再現」と二分していた。
未着手2 の修正が landed した (a6c05aef、実装は 64deb1c9) ので、通ったことを
根拠にせず自分で測り直した。

【未着手2 の再現シナリオを HEAD で再実行】
前回 (f7ffc2c9) に再現させた条件をそのまま使う: 被引用ファイルを作業ツリーで
13 行ずらし、index には一切入れない。

  対象: crates/condukt/skills/condukt/SKILL.md を 13 行シフト (未 stage)
  staged count: 0
  結果: SKILL.md 由来の [BLOCK] は 0 件。
        check-doc-claims: all cited claims match the index. / exit=0

前回はここで 5 件の [BLOCK] line-drifted が出ていた。解消している。

【対照 -- ゲートが検査をやめただけではないことの確認】
「静かになった」を「直った」と読まないため、同じ差分を stage して測り直した:

  [BLOCK] docs/plugin-dependency-graph.md:141 -> SKILL.md:130
          line-drifted (quote is at line(s) 143 but the claim cites 130)
  [BLOCK] docs/plugin-dependency-graph.md:144 -> SKILL.md:127 line-drifted
  [BLOCK] docs/plugin-dependency-graph.md:181 -> SKILL.md:937 line-drifted

同一の drift が stage された瞬間に、チケットが記録していたのと逐語で同じ
finding を出す。つまりゲートは「作業ディレクトリ全体が整合しているか」ではなく
「このコミットは正しいか」を見るようになった。測定後、作業ツリーは復元済み。

【未着手1 は前回の再測定どおり landed 済み】
crates/precommit-audit/src/main.rs:359 の attribute_from_session による
帰属絞り込みが実装済みで、Narrowed / Undetermined を明示的に処理し、
判定不能を「自分の変更ではない」へ倒していない。

【この修正が持ち込んだ別の性質 -- 引き継ぎとして記録】
index を源にしたことで、未 track の被引用ファイルは path-not-found (exit 1)
として扱われるようになった。担当 agent は Undetermined (exit 2) 案も実装して
