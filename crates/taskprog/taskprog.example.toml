# taskprog.toml — multi-session progress file for Claude Code
#
# Place in the project root or home (~/.taskprog/config.toml).

enabled = true

# Path to the progress markdown file.
# Default: <project root>/.claude/progress.md (nearest ancestor with a .git)
# progress_file = "~/.claude/progress.md"

# No effect: the SessionStart hook no longer injects the progress file (hooks
# print nothing). Kept for backward compatibility; `taskprog status` shows it.
inject_limit = 4096
