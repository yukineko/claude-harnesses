spec title: sitecraft を Web アプリを超える課題（能力・実機検証・停滞検知）まで拡張する
statement: Web アプリ以外の能力を sitecraft decide capability で [capabilities.<name>] に登録できる。verify.kind は閉じた 3 種で、command 種の argv は D2-trust の digest で人間の trust を要する。

done_criteria (spec の acceptance を逐語で。言い換えないこと):
  - sitecraft decide capability --name N --relevance R --how T --done-when T --verify-kind K と種別ごとの引数で、[capabilities.N] に relevance・how・done_when・verify が保存される
  - name が ^[a-z0-9][a-z0-9-]*$ に一致しない場合は記録されず、失敗終了する
  - verify.kind が builtin:blender-headless / builtin:threejs-render / command 以外、必須キー（blender-headless: script・glb・render、threejs-render: page、command: argv（空でない文字列配列、先頭は空白でない）・inputs（空でない glob 配列））の欠落、または型不一致のとき、sitecraft decide check が exit 2
  - relevance=relevant の能力で how / done_when / verify のどれかが無いとき、sitecraft decide check が exit 1
  - [capabilities] テーブルが無い project では、能力に関する指摘を何も出さない（能力なしとして扱う）
  - sitecraft trust は、command 種の能力が 1 つ以上あれば、[name, argv] を name 昇順に並べた JSON 配列の sha256 を trust store のキー `<canonical root>#capabilities` に記録する。command 種が 0 個ならこのキーを要求しない
  - command 種の argv を変えた後、trust し直す前に sitecraft check capability <name> を実行すると、コマンドを実行せず exit 2 になり、sitecraft trust の案内を出す。trust store が読めない場合も exit 2
  - how / done_when / builtin 種の verify の変更では D2-trust の記録は無効にならない
  - 値の違う能力を再記録すると [[history]] に area = "capability", question = N で追記される
  - SKILL.md は、能力の how / done_when を AskUserQuestion でユーザーに決めてもらう手順を持ち、LLM が sitecraft trust を代わりに実行しないことを明記している

