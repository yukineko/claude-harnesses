id = "5b0e9fe1"
title = "taintguard: mark matcher covers Read only, so Grep/Bash/Glob import external content untainted"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "injection",
    "taintguard",
    "p1",
]
status = "pending"
notes = """
Measured 2026-08-05 against the deployed 0.1.6 binary with an isolated TAINTGUARD_STATE_DIR (anti-vacuity control: an in-repo Read stays SILENT in the same run, so the probe is not uniformly firing).

hooks.json PostToolUse matcher is WebFetch|WebSearch|Read, and decide_mark (main.rs:104-118) has a catch-all _ =+ Ok(()). Observed: tool_name Grep produced NO taint, so a following Bash was allowed.

The consequence is an asymmetric boundary. These import external-provenance content into context and do NOT taint:
  - Grep with output_mode content over a path outside the repo
  - Bash reading an external file (cat, head, less) -- Bash is in the GATE matcher only, never the MARK matcher
  - Bash fetching a URL (curl, wget) -- i.e. the exact channel WebFetch is marked for
  - Glob, NotebookRead, and MCP tools returning remote content

Meanwhile a Read of the session worktree (mandated by CLAUDE.md section 8) DOES taint. So the gate is strict on an internal, trusted, mandated path and open on the external ones it exists to cover. See 270f36fa for the other half.

Not claimed: I did not measure whether an MCP tool result reaches PostToolUse at all -- that is unverified, not refuted.

Done when: a probe shows an external-content Grep and an external-content Bash read both taint the session, with an in-repo Grep and an in-repo Bash read still clean in the same run."""
