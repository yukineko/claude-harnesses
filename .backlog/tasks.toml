notes = "Observed 2026-10-26 (session c5b9c02b). scripts/guard-maintree-bash.py (PostToolUse:Bash) refused a command that wrote only inside a scratchpad worktree. Verbatim: Refused: this command modified this project's MAIN working tree outside integration (CLAUDE.md 8: main only receives merges). Changed in /Users/yuki/src/harness: .backlog/tasks.toml ... During that call another session merged into main: 807ca59e (backlog: add 775e5bc8), merge 16f2e9c9 (reflog: merge c5b9-sessionroots-red: Merge made by the 'ort' strategy). Something similar happened earlier the same session. Mechanism (reproduced): the message has no 'HEAD a -> b' line, so HEAD was equal at Pre and Post. The Post snapshot fell inside the other session's git merge window (merged tree already in main's index and worktree, HEAD not yet moved, no MERGE_HEAD; git runs pre-merge-commit there, and .githooks/pre-merge-commit runs gates, so the window is long). post() at scripts/guard-maintree-bash.py:343-357 then falls through to verdict = REFUSE and prints 'this command modified'. A merge that completes between Pre and Post is already allowed (integration_head, :350-355; control test green). Repro: scripts/test_guard_maintree_bash_concurrent_merge.py, committed 0deb7cef, merged 64ca934b; RED 2026-10-26: 1 failed, 2 passed (test_red_post_inside_concurrent_merge_window_does_not_blame_command, guard rc=2 naming tracked.txt). Done when that test is green with both controls still green: the guard allows, or stops claiming 'this command modified' when the change is another session's in-flight merge. The refusal must stay fail-closed when the cause cannot be determined."
