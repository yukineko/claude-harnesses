notes = """
Observed 2026-08-14, measurement point ee214481, during a fresh condukt run init.

condukt state set --status running refused two tasks with "task skipped - N file(s) already claimed by a live run". The claim registry (condukt state claims) named three holders:

  crates/condukt/tests/worktree_reconcile.rs -> run-20260814-023742-67810, holder_pid 68483
  crates/backlog/src/store.rs                -> p0trio-1, holder_pid 94820
  crates/backlog/Cargo.toml                  -> p0trio-1, holder_pid 94820
  crates/backlog/.claude-plugin/plugin.json  -> p0trio-1, holder_pid 94820
  crates/condukt/src/claim.rs                -> p0trio-1, holder_pid 94789

MEASURED: all three pids are dead. "ps -p 68483 / 94820 / 94789" returns no such process for each.
MEASURED: p0trio-1 claimed_at = heartbeat_at = 1786499161, wall clock at observation = 1786643679.
That is 144518 seconds, about 40 hours, and the heartbeat was NEVER refreshed after the claim
(claimed_at and heartbeat_at are byte-identical).

So the predicate behind the word "live" in that refusal message is satisfied by a claim whose
