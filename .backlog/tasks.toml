touched_files = []
status = "pending"
notes = "Observed 2026-11-21 (main 79efa2c7c era, blastguard 0.2.857 source / 0.2.840 deployed; re-measured on 0.2.858). A Bash command from the main session of the shape: cd WORKTREE and-and cat append-redirect docs/specs/blastguard.md with a QUOTED heredoc 'EOF' whose markdown body contained a backticked path like ~/.backlog/drivers/<fnv1a64(canonical main tree) %016x>/<fnv1a64(session_id) %016x>.driver, followed by git add and git commit, was blocked by PreToolUse. Verbatim reason: '> .driver`' destroys the file's current contents and `.driver`' contains a shell expansion, so blastguard cannot tell which file this names, let alone whether its contents are recoverable. Measured: the heredoc append alone is allow; adding a cd prefix (reason: relative path) or a trailing git add/commit line makes it deny. Readings: (a) FP - quoted delimiter means the body is inert data, the angle bracket in the body is not a redirect; (b) intended - body lines judged as shell even when quoted. Tell apart: the append-alone form with the identical body is allow, so the verdict depends on the surrounding command, not on the body or on what executes; cat never interprets the body, so (a). Control row: a real echo with a truncating redirect to a quoted dollar-expansion path stays not-allow."
