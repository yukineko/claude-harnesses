    -status = "pending"    +status = "claimed"     x3
    -updated_at = 1786499132 / 1786496451 / 1786499132
    +updated_at = 1786635870                       x3

つまり:
  * **subagent ではない。** 私 (main loop) が直接叩いたコマンドである。
  * **`add` ではない。** `next --claim` という読み取り兼予約の書き込みである。
  * **偶発ではない。** /flow SKILL.md が Step 3-1a で処方している手順そのもの。

**したがって旧本文の「原因の候補: subagent の Bash cwd は project root を既定にする」は
1 事例の説明であって原因ではない。** 本当の構造は:

  store は checkout に追従する (repo root ごとに .backlog/tasks.toml、linked worktree は
  それ自身が root)。一方 /flow の記帳ステップ —— Step 3-1a `next --claim`、3-1c
  `backlog add`、3-3 `backlog done`/`fail`、および `compass outcome` —— は driver の
  cwd で走る。セッションを repo root で開始していれば driver の cwd は main である。
  **よって skill が処方する手順を素直に実行するたびに、毎イテレーション §8 に違反する。**

**この観測が falsify したもの**: 旧本文の修正候補 (b)「condukt worker のプロンプト規約と
して backlog add の前に worktree へ cd させる」は**単独では不十分**である。driver 自身を
カバーしないし、規約 = 自己申告依存なので CLAUDE.md 6 が禁じる置き方でもある。
残る候補 (a) store 解決を git worktree 境界で行う / (c) machine-global 化 の 2 つは
今も有効で、どちらも呼び出し側の行儀に依存しない点が (b) と違う。

**同一バイナリで着地先が分かれることの再確認**: 同じ turn 内で、私が worktree へ cd して
から叩いた `backlog done` x3 と `backlog edit --notes` は worktree 側の store に入り、
main には 1 行も書かれなかった。cwd だけが違いである (旧本文の観測と一致)。

**今回の退避**: 失うと困る実状態なので破棄せず、main の tasks.toml を worktree へコピー
して差分が上記 3 遷移だけであることを確認したうえで commit (ba9d9d38) し、main へ
merge (87cd53b1) して戻した。merge 後の main で `grep -c 'status = "claimed"'` = 3 を確認。
**これは毎イテレーション必要な手作業であり、回避であって修正ではない。**

**追加で判明した副作用**: この round-trip の merge が post-merge hook を起こし、
.specguard/spec-map.toml の last_synced が再び動いて main が dirty になる
(48bdc55b のデッドロック)。つまり本 item を踏むたびに 48bdc55b も必ず踏む。
2 件は独立ではなく連鎖するので、片方だけ直しても /flow の 1 イテレーションは
clean に終われない。
