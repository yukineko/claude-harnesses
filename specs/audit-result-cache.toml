id = "R4"
statement = "監査ごとのルール指紋は E5 の入力に加え、R4 / D6 が求める監査実装の内容ハッシュを含む。どれか 1 つでも変われば、その監査は全件を再監査する。"
acceptance = [
    "check-fail-open.py の指紋は、スクリプトの内容ハッシュ・check-fail-open.baseline の内容ハッシュ・python の major.minor から作られ、どれか 1 つを変えるとすべてのファイルが監査される",
    "check-raw-io-ratchet.py の指紋は、スクリプトの内容ハッシュ・check-raw-io-ratchet.baseline の内容ハッシュ・python の major.minor から作られ、どれか 1 つを変えるとすべてのファイルが監査される",
    "sitecraft の指紋は、crate バージョン・シンクパターン集合のハッシュ・sitecraft.toml の web_globs・実行中バイナリの内容ハッシュから作られ、どれか 1 つを変えると（バージョンは同じでもバイナリが違う場合を含めて）すべてのソースが監査される",
    "指紋の入力のうち 1 つでも読めない（baseline が無い、実行中バイナリが読めない、など）ときは Undetermined として全件を監査し、その実行では何も記録しない",
]
canon = [
    "要望 R4 / D6 / E5",
    "scripts/check-fail-open.py:98 / scripts/check-raw-io-ratchet.py:105（GATE_CRATES はスクリプト内にあるので、スクリプトのハッシュで覆われる）",
    "crates/sitecraft/src/check/security.rs:591-617（sinks）",
]
falsifiable = true

