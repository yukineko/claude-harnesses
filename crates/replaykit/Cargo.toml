[package]
rust-version.workspace = true
name = "replaykit"
version = "0.1.9"
edition = "2021"
description = "Trace-to-golden replay regression harness that distils a tracekit-recorded condukt run into an evalkit golden case pinning the run's phase set, error count and cost."
license = "MIT"

[[bin]]
name = "replaykit"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
