That is the definition of a fixture that is not hermetic - /tmp is in the fixed TEMP_ROOTS and
/var/folders is not, so on Linux the fixture's tmpdir:None agreed with production by accident.

THE CHANGE (fixture setup only; no production file was touched, and detect.rs is byte-identical to
HEAD). The case now creates its own pid-named scratch directory under the process temp dir and hands
that directory to SafeRoots::new as the tmpdir argument, exactly as main.rs:364 does, then judges
through scoped_with instead of scoped. Side 2 (the absent-target Allow) was moved onto the same
scratch root and the same root set, for consistency; it reaches Allow ahead of the location axis
either way, so no verdict moved. The assertion text, the expected Ask and the expected Allow are all
unchanged. check-test-weakening reports clean (verdict clean, findings []), which is the mechanical
statement that no assertion was removed, no test deleted, no ignore added.

