notes = """
2026-08-07 の会話でユーザーが確定させた設計。着手前にここへ落とす。

## 何を作るか

/flow に drain オプションを足す。**別コマンドではなくオプション**（ユーザー選択）。
無印 /flow の既定挙動は変えない。

別コマンドを採らなかった理由: driver register / next --claim / claim-task /
sink（done と fail）/ release-task / heartbeat という並行性の要を二重に持つことになり、
片方だけ直る乖離バグの温床になるため。実測前例として marketplace claim の
over-serialize が同じ型で起きている。

## 実行スコープの定義（2026-08-07 にユーザーが上書きした）

**「1つのタスクと、それに関連するタスクの解決まで」**。

- 関連する残件は **すべて** 処理する。
- 無関係な残件は **実行しない**。

当初案の「backlog が空になるまで回す」は**破棄**された。pending が 208 件あり、
毎回それを丸ごと抱え込む形になるため。

## 失敗時の扱い（ユーザー選択）

item が失敗したら backlog fail で落として次の item へ進む。連続失敗で止めない。

根拠: fail も pending を減らすので、関連クラスタは必ず単調減少し無限ループにならない。
これは autoflow が v0.1.16 で回数上限を progress ベースへ置き換えたのと同じ理屈。
最後に失敗一覧をまとめて報告する。

## 維持する停止条件（緩めない）

- 予算超過（budgetguard の早期脱出はどのモードでも不変）
- stall（既定 1800 秒）
- ユーザー中断
- condukt circuit check のうち **failure-streak だけ** drain では解除する。
  budget と stall は維持する。

## 未決（着手前に決める）

「関連」をどう判定するか。散文で LLM が決めると CLAUDE.md 第6節が禁じる自己申告に戻る。
決定論の判定手段が要るので別 ticket af239090 に切り出した。**それが決まるまで実装に入らない。**

## 前提

condukt 0.7.124 / flow 0.2.5 で入れた policy answer の approval クランプ
（権限認可は常設許諾・判断要求は Ask を残す）と組み合わせて動く。
drain 中に残る human stop は pivot / worker blocked / untestable のみ。
"""
