notes = "Test detect::tests::d4_exponential_find_exec_is_bounded_and_denies is meant to prove that analysis of an exponential find -exec is BOUNDED (budget exhaustion yields Ask/Deny, never a hang or Allow). It asserts wall time under 2s, which is load-sensitive: observed 2.29s, 3.5s, 6.43s under machine load, about 0.6s alone; fails on main; repeatedly fails donegate Stop checks. Repro: 40 busy loops on 8 cpu gave 3/3 failures at 25-29s. Fix direction: measure work done (steps or nodes visited) instead of wall time, without weakening the bound (keep the bound tight, assert still Ask/never Allow)."
