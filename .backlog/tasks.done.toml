[[task]]
id = "d7e1ac30"
title = "backlog: lock acquire budget measures 9.97s against a 10s stale-reap threshold, so a LIVE holder gets reaped and two writers barge into the same RMW"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p0"]
