[package]
rust-version.workspace = true
license.workspace = true
name = "hypothesis"
version = "0.1.24"
edition = "2021"
description = "PDO hypothesis lifecycle management for Claude Code: create, validate and track the falsifiable bets behind a compass goal, so shipping is not mistaken for validating."

[[bin]]
name = "hypothesis"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
