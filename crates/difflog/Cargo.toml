[package]
rust-version.workspace = true
name = "difflog"
version = "0.1.13"
edition = "2021"
description = "Session diff-log for Claude Code: snapshots HEAD at SessionStart and records a structured git diff summary at SessionEnd, with a /difflog skill that turns it into a readable narrative."
license = "MIT"

[[bin]]
name = "difflog"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
