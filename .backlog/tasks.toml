[[task]]
id = "64e1287c"
title = "context-governor: add prompt-caching cache breakpoints (cost lever, not token lever)"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "industry",
    "scout",
    "context",
    "p1",
    "wontfix",
]
status = "done"
notes = """
Structure resident prefix in cache-stable order (static spec/loadset/tool defs first, dynamic task instr last) + cache_control breakpoints; cuts input cost ~90% / latency ~85%; a per-turn dynamic header would silently invalidate cache. 証拠: https://code.claude.com/docs/en/prompt-caching (Claude Code/Cline rely on it). 完了条件: resident context emitted in cache-stable order with explicit cache_control breakpoints; measurement shows cache-read tokens dominate input tokens across consecutive turns.
architecturally inapplicable to a hook plugin. Traced both injection paths (defaults/injector.rs UserPromptSubmit + defaults/rehydrator.rs SessionStart). A hook emits TEXT (additionalContext) only; it cannot (1) set API-level cache_control breakpoints — the Claude Code client owns the request and its cache breakpoints; (2) reorder the resident prefix (system prompt / loadset / tool defs are assembled by the client, not emitted by context-governor); (3) measure cache-read vs input token dominance (Stop context_window exposes total_input/output_tokens, not the cache-read split). The crate's own emitted injections are already deterministic with no per-turn-varying header (already cache-stable in the only sense a hook controls), and lib.rs/README already document the stable-prefix principle. No shippable build delivers the stated value (~90% input-cost cut is client-side). Recommend reclassify: either (a) close as guidance-only (docs already cover it), or (b) retarget at whatever component actually assembles the API request, which is out of this plugin's scope.
調査済み・実装不能につき guidance-only として close (ユーザー裁定 2026-08-02)。hook は additionalContext のテキストしか出せず、API の cache_control breakpoint 設定も resident prefix の並べ替えも Claude Code client 所有。cache-read/input の内訳も Stop の context_window から観測できない。詳細な traced 分析は notes に保持。"""
created_at = 1782753890
updated_at = 1785971334
defer_until = 1785807264
weight = 0.0

[[task]]
id = "966ae7aa"
title = "context-governor: order injected context to avoid lost-in-the-middle"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "industry",
    "scout",
    "context",
    "p1",
    "wontfix",
]
status = "failed"
notes = """
U-shaped attention bias under-attends middle (>30% degradation vs edges); place highest-relevance chunks at start AND end, bury least-relevant in middle. Cheap, separate ordering pass over already-selected chunks. 証拠: https://docs.haystack.deepset.ai/reference/rankers-api (LostInTheMiddleRanker). 完了条件: injected spec/retrieved chunks emitted in edge-weighted order (rank1 first, rank2 last, lowest centered) via one ordering pass.
Inapplicable to context-governor's hook architecture as scoped. Lost-in-the-middle edge-ordering requires a MULTI-CHUNK relevance-ranked injection; the injector emits exactly ONE best-scoring section (injector.rs:92-106 max_by_key), and the rehydrator emits normative pins with no query to rank by. Adding top-K multi-chunk retrieval to create ranked chunks fights the crate's explicit size-minimization axis (lib.rs 'minimize resident normative text'), and edge-ordering resident pins would risk burying Verbatim content mid-context, contradicting I2 lossless-recall. Deferred by user decision to pursue grounded safety/autonomy p1s. Recommend reclassify as guidance-only or retarget if multi-chunk retrieval is ever introduced.
調査済み・実装不能につき guidance-only として close (ユーザー裁定 2026-08-02)。edge-ordering は multi-chunk の relevance-ranked injection を前提とするが、injector は最高スコア 1 section のみ、rehydrator は ranking する query を持たない。top-K 導入は crate の size-minimization 軸と I2 lossless-recall に反する。詳細は notes に保持。"""
created_at = 1782753890
updated_at = 1785634509
defer_until = 1785807264
