notes = """
47eedff9 / f232c901 / 572c8640 の統合。3 件は別々に起票されていたが、同一クラスである。
いずれも「単独実行では通り、full-suite 並列でのみ落ちる」= テストがプロセス外の共有状態に依存している。

■ 統合前の 3 件の実測（原文を失わないためここに転記）

(1) 47eedff9 — oracle::tests::no_reproduction_tests_falls_back_even_when_required
    2026-08-11、8b871bb1 の implementer が full-suite 1 回目で crates/condukt/src/oracle.rs:248 の
    失敗を観測したが、assertion payload を捕まえる前に再現しなくなった (以後 9 連続 pass)。
    独立 verifier は単独 40 回・full-suite 10 回で再現せず、root cause は UNVERIFIED
    (benign とは判定していない)。
    重要な負の結果: 「bare task id t1 と共有 ~/.tdd/state を他テストと共有している」という仮説は
    経路追跡で REFUTED。proof_dir は root 相対の .tdd、~/.tdd/config.toml は存在せず、
    ~/.tdd/state/log.jsonl に t1 のヒットは 0 件、root は毎回 TempDir。
    requires_oracle=true では valid_fp_oracle の assert しか落ちようがなく、
    それには temp dir が持ちえない proof file が要る。別の原因が残っている。

(2) f232c901 — 同じテスト。2026-08-21、観測点 5bb3579f。
    cargo test -p condukt (760 unit tests 並列) で 4 回中 1 回 FAILED、単体指定では 4/4 通る。
    機構仮説 (未検証): check_oracle(true, None, t1, tmp) は tdd バイナリを spawn するので、
    full-suite 時の負荷で spawn の結果が変わる経路が疑わしい。

(3) 572c8640 — diffrisk_record::tests::every_invocation_is_journaled_even_when_nothing_is_recorded
    2026-09-10、測定点 59563fde。同一条件 3 回中 1 回だけ赤。
    run1 全ターゲット 768 passed / 1 FAILED、run2 bin のみ 769/0、run3 全ターゲット全 green、
    単独実行 1 passed。
    機構 (最も具体的): crates/condukt/src/diffrisk_record.rs:500 の当該テストは cwd と wt を
    tempfile::tempdir() で作るが、台帳パスだけは Config::load() と state::project_state_dir()
    から導いている (同 504-507 行)。つまり台帳は tempdir の外、実際の共有 state ルート配下に落ちる。

■ このクラスに共通する構造

テスト本体は TempDir で隔離しているつもりでも、(a) 外部バイナリの spawn か
(b) Config::load() 経由の実 state ルート参照で、隔離の外へ漏れている。
別プロセスとして並行実行される cargo のターゲット間では、この漏れが相互干渉になる。

■ なぜ放置してはいけないか

f232c901 の指摘どおり、間欠 fail を放置すると F to P オラクルのゲート自体が
「たまに落ちるので無視するもの」になる。CLAUDE.md 4 が禁じる隠蔽への構造的圧力である。

■ 完了条件

(1) 3 件それぞれについて、台帳・proof・spawn 先が TempDir の外へ出ていないことを
    型または fixture で保証する。
(2) 修正の検証は単発実行ではなく反復実行で行う (再現率が 1/3 から 1/10 なので、最低 20 回)。
(3) 落ちたときに実値 (required / valid_fp_oracle / reason / entry JSON) を残す assertion にする。
    現状は payload が取れず root cause が UNVERIFIED のまま残っている。

■ 判定不能な点

(1) の root cause は今も未同定。共有 ~/.tdd/state 説は REFUTED 済みなので、そこへは戻らないこと。"""
