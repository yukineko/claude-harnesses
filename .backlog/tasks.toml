]
status = "done"
notes = """
UNVERIFIED は 2026-08-06 に解消。結論: 波及は実在し、到達可能。以下は全て HEAD f08fa5f0 のコードを読んで確認した連鎖 (file:line つき)。

連鎖:
1. crates/stuckguard/src/main.rs:118-119 — PostToolUse のたびに fetch_session_anchor が呼ばれる (heartbeat_piggyback_enabled の既定は true、config.rs:161)。
2. crates/stuckguard/src/anchor.rs:59-72 — 「lease が無い」と「overwatch をそもそも実行できなかった」の両方が同じ None になる (意図的に据え置いた沈黙)。
3. crates/stuckguard/src/main.rs:125-129 — anchor が None なら heartbeat_piggyback は呼ばれない。
4. crates/stuckguard/src/anchor.rs:76 以降 — これが overwatch lease の heartbeat を tool call ごとに更新する唯一の経路。他に per-call の更新元は repo 内に無い (grep で確認。condukt state heartbeat は claim registry 用で別物、flow の SKILL は begin/end のみ)。
5. crates/overwatch/src/store.rs:1338-1339 — is_stale は now - heartbeat_at > LEASE_TTL_SECS。
6. crates/overwatch/src/store.rs:53 — LEASE_TTL_SECS = 1800 (30分)。
7. crates/overwatch/src/store.rs:1493-1494 — reap_stale は該当 lease を retain から外す (削除する)。

したがって、overwatch の呼び出しが 30 分以上失敗し続けると、生存中のセッションの lease が剥がされ、他セッションがその作業を取れる状態になる。しかも何の診断も出ない。

これは仮想の話ではない: crates/stuckguard/src/anchor.rs:60 は Command::new("overwatch") と裸の名前で起動しており、backlog 1e783882 が「bare overwatch is not on PATH」を undetermined telemetry で実測済みの本番不具合として記録している。つまり stuckguard はその既知バグの当たる側に居る。

ミラーギャップ (同時に発見): crates/ctxrot/src/hooks/guard.rs:693 は同じ overwatch lease --session --json を呼ぶが、find_overwatch_binary() で解決しており裸名を使っていない。同じ呼び出しの双子の片方だけが修正済み。ただし ctxrot 側は heartbeat を打たない (注入 cadence の判定にしか使わない) ので、reap への波及は stuckguard 側だけ。

未検証として残る点 (正直に記す): 上の連鎖はコードリーディングで辿ったものであり、30 分待つ end-to-end の実行はしていない。両端 (is_stale の判定 / anchor が None を返すこと) は既存テストで守られているが、中間の「沈黙して heartbeat を飛ばす」経路を守るテストは 0 本。

完了条件 (measure から fix へ変更):
(1) anchor.rs:60 を find_overwatch_binary() 相当の解決へ寄せ、1e783882 の当たる側から外す。
(2) fetch_session_anchor の Undetermined を「lease 無し」と区別し、heartbeat を打てなかった事実を診断として出す (stuckguard は advisory なので block はしない)。
(3) heartbeat が飛ばされた経路を守るテストを追加し、RED を先に観測する。"""
