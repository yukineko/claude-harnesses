[[requirement]]
id = "R9"
statement = "pre-push の型検査は、固定パスの専用 worktree を 900 秒の時間制限付き排他ロック下で使い回し、毎回その中で対象 sha に切り替える。内容の変わっていないファイルの mtime を保つ。ロック取得・切り替え・不要ファイル掃除の失敗は block する。"
acceptance = [
    "同じ sha で 2 回続けて pre-push を走らせると、2 回目の `CARGO_LOG=cargo::core::compiler::fingerprint=info` 出力に workspace crate の `dirty:` 行が 0 件",
    "sha A から、1 crate の src だけが違う sha B に切り替えると、dirty になるのはその crate と逆依存の crate だけである",
    "切り替え後、A と B で中身が同じファイルの mtime は切り替え前と同じで、中身が違うファイルの mtime は切り替え前より新しい（mtime を固定値に揃えていない）",
    "別プロセスがロックを保持しているとき、pre-push は 900 秒の時間切れで exit 1 になる",
    "checkout の失敗・`git clean` の失敗・ロック取得の失敗をそれぞれ注入すると、pre-push はどれでも exit 1 になり、型検査を skip して exit 0 にはならない",
    "専用 worktree に untracked のファイルを置いて走らせると、型検査の前に消える",
    "`.githooks/pre-push:397` と `:400` のコメントを、新しい方式に合わせて同じ commit で書き換えている",
]
canon = [
    "要望 R1 / D4 / E3 / E4(3)",
    ".githooks/pre-push:397-401, 424, 431",
    "CLAUDE.md §4（実装を変えたら同じコミットで記述も直す）",
]
falsifiable = true

