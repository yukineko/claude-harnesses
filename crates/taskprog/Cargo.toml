[package]
rust-version.workspace = true
license.workspace = true
name = "taskprog"
version = "0.1.19"
edition = "2021"
description = "Multi-session progress file for Claude Code: keeps .claude/progress.md for handoff across sessions; the Stop hook silently seeds a skeleton when it is missing (hooks print nothing)."

[[bin]]
name = "taskprog"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }
