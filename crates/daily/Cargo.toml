[package]
name = "daily"
version = "0.3.26"
edition = "2021"
rust-version.workspace = true
description = "Daily-once task runner for Claude Code: a SessionStart hook that runs registered shell tasks at most once per calendar day and feeds a summary of what ran back into the session."
license = "MIT"

[[bin]]
name = "daily"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
blastguard = { path = "../blastguard" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = "5"

[dev-dependencies]
tempfile = { workspace = true }
