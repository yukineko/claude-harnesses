id = "f2de7f69"
title = "harness-core attribution: path inside quoted donegate skip --reason becomes a session root (tdd/reviewgate skip twin missing)"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "harness-core",
