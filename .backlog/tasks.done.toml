signature autoflow:record-requested の実体は crates/autoflow/src/main.rs:197。
Phase::Idle で turns >= min_turns かつ tool_events >= min_tool_events のときに
Phase::RecordRequested へ遷移して block する Stop hook であり、
遷移は state::save で永続化されるので 1 セッションにつき最大 1 回しか出ない。
したがって「3 sessions で 3 occurrences」は設計どおりのレートそのもので、
異常の兆候ではない。逆に 1 セッションで 2 回出ていたら欠陥だが、そうなっていない。

両方の読みを残す:
  (a) 実在の欠陥 = ない。コードが per-session 1 回を構造的に保証している。
  (b) 意図的な仕様 = こちら。/session-insights:record を促す設計上の block。
見分ける方法: 同一 session_id で 2 回以上出るかを見る。出れば (a)。
今回の 3 件は 3 session に分かれているので (b) と確定した。

本 item を閉じるのは「作業をした」からではなく「欠陥ではないと観測で確定した」から。
recurrence registry 側の分類の問題は 7a842862 に転記した。"""
