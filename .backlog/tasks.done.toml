--- 2026-09-08: 半分だけ landed。チケットは pending のまま残す ---

【landed】skip 札の側は完了（commit 38ad9dd6、branch fix/issue-15-jsonl-append-race）。
`harness_core::gate::run::consume_skip` に第3引数 `stop_hook_active` を足し、札の
ライフサイクルを三状態にした: honour したら `<marker>.honoured` へ rename して記録を残し、
再入（stop_hook_active=true）の間は「まだ owed」として honour し続け、再入でない stop が
来た時点で記録を削除する。別ゲートが block した stop で札が焼かれる経路は塞がった。
ついでに読めない札（EISDIR 等）を `(no reason given)` として honour する fail-open も
`None`（制限側）へ解決した。donegate / reviewgate / propguard / tdd の 4 呼び出し側は
すでに `HookInput` を持っているので `input.stop_hook_active` を渡すだけで済んだ。
F→P オラクル: RED (e7cc798a) に対して 3 FAILED / 1 ok → GREEN で 4/4。
アンチ空虚の対照（token_is_consumed_exactly_once_on_the_ordinary_path）は両状態で green。

【未着手】attempt 予算の側は**1 行も触っていない**。`state::bump` は
crates/donegate/src/main.rs:237（blocking failures 経路）と :464（refuse 経路）で
今も無条件に呼ばれる（実測 2026-09-08、測定点 = 上記 commit の親、測定コマンド
`grep -n 'state::bump' crates/donegate/src/main.rs`）。

【未着手のまま残す理由 — 判断で埋めないため】この完了条件は 2 つの排他的な設計を並記している:
(A)「bump が『実際に stop が成立したか』に条件づけられる」/ (B)「ゲート横断で共有される」。
(A) を字義どおり実装すると、donegate 自身が block した stop も「成立していない」ので
カウンタが決して進まず、max_attempts の give-up が発火しなくなる ＝ 意図的に置かれている
bounded fail-open（crates/donegate/src/main.rs の refuse() docstring が「it is the residual
risk of this design」と明記）が無期限ブロックに変わる。(B) は 4 ゲートがプロセス跨ぎで
