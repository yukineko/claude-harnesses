[package]
rust-version.workspace = true
name = "reviewgate"
version = "0.1.63"
edition = "2021"
description = "Code-review gate for Claude Code whose Stop hook defaults to off; opt in to inject a review rubric for self-review or to spawn an independent reviewer command."
license = "MIT"

[[bin]]
name = "reviewgate"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
globset = "0.4"
wait-timeout = "0.2"
chrono = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# tests/launcher_missing_binary.rs runs bin/reviewgate from a scratch dir that
# provably has no `reviewgate-<os>-<arch>` sibling, so the missing-binary branch
# is exercised even on a host whose build IS bundled in the repo's bin/.
tempfile = { workspace = true }

[lints]
workspace = true
