notes = '実測 2026-08-06、測定点 90385f84 + harness-core 未コミット差分。cargo test --workspace を 2 プロセス同時に走らせたところ、fugu-router の store::tests::import_episodes_deduplicates が summary.read で left 4 / right 2 を出した。原因は固定パス std::env::temp_dir().join("fugu-router-import-ep-test") を両プロセスが共有し、双方が src.jsonl へ append したこと。同様の固定パスは import_episodes_dry_run_writes_nothing と dedup_episodes_removes_duplicates_preserves_order にもある。donegate/tests/integration.rs:13 の isolated_dir は pid を混ぜているのでプロセス間は分離されるが、同一プロセス内で同じ tag を複数テストが使うと remove_dir_all と create_dir_all が競合し AlreadyExists で落ちる（run1 で観測）。ctxrot の violation_emission_tests::emit_violation_records_a_ctxrot_event も 0 対 1 で落ちた（要調査）。これは CLAUDE.md 第8節が並行 worktree セッションを義務づけていることと直接衝突する: 別セッションが別 worktree で cargo test を回すだけで、こちらのスイートが壊れる（target/ は分かれても /tmp は分かれない）。修正案は固定パスをやめて tempfile::tempdir へ寄せること。'
