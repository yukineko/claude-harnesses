[package]
rust-version.workspace = true
name = "trajectoryeval"
version = "0.1.17"
edition = "2021"
description = "Trajectory-match verifier that checks the ordered tool-call path a worker took against an expected trajectory spec, the path-level sibling of an output verifier."
license = "MIT"

[[bin]]
name = "trajectoryeval"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
harness-core = { path = "../harness-core" }
