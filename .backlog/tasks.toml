Choke point: crates/condukt/src/worktree.rs `merge` is the one deterministic step every task branch passes before main. It already refuses on an unresolvable branch, a base not on main, missing Condukt-Task trailers and an open overlap hold, all before any checkout. An automatic fmt+clippy step on the pinned `tip` belongs in the same pre-checkout block.

