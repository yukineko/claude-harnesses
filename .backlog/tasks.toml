id = "93a8bd27"
title = "reviewgate: changed_files は fail-closed なのに diff_text は fail-open — 変更ありと観測済みなのに空 diff が allow(empty-diff) になる"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "gate",
    "fail-open",
    "p1",
]
touched_files = []
status = "pending"
notes = """
実測 2026-09-13、測定点 1235d60d。propguard で 87dbfbb8 として done になった欠陥の、reviewgate 側の未修正ミラー。

逐語 crates/reviewgate/src/review.rs:205-217 (and は原文の参照記号を置換したもの):

    let files = reviewable_files(cfg, and changed);
    if files.len() < cfg.min_changed_files {
        return allow("no-reviewable-changes", st);
    }
    let crate::git::DiffText { text: diff, truncated } =
        crate::git::diff_text(root, and files, cfg.max_diff_bytes);
    if diff.trim().is_empty() {
        return allow("empty-diff", st);
    }

この allow に到達した時点で changed_files は既に「変更あり」を積極的に観測している (files.len() が min_changed_files 以上)。したがって diff が空になる経路は (a) diff_text 内部の git 失敗、または (b) バイナリ/非UTF-8 の変更しかない。どちらも判定不能であり、CLAUDE.md 第3節が禁じる permissive 側への解決である。

原因は crates/reviewgate/src/git.rs:135 の run_diff。Command の spawn 失敗も非0終了も黙って無視され、出力が空のまま返る:

    if let Ok(o) = Command::new("git").current_dir(root).args(and args).output() {
        if o.status.success() {
            out.push_str(and String::from_utf8_lossy(and o.stdout));
        }
    }

同じモジュール内で changed_files 側 (git.rs:33-79) は collect が false を返したら ChangeScan::Failed に倒す fail-closed になっており、契約が非対称である。git.rs:1-10 のモジュール doc も changed_files の三値だけを説明し diff_text には触れていない。

さらに DiffText の truncated フラグは「大きすぎて切った」だけを表現しており「取得に失敗した」を表現できない。三値が要る: Known(text) / Truncated / Failed。Failed は既存の decide_truncated と同じ bounded block へ倒すのが筋で、写経元はその truncated 経路そのもの。

完了条件: changed_files が非空を返したのに diff_text が空/失敗を返す状況で reviewgate が allow しないことを、先に RED を観測したうえでテストで固定する。空虚テスト防止の対照として、本当に空の diff (クリーンなツリー) では allow(empty-diff) のままであることも同時に固定する。

関連 87dbfbb8 (propguard 側・done) / 8271c1a1 (done だが reviewgate の run_diff は残っている) / 1ddd37e9 / f71ac81a (同じ diff_text の別軸・タイムアウト)。"""
