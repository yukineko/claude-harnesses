notes = "測定 (2026-08-12, worktree p0trio-1-t3-backlog-add-verified, commit ead274ef): store.rs の TASKS_LOCK_MAX_ATTEMPTS (1600) x TASKS_LOCK_SLEEP (5ms) を実際に使い切らせるテストを 3 回走らせたところ、経過時間は 9.951s / 9.967s / 10.003s だった。sleep の overshoot (5ms 公称が実測 ~6.2ms) のため、実際の budget は公称 8s ではなく約 10s である。TASKS_LOCK_MAX_ATTEMPTS の doc comment は 'attempts x sleep = 8s worst case' と書き、さらに 'The budget must stay a comfortable margin BELOW TASKS_LOCK_STALE_SECS (10s) so a queued-behind-many-live-holders waiter is never mistaken for one waiting on a crashed holder and made to reap+barge in early' と主張しているが、実測値 ~10.0s は 10s を下回っておらず margin は存在しない (むしろ同時か超過)。実 holder は lockfile の mtime を作成時から更新しないので、10s 待った waiter は生きている holder の lock を stale とみなして reap し critical section に割り込みうる — この定数がまさに防ぐと書いている race である。docstring と実挙動の矛盾 (CLAUDE.md 第6節 LLM の職務1)。測定方法: 外部 holder が lockfile を保持し background thread で mtime を refresh する fault injection 下で add_with_weight_and_github_push を呼び、Instant::now() の経過を記録した (crates/backlog/src/store.rs の add_must_not_report_success_when_the_tasks_lock_is_unavailable)。"
