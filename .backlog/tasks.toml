[[task]]
id = "b071f4dd"
title = "condukt diffrisk_record test is non-hermetic: Config::load() writes into the LIVE ~/.condukt/state"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
Observed 2026-09-13 as a donegate red on the main tree (test-changed-crates.sh): diffrisk_record::tests::every_invocation_is_journaled_even_when_nothing_is_recorded failed with 'one record per invocation' left=1 right=2, i.e. it saw FEWER records than it appended.

Measured, not inferred:
1. The ledger is APPEND-ONLY jsonl (gatelog::append_diffrisk_outcome), so a lower count cannot come from accumulation-pollution.
2. The test uses Config::load() (the REAL config) and only tempdirs for cwd/worktree. project_dir resolves to cfg.state_dir joined with project_key(repo_root(cwd)), so every run of this test writes into the user's live ~/.condukt/state tree.
3. Swept every diffrisk-outcomes.jsonl under ~/.condukt/state modified in the last 60 min: ALL tempdir-keyed ones have exactly 2 parseable lines and 0 corrupt lines. So the per-tempdir project_key IS unique and cross-PROCESS collision is REFUTED by observation. My first hypothesis (interleaved partial appends dropped by the reader) is falsified.

Remaining hypothesis, NOT yet confirmed: an intra-process race. cargo test runs tests as parallel threads in one binary, and env vars plus process cwd are process-global. If a sibling test mutates the environment that Config::load() reads, the two appends in this test can land in two DIFFERENT state dirs, leaving 1 in the dir the assertion then reads. This fits the evidence but I have NOT reproduced it.

Why it was not settled now: three concurrent condukt cargo processes were live (two cargo test -p condukt, one cargo check in another worktree). Adding a fourth run would make the measurement void, so no clean re-run was possible. Per CLAUDE.md section 2 this is left as undetermined rather than judged ok.

Second, INDEPENDENT finding in the same area, a docstring vs behaviour contradiction (CLAUDE.md section 4): append_diffrisk_outcome documents itself as 'Best-effort but never silent ... reported on stderr so a reader can tell this history has a hole in it', but the READER load_diffrisk_outcomes silently drops unparseable lines via filter_map with ok(). A hole in the history therefore reads downstream as 'fewer events happened' instead of 'this history is unreliable' - an Absent vs Undetermined conflation of exactly the class DoD14 was carved for. The writer keeps its promise; the reader breaks it.

Fix direction: give the test an isolated state_dir instead of Config::load(), and make the reader surface corrupt-line counts rather than dropping them. 【救出 2026-09-29】元 id cd4e4f39。branch session-23af0e35 (0d4a93ec) の未マージ/未コミットの tasks.toml にだけ存在していたため、ブランチ・worktree 整理の前に再起票した。notes 中の関連 id は元 id のまま。 【観測 2026-09-29】condukt 0.7.181 の検証中、cargo test -p condukt --no-fail-fast を 3 回回したうち 1 回で diffrisk_record::tests::every_invocation_is_journaled_even_when_nothing_is_recorded が落ち、残り 2 回と単独再実行 3 回は green。変更 (claim.rs) は diffrisk_record.rs に触れていない。負荷下のフレークで、この非密閉性が原因候補。"""
