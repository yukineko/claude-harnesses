Observed 2026-09-10.

  /Users/yuki/.claude/plugins/cache/yukineko/blastguard/0.2.52/bin/blastguard-darwin-arm64 --version
    -> blastguard 0.2.59

The 0.2.52 directory contains a 0.2.59 build. Behaviourally it answered identically to the 0.2.59 dir on all three probes I ran (the /etc/sudoers.d allow, the /etc/fstab allow, the /etc/hosts deny), which is how I noticed - I was using the older dir as a control and it was not one.

Why it matters: MEMORY records 'deploy provenance not hash' - verify a deployed binary via .deployed-from.json, never sha256. That is right, but it is easy to also read the version DIRECTORY as identifying the build, and this shows it does not. Any audit that keeps an old version dir around as a before/after control will silently compare a build against itself.

Likely cause: rebuild-plugins.sh swaps binaries into existing cache bin files and does not restrict itself to the currently-registered version dir. Either prune superseded dirs eagerly, or leave their binaries alone so the dir keeps meaning what its name says."""
