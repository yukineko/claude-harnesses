notes = """
実測 2026-08-06、crates/harness-core/src/trust.rs。

`trust_roundtrip_and_env_override` (:266 付近) と `resolve_inherits_trust_from_the_main_worktree_but_only_when_it_is_trusted` (:330 付近) はどちらも `std::env::set_var("HOME", home.path())` を打つが、テスト末尾で元の HOME に戻していない。`home` は `tempfile::tempdir()` なのでテスト終了時に削除される。したがって以後、同じプロセス内で `harness_core::config::home()` を読むテストは **存在しないディレクトリ**を HOME として観測する。

比較対象: 同じ crate の `config::tests::home_prefers_home_env_var_over_dirs_home_dir` は `var_os` で退避し、末尾で `set_var`/`remove_var` により復元している。作法は crate 内に既にあり、trust の 2 本だけが従っていない。

今回の flake 修正 (crate 全体で 1 本の `crate::test_env::lock()` に寄せた変更) は **順序**を直列化するので、この漏れは順序競合としては顕在化しなくなった。しかし「テストが後続へ汚染を残す」こと自体は残っており、別の潜在的 flake の種である。今回の変更のスコープ外として意図的に分離した (元のタスクを塞いでいたのは競合であって復元漏れではないため)。

完了条件: 両テストが HOME を退避・復元すること。panic 経路でも戻るよう、スコープガード (Drop 実装) か、復元を担う小さなヘルパを config::tests の作法と共通化する形が望ましい。"""
