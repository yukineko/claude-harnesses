id = "b80023b3"
title = "donegate re-blocks the Stop on an identical finding (same tree, same red output): attempt counter in block_fingerprint defeats the repeat waiver"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "donegate",
