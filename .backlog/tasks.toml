status = "pending"
notes = """
Evidence: crates/context-governor/src/lib.rs:12-16 separates the size axis from the cost axis and states cost as make prefill cheap equals prompt cache. Stable prefixes win here. It gives no number, and no crate derives one.

Rationale: at a ~100 percent hit rate the dominant input-side cost is not misses, it is the resident prefix re-read once per turn. Measured on session 1faeac72 (2026-07-31): 585.58M cache-read tokens for opus-5 across roughly 5017 main plus sub-agent turns, i.e. a resident token is re-read on the order of thousands of times, at 0.1x each. Cache reads are 69.55 percent of opus-5 input-side spend (292.79 of 420.99 USD) while fresh input is 0.008 percent. So the cost of injecting a token into the prefix is not its face value, it is roughly 0.1x times the number of turns that follow - and every hook in this repo that adds additionalContext is making that trade with no number in front of it.

Note the negative result, which is the actionable part: hook output can only be APPENDED (SessionStart, UserPromptSubmit, PostToolUse additionalContext), so a hook cannot reposition or invalidate the cached prefix. Cache PLACEMENT is therefore out of reach - consistent with the earlier finding that scout industry prompt-caching items were architecturally inapplicable. The only levers a hook has are volume and lifetime. Do not queue placement work.

Done when: gauge derives and reports a cost-per-resident-prefix-token-per-session figure, so an injection decision is made against a measured price rather than intuition."""
