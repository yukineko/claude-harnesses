[package]
rust-version.workspace = true
license.workspace = true
name = "harness-status"
version = "0.1.29"
edition = "2021"
description = "Unified human-on-the-loop status dashboard for Claude Code: a /status command that aggregates budgetguard spend and gauge session records into one read-only view."

[[bin]]
name = "harness-status"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# tests/launcher_missing_binary.rs runs bin/harness-status from a scratch dir that
# provably has no `harness-status-<os>-<arch>` sibling, so the missing-binary branch is
# exercised even on a host whose build IS bundled in the repo's bin/.
tempfile = { workspace = true }
