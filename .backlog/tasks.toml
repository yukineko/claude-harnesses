title = "condukt worktree create が 45s timeout 後も git を完走させ、locked な worktree を残しつつ「作成失敗」と報告する (orphan 蓄積の原因)"
project = "/mnt/c/Users/hiroyuki_nakayama/src/harness"
project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-18, 測定点 01deeab2, run-20260818-143719-13654。

## 症状: timeout で kill した後も git が完走し、「作成失敗」と報告しつつ壊れた worktree を registered + locked で残す

再現: /mnt/c (WSL2 drvfs) のチェックアウトで
  condukt worktree create --run run-20260818-143719-13654 --topic t3 --branch condukt/t3
→ stderr (逐語): "condukt: could not create worktree for branch 'condukt/run-20260818-143719-13654/t3' at
   /mnt/c/tmp/aegis-worktrees/run-20260818-143719-13654-t3: git [worktree, add, -b,
   condukt/run-20260818-143719-13654/t3, --, /mnt/c/tmp/aegis-worktrees/run-20260818-143719-13654-t3]
   in <cwd> timed out after 45s and was killed"

## 「失敗」報告に反して残っていたもの (すべて観測値)

  git worktree list | grep run-20260818
    -> /mnt/c/tmp/aegis-worktrees/run-20260818-143719-13654-t3  01deeab2
       [condukt/run-20260818-143719-13654/t3] locked
  git branch --list 'condukt/run-20260818*'   -> + condukt/run-20260818-143719-13654/t3
  ls -d <wt>                                  -> 実在

つまり (i) worktree は git に **登録済み**、(ii) branch も作成済み、(iii) さらに **locked**
(git worktree prune の対象外になる)。condukt 側は失敗として扱っている。

## 決定的な点: 登録された worktree の中身が不完全である

  ls <wt>/crates | wc -l            -> 19
  ls <session worktree>/crates | wc -l -> 44
  ls <wt>/crates                     -> autoflow, backlog, beacon, benchkit, blastguard,
     budgetguard, compass, condukt, context-governor, ctxrot, curate, daily, daily-report,
     deepwiki, difflog, donegate, evalkit, fetchguard, flow  (アルファベット順に flow で停止)
  ls -d <wt>/crates/hypothesis       -> No such file or directory
  git -C <wt> status --porcelain | wc -l -> 1216
  git -C <wt> status --porcelain | head -5 ->
     D  .backlog/tasks.toml
     D  .claude-plugin/marketplace.json
     D  .claude/settings.json
     D  .compass/charter.md
     D  .condukt/knowledge.md

crate ディレクトリが 19/44 しか存在せず、アルファベット順の途中 (flow) で止まっているのは
逐次チェックアウトが中断した形と整合する。さらに index 側は 1216 件を **staged deletion**
として持っている。

## なぜ重大か

この worktree で worker を起動すると、worker は 25 crate が消え 1216 件の削除が staged された
ツリーを「自分の作業ツリー」として受け取る。そこで commit すれば **大量削除を commit する**。
condukt が「作成失敗」と報告するので orchestrator が素直に retry すると
'worktree path already exists' / 'branch is already checked out' で二重に失敗し、
locked なので cleanup でも回収されない。

裏付け (orphan の蓄積): /mnt/c/tmp/aegis-worktrees/ に既に 10 個以上のディレクトリが残存
(ca-machine-root, connect-error-wording, credential-rotation-frontend, dead-audit-log-service,
install-failure-loud, ldap-eval-rc, mongo-role-parity, mysql-rotate-cron, mysqlrot-core-rollback,
mysqlrot-cronunit, ...)。本セッションの SessionStart hook も run-20260804-101404-8767-t1 / -t2 を
orphan として報告していた。

関連既知課題: backlog に 'stop-verify-worktree.py の git timeout 15s が /mnt/c で不足し、clean な
main tree でも UNDETERMINED block になる' が pending。同一クラス (drvfs 上の git 操作が固定
タイムアウトを超える) の別実例であり、タイムアウト値のハードコードが横断的な問題である可能性。

## 判定不能な2つの読み

(a) timeout 値 45s が /mnt/c に対して短すぎる実在の欠陥 (環境変数で可変にすべき)。
(b) timeout 自体は妥当で、欠陥は kill 後の後処理にある — 部分作成を検出せず、
    unlock/remove も再開もしないまま Err を返している。

どちらの読みでも「壊れた worktree を locked で登録したまま失敗を返す」のは修正対象。
CLAUDE.md 第3節「判定不能は制限側へ」に照らすと、作成が判定不能なら
**registered な状態を残さない** (確実に remove する) のが制限側である。

## 見分ける方法

crates/condukt/src/worktree.rs の create 経路で:
  (i) timeout がハードコードか env override 可能か
  (ii) timeout 分岐が Err を返すだけか、部分作成の検出/ロールバックを行うか
  (iii) locked を誰が付けているか (condukt 自身か git か)。condukt が意図的に lock するなら、
        失敗経路で unlock/remove しないことが欠陥。
(iii) が git 由来でないなら (b) が確定する。

## 本セッションでの扱い (やったこと / やっていないこと)

- 壊れた worktree は **削除していない**。証拠として保全した (削除を含む一括コマンドは
  ユーザーに拒否されたため、再試行もしていない)。
- 代わりに別パス・別 branch で新規 worktree を作成して作業を継続した:
  git worktree add -b condukt/run-20260818-143719-13654/t3-retry
    /home/hiroyuki_nakayama/condukt-worktrees/run-20260818-143719-13654-t3 HEAD
  (drvfs の遅さを避けるため Linux ネイティブ側に配置。素の git なので 45s 上限がかからない)
- したがって /mnt/c/tmp/aegis-worktrees/run-20260818-143719-13654-t3 は
  **意図的に残された壊れた worktree** であり、この課題の再現物である。回収は本課題の一部として行う。

