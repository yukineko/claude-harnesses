notes = """
実測 2026-08-06、測定点 8340afc8、backlog 0.2.14 を rollout した直後。backlog のキューを ~/.backlog/tasks.toml から repo 内 .backlog/tasks.toml へ移す変更 (main の 8d729129) が、既存タスクを移行していない。観測値: ls -la ~/.backlog/tasks.toml は 669648 バイト、ls -la .backlog/tasks.toml は 2173 バイト。backlog list --project /Users/yuki/src/harness --status pending は移行前 162 件を返していたが、移行後は 2 件しか返さない。本セッションで積んだ 5 件のうち 4cacdfae と 241e7a47 と d8d0778c は旧ストアに取り残され、新ストアからは存在しないものとして扱われる (backlog done d8d0778c が task not found で失敗した)。これは単なるデータ移行漏れではなく判定の問題である: 下流 (autoflow の Stop hook / daily / flow の停止判定 / SessionStart の注入) はいずれも「キューが空か」を backlog list の結果で判断するため、160 件の未完了作業が黙って完了扱いになる。空集合が合格として読まれる典型 (CLAUDE.md 第3節)。判定不能どころか、判定が誤った側に確定している。完了条件: (1) 旧ストアの内容を新ストアへ移行する経路を用意し、移行が起きたことを観測で固定する、(2) 移行前に「旧ストアに項目があるのに新ストアが空/少ない」状態を検出して block するか少なくとも警告する経路を入れる (黙って空を返さない)、(3) 既に旧ストアに取り残された項目を回収する。注意: 旧ストアはクロスプロジェクトなので、repo 内ストアへ移すときに project フィールドで振り分ける必要がある。

--- 棚卸し追記 (2026-08-06、測定点 043e757d、read-only。上の起票時ノートは原文のまま保存) ---

規模: home ストア 668 件中 pending 213 件。repo ストアは 11 件。
project キー別の pending 内訳:
  164  harness 移行候補 (/Users/yuki/src/harness 154 + harness 8 + claude-harnesses 2 — 表記ゆれ3種)
   35  他プロジェクト (iro 31, vtuber-app 4) — repo ストアを持たないので移行先が別問題
   12  一時ディレクトリ (/var/folders 配下) — 移行対象外
    2  worktree パス (/Users/yuki/src/.harness-worktrees/session-1faeac72) — stale、そのままでは移行不可

移行リスクは想定より低い: repo ストアとの重複が title 一致 0 件・ID 一致 0 件、home ストア内の重複も 0 件。単純追記で二重起票は起きない。障害は表記ゆれ3種の正規化と、一時/worktree パス 14 件の除外だけ。起票時ノートの注意「project フィールドで振り分ける必要がある」はこの3種+除外14件が具体像。

見えなくなっている内容の重さ: 移行候補 164 件の優先度内訳は p0 が 3、p1 が 91、p2 が 55、p3 が 5、無印 10。作成月は 2026-07 が 101、2026-08 が 63 で、古くて無効化した山ではなく直近1か月の現役キュー。
不可視の p0 3件:
  5151605e コンパイラは強制面になっていない — merge 前にワークスペースを型検査するものが1つも無い
  6aaec283 taintguard t2 commit d24f02d5 は敵対的パネルが block した版 — そのまま merge しないこと
  87dbfbb8 propguard: diff 取得に失敗した非UTF-8 の変更が空 diff に潰れて ALLOW になる

腐敗は双方向である: 本チケットの表題は「未完了作業が黙って完了扱いになる」だが、逆も起きている。5151605e (型検査の強制面が無い) は main の f98de400 で pre-push 型検査が入っており実質着手済みだが、旧ストア側は pending のまま誰も閉じていない。分離したストアは「やっていない仕事を隠す」だけでなく「やった仕事を開いたまま残す」ので、どちらの向きにもキューが事実と乖離する。完了条件 (3) の回収時はこの向きも見ること。

CLI に migrate サブコマンドは無い (add/list/next/done/fail/edit/session-start/install/uninstall/lock/driver)。ユーザ判断 2026-08-06: 今回は可視化のみ、移行は未実施。

