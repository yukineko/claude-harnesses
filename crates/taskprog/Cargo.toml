[package]
rust-version.workspace = true
license.workspace = true
name = "taskprog"
version = "0.1.18"
edition = "2021"
description = "Multi-session progress file for Claude Code: injects .claude/progress.md at SessionStart and notifies the user at Stop to keep it current for handoff across sessions."

[[bin]]
name = "taskprog"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }
