[package]
rust-version.workspace = true
name = "playbook"
version = "0.1.17"
edition = "2021"
description = "Project knowledge retrieval for Claude Code: a UserPromptSubmit hook that injects the curated notes relevant to your prompt under a strict character budget."
license = "MIT"

[[bin]]
name = "playbook"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }
