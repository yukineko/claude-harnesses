[package]
name = "onepass"
version = "0.1.4"
edition = "2021"
rust-version.workspace = true
description = "PreToolUse gate on Agent and Task that allows at most one refutation, verification or audit subagent spawn per user prompt, failing closed when state is unreadable."
license = "MIT"

[[bin]]
name = "onepass"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
