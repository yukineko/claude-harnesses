原因はコードに明記されている。crates/condukt/src/state.rs:1134-1135 逐語:
    // git HEAD is a run-level (repo-wide) signal shared by every task.
    let head = progress::git_head_signal(&repo_root(cwd));
progress::fingerprint_from_signals は git-head と task-updated-at を合成するので、repo のどこかで誰かが commit するたび fingerprint が変わり、凍結した task も progressing に写る。CLAUDE.md 第8節は「別セッションは常に存在する前提で動く」を最上位の不変条件に置いているので、この repo で HEAD が止まることは事実上ない。

