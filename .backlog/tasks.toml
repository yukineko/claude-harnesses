[[task]]
id = "26d84958"
title = "gate outcome ledger: score each gate by its comply/override/escalate rate, mirroring review-metrics"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "gates",
    "p1",
]
touched_files = []
status = "pending"
notes = """
User principle 2026-08-05: a gate needs accumulated MEASURED experience. If the reasoned exit is chosen every time, what the gate defines is not worth defending -- either the basis of its judgment is wrong, or the gate was unnecessary. That verdict is reachable only from data.

The repo has ALREADY accepted this shape one layer over, for AI review findings, and simply never applied it to gates. Existing precedent to mirror, not reinvent (surveyed 2026-08-05, overwatch --help at commit 401821df):
  - overwatch record-disposition / review-metrics: joins human dispositions against review findings, computes false-positive rate, human-agreement rate, median resolution latency
  - overwatch auto-approved: deliberately surfaces the DENOMINATOR of auto-approved policy decisions so sampling coverage is judgeable
  - overwatch record-violation / violations: recurrence stats per violation signature
  - overwatch undetermined-metrics: how often gates gave up
  - condukt policy answers: the self-answer audit trail

What is missing is the gate-firing outcome itself. No store records that a gate FIRED and what happened next.

Shape: every firing records one of COMPLIED / OVERRIDDEN (with the human reason) / ESCALATED. A numerator-only ledger is useless -- an override-only log reads as healthy exactly when the gate is being overridden constantly. Readout prints the RATE with reasons attached so a reader can cluster them: a recurring reason means the boundary is mis-specified, scattered reasons mean genuine one-offs. The tool prints the measurement; a human reads the verdict. An extreme rate must LOOK extreme, not sit in a row count.

taintguard 0.1.9 builds this gate-locally first, in a record shape close enough to overwatch's that lifting it is mechanical. This item is that lift plus the other gates.

Done when: at least three gates emit outcome records, one readout prints per-gate comply/override/escalate rates with reason clustering, and every number it reports carries its command, revision and date per the CLAUDE.md measurement rule."""
