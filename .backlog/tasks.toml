notes = "実測 2026-09-24、測定点 b47f08e3。blastguard::classify::classify は detect(Bash, {command: text}) を呼ぶが、その text は condukt では「シェルコマンド」ではなくタスクの散文 (title + done_criteria + touched_files) である。この repo の .backlog/tasks.toml の実タスク記述 1040 件を同じ形で detect へ投入した結果: TOTAL=1040 DENY=85 ASK=101 ALLOW=854。つまり実タスク記述の 8.2% が「破壊的コマンド」と判定され、9.7% が「解析不能」と判定されている。Ask の実例はいずれも日本語散文で、引用符やパスや rm 等の語が本文中に現れたもの (例: ctxrot/governor: truncate large tool outputs instead of only nudging ... )。memory の classify-deploy-needle-force-gate (「やってはいけないこと」を説明した散文が High/irreversible に force-gate される) と同じ根である。本セッションで Ask を Medium+irreversible へ写したので (backlog ed941047) Ask 分は escalate へ回るようになったが、それは「散文をコマンドとして読む」という前提の上での制限側解決であって前提自体の是非は未検討である。両方の読み: (a) 散文に破壊的コマンドが書かれていれば実際にそれが実行されうるので検査は正しい、(b) 散文は実行されないのでこれは category error であり、force-gate と escalate のノイズ源である。見分け方: force-gate / escalate された実タスクを追跡し、そのうち実際に破壊的コマンドが実行されたものの割合を数える。完了条件: どちらの読みが正しいかを実測で決め、(b) なら classify にコマンド由来かタスク散文由来かの入力種別を渡して検査を切り分ける。"
