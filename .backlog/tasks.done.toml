Architecturally inapplicable to a hook (same class as prompt-caching batch). A Claude Code hook has NO output channel to clear/null resident tool_result or thinking blocks: the only emit surface is decision:block/deny and additionalContext (which ADDS text, never removes). preguard.rs:16 documents 'PreToolUse cannot inject additionalContext'. The only actor that removes content is compaction, which a hook cannot trigger at a custom pressure threshold (see memory compaction-not-hook-triggerable) nor apply selectively block-by-block. Anthropic 'clear tool uses' context-editing is an API-request param the CLIENT sets, unavailable to a subscription-mode plugin hook. Achievable levers already exist: preguard PREVENTS large reads entering context (PreToolUse deny+reason); rescue preserves facts pre-compact; distill is the proactive auto-distill answer. The 'clear resident blocks via hook' framing is not buildable.
実測で architecturally-inapplicable を確認 (測定日 2026-09-07, 測定点 e018fe91): hook の出力面は additive か blocking のみ (main.rs:375 permissionDecision:deny / main.rs:408 additionalContext / decision:block) で、常駐 tool_result・thinking ブロックを除去する経路は無い。main.rs:371 に "PreToolUse can not inject additionalContext" と明記。ctxrot に clear 機構は存在しない (grep で loadset.rs:102 clear_preferred_note のみ、無関係)。done_criteria の「古い tool 出力 clear」は hook 層では実装不能。

--- 再測定して cancelled にする 2026-09-11、測定点 2abf8dea ---

2026-09-07 (e018fe91) の architecturally-inapplicable の判定が今も成り立つかを
測り直した。成り立つ:
  crates/ctxrot/src/ の clear で始まる関数は clear_preferred_note
  (loadset.rs:102 と唯一の呼び出し main.rs:883) の 1 本だけで、常駐の
  tool_result / thinking ブロックとは無関係である。
  hook の出力面は main.rs:375 の permissionDecision:deny、main.rs:408 の
  additionalContext、および decision:block のみ。いずれも追加か阻止であって
  除去ではない。main.rs:371 のコメントが逐語で
  「PreToolUse can't inject additionalContext」と書いている。

done_criteria の「古い tool 出力 clear」は hook 層では実装不能なので
cancelled にする。done ではない。"""
