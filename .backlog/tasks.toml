notes = '''Measured 2026-11-03 at rev 69c03215 (worktree session-c4aa3733-followups): cargo test -p harness-core --test read_stdin_error_erased_20261103 -> 'test result: FAILED. 0 passed; 2 failed'. Verbatim: 'assertion left != right failed: a stdin read ERROR came back as Ok("") — identical to nothing was piped; the failure is invisible to the caller' and 'a stdin read that FAILED after "{\"a\":1}" came back identical to a complete, error-free read of the same bytes'. Cause: crates/harness-core/src/hook.rs read_capped does 'let _ = r.take(MAX_STDIN_BYTES).read_to_end(&mut buf);'. Verdict-bearing consumers of the erased value: fetchguard scan ('if raw.trim().is_empty() { return; }' = no warning; its main.rs doc admits read_stdin is outside the barriers), stuckguard watch (early return). parallelguard maps empty to Deny (not affected). donegate has its own read_stdin twin with the same 'let _ = read_to_string' (gate-audit mirror). READING (a) real defect: CLAUDE.md §3 says an IO failure is cannot-determine and must not be representable as empty/clean; the erasure is a fail-open for fetchguard/stuckguard. READING (b) intentional: read_stdin's doc says 'Errors are swallowed (returns what was read, possibly empty) so a hook never aborts on a read hiccup', and in-crate test read_capped_returns_partial_content_when_the_reader_errors_midway (commit 97a2498d, 2026-09-11) pins returning the partial prefix. Note the doc's 'never aborts' rationale is the §1 'don't break the turn' wording that CLAUDE.md flags as a red signal on verdict paths. HOW TO TELL APART: (b) holds only if no verdict-bearing caller consumes read_stdin's output; list callers (grep read_stdin crates/*/src) — fetchguard scan is a PostToolUse warning emitter whose silence is read as 'nothing found', so (a) unless a human rules fetchguard/stuckguard non-verdict. The fix decision (panic vs Determination return type vs keep) and the fate of the conflicting pinned in-crate test need a human ruling; if the return type changes, re-target the RED file at the new API rather than counting a compile error as GREEN.'''
