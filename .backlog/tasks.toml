[[task]]
id = "64ce9501"
title = "condukt lock.rs の pid_alive が .unwrap_or(false) で終わる — 判定不能な liveness プローブが「死んでいる」に潰れる"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p2"]
touched_files = []
status = "pending"
notes = """
実測 2026-08-17、測定点 f1131a36。crates/condukt/src/lock.rs:128-142。

fn pid_alive(pid: u32) -> bool は Linux では /proc/<pid> の存在を見て、無ければ `kill -0` にフォールバックし、
最後が `.status().map(|s| s.success()).unwrap_or(false)` で終わる。つまり **kill コマンドの起動自体に失敗した
(spawn できない・PATH に無い・fork 失敗)** ケースが `false`＝「プロセスは生きていない」に写る。

【なぜ問題か】この返り値が **reap / steal の判定に使われる**なら、unwrap_or(false) は制限側ではなく
permissive 側である。「holder が生きているか判定できなかった」が「holder は死んだ」として扱われ、
生きている holder のロックが奪われうる。CLAUDE.md 第3節「Result/Option を bool へ潰すとき、unwrap_or の
既定値は必ず制限側」に該当する形。

【判定不能な点 — 両方の読みを残す】
(a) 実在の欠陥 — pid_alive の呼び出し元が reap/steal を判定しており、unwrap_or(false) が生きた holder の
    ロック奪取を許す。この場合 Determination 三値化 (Alive / Gone / Unknown) が要る。
(b) 影響なし — 呼び出し元が「生きていることの確認」にしか使っておらず、false が制限側に当たる文脈しかない。
見分け方: `grep -rn "pid_alive" crates/condukt/src/` で全呼び出し元を列挙し、返り値 false が
「奪ってよい」へ流れる経路が 1 本でもあるかを追う。**まだ追っていないので未判定** (この起票は観測の記録であって
欠陥の断定ではない)。

【発見の経緯】backlog d7e1ac30 (tasks-file lock が生きた holder を reap する) の修正中、同種の liveness
プローブの先例として参照した際に気づいた。d7e1ac30 側では同じ関数を再利用せず、三値の TasksLockHolder
(Alive/Gone/Unknown) を新規に書いた — Unknown を Gone に潰さないため。crates/backlog/src/store.rs の
tasks_lock_pid_state の doc comment がこの item を参照している。

【関連】d7e1ac30、b6cf486d (どの liveness probe が健全か)。"""
created_at = 1786947295
updated_at = 1786947295
weight = 0.0

