flow (2026-08-21, session 9cff59ab, 測定点 4beaca80) で fe84d350 / 5aaecbf6 / e99f61e4(b) のコードを読み、
2026-08-14 の裁定 (Dead <= 活動の停滞 かつ progress window 経過 かつ transcript 証拠なし) を
現行コードへ落とす設計を確定した。**実装は 1 行も書いていない** (context 枯渇でここで停止)。
375587a2 が消えている件は 4f790457。

== 直す 1 箇所 (逐語) ==

crates/condukt/src/wt_reconcile.rs:1374-1397 の occupancy 決定。現状:

    let occupancy: Determination<Occupancy> = if any_progressing {
        Determination::Known(Occupancy::Live)
    } else if !claims_here.is_empty() {
        Determination::undetermined(...)          // frozen is not dead (正しい)
    } else if index.complete {
        Determination::Known(Occupancy::Dead)     // <-- ここが fe84d350 の欠陥
    } else {
        Determination::undetermined(...)
    };

index.complete が真 = 「run state を完全に読めた」だけで Dead を主張している。claim が
無い worktree (CLAUDE.md 8 節が常態とする .harness-worktrees/session-* が全部これ) は
生きていても常に Dead になる。

== 置き換える中身 ==

claim が無いので claim_progress_verdict は使えない。worktree 自身のシグナルで sample する:

    progress::sample(store, key, progress::fingerprint_from_signals(vec![
        ("worktree-head",     progress::git_head_signal(path)),
        ("worktree-activity", worktree_activity_signal(path)),   // 既存 :825
    ]), now, window)

その Determination<Liveness> と transcript witness の積で決める:

    Known(Progressing)                       -> Live
    Undetermined(r)                          -> Undetermined(r)
    Known(Stalled) かつ witness Known(Absent)  -> Dead        <- 3点連言の成立点
    Known(Stalled) かつ witness Known(Present) -> Undetermined (transcript があるので死の証拠にならない)
    Known(Stalled) かつ witness Undetermined   -> Undetermined <- 5aaecbf6 notes が要求する fail-closed

**重要な観測**: 「活動の停滞」と「progress window の経過」は別条件ではない。
harness_core::progress::classify (progress.rs:191-241) の Known(Liveness::Stalled) が
既に「fingerprint が window 秒以上、2 サンプル以上にわたって凍結」を意味する
(first_seen からの elapsed >= window_secs)。よって連言は実質 Stalled かつ transcript-Absent の 2 項。
裁定が言う「progress window を注入可能にする改修」も**既に払われている**:
progress::WINDOW_ENV = HARNESS_PROGRESS_WINDOW_SECS (progress.rs:81)、
window 0 でも 2 サンプル必須なので単発観測が Stalled になることはない。

== 新規に要る 1 つの関数 (harness-core) ==

既存の progress::transcript_signal_in (progress.rs:380) は**流用できない**。
「projects dir が読めない」と「読めたが見つからない」を**どちらも Undetermined に潰す**ため、
Known(Absent) を表現できない。progress 用途としてはそれが正しい (不在は凍結の証拠にならない) が、
死の第3項には三値が必要。したがって追加する:

    pub enum TranscriptWitness { Present, Absent }
    pub fn transcript_witness_in(projects_dir: &Path, session_prefix: &str)
        -> Determination<TranscriptWitness>
    pub fn session_transcript_witness(session_prefix: &str) -> Determination<TranscriptWitness>

fail-closed の要点 (ここを緩めると連言が 2 項へ縮退して元の fail-open が復活する):
  * session_prefix が空 (worktree 名から導出できない) -> Undetermined
  * HOME 未設定 / projects dir が read_dir 失敗 -> Undetermined
  * **project サブディレクトリの read_dir が 1 つでも失敗したら Undetermined**
    (探索空間の一部が読めなかったのに Absent を主張しない)
  * どこかに <prefix>*.jsonl があれば Known(Present)
  * 全部読めて 1 件も無ければ Known(Absent)

prefix マッチが必要な理由: worktree 名は session-<8hex> で、これは session id の**先頭 8 桁**
にすぎない (実例: session-9cff59ab / id 9cff59ab-de17-4468-91c1-33589ee43e81)。
transcript_signal_in の完全一致 <id>.jsonl では当たらない。
condukt 由来の run-*-t<N> worktree は session id を導出できないので Undetermined = 削除しない
(裁定が明示的に受け入れた auto-removable の減少そのもの)。

== テスト計画 (RED を先に観測すること) ==

crates/condukt/tests/worktree_reconcile.rs は**実 git と実 condukt バイナリの subprocess**で
回っており (Fixture::condukt_in は .env("HOME", home) を渡す)、env 注入がプロセス毎に閉じるので
グローバル env の競合が無い。Fixture::new は home/.condukt/state を作るが
**home/.claude/projects は作らない** = 現状は witness が Undetermined になる。

  1. dead_clean_worktree_is_removable (現行 :427) は**必ず落ちる**。単発 probe はアンカーが無く
     Undetermined になるため。これが 375587a2 が削除した対照そのもの。**削除ではなく書き換える**:
     home/.claude/projects を空で作り、HARNESS_PROGRESS_WINDOW_SECS=0 で 2 回 reconcile し、
     2 回目で occupancy=dead かつ removable=true に到達することを固定する
     (= GC 全体が空虚でないことを示す唯一の end-to-end 対照を新しい形で復活させる)。
  2. 追加: unclaimed_stalled_worktree_with_unreadable_projects_dir_is_undetermined
     (projects dir を作らない -> 2 probe 後も dead にならない = 第3項の fail-closed)
  3. 追加: unclaimed_worktree_with_a_transcript_is_not_dead
     (projects/<slug>/<prefix>....jsonl を置く -> Present -> 削除不可)
  4. 追加: unclaimed_worktree_with_advancing_activity_is_live
     (2 probe の間に worktree 内でコミット -> Progressing)
  5. 既存 green を割らないこと: dirty_worktree_is_preserved_before_it_becomes_removable と
     stale_preserved_ref_does_not_authorize_deletion は Known(Occupancy::Dead) を要求する。
     この 2 本は現在 dirty ケースで dead を経由しているので、上の変更で Dead が
     到達しにくくなると**落ちる可能性が高い**。裁定は「この 2 本はそのまま通り続ける」と
     明言しているので、落ちたら retarget せず (通すためにテストを緩める禁止) fixture 側で
     3 点連言を満たす形 (projects dir を空で作る + window 0 + 2 probe) に整えること。
     **これは未確認の予測である** — 実装前に実際に走らせて確認すること。

