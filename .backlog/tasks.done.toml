fixture fails to set up "confined". The honest repair is to make the fixture hermetic - pass the real
temp dir as tmpdir via the existing scoped_with helper - which is a fixture repair, not a weakening.
But it is still an edit to a frozen test, so it needs the human's word before anyone makes it.

