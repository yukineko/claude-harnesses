    (none - the gate will allow every stop; run donegate init)

2 つの問題が重なっている。

(1) donegate 自身の fail-open。設定を読めない・信頼していないという判定不能を、checks:0 すなわち「全 stop 許可」へ写している。CLAUDE.md 第3節の「判定不能は必ず制限側に解決する」「空集合を返さない (下流で検査対象なし = 合格と読まれる)」に真っ向から反する。空の check 集合が clean として下流へ渡る、まさにその形。

(2) 配置の反転。~/.harness/trust.toml の trusted には /Users/yuki/src/harness (main tree) と ~/.condukt/worktrees/ 配下 11 件があるが、/Users/yuki/src/.harness-worktrees/ 配下は 1 件も無い。donegate.toml の cargo clippy --workspace --all-targets -- -D warnings は workspace を型検査する唯一のゲートなので、結果として型検査が強制されるのは第8節が作業を禁じている main tree だけ、第8節が義務づけている worktree では強制されない、という反転が起きている。

これは verdict.rs 冒頭の主張に直接刺さる: built so that a fail-open is a compile error rather than a code-review finding。この worktree ではコンパイラがゲートから呼ばれないので、封印は「書けなくする」ではなく「後で誰かが気づくかもしれない」に留まる。実測: pre-commit / pre-push のどちらも Rust コンパイラを起動しない (grep で cargo にヒットする 3 件はすべてエラーメッセージ中の助言文字列)。pre-commit が回す 9 scanner のうち cargo を起動するものは 0。

完了条件: (a) donegate の untrusted 時の挙動を「判定不能 = block」へ倒す (現状の permissive を是正)。(b) worktree 生成時に donegate trust を自動化し、第8節が要求する場所で型検査ゲートが実際に走ることを実測で示す。(c) donegate は 3 ファイル lockstep で micro bump。

--- 2026-08-06 追記: 自分で再現し、根本原因がより広いことが判明した ---

まず監査者の主張を独立に再現した (第6節「批判もまた検査対象である」に従い、無検証で採用しない)。この worktree で:

  trust:         UNTRUSTED — .../donegate.toml is ignored (run donegate trust)
  checks:        0
    (none — the gate will allow every stop; run donegate init)

再現できた。加えて、問題は donegate 単体ではないことが分かった。

実測 1 (trust store の中身、測定日 2026-08-06): ~/.harness/trust.toml の trusted 配列は 12 エントリで、その全てが /Users/yuki/src/harness (main tree) か ~/.condukt/worktrees/ 配下。/Users/yuki/src/.harness-worktrees/ 配下は 0 件。一方 git worktree list はそこに約 90 個の session worktree を列挙する。つまり CLAUDE.md 第8節が「作業は必ずここで行え」と義務づけている場所が、trust store から丸ごと抜けている。

実測 2 (tdd も同じ穴に落ちている): この worktree で tdd status を実行すると
  tdd: <worktree>/tdd.toml is not trusted; ignoring it. Run tdd trust to enable.
donegate だけの問題ではなく、project 設定を読む gate crate に共通の穴。

実測 3 (ここが本題): 同じ untrusted という入力に対して、2 つの gate が逆方向へ倒れている。

  donegate: untrusted -> checks:0 -> the gate will allow every stop     = fail-open
  tdd:      untrusted -> oracle transition:unknown -> condukt が
            「no valid fail-to-pass reproduction oracle」で verified 化を拒否 = fail-closed

後者の condukt 側のメッセージは、この区別を明示的に言語化している:
  tdd oracle exited non-zero — the F→P oracle could not be determined,
  which is not the same as it being unavailable

同じ判定不能を、片方は「問題なし」へ、もう片方は「判定できないので通さない」へ写している。第3節が要求するのは後者であり、donegate の挙動が誤りである。これは推測ではなく、両方を実行して観測した差分。

さらに区別すべき点: donegate は「設定が無い」(何も宣言されていない) と「設定はあるが信頼していないので実行を拒否した」(判定の拒否) を同じ checks:0 に写している。この repo は同型の欠陥を一度解いている — condukt/src/verify.rs の checks_verdict がかつて空スライスに true を返していたのを d30d9b00 で三値化し、今は ChecksVerdict::NoChecksDeclared を返す (Passed ではない)。その解が donegate に来ていない。CLAUDE.md 冒頭が引く実例そのものの再発。

完了条件 (更新):
(1) donegate の untrusted 時を「判定不能 = block」へ倒す。「設定なし」と「設定はあるが信頼していない」を三値で区別し、後者を Passed 側に写さない (verify.rs の NoChecksDeclared が先例)。
(2) trust store が .harness-worktrees 配下を 0 件しか持たない状態を解消する。worktree 生成時に trust を自動付与するか、trust の判定を worktree の親 repo へ委譲する。どちらにせよ「第8節が義務づける場所でゲートが実際に走ること」を実測で示すこと。
(3) 同じ穴に落ちている gate crate を全数列挙する (donegate と tdd は確認済み。project 設定を読む他の crate は未調査)。
(4) 触った crate は 3 ファイル lockstep で micro bump。

未検証として残す点 (正直に記す): (3) の全数列挙はしていない。donegate と tdd の 2 件は実行して観測したが、他の gate crate が同じ trust 機構を使っているかは調べていない。したがって「2 件ある」は下限であって全体ではない。"""
