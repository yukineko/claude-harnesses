notes = "実測 2026-09-09、この mac 上。1b19e6d2 は『375587a2 は共有 odb から失われた』と結論していたが、それは WSL2 側からの観測であり、**この mac には commit も branch も無傷で存在していた**。git cat-file -t 375587a2 は commit を返し、full sha は 375587a24ba4f8868e1c01d7d70d65ed81f6fb87。branch condukt/run-20260814-005232-58819/run-20260814-005232-58819/t2-occupancy-undetermined が ~/.condukt/worktrees/run-20260814-005232-58819-t2-occupancy-undetermined に checkout されたまま生きており、3 本の RED テスト (unclaimed_clean_worktree_with_no_witness_is_not_removable / unclaimed_worktree_occupancy_is_undetermined_not_dead / unclaimed_worktree_with_advancing_activity_is_live) は crates/condukt/tests/worktree_reconcile.rs に +231 行として全て含まれている。git ls-remote --heads origin は空を返した = **一度も push されていなかった**。したがって GC が食べたのではなく、他機からは最初から見えなかっただけである (1b19e6d2 の 2 つの読みのうち (b) 側が正しく、しかし『ID の誤記』ではなく『machine-local』が正解)。2026-09-09 に origin へ push して保全済み。構造的な欠陥はここ: condukt の run branch は worker が commit した時点では **local にしか存在せず、merge されなければ永久に push されない**。並行する別マシン/別 clone からは、その成果は存在しないのと区別できない。しかも 1b19e6d2 が示すとおり、その不在は『GC が消した』と誤読され、実在しない欠陥の調査に工数が費やされた。修正案: worker の commit 後 (merge 前) に run branch を origin へ push する、または refs/preserved を push 対象に含める。判定不能を残さないという観点では、少なくとも『この branch は未 push である』ことが resume/reconcile の出力に現れるべき。"
