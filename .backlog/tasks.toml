title = "guard-maintree-edit.py が main のツリーでの conflict 解決を止める（pre-commit の main-tree-guard は merge を許すのに、Edit 側だけ MERGE_HEAD を見ていない）"
project = "/home/hiroyuki_nakayama/src/claude-harnesses"
