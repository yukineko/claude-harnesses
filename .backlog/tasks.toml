  stderr: usage: pgrep [-Lfilnoqvx] [-d delim] [-F pidfile] [-G gid]

macOS pgrep has no -c flag, so the combined -fc is rejected as a usage error and exits 2. The code is behaving CORRECTLY: exit 2 is outside the expected {0,1}, so it resolves to Undetermined rather than pretending the process count is zero. The bug is the probe command, not the verdict handling — do not "fix" this by widening the accepted exit codes, which would turn a usage error into a count of zero and make the test pass for the wrong reason.

Likely fix: use pgrep -f PATTERN and count the returned pids (exit 0 = at least one match, exit 1 = none), or gate on a platform-specific flag set. Whatever is chosen must keep a genuinely failed probe resolving to Undetermined.

Note the whole rest of the crate is green: 250 passed with this one skipped."""
