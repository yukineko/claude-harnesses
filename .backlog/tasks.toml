実測 2026-09-11、測定点 2abf8dea。

  backlog edit 966ae7aa --status cancelled
  出力: Error: warning: unknown status 'cancelled'; valid values are pending | done | failed
  exit code: 0

拒否そのものは正しい (cancelled は CLI の語彙に無い)。問題は終了ステータスで、
「拒否した」と「成功した」が下流から区別不能になっている。スクリプトが
  backlog edit <id> --status X || handle_failure
と書いた場合、handle_failure は決して呼ばれず、status は変わっていないのに
変わったものとして扱われる。CLAUDE.md 第3節の「subprocess は stdout だけでなく
必ず終了ステータスを判定に使う」の供給側の違反であり、消費側がいくら正しく
書いても検出できない。

さらに出力自体が矛盾している: 接頭辞は Error だが本文は warning と名乗る。
どちらの深刻度なのかが読めない。

見分けるべき2つの読み:
 (a) 実在の欠陥 — 不正な入力は非0で終わるべき。
 (b) 意図的な fail-soft — 「edit の他のフィールドは適用したので成功」。
     ただしこの呼び出しでは --status しか渡していないので、適用されたものは
     何も無く、(b) の読みでも exit 0 は正当化されない。

関連: cancelled が CLI から到達不能なため、terminal な非完了は TOML を直接
編集するしかない。この2つは同じ根 (status 語彙が pending|done|failed の3値で、
「やらないと決めた」を表現できない) から出ている。"""
