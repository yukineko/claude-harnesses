[package]
name = "daily"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
description = "Daily-once task runner for Claude Code SessionStart: runs registered shell tasks at most once per calendar day."
license = "MIT"

[[bin]]
name = "daily"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
dirs = "5"

[dev-dependencies]
tempfile = { workspace = true }
