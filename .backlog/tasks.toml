WHY IT MATTERS BEYOND THE TEST: this journal exists specifically so that
inspected-and-clean is distinguishable from never-inspected. If a record can be lost
under load, that distinction has a hole under exactly the concurrent conditions the
fleet runs in.

=== 追加実測 2026-09-16 (flow cycle6 / run-20260913-223733-78880 t1 worker, 測定点 847a782e) ===

原因は「同時に走る integration test バイナリ」ではなく、より一般に
TMPDIR に対する同時 create/write/remove の churn である。切り分け:

  - t1 の新規テスト (subagent_stop 15 件) を含め既定並列度  -> 10 回中 4 回 FAIL
  - t1 のテストを --skip subagent_stop で除外              -> 5 回中 0 回 FAIL
  - 全体を --test-threads=1                                 -> 毎回 824/824 green
  - 決定的: t1 のテストを除外したまま、無関係なプロセスに
    $TMPDIR への平凡な create/write/remove churn をさせる   -> 3 回中 1 回 FAIL

つまり subagent_stop のテストは原因ではなく、単に負荷を上げてヒット率を
上げているだけ。既存メモの「integration-test バイナリが必要」という
条件は狭すぎる ($TMPDIR churn で十分)。

未解明で、ここが本題: 2 回の journal append のうち 1 回が落ちているのに、
diffrisk-outcomes の "this record is LOST" 警告が一切出ていない。
このテストが守ろうとしているのはまさに「穴の空いた履歴」であり、
記録が失われたのに誰も気づけない経路が実在することになる。
flake の再現条件よりこちらの方が重い。

なお本件は weaken / skip / disable していない。cycle6 の 3 ブランチは
すべて -- --test-threads=1 で測って green を確認した。"""
