Mechanism: scratch_crate (crates/condukt/src/editgate.rs:462) names every fixture the SAME package, eg_scratch 0.1.0. check_edit spawns cargo check with the ambient environment inherited, so under one shared target dir the three fixtures - two broken, one compiling - collide on package identity and cargo can answer fresh/exit 0 for a crate that does not compile. editgate then reports broken:false, fallback:false: an affirmative "I checked, it compiles" about code that does not. That is the exact defect the first test was written to pin, resurfacing through a different door.

