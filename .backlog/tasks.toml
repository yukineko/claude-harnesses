notes = """
Observed 2026-11-07, session c2e3bc17, measured at rev 30d95437. On root ~/.condukt/worktrees/run-20261107-034825-70254-c2-8cd825f3, donegate's test-changed failed with `binary spawns: Os { code: 2, kind: NotFound }` at crates/backlog/tests/common/mod.rs:275 (CARGO_BIN_EXE_backlog). It did not reproduce at main: backlog 672 passed / 0 failed. The cause in that event is UNVERIFIED. The candidates are a worker's concurrent cargo in the same per-worktree target dir, or scripts/cap-target-dir.sh's `cargo clean`. That worktree has since been removed, so its target size cannot be measured any more.

One sufficient mechanism, measured deterministically on 2026-11-07 with cargo 1.97.1 (c980f4866 2026-06-30): `cargo clean` does NOT wait for a `cargo test` that is already executing its test binary. It printed "Removed 154 files, 5.7MiB total" and exited 0 at once, and the waiting test then failed with exactly `binary spawns: Os { code: 2, kind: NotFound, message: "No such file or directory" }`. cap-target-dir.sh runs `cargo clean` whenever the target dir is over CARGO_TARGET_CAP_MB (default 20000). test-changed-crates.sh and lint-changed-crates.sh both call it, so two cargo users on one root can delete each other's binaries.

RED (python3 -m pytest -q scripts/test_test_changed_env_failure_20261107.py): 1 failed, 1 passed, and it failed 4 of 4 runs. The fixture test writes `ready`, then waits for `go`. The driver runs cap-target-dir.sh with CARGO_TARGET_CAP_MB=1 between the two. test-changed's own lines were exactly "test-changed-crates: testing scratch-race" and "test-changed-crates: FAILED for scratch-race", with exit 1. The control (the same crate with no interference) exits 0.

Readings:
(a) Defect: an environment failure, where the binary was deleted under the run, is reported with the same words as a real test failure. In this session that was read as a red to be fixed by an agent who could not fix it. Separately, cap-target-dir.sh destroys a target dir that another cargo process is using.
(b) Intended: both outcomes are non-zero and fail-closed, so labeling is cosmetic. The panic text (NotFound) is in the record for anyone who reads it.
