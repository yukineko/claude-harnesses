[[requirement]]
id = "R11"
statement = "D11 の閉じた一覧のすべての subprocess に時間制限があり、各検査の結果を履歴に残す。sitecraft status は state を D11 の判定式と優先順で JSON に出し、SKILL は stuck と waiting-human を D12 の手順で扱う（対象は /sitecraft のビルドループに限る）。"
acceptance = [
    "probe は 120 秒、check capability は 300 秒、init の git は 30 秒、api_paths は 1 パス 10 秒で時間切れになり、exit 2（reason timeout）。既存の deadline_for・npm audit 300 秒・ready_timeout_secs は変わらない",
    "decide check・check pages・check security・check capability <name> は、CLI でも gate 経由でも、終了ごとに <state>/check-history/<root-key>.jsonl に {name, exit, fingerprint, elapsed_ms, timed_out, at} を 1 行追記する（name は decide / pages / security / capability:<name>）。追記できなければその検査が exit 2",
    'fingerprint は、exit≠0 なら stdout+stderr の時刻を <time>、絶対パスを <path>、数字列を 0 にこの順で置換した文字列の sha256 hex。時間切れなら sha256("timeout")、exit 0 なら null。時刻・パス・数字だけが違う 2 つの失敗が同じ指紋になることをテストで観測する',
    'sitecraft status は stdout に {"checks":[{name, last_exit, consecutive_same_failure, elapsed_ms, state}]} を出す。state は waiting-human > stuck（同一指紋の連続失敗 3 以上）> failing > slow（exit 0 かつ elapsed_ms が制限の 50% 以上。decide は slow にならない）> ok の優先順で決まる',
    "status の終了コード: 全検査が ok か slow なら 0、failing / stuck / waiting-human のどれかがあれば 1。履歴が無い・読めない・パースできない行がある・state dir が決まらない場合は 2",
    "pages と、capability: のうち threejs-render 種と command 種は、sitecraft.toml または D2-trust の digest が未 trust なら、失敗の連続数にかかわらず waiting-human になる",
    "SKILL.md は、stuck を見たら再実行ループを止め、D12 の (a)〜(d) でハーネス側か対象アプリ側かを切り分けて記録すること、ハーネス側なら harness repo の worktree で RED を観測した再現テストを添えて backlog add し、修正と rollout の後に再開すること、対象アプリ側で同じ指紋の stuck がさらに 3 回続けば Ask することを明記している",
    "SKILL.md は、waiting-human を停滞として扱わず、trust が要るファイルを示してユーザーに Ask し、待ち続けないことを明記している。この手順の対象を /sitecraft のビルドループに限ることも明記している（U6）",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D11",
    "docs/specs/sitecraft-capabilities-rulings.md#D12",
    "docs/specs/sitecraft-capabilities-rulings.md#C2",
    "docs/specs/sitecraft-capabilities-rulings.md#U5",
    "docs/specs/sitecraft-capabilities-rulings.md#U6",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r11_status_history"

[[requirement]]
id = "R12"
statement = "~/src/3d-pipeline-web で D13 の 4 項目がすべて観測されたとき spec を完成とし、GLB→VRM 変換は完了条件に含めない。"
acceptance = [
    "~/src/3d-pipeline-web で [purpose] が記録され、sitecraft decide check が exit 0、stderr に `warning: W1:` が表示される",
    "blender-headless（builtin:blender-headless）と threejs-render（builtin:threejs-render）が relevance=relevant で登録され、両方の sitecraft capability probe が exit 0（feasible）",
    "両方の sitecraft check capability が、/Applications/Blender.app の実 Blender と Playwright Chromium で exit 0",
    "その状態で sitecraft gate が block を返さない",
    "SKILL.md の完成報告の条件に、relevant な全能力の sitecraft check capability が exit 0 であることが加わっている（probe の feasible だけでは完成と報告しない）",
    "command 種はテスト内の fixture で検証し、テストベッドの完了条件には含めない",
]
canon = [
    "docs/specs/sitecraft-capabilities-rulings.md#D13",
    "docs/specs/sitecraft-capabilities-rulings.md#U2",
    "docs/specs/sitecraft-capabilities-rulings.md#U3",
    "crates/sitecraft/skills/sitecraft/SKILL.md#不変条件",
]
falsifiable = true
repro_test = "cargo test -p sitecraft --test spec_r12_skill_completion"
