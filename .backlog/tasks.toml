    "p0",
]
status = "done"
notes = "ユーザー指針(逐語, 3段): (1) 与えられたタスクがおわったら止まる。タスクの途中、残件があるときは止まらなくていい。(2) backlogタスクを消化しろ、であれば消化する時点まで止まらなくていいが、実行時に決めたタスクを消化するところまででいい。途中でつまれたものまでやらない。(3) タスクの実行中に新規に発見された問題はタスクの完了に必要であればそれも実施する。ゴールはタスクの完了。 --- 契約(統合): ゴール=与えられたタスクの完了。停止は完了時のみで、残件・途中では止まらない。(A)対象範囲は実行開始時点のタスク集合(スナップショット)。run 中に積まれた【独立した】新規項目は対象外で run を延長しない。(B)ただし run 中に発見された問題でも【現タスクの完了に必要】なもの(前提・ブロッカー・不可欠な副修正)は実施する=完了の一部。境界の判定軸は『スナップショットにあったか』ではなく『現タスクの完了に必要か』。現状の autoflow は件数プロキシ(condukt_prompts>4 で ask、backlog_prompts>2 で Done)でこの契約とズレる。 / 証拠: autoflow/src/main.rs:198-220・:256-260、state.rs:13 'auto <=4 times, ask user >=5 times' / 完了条件: autoflow の condukt/backlog 両分岐と condukt 完了ゲートが stop 述語=『実行開始スナップショットのタスク群が、各タスクの完了に必要な発見済み作業まで含めて完了したか』で停止/継続を決める。(1)回数上限停止の撤廃、(2)完了に不要な mid-run 追加項目が完了判定に混入しない、(3)完了に必要な発見作業は現 run 内で実施される、の3点がテストで固定される。実装各論: 822c7209(A)・9aa0031f(C)・1bac3de6(I)。真の不明点(escalate/block)でのみ途中停止"
