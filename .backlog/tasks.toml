観測: worktree から `backlog list --status pending` は "no tasks"、`backlog list --json` は `[]`。同じ瞬間に main tree (/Users/yuki/src/harness) から同じコマンドを打つと pending 9 件が返る。worktree から `--project /Users/yuki/src/harness` を明示すると同じ 9 件が返る。したがって原因はストアの不在ではなく project スコープ: task の project フィールドには main tree のパスが記録されるが、list は既定で cwd を project とみなすため、worktree からは決して一致しない。

なぜ重大か: CLAUDE.md 第8節は作業を worktree で行うことを絶対義務としている。flow の SKILL.md は Step 2 以降すべて `--project "$PWD"` を渡す。つまり *規範どおりに運用した場合に限り* キューが必ず空に見える。空集合が「残件なし」として消費される第3節の形そのもので、判定不能ですらなく誤った側に確定している。

さらに eb127a5b で flow の停止判定を三源 (compass 主筋 / 今 observable な measure / backlog pending) に絞ったため、この誤読は直接「まだ 9 件あるのに正常終了」に化ける。停止判定の正しさがこのバグに依存している。

完了条件: (1) worktree の cwd から、その worktree が属する git リポジトリ本体の project スコープが解決されること (gitfile 経由の common dir から主 worktree を求める形が harness_core::trust::resolve に既にある — 同じ手が使える)。(2) 解決できなかった場合に空リストを返さないこと — 判定不能として区別可能に返し、下流が「残件なし」と読めないようにする。(3) worktree の cwd から pending が返ることを観測するテスト。"""
