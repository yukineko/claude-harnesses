notes = "Found while implementing 5b33b4cd (0558db6f), deliberately NOT widened into that change. In audit_round_cli::record, a failed store::append_audit_round prints {recorded:false, reason:store-write-failed} and returns Ok(()) — exit 0. The round did not reach the ledger, so convergence metrics are computed over a silently incomplete history, and continuous-audit.sh now routes this call through run_ow_gate, which only reacts to a NON-ZERO exit — so this path still sails past. Same family as CLAUDE.md section 3 (an IO failure is not a clean result). Note the tension to resolve deliberately: the module treats reporting failures as fail-soft on purpose so an unwritable ledger does not destroy a round's work, and that is defensible; what is not defensible is reporting success. Options are exit non-zero, or keep exit 0 but make the omission visible to audit-metrics rather than invisible."
