    ... (session-* 計 12 本が同じ)
    registered   fix/callgraph-observable  occupancy=dead  dirty=true   removable=false
    registered   session-de693779          occupancy=dead  dirty=true   removable=false
    13 of 16 entries are removable

**session-05717fa8 は本セッションが今まさに commit している worktree である**
(直前の commit c3167e85 / 181a099e はこの worktree で作られた)。それが
occupancy=dead removable=true と判定された。session-7b53203c も
feat/spec-map-search-callgraph も、本日 main へ merge された作業の worktree である。

removable=false になった 2 本を救っているのは liveness ではなく **dirty (未コミット変更)**
という別の項であり、liveness 規則は 3 本とも死んでいると答えている。

## 機序 — 3 項連言の第3項が構造的に空振りする

crates/condukt/src/wt_reconcile.rs:1094 の DEATH 規則は 3 項連言:
  1. 停滞 (worktree の HEAD / 作業ツリー活動が凍結)
  2. 窓経過 (>=2 サンプル、既定 90 秒。harness_core::progress::DEFAULT_WINDOW_SECS)
  3. transcript 証拠なし (Transcripts::NoneEverRanHere)

第3項は `~/.claude/projects/<worktree パスの slug>` が **存在しない** ことで成立する
(wt_reconcile.rs:1028、`project_transcript_dir_name` は cwd のパスを slug 化する)。
docstring は「a worktree that any session has ever worked in stays unreclaimable」と
書いており、これがコストとして意図的に受け入れられたと述べている。

ところが CLAUDE.md 第8節の実使用形では **セッションの cwd は main ツリーであり、
worktree へは Bash 呼び出しごとに cd している**。したがって transcript は main ツリーの
slug に紐づき、worktree パスの slug は **一度も作られない**。実測:

    $ ls ~/.claude/projects/ | wc -l
    7
    (7 件のうち .claude-harnesses-worktrees/session-* に対応する slug は 0 件)

つまり第3項は session worktree に対して **常に真** であり、連言は事実上
「凍結 90 秒」の 2 項に縮退する。docstring 自身が
「If it could, the third term would hold vacuously and the conjunction would
silently degenerate to two terms」と書いて禁じている当の形が、別経路
(cwd が worktree でない) で成立している。

そして「90 秒間 worktree にファイルを書かない」は、エージェントが読む・考える・
別ツリーを見る間に**日常的に**起きる (本件の観測がまさにそれ: 私はこの worktree に
commit した後、120 秒間 読み取りだけをしていた)。

## なぜ重いか

- 消えるのは directory だけではない。branch も一緒に落とせば **未 merge の commit** が
  死ぬ (dirty=false は「未コミット変更が無い」であって「作業が無い」ではない)。
- 削除は **このシステムで唯一不可逆な操作** である。wt_reconcile.rs:2166 の docstring 自身が
  「for a GC, the restrictive side is *do not delete*」と書いている。
- 2d3cbda2 は「registered だが dead な worktree を回収する sweeper」を求めている。
  現状 `cleanup --remove` は unregistered な dir しか見ないので実害が出ていないだけで、
  2d3cbda2 を素直に実装すると **13 本を消す**。

## 判定不能として残す点 (両方の読みと、見分ける方法)

(a) 実在の欠陥 — 第3項が実使用形で空振りしており、規則は 2 項に縮退している。
(b) 意図された設計 — 「condukt が claim していない worktree は condukt の管理外なので
    回収してよい」という立場もありうる (実際 primary は別扱いで守られている)。
見分ける方法: 第3項を導入した 2026-08-21 の裁定 (charter の DoD12 / backlog 5aaecbf6)
が、cwd が worktree であるケースだけを想定していたのか、§8 の cd 運用も想定していたのかを
読む。5aaecbf6 の notes と fe84d350 の notes に裁定文がある。

## 修正案 (いずれも未検証の案であって結論ではない)

- 第3項を cwd 依存でない証拠に替える: transcript の slug ではなく、その worktree を
  作った session id の生存 (overwatch / backlog driver registry は session 単位で
  heartbeat を持つ) を引く。session-<id> という命名はまさにその id を持っている。
- worktree 自身に lease ファイルを置き、heartbeat で更新する (condukt state heartbeat と
  同じ TTL 方式)。lease が読めない/新しい なら keep。
- 窓を秒ではなく「未 merge commit を持つか」と組み合わせる: branch が default branch に
  完全に含まれていない worktree は、凍結していても removable にしない。

