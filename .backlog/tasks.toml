notes = "実測 2026-09-13、測定点 36e3f960。2904dc6c の前提は HEAD でも真である (陳腐化していない)。crates/condukt/src/worktree.rs:369 の doc が run is None for legacy/un-namespaced callers, which get exactly the old ... と書き、:2726 のテスト create_namespaced_without_a_run_is_byte_identical_to_legacy_create が pass --run しない呼び出しが legacy path/branch に着地することを assert する。警告の出力は無い。/ 重要: このテストを欠陥として扱わないこと。これは 167cf55e (名前空間ギャップの両側修正) が入れた正当なアンチ空虚対照であり、新しい名前空間化が既存呼び出しを壊していないことを示すために必要である。問題はテストではなく、固定されている挙動が沈黙である点。/ したがって本件は 2 論点に分かれる。(A) 縮退を可視にする = 裁定不要。CLAUDE.md は 沈黙は許容される degrade ではない と規定し、後方互換が必要なら縮退すること自体を可視にする (stderr への明示的な警告) と書いている。挙動を変えずに警告だけ足せるので、既存テストの byte-identical 主張とも両立する (stdout ではなく stderr なので)。(B) --run 省略を機械的に拒否する = 裁定要。これは後方互換を切る判断であり、legacy 呼び出し側が現存するかを数えてからでないと決められない。元チケットのタイトルは 並列セッション下では機械的に拒否する と (B) を主張しているが、(A) だけでも 黙って という主要な害は消える。/ 次の一手: (A) を先に実装し、(B) は legacy 呼び出し側の実数を測ってから人間に問う。分けて進めること。"
