  （syncstate::record 経由。durable trace の仕組み自体は正しく動いていた）。

同時に観測した本体の問題 — 手書き hook による二重化:
  ~/.claude/settings.json の hooks.SessionEnd に、plugin の hooks.json と
  同じ仕事をする生の git ワンライナーが書かれていた:
    cd "$HOME/.fugu-router/sync" && git pull --rebase --autostash >/dev/null 2>&1;
    git add -A >/dev/null 2>&1; git diff --cached --quiet || git commit -q -m ...
    >/dev/null 2>&1; git push -q >/dev/null 2>&1; true

  この手書き側には 3 つの欠陥がある:
  (1) fail-open。全コマンドが >/dev/null 2>&1 で、チェーンが ; true で終わる。
      どの git が落ちても成功と区別できない。CLAUDE.md 4/5 が名指しする形そのもの。
      plugin 側は失敗を syncstate へ記録し UserPromptSubmit で surface する
      （main.rs:509 で実際に消費されている。確認済み）。
  (2) 順序が逆。pull を commit より先に打つ。main.rs:1240 付近のコメントが
      「store files は sync_dir の中にあるので record のたびに未コミット変更が残り、
      その状態で pull すると abort する。これが 34 日間 sync が黙って止まっていた原因」
      と明記している当の順序。--autostash は緩和にすぎない。
  (3) 同じ SessionEnd で plugin hook と同じ git dir を同時に叩くので index.lock で
      競合しうる。負けた側が手書き hook なら (1) により無音で消える。

  sync/ の commit log は "fugu-router sync <epoch>" だが、これは両者で同一の
  メッセージ書式（main.rs:1394 と手書き側が一致）。plugin の sync は
  sync_repo 未設定で必ず 1211 行目で落ちていたので、既存 commit はすべて
  手書き hook が作ったもの。memory の「this Mac uses a raw git hook」と一致する。

適用した修正:
  1. ~/.fugu-router/config.toml に sync_repo（origin URL）と sync_dir
     （既存 clone の ~/.fugu-router/sync）を追加。store_file / playbook_file は
     既に同じ場所を指しているので移動は発生しない。
