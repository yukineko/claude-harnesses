notes = """
実測 2026-09-10、測定点 d415d5ea。

crates/harness-core/src/hook.rs:474 の
hook::tests::headless_and_piped_guards_are_callable_and_pure は
read_stdin_if_piped() を呼ぶ。stdin が端末でなく、かつ writer が閉じない場合、
この read は永久にブロックする。

実際に起きたこと: cargo test --workspace --no-fail-fast をバックグラウンドで
起動したところ、このテストのバイナリが semaphore_wait で 15 時間 42 分 生存し続け、
手で kill するまで終わらなかった。cargo の出力の最終行は

  test hook::tests::headless_and_piped_guards_are_callable_and_pure has been running for over 60 seconds

sample(1) のスタックも semaphore_wait_trap で確定している。

制御実験 (判断ではなく観測):
  A) cargo test -p harness-core --lib <この1本> -- --exact < /dev/null
     -> ok, finished in 0.00s, 経過 0 秒
  B) (sleep 25) | cargo test -p harness-core --lib <この1本> -- --exact
     -> ok, finished in 24.81s, 経過 26 秒
所要時間は stdin の writer の寿命と一致する。閉じなければ返らない。

これは CLAUDE.md 第4節の事例でもある。テスト自身のコメントが逐語で
こう書いている:

  It must not block on an interactive read and must return a String either way.

実挙動はその主張と食い違う。ブロックしないのは stdin が即 EOF になる場合だけで、
非端末かつ writer が開いたままなら必ずブロックする。散文を実装に合わせて
