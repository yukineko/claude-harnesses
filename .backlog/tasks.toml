notes = """
Raised by the implementer of 5e62b0eb and confirmed by reading the landed code (commit a2e9e3a3, condukt 0.7.171).

run_worktree_head_signal now discriminates three cases in crates/condukt/src/claim.rs:

  Err(e) if e.kind() == ErrorKind::NotFound  =>  fold in ABSENT_WORKTREE_MARKER (determinate absence)
  Err(e)                                     =>  return Undetermined (stat failed: EACCES, transient IO)
  Ok(_)                                      =>  ask git

The middle arm is the one with no test. It is deliberately NOT written as Path::exists(), and that choice is load-bearing: exists() is metadata().is_ok(), so a permission or IO failure would have returned false and been recorded as determinate absence, which would let a LIVE run be reaped. The arm is therefore the thing preventing a real fail-open, and nothing observes it.

Per CLAUDE.md section 2 that arm is currently a judgement, not an observation. It is on the fail-closed side, so a miss there is safe rather than reap-enabling, which is why it is filed rather than treated as blocking.

This is also an instance of the known class: an Undetermined forwarding arm compiles fine with no behavioural test, and a test asserting only on the returned Determination can never be observed RED. It needs its own behavioural test with a fixture that makes stat fail with something other than NotFound.

Testing difficulty, which is why the implementer skipped it: a chmod 000 fixture is unreliable under a root-ish or sandboxed test runner and would be flaky rather than honest. Options to evaluate: make the PARENT directory non-searchable rather than the worktree itself; or inject the error by making the recorded path exceed the platform name limit (ENAMETOOLONG) which is deterministic and needs no permission games. Confirm whichever is chosen actually produces a non-NotFound ErrorKind on macOS before relying on it - assert the kind in the test so the fixture cannot silently decay into the NotFound arm and pass vacuously."""
