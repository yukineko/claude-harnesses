[package]
# `lock::LedgerLock` uses `std::fs::File::try_lock` (kernel advisory lock,
# stable since 1.89; backlog 2ae3fa29).
rust-version = "1.89"
name = "budgetguard"
version = "0.1.31"
edition = "2021"
description = "Real-time cost budget gate for Claude Code. On Stop it reads the session transcript, computes the USD cost, and blocks the turn if session or daily limits are exceeded — feeding the overage back so the agent winds down gracefully."
license = "MIT"

[[bin]]
name = "budgetguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
