notes = "観測 2026-09-24、測定点 b47f08e3。crates/propguard/src/git.rs:532 の test helper git_available() は Command::new(git).arg(--version).output().map(status.success).unwrap_or(false) で OSError を false へ潰す。その戻り値を 15 箇所 (grep -c で 15) の #[test] が if !git_available() then eprintln skipping and return として消費するため、git が起動できない環境では 15 本のテストが何も検証せずに ok を報告する。CLAUDE.md 2 の「検証していないテストの assert が仕様として固定されうる」と同じクラスで、さらに unwrap_or の既定値が permissive 側 (3 節違反)。到達可能性は推測ではない: この repo のメモリに xcode license blocks toolchain (cc/git/ld が exit 69 で失敗しうる) が記録されており、その状態では 122 passed のうち 15 本が空虚になる。見分け方: PATH から git を外して cargo test -p propguard を走らせ、テスト数が変わらず全 ok になることを確認する。完了条件: git が起動できないことを skip ではなくテスト失敗に写すか、少なくとも起動失敗と「git は在るが --version が非0」を区別する。対照として通常環境で 15 本が実際に本体を走らせていることを固定する。"
