hook 本体は main から、hook が呼ぶスクリプトは **worktree** から来る:

    .githooks/pre-commit:131  REPO="$(git rev-parse --show-toplevel)"   <- worktree
    run() { path="$REPO/scripts/$scanner"; ... }

つまり **「どのゲートを呼ぶか」の一覧は main 由来、「各ゲートが何をするか」の実装は
worktree 由来**という食い違いが常態化している。帰結:

- worktree で**ゲートを新設**しても、main の一覧に無いので**呼ばれない**。dark。
- worktree で**既存ゲートの実装を変更**すると、それは**そのまま効く**
  (main の一覧が呼ぶ先が worktree のファイルなので)。
- worktree で**スキャナを削除**すると `run` の `! -f` で block される。つまり
  削除だけは検出され、追加だけが黙って無視される — **非対称で、permissive 側に倒れている**。

