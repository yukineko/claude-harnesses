notes = "verifier-found in c3dcbd6d/b3866b6: has_task_link's 8-hex token matches an 8-char git short-SHA (backlog ids and short-SHAs are lexically identical here), so a change that only cites a SHA is mis-scored as task-linked and under-scored. Degrades gracefully (under-scoring, not crash) and is offset by the pessimistic default, so non-blocking. Fix: require a backlog/run-id context token (e.g. the word backlog or a run-id prefix) rather than bare 8-hex, or exclude tokens adjacent to commit/sha. Oracle: review_worthiness.rs has_task_link tests."
