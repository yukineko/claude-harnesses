status = "pending"
notes = """
観測 2026-09-22、測定点 414be4f1、session 79d79a35。/flow 実行中に発生。

何が起きたか: ターン終了時に stop-verify-worktree.py が逐語で
  Do not stop yet: this turn is ending on the MAIN working tree with uncommitted changes.
を返して停止をブロックした。main の git status は .backlog/tasks.toml の 1 ファイルのみ modified。
このセッションは CLAUDE.md 8 に従い、編集をすべて worktree
(/Users/yuki/src/.harness-worktrees/session-79d79a35) で行っており、main では merge しか
していない。つまり dirty 化したのは人間でも LLM でもなく、backlog 側のツールである。

差分の中身 (HEAD と working tree を tomllib で読んで id 単位に比較した実測):
  status 変更 4 件、いずれも claimed -> pending
    06eb8aa3 / 5e62b0eb / bcfc5491 / e073bdb1
  id の追加 0 件、削除 0 件、task 総数 992 で不変
  updated_at は 1789566348 -> 1790114248 に更新されている
加えて先頭の空行 2 行が除去され、1ff0fcc9 に touched_files = [] が正規化で追加されていた。

つまり内容としては正当な stale-claim の requeue (TTL による reap) である。問題は中身ではなく
書き込み先: cwd が main だったために main のストアへ書かれ、main が dirty のまま残った。

なぜ問題か:
1. CLAUDE.md 8 は main の作業ツリーで許されるのは統合だけと定めている。ツールが main を
   dirty にすると、セッションは「自分が触っていない変更」を commit するか捨てるかの二択を
   迫られる。どちらも 8 に反する (commit は非 merge commit、捨てるのはツールの正当な仕事の破棄)。
2. stop-verify-worktree ゲートが発火するので、ターンが終われなくなる。ゲート自体は正しく
   仕事をしている (これは red であって誤検知ではない) が、原因が自分の作業ではないので
   セッション側に直す手段がない。
3. backlog のストアは cwd の git root に従う (memory backlog-store-follows-cwd)。したがって
   worktree から呼べば worktree のストア、main から呼べば main のストアに書く。requeue は
   セッションの cwd と無関係に発火しうるので、どちらに書くかが実行時の偶然で決まっている。

今回の回避 (恒久修正ではない): 差分を id 単位の delta として scratchpad に逐語保存してから
main を HEAD へ restore し、同じ 4 件の requeue を worktree 側で backlog edit --status pending
として再適用し、worktree で commit して merge した。捨てた情報は無い。

判定不能ではなく確定の欠陥だが、正しい修正方向には 2 つの読みがあるので両方残す:
(a) requeue の書き込み先を cwd ではなく project root (main worktree root) に固定する。
    43393ce2 / DoD14(b) が扱っている「共有ストアの解決」と同じ軸で、同じ道具
    (harness_core::projkey::main_worktree_root) が使える。ただしこの向きだと
    main のストアへ書く以上、main が dirty になる問題自体は残る。
(b) requeue をファイルへ即時書き込みせず、次に backlog が書き込むタイミングまで遅延させるか、
    そもそも main の作業ツリーではなく共有の状態ディレクトリへ持つ。
    main を dirty にしないことを要件にするならこちらが筋。
見分ける方法: そもそも「tasks.toml が git 追跡下の作業ファイルである」ことが根因なので、
5ba13c3e / backlog-store-split と合わせて「キューの正典をどこに置くか」を決める必要がある。

関連: 5ba13c3e (legacy ストア分裂)、43393ce2 と DoD14(b) (共有ストアの worktree 解決)、
backlog requeue lock scoping (SessionStart requeue の TOCTOU)。"""
