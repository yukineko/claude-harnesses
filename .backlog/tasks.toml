title = "guard-maintree-edit blocks Edit during a legitimate merge conflict resolution on main"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = []
touched_files = []
status = "pending"
notes = """
Observed 2026-09-23 while integrating the cycle-7 t3 branch.

CLAUDE.md section 8 permits exactly one class of operation on the main working tree: 統合 merge と conflict 解決. The guard hook scripts/guard-maintree-edit.py states this itself in its own refusal text:
  Merge / conflict-resolution are the ONLY operations allowed on the main tree.

But the hook then refuses the Edit that performs that very conflict resolution. Repro: start a real merge on main that conflicts, then try to Edit a conflicted file to remove the markers. Verbatim refusal:
  Refused: editing /Users/yuki/src/harness/crates/condukt/Cargo.toml writes to this project MAIN working tree.

So the hook blocks the one main-tree operation its own message declares allowed. It cannot currently tell that a merge is in progress.

Impact: the operator is pushed toward one of three bad outcomes - reach for CONDUKT_MAINTREE_OVERRIDE (turns a targeted guard into a blanket one, and per the maintree-guard stale-lock finding that override should not be used casually), or edit via sed to dodge the PreToolUse hook (which also makes editgate go dark, backlog 41508876), or abandon the merge.

Workaround used in this run, which is clean and needs no override: merge main INTO the feature branch inside the worktree, resolve the conflict there where editing is allowed, commit, then fast-forward main. Main is never edited. This should probably be the documented procedure regardless.

Note the fast-forward then trips the gate-bypass ledger (one outstanding entry, since FF moves HEAD with no pre-commit run on main) even though the merge content was fully gate-judged green in the worktree. The ledger self-clears on the next green pre-commit, so it is survivable, but it means the clean workaround still leaves a transient red.

Fix direction: make the hook detect an in-progress merge (MERGE_HEAD present in the gitdir) and allow edits to files that are currently unmerged (git diff --name-only --diff-filter=U), while still refusing edits to any other path. That keeps the guard fail-closed for ordinary edits and stops it from contradicting its own stated carve-out. Do NOT widen it to allow arbitrary edits whenever MERGE_HEAD exists."""
