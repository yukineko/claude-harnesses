成功条件を「patch を書いた」ではなく「一定時間後も pointer が生きている」に変える。

---
## 追試 (2026-09-09、測定点 f17bbba3) — 2 つの現象は別物だった。両方とも書き手を特定した

起票時は「rollout 直後に registry が巻き戻り、配備済み dir に `.orphaned_at` が付く」を
1 件として書いていたが、実測すると**原因の異なる 2 件**である。分けて追う。

### (1) registry の巻き戻し — 出所は「別 base で走った別セッションの rollout」

巻き戻った `installed_plugins.json` が指していたのは donegate 0.1.29 / propguard 0.1.43 /
tdd 0.1.26。これは**いずれも origin/main (77049bfc) 側のバージョン**である
（当ブランチ側は 0.1.30 / 0.1.44 / 0.1.27）。つまり registry を上書きしたのはバグではなく、
**origin/main をチェックアウトした別セッションが自分の rollout を正常に実行した結果**で、
こちらの新しい版へのポインタが last-writer-wins で潰されたもの。

したがってこの半分は rollout の壊れではなく、**`installed_plugins.json` が全セッション共有の
単一ファイルであること**に由来する構造的競合である。`f17bbba3` で両者のバージョンが合流した
今は同じ潰れ方を再現しないが、**並行セッションが別の base で rollout するたびに必ず起きる**
（§8「別セッションは常に存在する前提で動く」）。

完了条件はここで変わる: rollout が registry を書くとき、**上書き対象が自分より新しくないことを
確認する**（単調性チェック。降格になる書き込みは block、少なくとも報告）。判定不能
（registry が読めない・版が比較不能）は §3 に従って書き込みを止める側へ倒すこと。

### (2) `.orphaned_at` — 書き手は Claude Code 本体だった（このリポジトリではない）

    grep -rln 'orphaned_at' --exclude-dir=target --exclude-dir=.git .
      -> .backlog/tasks.toml だけ（＝この起票文だけ。scripts/ も crates/ も 0 hit）
    grep -rl 'orphaned_at' ~/.claude/plugins
      -> 0 hit（配備物にも書き手はいない）
    grep -rl 'orphaned_at' /usr/lib/node_modules/@anthropic-ai/claude-code/bin
      -> claude.exe   ← ここ

`claude.exe` 内の逐語:

    var JL=".orphaned_at", Nu=".in_use", uEt=".gcs-sha", SD=".links_materialized";
    ...
    n(`Not marking a symlinked plugin version: ${r}`)
    n(`Not writing .orphaned_at outside the plugin cache root: ${r}`)
    n(`Failed to write .orphaned_at: ${r}: ${f}`)
    ...
    n("Skipping the orphaned-version sweep: the cache root volume could not be read ...")

書式も一致する: マーカーの中身は `${Date.now()}` の**ミリ秒 epoch 1 行**で、実測は
`1788915479226`（= 2026-09-09 09:57:59 JST）。Rust なら RFC3339、Python なら秒の float に
なるところで、JS の `Date.now()` 形式であること自体が書き手を示している。

観測された 5 件（donegate 0.1.27 / propguard 0.1.40 / reviewgate 0.1.20 / condukt 0.7.148 /
tdd 0.1.24）は**すべて mtime が 4 ミリ秒以内**に収まっており、plugin ごとの rollout ではなく
**1 回の sweep** が付けたものと分かる。付いた対象はいずれも registry から参照されなくなった
旧版 dir である。

**したがって `.orphaned_at` は rollout の副作用ではなく、Claude Code の
orphaned-version GC が「registry がもう指していない版 dir」に付ける印である。**
これ自体は正常動作であり、このリポジトリ側に直すものは無い。

### 2 件が繋がる箇所 — ここが本当の危険

(1) と (2) は独立に正常でも、**連鎖すると配備物が消える**:
別セッションの rollout が registry を古い版へ巻き戻す → こちらが配備したばかりの新しい版 dir が
「参照されていない」状態になる → 次の sweep がそれに `.orphaned_at` を付ける → 猶予後に GC される。
`claude.exe` の近傍には `jts=21600000`（6 時間）と `Wts=600000`（10 分）が置かれており、
猶予と sweep 間隔と読めるが、**どちらがどちらかは未確認**なので推測で書かない。

つまり**この ticket の実体は (1) の単調性チェック 1 本**である。(2) は原因究明済みとして
閉じ、GC は与件として扱う。完了条件は (1) の節に書いたとおり。
"""
