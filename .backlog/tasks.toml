]
touched_files = []
status = "pending"
notes = '''
Measured 2026-11-07 in worktree session-0d3d5bb8 (main 31bf83ed merged; harness-core 0.2.92; test commit fe02d371).

Repro: crates/harness-core/tests/backlog_quoted_prose_path_root_20261107.rs :: path_inside_quoted_skip_reason_is_not_a_written_path_nor_root
RED (verbatim, tempdir path shortened to <T>):
  donegate: command="donegate skip --reason \"attribution bug: the failing root <T>/run-X-t1 is session bf349dd5's worktree, not ours\"" bash candidates under foreign=["<T>/run-X-t1"] roots=["<T>/repo", "<T>/run-X-t1"]
  test result: FAILED. 3 passed; 1 failed
Controls GREEN in the same run: control_redirect_write_into_foreign_still_roots_it (echo x > <wt>/f), control_write_tool_into_foreign_still_roots_it (Write tool), control_unquoted_bare_path_to_unknown_command_still_roots_it (some-unknown-tool <wt>/f).

Narrowed scope (measured, contradicts the original probe's wider claim): the same test's `tdd skip --reason "... <wt> ..."` sub-case does NOT reproduce. attribution.rs read_only_stage already has `"tdd" | "reviewgate" => rest.get(1) == Some(&"skip")` (added in c735d338, 2026-10-20, harness-core 0.2.63, for exactly this "path in the skip reason that says not mine" case). `donegate` is not on that list, so `donegate skip --reason` is kept by writing_statements and every existing-path word in it (quotes trimmed by split_whitespace + trim_matches in session_written_paths) becomes a Bash candidate; session_roots.rs then adds its git toplevel as a root. So this is a mirror gap: twin rule for donegate missing. c735d338's message names only tdd/reviewgate; no record of donegate being deliberately excluded (UNVERIFIED either way).

Two readings:
(a) defect: a word inside a quoted prose argument (--reason) is not a write target; making it a root makes Stop gates (donegate, tdd) judge a foreign session's worktree, and the natural escape (another skip naming it) feeds the loop.
(b) intended: session_written_paths documents Bash candidates as heuristic, and over-counting writes is the restrictive side (more roots judged).
How to tell them apart: (1) the existing tdd/reviewgate skip carve-out shows the repo already ruled (a) for skip reasons — if donegate skip writes nothing at a path named in its reason (check crates/donegate skip implementation: does it only write a session-scoped marker under its state dir?), adding donegate to the read-only list is the twin of c735d338; (2) more generally, does any command treat a quoted --reason/--message/-m value as a path? If not, quoted-value words of those flags could be dropped generally; if a fix goes the general route it must keep the unquoted-bare-path control green.'''
