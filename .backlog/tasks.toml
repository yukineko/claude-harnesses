[[task]]
id = "05726f9f"
title = "scripts/test_*.py の import shim (spec_from_file_location + exec_module) は __pycache__ 越しに古いコードを検証しうる"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["p1"]
touched_files = []
status = "pending"
notes = """
実測 2026-09-10、worktree agent-aa54b994b297e4963。mutation kill-rate 実施中に発見。

## 何が起きたか (観測)

check-workspace-tests.py に mutation を注入して kill されるか確かめる作業中、
main() の ranking chain を **並べ替えるだけ** の mutation (return 文の順序入れ替え、
バイト長は不変) を注入したところ、テストが緑のままで「SURVIVED」と判定された。
しかし実際にはその mutation は **一度もロードされていなかった**。

原因: テスト側の import shim が
    _SPEC = importlib.util.spec_from_file_location(name, path)
    mod = importlib.util.module_from_spec(_SPEC)
    _SPEC.loader.exec_module(mod)
という形で、SourceFileLoader 経由で読んでいる。SourceFileLoader は __pycache__ の
.pyc を **(source の mtime, source の size)** で検証する。mtime の粒度は **1 秒**。
したがって「直前の compile と同じ壁時計秒の中で行われた、バイト長を変えない編集」は
検証をすり抜け、インタプリタは古い bytecode を配る。

## なぜ重要か (これは fail-open の一種)

古いキャッシュが作れるのは **偽の GREEN / 偽の SURVIVOR だけ**で、偽の RED は作れない。
つまりこの経路は常に「テストが実際には何も見ていない」側に倒れる。CLAUDE.md 2.(b)
「落ちることを確認していないテストは何も証明しない」の機械的な裏口にあたる。

## 影響範囲 (未確認 — ここは調べていない)

scripts/test_*.py は 23 本あり、ハイフン入りのスクリプト名を import するために
どれも同種の shim を持っている可能性が高い。**実際に何本がこの形かは数えていない**
(この起票時点で確認したのは新規の test_check_workspace_tests.py のみ)。
まず `grep -ln exec_module scripts/test_*.py` で母数を出すこと。

## 対処 (新規 suite では適用済み)

scripts/test_check_workspace_tests.py はキャッシュ経路を使わない形へ変更済み:
    exec(compile(path.read_text(encoding="utf-8"), str(path), "exec"), mod.__dict__)
理由をコメントで残してある (後で「単純化」して戻されないように)。
再確認: __pycache__ を消さずに同じ mutation を注入したところ、今度は正しく
kill された (AssertionError: 1 != 4)。

他の 22 本にも同じ変更を入れるか、あるいは mutation を扱う手順側で
毎回 __pycache__ を消すことを必須にするか、どちらかを決めること。
前者の方が良い — 手順の遵守を人間の記憶に置かない (CLAUDE.md 6.)。

--- 母数を実測 2026-09-11 (起票時に「調べていない」と書いた部分の補完) ---

  grep -ln exec_module scripts/test_*.py | wc -l  -> 15
  ls scripts/test_*.py | wc -l                    -> 24 (新規の1本を含む)

つまり **15 本**が SourceFileLoader.exec_module 経由で被検証スクリプトを読んでおり、
同じ偽 GREEN / 偽 SURVIVOR の経路を持つ。うち 1 本 (test_check_workspace_tests.py) は
対処済みなので、残り **14 本**が未対処。

なお対処が効いていることは実測済み: __pycache__ を消さずに ranking mutation
(バイト長不変の並べ替え) を注入したところ、対処後の suite は正しく kill した
(AssertionError: 1 != 4)。対処前は同じ条件で SURVIVED と誤判定していた。


[triage 2026-09-29 @b325a169] p2->p1: 16 scripts/test_*.py still use exec_module stale-bytecode path -> false greens / false mutation survivors"""
