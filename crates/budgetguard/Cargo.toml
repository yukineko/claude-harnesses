[package]
# `lock::LedgerLock` uses `std::fs::File::try_lock` (kernel advisory lock,
# stable since 1.89; backlog 2ae3fa29).
rust-version = "1.89"
name = "budgetguard"
version = "0.1.45"
edition = "2021"
description = "Real-time cost budget gate for Claude Code: on Stop it computes the session's USD cost from the transcript and blocks the turn when the session or daily limit is exceeded."
license = "MIT"

[[bin]]
name = "budgetguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
overwatch = { path = "../overwatch" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = "5"
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
