scripts/tests/check-shell-syntax.sh は 22 行目と 79 行目で

    mktemp -d -t shellsyntax
    mktemp -d -t shellsyntax-nogit

を呼ぶが、GNU coreutils の mktemp は -t のテンプレートに最低 3 個の X を要求するため

    mktemp: too few X's in template 'shellsyntax'

で失敗する (BSD mktemp では通る書き方)。set -uo pipefail のみで -e が無いので、テストは失敗に気づかず空の $d で処理を続け、/s.sh や /hook への書き込みが Permission denied、続く git add が pathspec エラーになる。

【実測 2026-09-07、測定点 0eb9996e、linux-x86_64】
    bash scripts/tests/check-shell-syntax.sh  -> 4 case(s) failed / exit 1
逐語で失敗するのは:
  FAIL — expected exit 1 for the broken script, got 0
  FAIL — expected exit 1 for the extensionless broken script, got 0
  FAIL — expected exit 2 for an empty script set, got 0
  FAIL — expected exit 2 outside a git repo, got 0
main (e018fe91) でも同一に 4 件失敗するので、既存不良であって回帰ではない。

【なぜ p2 でなく無視できないか】
通っている 2 件のうち意味があるのは「このリポジトリの tracked shell script が全部 parse する」だけで、check-shell-syntax.py 側が *壊れた script を検出できるか* を確かめる assertion は 4 件とも一度も実行されていない。CLAUDE.md 第2節の「何も検証していないテストは常に通る」の実例で、しかもこのテストは常に **exit 1** を返すため、日常的に red が既定になっている = 誰も読まなくなる形の腐敗。

【修正】
テンプレートを shellsyntax.XXXXXX / shellsyntax-nogit.XXXXXX にする。併せて mktemp の失敗を検出して即 fail するようにし (現状は空文字で続行 = 第3節の判定不能を素通りさせる形)、修正後に 6/6 green を確認すること。

