check-test-weakening の acknowledge まで通過し、`clippy-lints: clean`、commit の
exit code 0）。post-commit は sentinel を消費して静かに終了している。

その直後、main の作業ツリーで

    git merge --ff-only integrate/main-77049bfc      -> Fast-forward

を実行したところ、commit は 1 つも作られていないのに:

    ! UNGATED COMMIT: f17bbba32627 merge(origin/main): 77049bfc を統合する — …
      The local gate did not inspect this content (--no-verify, cherry-pick or
      rebase). Recorded in the bypass ledger; 1 entr(y/ies) outstanding.

機序は 2026-08-28 / 2026-09-07 の記録と完全に一致する。ff 後の HEAD が親 2 つの
merge commit なので `.githooks/post-merge` の
`parents="$(git rev-parse HEAD^@ | grep -c .)"` が 2 を返し、早期 exit のガードを
通過して post-commit へ exec される。main の git-dir に sentinel が無いのは
per-worktree だから当然で、既に検査済みの commit が bypass として記録される。

**今回は `--ff-only` を明示していた点が新しい。** git 自身が「これは ff であって
merge commit を作らない」と保証している操作でも post-merge は区別できていない、
ということなので、`--no-edit` 付きの通常 merge に限った話ではない。

3 回連続（2026-08-28 / 09-07 / 09-09）。すべて §8 に従って worktree で実装し main へ
