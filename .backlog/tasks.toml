notes = "Observed 2026-11-13 at 8dedad41 and 1fd747e9, Linux WSL2, TMPDIR unset so temp_dir() is /tmp. Verbatim: inline harmless baseline must be Allow: rm -rf /tmp/foo -> ask (recursive rm (-r) is confined to /tmp - a safe root for this session ...). Cause, observed: tests/support/neutral_base.rs, when the cargo target dir lies under .harness-worktrees, spells the fixture base through an alias symlink created in temp_dir(), i.e. /tmp/blastguard-wtfix-HASH/run-.../home. The fixture HOME spelling is therefore under /tmp, and src/scope/deletion_roots.rs refuses any temp deletion root that contains HOME (contains_home), so /tmp stops being a disposable root and the rm becomes a confined Ask instead of Allow. On macOS temp_dir() is /var/folders/..., so HOME is not under /tmp. Reading (a) defect: the Linux verdict is MORE restrictive (ask), not fail-open; refusing a temp root that contains HOME is intended. Reading (b) fixture artefact: confirmed. Distinguishing check run: with BLASTGUARD_TEST_FIXTURE_DIR set to a dir under HOME/.cache (outside /tmp, outside git), the target passes 6/6 (14 ignored). A hand probe with HOME outside /tmp also gives allow for rm -rf /tmp/foo. Other neutral_base users on Linux are exposed to the same alias-under-/tmp effect."
