  TMPDIR=/tmp:                          ok   (identical to TMPDIR unset - temp_dir falls back to /tmp)
  TMPDIR=/private/var/tmp:              ok
Whatever temp_dir resolves to, that same directory is now passed in as a root, so the OS and the
runner's environment no longer decide the verdict. One precondition remains and is documented in the
