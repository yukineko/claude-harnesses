## 起票時の数字の訂正 (どちらも実測しなおした)

**前の測定「115 ok targets / 3 FAILED / 96 秒」は撤回する。** あれは
crates/harness-core/src/hook.rs の headless_and_piped_guards_are_callable_and_pure が
read_stdin_if_piped() で stdin をブロックしたまま 15h42m 止まっていた run の
**部分的な出力**であり、完走していなかった。

stdin を /dev/null にして測りなおした結果 (worktree agent-aa54b994b297e4963、2 回とも完走):
  cold (target/ 空から)  345.2 秒  rc=101
  warm                   152.8 秒  rc=101
  targets 232 / passing 4937 / failing 4 (2 回とも同じ 4 件なので flake ではない)

  project_scope (tests/project_scope.rs) :: a_pinned_store_dir_still_scopes_by_project
  project_scope (tests/project_scope.rs) :: a_pinned_store_dir_still_works_outside_any_repo
  blastguard (unittests src/lib.rs) :: detect::tests::bg2_fd_dup_and_safe_targets_stay_allowed
  scoped_destructive (tests/scoped_destructive.rs) :: relaxed_truncating_forms_inside_the_project

**したがって pre-push の実コストは 152.8 (cargo) + 193.4 (python 23 suite) = 約 346 秒 / 約6分**で
あり、事前に見積もっていた約 156 秒の 2 倍以上ある。配線を判断する人はこの数字で判断すること。

## stdin の件 (配線する側が必ず知っている必要がある)

git は pre-push フックに ref list を **stdin で**渡す。上記のテストは stdin を読むので、
子プロセスが hook の stdin を継承すると (a) ref list を食う (b) 書き手が閉じなければ
永久にハングする。実測: `< /dev/null` なら 0.00s、`(sleep 25) |` なら 24.81s —
実行時間が stdin の書き手の寿命と一致する。
check-workspace-tests.py は cargo にも python にも **stdin=/dev/null を無条件で**渡し、
さらに子ごとに wall-clock deadline を持ち、期限切れは **process group ごと** kill して
exit 6 でブロックする (親だけ kill すると test binary が孤児になる — 実際に 15 時間ものを
手で kill した)。deadline を伸ばす/切る環境変数は用意していない。

