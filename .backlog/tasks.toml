notes = """
828 の println!/eprintln! があり tracing:: は 0。span/レベルフィルタ(RUST_LOG)が無く hook 障害の観測性が低い。/ 証拠: grep println!|eprintln! 828 hits, tracing:: 0 hits, workspace.dependencies に tracing 無し / 完了条件: tracing を workspace.deps に追加、hot path の出力を tracing マクロ化、RUST_LOG でレベル制御可能
Harmful as specified — scout miscounted grep hits without the architecture. In this codebase stdout is a STRUCTURED WIRE PROTOCOL, not incidental logging: hook binaries emit their JSON decision/additionalContext to stdout via println! (ctxrot/main.rs:280,310,331), and CLI commands emit JSON to stdout that the flow/scout/condukt skills capture via $(...) (compass/main.rs:606,689,750; backlog/main.rs:226,320 println! json!({additionalContext})). Converting these println! to tracing::info! (stderr, RUST_LOG-gated, OFF by default) would make every hook emit nothing to stdout and every CLI-JSON contract return empty — breaking the whole PDO loop (backlog next / compass gap / condukt would all get empty strings). 'tracing:: = 0 hits' is correct-by-design. Only a small fraction (internal fail-soft eprintln! diagnostics) is a safe tracing target, and even that needs a stderr-pinned subscriber and is NOT what the done-condition ('hot path の出力を tracing マクロ化') asks. Introducing a global subscriber across ~30 binaries also risks never-break-a-turn for marginal gain. Not buildable as specified."""
