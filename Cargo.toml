[workspace]
# resolver "3" enables Cargo's MSRV-aware dependency resolution (and itself
# requires Rust >= 1.84, which our MSRV satisfies): with
# `incompatible-rust-versions = "fallback"` (its default), `cargo update` prefers
# dependency versions compatible with `workspace.package.rust-version` when a
# newer one would raise the floor. The MSRV is 1.85 because the current
# dependency surface (clap 4.6, indexmap 2.14, globset 0.4.18, proptest, …)
# requires `edition2024`, stabilized in Rust 1.85. The msrv.yml CI enforces this.
resolver = "3"
members  = ["crates/*"]
# Skill-only plugins (no Rust binary) live under crates/ as Claude Code plugins
# but are NOT Cargo crates, so the `crates/*` glob must skip them.
exclude  = ["crates/scout", "crates/daily-report"]

[workspace.package]
rust-version = "1.85"     # 依存 (clap 4.6 / indexmap 2.14 / globset 0.4.18 等) が edition2024 を要求するため。資格的下限は msrv.yml が保証。
edition      = "2021"
license      = "MIT"

# 共通依存はここに集約し、各クレートは段階的に `workspace = true` へ移行する。
# Phase A 時点では各クレートの [dependencies] はそのまま（移行は後続フェーズ）。
[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
regex      = "1"
anyhow     = "1"
toml       = "1.1"
chrono     = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile   = "3"
sha2       = "0.10"
clap       = { version = "4", features = ["derive"] }

# ゲート crate 共通の lint 設定。opt-in — 継承するのは `[lints] workspace = true`
# を書いたメンバーだけで、既定では誰にも掛からない（後方互換）。
#
# なぜここに置くか: fail-open の物理的な出口は Result / Option を判定へ潰す少数の
# イディオムに集中しており、そのうち unwrap と expect は「潰す」のではなく
# 「潰せなかったら落ちる」形。判定を持つ crate では panic は判定不能そのものなので、
# 書けてはならない。clippy の unwrap_used / expect_used は既定 allow なので、
# ここで deny にするまでゲート crate でも素通りしていた（実測 2026-07-22 / 690cc4af:
# production 側に 11 箇所 — specguard 7 / stuckguard 2 / overwatch 1 / blastguard 1 —
# 残ったまま `cargo clippy -p <各 gate crate> --all-targets` が 6/6 green だった）。
# 事前見積りではこれを 10 と報告していた。数え方が「ファイル最初の #[cfg(test)] 以降は
# 全部テスト」と見なす heuristic で、テストモジュールの後ろにも production コードを持つ
# blastguard/src/detect.rs を取りこぼしていた。過小側にのみ外れる floor だったが、
# 黙って直さずここに残す。
#
# テスト側は crate ルートの `#![cfg_attr(test, allow(...))]` で除外する。テストで
# unwrap するのは意図的な assert であって fail-open ではなく、ここを deny にすると
# 大量の書き換えを強要して「lint を外す」圧力になる（CLAUDE.md 第4節が名指しする
# 「通すためだけに緩める」を、こちら側から誘発してしまう）。規模の実測は
# allow を入れる前に clippy 自身が出した 465 件（2026-07-22 / 690cc4af、
# `[lints] workspace = true` のみを入れ allow を一切書かない状態で
# `cargo clippy -p <各 gate crate> --all-targets`: blastguard 14 / propguard 36 /
# specguard 1 / stuckguard 69 / mutategate 25 / overwatch 320）。specguard の
# カスタム target root 2 本（[[bin]] src/forge/main.rs、[[test]] src/testaudit.rs）を
# 覆った後にさらに 70 件が出たので、総数はこれより多い。
#
# この allow の射程（測定済みの限界、2026-07-22 / 690cc4af）: cfg_attr(test) は
# crate ルート属性なので、cargo が bin を cfg(test) 付きでビルドする variant では
# production コードにも allow が掛かる。production を実際に守っているのは
# cfg(test) が false の素の bin target の方で、`--all-targets` はこれを必ず含むため
# 新規 unwrap は RED になる（6/6 で injection 実測）。`--tests` だけに絞った
# 呼び出しでは守られない。この repo にそういう呼び出しは無いが、増やさないこと。
#
# enforce の置き場所は local。CLAUDE.md 第7節により、この lint を GitHub の
# required status check として登録しない — ブロックと許可を決める権限は手元に置く。
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# panic は上の2つと同じ理由（判定を持つ crate で panic は判定不能そのもの）だが、
# 経緯が違う: これは新規の締め付けではなく、既に 15 ファイルに手貼りされていた
# `#![deny(clippy::panic)]` の集約先。うち **10 個をここへ引き取り**、該当ファイルの
# 属性行を削除した（blastguard lib+main / mutategate lib+main / overwatch lib+main /
# propguard main / specguard main+forge-main / stuckguard main）。
#
# 残る 5 個（budgetguard / donegate / reviewgate / schemaguard lib+main）は
# **手貼りのまま残す**。集約するにはその crate に `[lints] workspace = true` が要り、
# それは unwrap_used / expect_used の deny も同時に持ち込む＝この一手のスコープを超える。
# 「15 個を集約した」ではなく「10 個を集約し 5 個を残した」と書くのは、
# 散文が実挙動と食い違わないようにするため（CLAUDE.md 第4節）。残り 5 個の集約は
# それらの crate が workspace lints を opt-in する時に持ち越す。
#
# 集約が空虚でないことは対照実験で確認済み（2026-07-23 / c23ac506 の上）:
# 属性を外し この行も入れない状態では production の panic! を clippy は
# 捕まえない（exit 0）。この行を入れると同じ panic! が RED になる。
panic = "deny"

# ラチェットの機構。既存の unwrap/expect には site ごとに
# `#[expect(clippy::unwrap_used, reason = "…")]` を貼って「見えて数えられる」状態にするが、
# それが**永住しない**ことをコンパイラに保証させる: 元の unwrap を消したのに attribute を
# 残すと unfulfilled_lint_expectations が発火し、deny なのでビルドが落ちる。
# つまり許可は自分で自分を回収する — 手で棚卸しする必要がなく、許可リストが
# 現実から乖離したまま腐ることがない。
[workspace.lints.rust]
unfulfilled_lint_expectations = "deny"

# 同梱バイナリ用の最適化プロファイル。各メンバーが個別に持っていた同一の
# [profile.release] をここへ一元化（ワークスペースではルートのみ有効）。
[profile.release]
strip     = true
lto       = true
opt-level = "z"
# never-break-a-turn invariant: the exit-0-on-error guarantee rests on
# std::panic::catch_unwind in hook::run_hook and gate::run_guarded, which becomes
# a silent NO-OP under panic="abort". Pin "unwind" so a panic is caught and the
# turn still exits cleanly. harness-core has a #[cfg(not(panic = "unwind"))]
# compile_error! backstop guarding against this being changed.
panic     = "unwind"
