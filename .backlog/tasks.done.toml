Inapplicable to context-governor's hook architecture as scoped. Lost-in-the-middle edge-ordering requires a MULTI-CHUNK relevance-ranked injection; the injector emits exactly ONE best-scoring section (injector.rs:92-106 max_by_key), and the rehydrator emits normative pins with no query to rank by. Adding top-K multi-chunk retrieval to create ranked chunks fights the crate's explicit size-minimization axis (lib.rs 'minimize resident normative text'), and edge-ordering resident pins would risk burying Verbatim content mid-context, contradicting I2 lossless-recall. Deferred by user decision to pursue grounded safety/autonomy p1s. Recommend reclassify as guidance-only or retarget if multi-chunk retrieval is ever introduced.
