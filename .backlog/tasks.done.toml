1 本でもあれば、同じ誤りを繰り返している**ことになる。ここは未検証。

【トレードオフ (要観察)】Unknown を never-reap にしたので、pid が読めない lockfile は自動
回収されない。silent な lost-update を silent な deadlock と交換した形。エラーメッセージに
手動削除の案内は入れたが、この判断自体が検証対象。


--- 追記 (2026-08-17, 敵対的検証が実 regression を1件発見): hot spin ---

架空チケット ID `2b6d54c9` は実 ID **64ce9501** へ訂正済み (前回の残課題を消化)。

【敵対的検証 agent の成果 — ユーザーがセッションを止めたため verdict 自体は未完だが、
agent が残した probe から実在の regression を1件回収した】

`try_acquire_tasks_lock_with` の reap 分岐は `remove_file` の後 **sleep せずに `continue`** する。
removal が成功したなら正しい (ロックが空いたので即リトライすべき) が、**removal が失敗した場合は
何も変わっていないのに sleep を飛ばす**ので hot spin になる。

到達経路 (実在): sticky bit の付いたディレクトリ (/tmp 等) に **別ユーザ所有の lockfile** がある場合、
`create_new` は AlreadyExists を返し (= reap 分岐に入る)、`remove_file` は EPERM を返す (= 削除できない)。

**これは本 item の修正が作り込んだ regression である。** budget が attempt 数 (1600) だった頃は
spin しても 1600 回で終わり数十 ms で抜けたが、budget を実測 elapsed (8s) に変えたことで
**8 秒間 100% CPU で回り続ける**ようになった。

実測 (RED): budget 300ms / sleep 5ms / 死んだ holder / 常に失敗する remove を注入して
**26,497 回**の reap 試行 (正常なら ~60 回)。production の 8s budget に換算すると約 70 万回。

修正: `is_abandoned && remove().is_ok()` のときだけ sleep を飛ばして `continue`。
それ以外 (holder が live/unknown、または削除できなかった) は sleep してから再試行。

テスト: `a_reap_that_cannot_remove_the_lockfile_must_not_spin_the_cpu` (RED 先行で観測済み)。
`TasksLockPolicy` に `remove: fn(&Path) -> io::Result<()>` の seam を追加して注入可能にした
(production は `remove_lockfile` = `std::fs::remove_file` 固定)。

【現況】cargo test -p backlog = 256 passed / 0 failed、clippy clean、fmt 済み。
version 0.2.27 lockstep 済み。**まだ未コミット・rollout 未実施。**

【検証の残り — 未実施】敵対的 agent は kill-rate / vacuity / pid 議論の妥当性 / deadlock リスクを
検査する予定だったが、**完了前に停止したので verdict は無い**。特に未検証のまま残っているのは:
 * mutation kill-rate (各 arm を permissive 側へ widen して全部 KILLED になるか)
 * 「tasks lock の pid は sound / exclusive lock の pid は unsound」という寿命ベースの議論の妥当性
   (tasks lockfile が書いたプロセスより長生きして後続プロセスに読まれる経路が 1 本でもあれば同じ誤り)
 * Unknown never-reap が deadlock を生まないか
これらは**未検証**であって「問題なし」ではない。


## 敵対的検証の結果 (2026-08-17) — verdict: HOLES_FOUND / kill rate 4/5

上の「未実施」は解消。検証者は実装者とは別 agent (CLAUDE.md §2(a))。CLAUDE.md §6
「批判もまた検査対象」に従い、9 件の指摘を**採用前に実装者が独立に再現確認**し、
確認できたものだけを採用した。

### 実在の欠陥として確認 → 修正済み

1. **surviving mutation**: `write!(f, "{}", process::id())` を削除しても全テストが green のまま
   = production の pid 書き込みが未カバーだった。reap 側のテストが lockfile を `fs::write` で
   捏造していたため。→ `the_acquire_path_records_our_pid_so_a_crashed_holder_is_recognisable`
   を追加。**RED 実測**: 変異適用時 `the acquire path wrote "" instead of our pid 22423`。

2. **非 Linux 分岐の fail-open (実在)**: `kill -0` を subprocess で撃ち非 0 終了を一律 `Gone` に
   写していた。`kill -0` は ESRCH (不在) と EPERM (**生きているが他ユーザ所有**) を同じ終了
   ステータスで返すため、macOS で**生きた holder を reap** する = 本チケットが直す欠陥そのものを、
   Linux の /proc 分岐が覆っていなかった唯一のプラットフォームで再現していた。しかもコメントは
   「must not treat it as reapable unless it is genuinely gone」と逆を主張していた (§4)。

3. **`Path::exists()` が判定不能を「不在」へ潰す (実在)**: `exists()` は EACCES を含む任意の
   metadata エラーで `false` を返す。`/proc` を `hidepid=2` で mount したホストでは他ユーザの
   **生きた**プロセスが不可視 → `false` → `/proc/self` は見える → `Gone` → 生きた holder を reap。

   2 と 3 は**同じ修正で消えた**: `/proc` と subprocess をやめ `libc::kill(pid, 0)` + errno へ統一。
   errno は POSIX 規定なので Linux と macOS が**同一コードパス**になり、「ここでは実行できない
   プラットフォーム分岐」が消滅した (再文書化ではなく除去)。
   ESRCH→Gone / **EPERM→Alive** (カーネルが見つけられたからこそ拒否した = 生存の積極的証拠) /
   その他→Unknown。**実測** (uid=1000): `kill(1,0)` → errno 1 = EPERM、
   `kill(999999,0)` → errno 3 = ESRCH。pid 1 を使った実カーネル経路のテストを追加。
   **RED 実測**: EPERM→Gone に変異させると 2 件が落ちる
   (`a_live_process_we_are_not_allowed_to_signal_is_alive_not_gone` /
   `an_old_lockfile_naming_an_unsignalable_live_process_is_never_reaped`)。

### 散文が実挙動と食い違っていた (§4) → 同一コミットで修正

- `TASKS_LOCK_STALE_SECS` の rustdoc **要約行**が依然「古い ⇒ reap」と主張していた
  (要約行は rustdoc の一覧に出る唯一の行なので、11 行後の訂正では届かない)。
- `tasks_lock_is_stale` への intra-doc link 切れ。`cargo doc` の warning で実測確認 → 修正後 0 件。
- テストの doc comment 4 箇所が修正前の挙動を現在形で記述 (「Today the second acquire
  SUCCEEDS ... RED」が GREEN になった今も残っていた)。
- budget と stale window の margin を、fix 後は安全性を担っていないのに「now real」と記述。
  holder 連言がある以上 budget がどうであれ生きた holder は reap されないので、内部矛盾。解消。

### 測定値の腐敗 (§「測定値」) — 自分が書いた数字が再現しなかった

doc に書いた `9.967965208s` を検証者が再現できなかった (旧 1600 回ループを復元して実測
`8.332424091s`)。9 桁を測定コマンド・rev・測定日なしで書いており規範違反。しかも出典とした
テストは**失敗メッセージの中でしか**その値を印字しないので green の今は再観測できない。
→ 固定値の引用をやめ「per-iteration の syscall コストはファイルシステム依存で、その分だけ
nominal を超過する」という**構造的な主張**に置き換えた。数字を継承せず捨てた。

### 別途起票 (このチケットでは直さない)

- `with_tasks_lock` 系 mutator の非 fail-closed (requeue_expired / mark_* / edit が
  ロック未取得でも実行し成功を返す) → **929739fe**。既存の欠陥で、source を読んで確認済み。
- 旧版が残した空 lockfile が Unknown で永久に reap されない rollout hazard → **8181d5e4**。

### 現状

259 tests green / clippy clean / fmt 済 / cargo doc warning 0。
surviving だった mutation 5 は RED を観測して塞いだので kill rate は 5/5 見込み。"""
