notes = """
Measured 2026-08-12 while orchestrating run p0trio-1 (two condukt-worker subagents in their own worktrees).

Three independent proxy signals ALL indicated the workers were dead, while two positive signals proved they were alive and progressing:

DEAD-reading proxies:
1. Agent transcript output-file mtime: last write 10:47, still 10:47 after 20 min of quiet.
2. lsof -a -d cwd -c claude filtered to the worktree path: returned NO pids for either worktree.
3. git log main..HEAD and git status --short in the worktree: both empty (no commits, clean tree) for 20+ min.

ALIVE-proving signals observed at the same moment:
1. t1 worker had written .tdd/t1-claim-scope.red.json at 11:06 -- i.e. 19 MINUTES AFTER its transcript mtime had stopped advancing.
2. t3 worker had live rustc processes with --out-dir pointing inside its own worktree target/debug/deps.

Why this matters: this is the same defect class as backlog 356bd51d and as condukt state.rs stuck_task_ids. A liveness predicate built on any of the three dead-reading proxies would have concluded dead and authorized a re-dispatch onto a live worktree -- reproducing the two-workers-one-index incident. Note in particular that lsof cwd is NOT reliable: the 356bd51d report used it and DID find a pid, but here it finds none for workers that are unambiguously alive, so its absence proves nothing.

Actionable: any progress or liveness gate must key off signals BOUND to the worker's own durable output (its worktree target/ mtime, its .tdd proof files, its own child processes), never off transcript mtime, lsof cwd, or worktree cleanliness. Suggest documenting the reliable-signal list next to condukt wt_reconcile.rs Frozen-is-not-dead section, which already argues the principle but does not enumerate which probes actually satisfy it."""
