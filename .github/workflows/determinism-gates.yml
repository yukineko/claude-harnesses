name: determinism-gates

# Per-PR determinism gate.
#
# The determinism arc moved control-flow decisions out of nondeterministic
# LLM-prose keyword matching and into pure Rust functions (scorer::score,
# policy::decide, replan::classify_failure, consensus::tally, lessons::search),
# and added a schemaguard schema-precheck at condukt's LLM->code parse boundary.
# The ordinary smoke gate (`cargo test --workspace`) proves the whole suite
# passes but says nothing about WHICH tests are the determinism floor — a
# regression that weakened a property or removed the schema gate could hide in
# an otherwise-green run.
#
# This job runs the determinism-specific checks on EVERY PR and reports them as
# a distinct, separately-counted gate (a dedicated workflow + a
# $GITHUB_STEP_SUMMARY table), so the determinism result is legible apart from
# the normal test count:
#   1. property-based tests (proptest floor) — harness-core + condukt pure fns
#   2. deterministic oracle/decision tests — scorer/policy/replan/consensus/verify
#   3. schemaguard schema validation — its test suite + a live sample check that
#      a valid decomposition exits 0 and a malformed one exits non-zero (the
#      re-ask contract at the source->executor boundary).
#
# Prereqs live in the tree already: the proptest modules (backlog 8babeb1a) and
# the schemaguard wiring (backlog 81f416e8). This workflow is the L4 backstop
# (backlog 04ce94b3) that keeps them enforced.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: determinism-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Strengthen the property gate in CI: run more generated cases than the
      # local proptest default (256) so the per-PR floor is harder to sneak past.
      PROPTEST_CASES: '1024'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 1. Property-based determinism floor (proptest). The modules are named
      #    `proptests` in each crate. A filter that selected 0 tests would make
      #    this gate a silent no-op, so each step asserts a non-zero pass count
      #    AND propagates a real test failure.
      - name: Property tests — harness-core (scorer/lessons)
        run: |
          set -o pipefail
          cargo test -p harness-core proptests 2>&1 | tee /tmp/hc.log
          rc=${PIPESTATUS[0]}
          n=$(grep -oE '[0-9]+ passed' /tmp/hc.log | awk '{s+=$1} END{print s+0}')
          echo "HC_PROPTESTS=$n" >> "$GITHUB_ENV"
          [ "$rc" -eq 0 ] || { echo "::error::harness-core proptests failed"; exit 1; }
          [ "$n" -gt 0 ] || { echo "::error::harness-core proptest filter selected 0 tests"; exit 1; }

      - name: Property tests — condukt (policy/replan/consensus)
        run: |
          set -o pipefail
          cargo test -p condukt proptests 2>&1 | tee /tmp/condukt.log
          rc=${PIPESTATUS[0]}
          n=$(grep -oE '[0-9]+ passed' /tmp/condukt.log | awk '{s+=$1} END{print s+0}')
          echo "CONDUKT_PROPTESTS=$n" >> "$GITHUB_ENV"
          [ "$rc" -eq 0 ] || { echo "::error::condukt proptests failed"; exit 1; }
          [ "$n" -gt 0 ] || { echo "::error::condukt proptest filter selected 0 tests"; exit 1; }

      # 2. Deterministic oracle / decision-layer tests (the pure fns that replaced
      #    prose-keyword control flow live in these lib suites: scorer, lessons,
      #    policy, replan, consensus, verify).
      - name: Deterministic oracle tests — condukt lib
        run: cargo test -p condukt --lib

      - name: Deterministic oracle tests — harness-core lib
        run: cargo test -p harness-core --lib

      # 3. schemaguard: unit suite + a live sample check of the re-ask contract.
      - name: schemaguard test suite
        run: cargo test -p schemaguard

      - name: schemaguard sample validation (valid accepted, malformed rejected)
        run: |
          set -o pipefail
          # A valid decomposition (only per-task `id` is required) must be
          # accepted (exit 0).
          printf '%s' '{"goal":"do a thing","tasks":[{"id":"t1"}]}' > /tmp/valid.json
          # A malformed decomposition (missing required top-level `goal`) must be
          # rejected with a non-zero exit — the deterministic re-ask signal.
          printf '%s' '{"tasks":[{"id":"t1"}]}' > /tmp/invalid.json
          cargo run -q -p schemaguard -- check --schema decomposition --file /tmp/valid.json
          echo "valid decomposition accepted (exit 0)"
          if cargo run -q -p schemaguard -- check --schema decomposition --file /tmp/invalid.json; then
            echo "::error::malformed decomposition was accepted — schema gate not enforcing"
            exit 1
          fi
          echo "malformed decomposition rejected (non-zero exit)"

      # Report the determinism gate distinctly from the normal test count.
      - name: Determinism gate summary
        if: always()
        run: |
          {
            echo "## Determinism gate"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| harness-core property tests | ${HC_PROPTESTS:-?} passed |"
            echo "| condukt property tests | ${CONDUKT_PROPTESTS:-?} passed |"
            echo "| proptest cases per property | ${PROPTEST_CASES} |"
            echo "| schemaguard re-ask contract | valid accepted / malformed rejected |"
          } >> "$GITHUB_STEP_SUMMARY"
