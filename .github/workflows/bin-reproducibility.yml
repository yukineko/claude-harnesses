name: bin-reproducibility

# Tamper gate for the committed plugin binaries. Each plugin ships prebuilt
# per-platform binaries (crates/*/bin/<name>-<os>-<arch>) that run on users'
# machines but are opaque blobs in code review. This job rebuilds every
# workspace binary from source and flags any string present in a *committed*
# binary but absent from the *freshly built* one that matches a malicious
# pattern (shared with injectguard) — i.e. content the source does not produce.
# Only the host-triple (Linux) binaries can be rebuilt here; macOS blobs are out
# of scope for a Linux runner. Merge-blocking on the prompt/bin-carrying paths.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/*/bin/**'
      - 'crates/*/src/**'
      - 'scripts/check-bin-reproducibility.py'
      - 'scripts/test_check_bin_reproducibility.py'
      - 'scripts/check-prompt-injection.py'
      - '.github/workflows/bin-reproducibility.yml'
  pull_request:
    paths:
      - 'crates/*/bin/**'
      - 'crates/*/src/**'
      - 'scripts/check-bin-reproducibility.py'
      - 'scripts/test_check_bin_reproducibility.py'
      - 'scripts/check-prompt-injection.py'
      - '.github/workflows/bin-reproducibility.yml'

permissions:
  contents: read

concurrency:
  group: bin-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit-test the diff core
        run: python3 scripts/test_check_bin_reproducibility.py
      - name: Rebuild workspace binaries and diff against committed blobs
        run: python3 scripts/check-bin-reproducibility.py
