[package]
rust-version.workspace = true
name = "webqa"
version = "0.1.0"
edition = "2021"
description = "Web QA gate for Claude Code: blocks a Stop until Playwright specs for changed web code pass, and detects test-weakening edits to Playwright specs."
license = "MIT"

[[bin]]
name = "webqa"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
