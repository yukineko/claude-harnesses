status = "pending"
notes = """
Observed 2026-09-23.

Command attempted (a read-only inspection of a tdd proof file):
  python3 -c "
  import json
  d=json.load(open(PATH))
  for k,v in d.items():
      ... print(k, chr(61)+chr(62), v) ...
  "
where the printed separator was the two-character arrow written literally inside the double-quoted python program.

blastguard refused, verbatim:
  (single-quote)> (space)(single-quote) destroys the file current contents and `` is a relative path and blastguard does not know which directory it is relative to, so it cannot tell whether these bytes are recoverable

The arrow inside the quoted python source was parsed as an output redirect, and the redirect target resolved to the empty string, which then produced the relative-path branch of the message. No file was ever going to be written - the whole program is a single quoted -c argument.

Note the refusal itself is the correct SHAPE: it is fail-closed, and refusing when it cannot tell whether bytes are recoverable is exactly CLAUDE.md section 3. The defect is the tokenisation upstream of that judgement, not the judgement.

Two concrete symptoms worth fixing together:
1. The command text is tokenised without respecting the quoting of the -c argument, so ordinary punctuation inside a quoted program is read as shell metacharacters.
2. The rendered message interpolates an EMPTY target and still prints backticks around nothing, producing the unreadable fragment: `` is a relative path. When the parsed redirect target is empty, that is itself evidence the parse is wrong, and it should be reported as a parse failure rather than as a finding about a file.

Related class: the existing note that backticks in a double-quoted --notes argument are command-substituted and silently eat that span. Same root - argument text being re-parsed as shell after it has already been quoted.

Impact is modest (workaround is to rephrase the command) but it costs a turn each time and it trains the operator to treat blastguard refusals as noise, which is the expensive failure mode."""
