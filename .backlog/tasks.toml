notes = """
実測 2026-08-06、測定点 8340afc8、backlog 0.2.14 を rollout した直後。backlog のキューを ~/.backlog/tasks.toml から repo 内 .backlog/tasks.toml へ移す変更 (main の 8d729129) が、既存タスクを移行していない。観測値: ls -la ~/.backlog/tasks.toml は 669648 バイト、ls -la .backlog/tasks.toml は 2173 バイト。backlog list --project /Users/yuki/src/harness --status pending は移行前 162 件を返していたが、移行後は 2 件しか返さない。本セッションで積んだ 5 件のうち 4cacdfae と 241e7a47 と d8d0778c は旧ストアに取り残され、新ストアからは存在しないものとして扱われる (backlog done d8d0778c が task not found で失敗した)。これは単なるデータ移行漏れではなく判定の問題である: 下流 (autoflow の Stop hook / daily / flow の停止判定 / SessionStart の注入) はいずれも「キューが空か」を backlog list の結果で判断するため、160 件の未完了作業が黙って完了扱いになる。空集合が合格として読まれる典型 (CLAUDE.md 第3節)。判定不能どころか、判定が誤った側に確定している。完了条件: (1) 旧ストアの内容を新ストアへ移行する経路を用意し、移行が起きたことを観測で固定する、(2) 移行前に「旧ストアに項目があるのに新ストアが空/少ない」状態を検出して block するか少なくとも警告する経路を入れる (黙って空を返さない)、(3) 既に旧ストアに取り残された項目を回収する。注意: 旧ストアはクロスプロジェクトなので、repo 内ストアへ移すときに project フィールドで振り分ける必要がある。

