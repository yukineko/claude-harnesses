## 実装へ渡す制約 (これを守らないと同じ穴が形を変えて再発する)

1. **「レジストリに記録が無い」を death の証拠にしてはならない。** 実測
   (2026-09-07): `~/.backlog/drivers/` の記録は **1 件だけ**で、それは /flow を
   回している本セッションのものである。§8 の worktree 作業をしているだけの
   セッションは driver 登録をしないので記録を残さない。記録の不在を death に
   写すと、第3項はまた空虚に真になり連言が 2 項へ縮退する — 本項目が直している
   当の欠陥そのもの。**不在は Undetermined**。
2. したがって第3項が Known になるのは次の 2 通りだけ:
   - 記録があり heartbeat が新しい -> **Live** (削除しない)
   - 記録があり heartbeat が TTL 超過 -> death 側の項として成立
   記録が無い / レジストリが読めない -> **Undetermined** (keep)
3. この設計だと当面ほとんど何も回収できない。それは**正しい縮退**であり、
   回収可能にするための一手は別項目にする: §8 の worktree 作成時点
   (`condukt worktree create` / SessionStart の worktree 用意) に登録を書き、
   **それ以降に作られた worktree については記録の不在が観測になる**ようにする。
   既存の 15 本は Undetermined のまま残ってよい。
4. レジストリの記録は `pid` を持つ (実測: driver ファイルに session_id / pid /
   project / registered_at / heartbeat_at)。pid の生存は Linux で直接観測できる
   ので、heartbeat TTL より強い witness として併用を検討してよい。ただし pid は
   再利用されうるので、pid 単独を Live の証拠にしないこと。
5. **アンチ空虚の対照が必須** (5aaecbf6 が削除した `dead_clean_worktree_is_removable`
   の後継): 注入した窓 (`HARNESS_PROGRESS_WINDOW_SECS`) のもとで、停滞 ∧ 窓経過 ∧
   「レジストリを読んで記録があり heartbeat が TTL 超過」の clean worktree が
   Dead + removable に到達することを固定する。これが無いと「常に Undetermined を
   返す定数実装」がテストを通ってしまう。
6. **RED を先に観測すること。** 本項目の実測 (session-05717fa8 が
   occupancy=dead removable=true) を再現する behavioural test を先に書き、
   それが RED であることを観測してから GREEN にする。テストは CLAUDE.md 2.(a) に
   従い利害のない agent に書かせる。

