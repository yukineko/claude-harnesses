notes = """
実測 2026-08-18, 測定点 01deeab2。

/flow SKILL.md Step 3-2 は逐語で: 'この /condukt 呼び出しは既定で fork(subagent_type の一種)に包んで実行する。例外はタスクが xs 級・単発ファイルで、ユーザーが経過を対話的に見たいと明示した場合のみ直接(inline)実行'。

一方 /condukt SKILL.md の不変条件1 は逐語で: '合意は main loop のみ — AskUserQuestion はこの skill (main) でしか使えない。合意未了のタスクを実装に渡さない'。かつ Phase 3 は condukt state autonomy-check が非自律 ({"autonomous":false} / exit 1) のとき '従来どおり。下記の AskUserQuestion で合意を取る(後方互換。既定では必ず合意 Ask が出る)' と規定。

fork 契約は 'No follow-up questions' かつ 'Do NOT spawn subagents with the Agent tool' なので、fork 内では (a) Phase 3 の合意 Ask が出せず、(b) Phase 1 interpreter / Phase 5 worker / Phase 6 verifier の subagent 起動もできない。

結果: 非自律モードで /flow の既定どおり fork に包んで /condukt を起動すると、fork は Phase 1 直前で構造的に停止する(実測: 実装0行、run id なし、250k token 消費)。fork が規範違反を避けて正しく停止したので隠蔽は起きていないが、/flow の既定経路が非自律モードでは常に空振りする。

判定不能な2つの読み: (a) /flow の fork 既定バイアスが condukt の合意要件を考慮していない実在の欠陥 / (b) fork 既定は自律モード前提で書かれており、非自律では inline へ落とすべきという暗黙の前提が明文化されていないだけ。

見分ける方法: /flow SKILL.md Step 3-2 の fork 既定バイアスの根拠として参照されている docs/design-delegation-strategy-measurement.md を読み、autonomy モードとの関係が論じられているか確認する。論じられていなければ (a)。また condukt state autonomy-check が exit 0 (自律) の場合に fork でも Phase 3 が policy answer で自答されて通るのか(その場合でも Phase 1/5/6 の subagent 起動は fork 契約違反のまま残る)を確認する — 残るなら自律モードでも fork 経路は成立しないので (a) が確定する。

修正案(未検証): /flow Step 3-2 に 'condukt を起動する場合は fork ではなく main loop から呼ぶ。fork は condukt を含まない単発タスクに限る' を明記する。

