notes = """
Observed 2026-09-23 (session 9d349393), deployed blastguard. The PreToolUse Bash hook denied three commands as file-truncating redirects when the ">" was not a redirect:
1. python3 inline script inside a quoted heredoc (<<'EOF') containing Rust text "if parsed.skipped > 0" -> denied: '> 0' destroys the file's current contents.
