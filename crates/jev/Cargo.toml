[package]
rust-version.workspace = true
name = "jev"
version = "0.1.3"
edition = "2021"
description = "Advisory-only wrapper for jev that returns typed, calibrated decisions as a hint and never as a gate; disabled by default and a structural no-op without an API key."
license = "MIT"

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
