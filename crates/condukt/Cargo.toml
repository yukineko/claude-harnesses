[package]
rust-version.workspace = true
name = "condukt"
version = "0.7.299"
edition = "2021"
license = "MIT"
description = "Deterministic orchestration engine for Claude Code: schedules parallel and serial task batches by file-conflict analysis, manages git worktrees, tracks run state and gates completion."
repository = "https://github.com/yukineko/condukt"

[[bin]]
name = "condukt"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
blastguard = { path = "../blastguard" }
overwatch = { path = "../overwatch" }
schemaguard = { path = "../schemaguard" }
wait-timeout = "0.2"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
regex = { workspace = true }
globset = "0.4"
chrono = { workspace = true }
shlex = "1"
tempfile = { workspace = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = { workspace = true }

[lints]
workspace = true
