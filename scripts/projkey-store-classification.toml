# ── non-Rust mechanisms ────────────────────────────────────────────────────
#
# Not every per-worktree store is reached through a projkey call. compass keeps
# its state IN the tree, so the mechanism that partitions it is .gitignore: an
# ignored path exists separately in every linked worktree. Recorded here so the
# table spans the mechanism, and so it goes stale-detecting if the line is moved
# or removed.

[[consumer]]
language = "gitignore"
pattern = ".compass/carve-state.json"
evidence = "Ignored, so each linked worktree carries its OWN carve state; a re-carve done in one worktree is invisible in every other. Tracked as a mechanism, not a call site — no Rust symbol is involved."

[[consumer]]
language = "gitignore"
pattern = ".compass/outcomes.json"
evidence = "Same mechanism as carve-state.json: ignored, therefore per-worktree. compass outcomes recorded in one worktree do not inform a run in another."
