[[task]]
id = "270f36fa"
title = "taintguard: trusted region is cwd only, so worktree and scratchpad reads taint every turn"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = [
    "injection",
    "taintguard",
    "p1",
]
touched_files = []
status = "pending"
notes = """
MEASURED 2026-08-05 against the deployed 0.1.6 binary, isolated TAINTGUARD_STATE_DIR, both postures. Anti-vacuity control in the same run: an in-repo Read stays SILENT, and a Grep stays SILENT, so the probe is not firing on everything.

Interactive (CLAUDECODE=1, CLAUDE_CODE_ENTRYPOINT=cli) -- verdict for a Bash that follows:
  Read of an in-repo file                    SILENT (allow)     [control]
  Read of the SESSION WORKTREE               ask   (external-read)
  Read of the declared SCRATCHPAD            ask   (external-read)
  Read of the user settings.json             ask   (external-read)
  WebFetch / WebSearch                       ask   (web)
  Read with no file_path                     ask   (external-read)  [correct fail-closed]
  Grep                                       SILENT (allow)     [control, and see 5b0e9fe1]

Headless (CLAUDECODE and CLAUDE_CODE_ENTRYPOINT unset): the same rows harden from ask to DENY.

Impact, stated plainly: CLAUDE.md section 8 makes a worktree read unavoidable, and the harness declares the scratchpad as an additional working directory. So enabling taintguard as it stands taints essentially every session within its first few tool calls. Interactive that means a permission prompt on every Bash/Write/Edit for the rest of each turn; headless it means every write-class tool is DENIED until Stop, which brick-walls an autonomous run.

This is not a bug in the enforcement -- the enforcement is correct for the boundary it was given. The boundary is the defect: classify.rs classify takes trust region = hook cwd, full stop. There is no configuration for additional roots (grepped: no trusted_root, no TAINTGUARD_TRUST, no additional-dir knob anywhere in src/).

Fix shape: trust region = cwd PLUS (a) the additional working directories the harness declares and (b) sibling git worktrees of the SAME repository, resolved via the git common dir so it cannot be spoofed by a path that merely looks like one. Keep Indeterminate meaning untrusted.

RED test to write first: a Read of a linked worktree of the SAME repo classifies Trusted, while a Read of an unrelated repo at a sibling path still classifies Untrusted -- the second assertion is what stops the fix from degenerating into trusting every sibling directory."""
