status = "pending"
notes = """
実測 2026-09-10、測定点 e9703c26。.backlog/tasks.toml は repo 内にあり git で全マシンに共有されるが、
各マシンは自分の絶対パスで絞るため、互いの起票が見えない。

  pending 総数 454
    /Users/yuki/src/harness                        309  (この Mac から見える)
    /mnt/c/Users/hiroyuki_nakayama/src/harness      97  (見えない)
    /home/hiroyuki_nakayama/src/claude-harnesses    43  (見えない)
    C:/Users/hiroyuki_nakayama/src/harness           5  (見えない)

4 キーとも同一リポジトリであることは title をサンプルして確認した (specguard / condukt / flow /
CLAUDE.md 第8節 / rollout を参照している)。ディレクトリ名が claude-harnesses と harness で
割れているのは checkout 名の違いにすぎない。

■ 予測が測定に否定された点 (重要)

「同じ課題が複数マシンで二重起票されているはず」と予測して全走査したが、
同一タイトルが複数 project キーに存在する件数は 0 だった。したがって実害は
重複起票ではなく可視性の分断だけである。この区別を失うと、対策が
「重複マージ」という誤った方向へ向かう。

■ なぜ project フィールドの単純な書き換えで直せないか

crates/backlog/src/task.rs:184 の hashkey(title, project) が、docstring の言葉どおり
the raw project path を title と結合して task の cross-session 同一性を作っている
(意図は別 project の同名タスクの衝突回避)。project を書き換えると全 hashkey が変わり、
claim ledger (claim_ledger.rs) と overwatch anchor の参照が切れる。
さらに片方のマシンのパスへ寄せると、他方のマシンから全件が見えなくなるだけで、
分断の向きが変わるにすぎない。

■ 筋の良い方向 (未検証の設計案。着手前に裁定が要る)

論理 project ID (例: git remote URL、または repo root の正規化名) を導入し、
hashkey と既定フィルタの両方をそれで引く。既存 hashkey の移行が要るので、
claim ledger と overwatch の既存エントリをどう扱うかが設計の本体である。

■ 判定不能な点 / 両方の読み

(a) 実在の欠陥: 同一リポジトリを 1 つのキューとして扱えていない。
(b) 意図的な仕様: project はあくまでマシン上の作業ディレクトリを指し、
    別マシンの作業は別 project として扱う設計かもしれない。
見分け方: crates/backlog/src/config.rs:84 の locate が repo_root を返す設計から、
store は repo 単位を意図していると読めるが、project フィールドだけが cwd 絶対パスの
ままである。この不整合が意図的かは docstring からは判定できないので人間の裁定が要る。

■ 関連

