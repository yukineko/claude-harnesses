--- 2 体目の独立測定を統合 2026-09-11、測定点 b304eb1a ---

別の agent が別 worktree・別コミット (deba848a、HEAD 1e428175) で同じ flake を
独立に起票していた (a3ae340d、重複として cancelled)。その観測をここへ転記する。
**2 つの独立測定が一致したこと自体が、この flake が実在し、どちらの変更にも
起因しないことの証拠**である。

a3ae340d 側の固有の観測:
  - 失敗の向きは「余分な record」ではなく **欠落した record** (left 1 right 2)。
    つまり invocation は起きたのに journal に載っていない。
  - full parallel run でのみ再現。単独実行は 3/3 で通る。
  - verify.rs と main.rs を HEAD へ checkout し直した無改変の状態で
    full suite を 5 回実行し、5 回目が FAILED。
  - 疑っている機構 (テストバイナリ間で共有される project_state_dir) は
    **仮説であって観測ではない**と明示されている。

こちら側 (2d57c47a) の観測と合わせると:
  無改変 baseline で 3 回中 1 回失敗 / 5 回中 1 回失敗
  --test-threads=1 では 769/769 通る
  単独実行では通る

【なぜ p2 以上に扱うべきか】
このテストが固定しているのは「検査して clean だった」と「一度も検査されていない」
が下流から区別可能であること、すなわち CLAUDE.md 第3節そのものである。
