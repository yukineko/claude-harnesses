2. production: condukt worktrees are checkouts of the SAME repo, so they share package names by construction, and this repo documents a machine with an absolute target-dir override in .cargo/config.toml (see scripts/cap-target-dir.sh). Whether two worktrees sharing one target dir can make editgate pass a broken edit is UNMEASURED - do not assume it cannot. Measure it before closing."""
