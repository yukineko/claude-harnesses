id = "422d256a"
title = "停止判定の統一契約: 停止は『与えられたタスクの完了』時のみ、残件・タスク途中では止まらない(回数プロキシ廃止) — autoflow(condukt/backlog 分岐)と condukt 完了ゲートに共通適用"
