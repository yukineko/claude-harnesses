name: fail-open-guard

# Fail-open gate for the fleet-guarding crates. The doctrine of this repo is that
# a gate must resolve "cannot determine" into a STOP (block / deny / fail /
# surface-unknown), never into "fine / allow / green / empty". A directory walk
# that silently drops an unreadable subtree (`let Ok(..)=read_dir else {return}`,
# `entries.flatten()`), or a shell capture whose non-zero rc vanishes into an
# empty string (`$(… 2>/dev/null)` with no `|| rc=$?`), re-imports exactly the
# "probably fine" judgment the doctrine bans — an unreadable input reads as a
# clean/empty one and the gate passes. This scanner catches such swallows on the
# GATE crate surface + repo shell scripts at the moment of introduction, so it is
# a merge-blocking check. The local pre-commit hook (.githooks/pre-commit) is the
# fast advisory layer; this CI job is the enforced one.
#
# NOTE: there is deliberately no `paths:` filter, and the job carries an explicit
# unique `name:`. Both are prerequisites for making this a required status check.
# A `paths:`-filtered job never reports on a PR that touches nothing in its filter,
# so requiring it would leave such PRs permanently pending — the gate would block
# everything instead of the thing it checks. And a required check is matched by its
# context name, which defaults to the job id; three workflows here all used the id
# `scan`, so the name had to be made unique to be addressable at all.
#
# This job is NOT yet registered in branch protection (`gh api …/branches/main/
# protection` returns 404: branch not protected), so today it can go red without
# blocking a merge. Registering it is the open step.
# Self-contained stdlib Python.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fail-open-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: fail-open-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Unit-test the scanner
        run: python3 scripts/test_check_fail_open.py
      - name: Scan gate surface for fail-open swallows
        run: python3 scripts/check-fail-open.py
