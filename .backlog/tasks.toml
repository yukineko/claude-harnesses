[[task]]
id = "6267bfbe"
title = "bypass ledger が git commit --amend を誤って「未検証コミット」と記録する（証明書が HEAD に束縛されているため）"
project = "/Users/yuki/src/harness"
project_unresolved = false
tags = ["blocked-githooks"]
touched_files = []
status = "pending"
notes = '''
実測 2026-07-22 / 測定点 6d4312c5。

再現: 通常どおり commit（6 ゲート全 green）した直後に `git add <file> && git commit --amend --no-edit` すると、
amend も pre-commit を走らせて全ゲート green にもかかわらず、post-commit が
`.git/gate-bypassed` に当該コミットを記録し、pre-push がブロックする。

原因（推定・要検証）: pre-commit の証明書は (tree, HEAD) に束縛されている。amend 実行時点の
HEAD は「amend される前のコミット」だが、生成される新コミットの親はその 1 つ手前になるため、
post-commit が照合する (tree, parent) が証明書の (tree, HEAD) と一致しない。
結果、ゲートは実際に走って green だったのに「証明書なし＝bypass」と読まれる。

影響: 誤検知の側（fail-closed 方向）なので危険ではないが、amend は日常操作なので
「ledger に載る＝誰かが --no-verify した」という信号の意味が薄まる。狼少年化すると
本物の bypass を見逃す。

解消は設計どおり動く（green な pre-commit を 1 回走らせると ledger が clear される。
実測: `pre-commit: gates green — cleared 1 ungated commit(s) from the bypass ledger.`）。

やること: (1) まず amend で ledger に載ることを scripts/test_gate_bypass.py に RED として固定する
（現行スイートに amend のケースが無い）。(2) 証明書に親コミットを含めるか、amend を検出して
(tree, HEAD^) でも照合するかを決める。(3) 「証明書が HEAD に束縛される」設計は
test_certificate_does_not_survive_head_moving が意図的に固定しているので、その意図
（HEAD が動いたら証明書を無効化する）を壊さない形で amend だけを救う必要がある。

--- HEAD で再現を観測し RED を固定 2026-09-11、測定点 1e428175 ---

再現した。起票時 (6d4312c5) の「原因（推定・要検証）」も観測で確定した。

【RED を固定した】scripts/test_gate_bypass.py に 2 テストを追加:
- test_amend_runs_every_gate ... GREEN。amend 自体が 14 スキャナ全部を走らせ
  green で完了することを先に固定する。これが無いと下の RED は何も証明しない
  (ゲートが走っていないなら ledger に載せるのが正しい挙動だから)。
- test_amend_of_a_gated_commit_is_not_recorded_as_ungated ... RED。
  観測した失敗 (逐語):
    Lists differ: ['ddee224326345dccfd6f0574e4e186a8a1793201\tfirst'] != []
    : bypass ledger must be empty ...
スイート全体: Ran 122 tests in 66.671s / FAILED (failures=1) -- この新規 RED のみ。

【原因を確定】推定どおりだった。.githooks/post-commit は証明書の
(certified_tree, certified_head) を、コミット済みの (HEAD^{tree}, HEAD^@) と
照合する。amend では pre-commit が判定した HEAD は「amend される前の C1」だが、
git が書く新コミットの親は C0 なので C1 は親集合に現れず不一致になる。

【修正案を実測で裏付けた】amend は reflog から決定論的に判別できる。
空の scratch repo で測定:
  amend 直後:  git reflog -1 --format=%gs HEAD  --  [commit (amend): first]
               git rev-parse HEAD@{1}            --  99aeec27... (= 置き換えられた C1)
               certified_head との一致           --  YES
  平常 commit: git reflog -1 --format=%gs HEAD  --  [commit: second]
したがって post-commit で「reflog subject が commit (amend) で始まる」かつ
「certified_head == HEAD@{1}」の両方を満たすときだけ certified 扱いにすればよい。

これは test_certificate_does_not_survive_head_moving が固定している意図
(HEAD が動いたら証明書を無効化する) を壊さない。あのテストは update-ref で
HEAD を動かすので reflog subject が commit (amend) にならず、条件を満たさない。

【なぜ修正を入れていないか -- CLAUDE.md 第5節】
.githooks/** はこのセッションの権限設定で Edit/Write が deny されている。
別 agent に代行させるのは権限のロンダリングなので行わない。修正パッチは
人間へ返す。RED テストは先に landed 済みなので、修正が入れば緑になる。

【この作業中に踏んだゲート拒否 2 件 -- 迂回していない、記録する】
1. scripts/guard-maintree-bash.py: mktemp した使い捨て repo での probe を
   「main の作業ツリーを変更する」として拒否 (行頭の bare 変数代入が原因)。
   別綴りで迂回せず、worktree から実行し直して要件を満たした。66a50b8c と同種。
2. scripts/deny-no-verify.py: probe 内の git commit --no-verify を拒否。
   scratch repo には hook が 1 つも無く --no-verify は不要だったので、
   フラグを別綴りにするのではなく削除して従った。

--- 修正案を検証: 全テスト緑だが mutation 2/3 が生存 2026-09-11、測定点 e8bcbe14 ---

上に記録した修正案 (reflog subject と HEAD@{1} の 2 条件) を候補として実装し、
実際のテストハーネスで検証した。良い結果と、正直に書くべき悪い結果がある。

【良い結果】候補を .scratch/candidate-hooks/post-commit に置き、
scripts/test_gate_bypass.py の _HOOKS_DIR をそこへ rebind して全 122 テストを実行:
  Ran 122 tests in 77.406s / OK / run=122 failures=0 errors=0
amend の RED が緑になり、かつ NoVerifyIsRecorded と
test_certificate_does_not_survive_head_moving を含む他 121 本が緑のまま。
「何でも通す carve-out」への過剰是正ではないことの対照は取れている。

【悪い結果 — こちらが本題】mutation を 3 通り掛けたところ 2 つが生存した:
  carve-out を丸ごと削除        -- KILLED
    (test_amend_of_a_gated_commit_is_not_recorded_as_ungated が RED に戻る)
  条件(1) reflog subject のみに縮退 -- *** SURVIVED *** run=122 failures=0
  条件(2) HEAD@{1} 一致のみに縮退   -- *** SURVIVED *** run=122 failures=0

つまり現行スイートが固定しているのは「何らかの carve-out が存在すること」だけで、
**2 条件のどちらの半分も、どのテストにも固定されていない**。候補のコメントは
「BOTH conditions are required」と書いているが、それは現時点では**議論であって
観測ではない**。CLAUDE.md 第2節 (落ちることを確認していないテストは何も証明しない)
と第6節 (自分の発見にも同じ立証責任) により、この状態のまま人間へ「検証済み」
として渡してはならない。

【対処】利害関係の無い別 agent へ dispatch 済み。2 つの生存 mutation それぞれを
殺すテストを、候補の実装を読ませずに契約記述のみから書かせる。想定シナリオは
(a) 別の HEAD に対して得た証明書での amend、(b) amend ではないのに certified commit が
reflog 上 1 つ前に来る操作 (branch 切り替え等)。どちらも実 .githooks に対しては
緑になるはずなので、RED を増やさずに landed できる。

**どうしても殺せない場合は 2 条件を 1 条件へ単純化するのが正しい** -- 区別できない
条件を「念のため」残すのは、次の読者に検証済みだと誤読させる仕掛けになる。

【この時点で人間へ渡してよい状態ではない】上の検証が終わるまで、
.githooks/post-commit へのパッチ適用は依頼しない。

--- 2条件が両方とも固定された。パッチは適用可能な状態 2026-09-11、測定点 6374a143 ---

前の記録で「mutation 2/3 が生存 = 2条件のどちらも固定されていない」と訂正したが、
利害関係の無い agent が候補実装を読まずに契約のみから 2 本のテストを書き、
両方の生存 mutation が殺されるようになった (landed: 6374a143)。

scripts/test_gate_bypass.py::CertificateBindsTheDiffNotTheOperation
- test_amend_certified_against_another_head_is_recorded
    reflog marker だけを信じる縮退を殺す。別の HEAD に対して得た証明書での
    amend は、検査した diff と landed した diff が別物なので記録されねばならない。
- test_non_amend_commit_one_reflog_step_from_the_certified_head_is_recorded
    HEAD@{1} 一致だけを信じる縮退を殺す。

【この過程で分かった非対称性 — 実装コメントにも反映済み】
2 条件は対等ではない。reflog が無傷な非 amend コミットでは HEAD@{1} は必ず
そのコミットの first parent なので、外側の親ループが先に受理してしまい
carve-out には到達しない。つまり **HEAD@{1} 条件の独立した価値は reflog の
「穴」にのみ依存する**。そして穴を空ける現実的な操作は、並行 worktree からの
ref 更新 (自 worktree の reflog にエントリを書かずに HEAD が動く) であり、
これは CLAUDE.md 第8節の運用では例外ではなく日常である。
逆に marker 条件は通常の wrong-base amend で簡単に破れる。
測定環境: git 2.50.1 (Apple Git-155) / darwin。他の git 版では未確認だが、
その場合テスト側の前提 assert が黙って通るのではなく大声で落ちる作りになっている。

【自分でも独立に確認した】
GATE_HOOKS_UNDER_TEST を候補ディレクトリに向けて全スイート実行:
  Ran 124 tests in 68.375s / OK
実 .githooks に対しては failures=1 (AmendIsNotABypass のみ = 本件の欠陥)。

【パッチの置き場所を .scratch から scripts/ へ移した】
scripts/patch-postcommit-amend.py として tracked にした。理由は eb1f8021 の実測 --
scratchpad は並行セッション間で共有されており、他セッションのファイルが作業中の
ハーネスを上書きした事例が観測されている。人間に適用を依頼するパッチが
gitignore された共有ディレクトリにしか無いのは、黙って消えうるということ。

【人間への依頼内容】.githooks/** はこのセッションで編集権限が無い。
worktree から (main のツリーでは行わない):
    python3 scripts/patch-postcommit-amend.py
    cp .scratch/candidate-hooks/post-commit .githooks/post-commit
    sh -n .githooks/post-commit
    python3 scripts/test_gate_bypass.py       # 期待: Ran 124 tests ... OK
適用後は scripts/patch-postcommit-amend.py を削除してよい。
