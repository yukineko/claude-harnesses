[package]
rust-version.workspace = true
name = "schemaguard"
version = "0.1.23"
edition = "2021"
description = "Schema-validation gate for LLM structured outputs: validates a JSON value against a named declared schema (such as verdict or undetermined-probe) and emits structured errors for one re-ask."
license = "MIT"

[lib]
name = "schemaguard"
path = "src/lib.rs"

[[bin]]
name = "schemaguard"
path = "src/main.rs"

[dependencies]
harness-core = { path = "../harness-core" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
