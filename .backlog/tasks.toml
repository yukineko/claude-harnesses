`install`/rename を使っているかを読む。cp なら (a) が実在の窓である。

影響の重さ: この launcher は **正しく** unknown を明示して exit 0 する
(CLAUDE.md 第1節どおり、空表示ではなく unknown と言う) ので、今回は dark では
なく可視の degrade だった。だが同じ窓に当たる他の hook が同じ配慮を持っている
保証は無い — GATE crate の launcher がこの窓に当たれば exit 1 で暗転しうる。
