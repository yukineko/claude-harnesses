Surface: crates/stuckguard/src/main.rs around :304-306, injected into the conversation as hookSpecificOutput.additionalContext (main.rs around :221-229), so the agent reads it. Verbatim:

    "stuckguard: progress may be stalling (score {:.2} - diversity {:.2}, state stability {:.2}, error recurrence {:.2}). この先しばらく同じ種類の操作/状態/エラーが続いています。..."

crates/stuckguard/src/detect.rs around :249 verbatim:

    // Reported as 0.0 when unavailable so the struct field keeps its shape for
    // existing readers; the score below no longer treats that as a measurement.
    let error_recurrence_signal = error_recurrence.unwrap_or(0.0);

and detect.rs around :238-242 verbatim:

    ///   error_recurrence_signal FIELD still reports 0.0 in that case, so read
    ///   the field as "recurrence contribution", not as "recurrence was measured".

Two problems:

1. The message prints that unwrap_or(0.0) sentinel as "error recurrence 0.00", in the same notation and the same parenthesis as the two signals that WERE measured, with no marker distinguishing them. This is the identical defect propguard fixed for satisfied=0 - a non-judgement printed in the notation of a measurement. The code comment even anticipates the misreading and asks readers to interpret the field correctly, which is exactly the self-申告 CLAUDE.md section 6 says not to rely on: the message does not carry the caveat the comment carries.

