再帰的に同じ decide へ渡す、(3) チルダと HOME と PWD は展開して判定する（展開できないものは
allow ではなく deny/ask）、(4) cd 再アンカー後の絶対パスは依然 main を指すなら hit、
(5) in-place フラグ判定をフラグ束の文字走査へ。RED 先行 + anti-vacuity 対照。
