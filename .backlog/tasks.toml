nsion is not modelled, so any template change in a base-existing file is fail-closed by design and the protocol must route un-ignore through some other declared path. How to tell apart: if a fix counts invocations per template on both sides and the controls stay non-zero (dropping an invocation must still be a finding, adding a template #[ignore] must still be ignore-added), (a) holds; if invocation counting cannot be made sound (e.g. invocations generated by other macros / include!), the ruling is (b) and the human must decide the un-ignore route for macro-generated repros. Fix must keep fail-closed for the unmodelled cases."""
