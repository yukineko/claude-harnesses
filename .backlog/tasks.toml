notes = """
実測 2026-08-28。手順: (1) session worktree 側で conflict を解決して merge commit 79b385b2 を作成 — pre-commit は green (「check-test-weakening: no unacknowledged test weakening」まで通過) で、post-commit が worktree の gate-verified-tree sentinel を消費して静かに終了した。(2) main の作業ツリーで `git merge --ff-only session-9aff7bf8`。ff は commit を 1 つも作らないが、.githooks/post-merge の判定は `parents="$(git rev-parse HEAD^@ | grep -c .)"; [ "$parents" -lt 2 ] && exit 0` であり、HEAD が「たまたま merge commit」になった ff もここを通過して post-commit へ exec される。main の git-dir には sentinel が無い (per-worktree なので当然) ため、既に検査済みの 79b385b2 が gate-bypassed ledger へ「UNGATED COMMIT」として記録され、pre-push が push を止めた。post-merge のコメント自身が「A fast-forward merge creates no commit, so there is nothing to certify and the absent sentinel must not be read as a bypass — that would fire on every `git pull`」と意図を宣言しているので、実装がその意図を満たしていない (parent 数は「この操作が commit を作ったか」の代理変数になっていない)。CLAUDE.md 8 が worktree で実装して main へ merge することを絶対義務にしている以上、main 側は常に ff になり、この誤判定は定常的に発生する = 他 worktree の正当な作業を自分の bypass として記録する帰属のバグ。修正案: post-merge が ff を判定するには HEAD の parent 数ではなく「この操作の前後で HEAD が commit を新規作成したか」を見る必要がある。git は post-merge に squash フラグしか渡さないので、ORIG_HEAD と HEAD の関係 (`git merge-base --is-ancestor ORIG_HEAD HEAD` かつ HEAD の親に ORIG_HEAD が含まれない = ff) を使うか、pre-merge-commit が置いた marker の有無で「実際に merge commit を作った」経路だけを post-commit へ渡す。判定不能は block 側 (ledger へ記録) に倒したままでよいが、ff を「不能」に分類しないこと。回避策 (今回採った): worktree 側で別の green な pre-commit を 1 回走らせて ledger を消す — 設計どおり「検査の副作用としてのクリア」なので bypass ではないが、毎回 1 commit を要求するのは代償である。

---
## 再発 2 件目 (実測 2026-09-07) — 単発ではなく定常

同一シェイプを再度観測した。7039ad47 の修正を統合する過程:

1. worktree `session-05717fa8` で conflict (`.backlog/tasks.toml`) を解決し、
   merge commit `992a57cb` を作成。pre-commit は green で通過している
   (`check-test-weakening: no unacknowledged test weakening` まで出力、
   commit の exit code 0)。post-commit は sentinel を消費して静かに終了した。
2. main の作業ツリーで `git merge --no-edit session-05717fa8` -> **Fast-forward**。
   commit は 1 つも作られていない。にもかかわらず:

       ! UNGATED COMMIT: 992a57cbb8f6 Merge branch 'fix/issue-15-jsonl-append-race'
         into session-05717fa8
         The local gate did not inspect this content (--no-verify, cherry-pick or
         rebase). Recorded in the bypass ledger; 1 entr(y/ies) outstanding.

   ledger (`.git/gate-bypassed`) の中身も実際にその 1 行だけだった。

機序は 2026-08-28 の記録と完全に一致する。ff 後の HEAD が `992a57cb`
(親 2 つの merge commit) なので `.githooks/post-merge` の
`parents="$(git rev-parse HEAD^@ | grep -c .)"` が 2 を返し、早期 exit の
ガードを通過して post-commit へ exec される。main の git-dir には sentinel が
無い (per-worktree なので当然) ため、既に検査済みの commit が bypass として
記録される。

**警告文が事実と食い違っている点も再確認した**: 「--no-verify, cherry-pick or
rebase」と書かれているが、実際に起きたのはそのどれでもない (通常の
`git commit` + ff)。CLAUDE.md 4. の「docstring / コメントで実挙動と違う話を
書く」に該当する — メッセージを読んだ人間は 3 つの原因を探して見つけられない。

## 意味

CLAUDE.md 第8節が worktree 実装 -> main へ merge を絶対義務にしている以上、
main 側は**構造的に常に ff** になる。したがってこれは稀な誤検知ではなく、
**§8 に従うたびに発生する**。2 回連続で発生したことがその証拠であり、
「毎回 green な commit を 1 本余分に要求する」という代償が常態化している。

今回もその回避策を採った (この notes 追記そのものが、その green な 1 commit を
兼ねている)。

